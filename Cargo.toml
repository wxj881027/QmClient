[workspace]
members = [
  "src/base",
  "src/engine",
  "src/engine/shared",
  "src/qm/update",
  "src/rust-bridge/test",
]

resolver = "2"

[workspace.dependencies]
# 更新 cxx 版本后需要重新运行 `python scripts/generate_rust_bridge.py`。
cxx = "=1.0.194"

[profile.dev]
panic = "abort"

[profile.release]
lto = "thin"
panic = "abort"

[profile.relwithdebinfo]
inherits = "release"
debug = true

[profile.minsizerel]
inherits = "release"
opt-level = "z"
