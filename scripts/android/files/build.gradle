apply plugin: 'com.android.application'

buildscript {
	repositories {
		google()
		mavenCentral()
	}
	dependencies {
		classpath 'com.android.tools.build:gradle:9.5.0'
	}
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(21))
	}
}

android {
	namespace = "com.qmclient.client"
	compileSdk 37
	buildToolsVersion "37.0.0"
	defaultConfig {
		applicationId "com.qmclient.client"
		minSdk 24
		targetSdk 37
		versionCode TW_VERSION_CODE
		versionName "TW_VERSION_NAME"
	}
	signingConfigs {
		release {
			storeFile file("TW_KEY_NAME")
			storePassword "TW_KEY_PW"
			keyAlias "TW_KEY_ALIAS"
			keyPassword "TW_KEY_PW"
		}
	}
	buildTypes {
		release {
			signingConfig = signingConfigs.release
			// 关闭 R8 压缩：Java 层很小（dex 约 160 KB），而 SDL 的 Java 胶水
			// 大量由 JNI 按名字调用，R8 看不到这些引用会删掉方法，
			// 运行期直接 NoSuchMethodError（SDLAudioManager.registerAudioDeviceCallback）。
			minifyEnabled = false
			shrinkResources = false
		}
		debug {
			debuggable = true
			minifyEnabled = false
			shrinkResources = false
		}
	}
	packaging {
		doNotStrip '**/*.so'
		jniLibs {
			useLegacyPackaging = true
		}
	}
	sourceSets {
		main {
			assets.srcDirs = ['assets']
			jniLibs.srcDirs = ['lib']
		}
	}
	lint {
		abortOnError = false
	}
	dependencies {
		implementation 'androidx.core:core:1.17.0'
	}
}

allprojects {
	repositories {
		google()
		mavenCentral()
	}
	gradle.projectsEvaluated {
		tasks.withType(JavaCompile) {
			options.compilerArgs << "-Xlint:deprecation"
		}
	}
}
