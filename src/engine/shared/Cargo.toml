[package]
name = "ddnet-engine-shared"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
publish = false
license = "Zlib"

[lib]
crate-type = ["rlib", "staticlib"]
path = "lib.rs"

[dependencies]
ddnet-base = { path = "../../base" }
ddnet-engine = { path = ".." }

cxx = "=1.0.194"
libtw2-common = { git = "https://github.com/heinrich5991/libtw2" }
libtw2-packer = { git = "https://github.com/heinrich5991/libtw2" }
libtw2-snapshot = { git = "https://github.com/heinrich5991/libtw2" }
libtw2-warn = { git = "https://github.com/heinrich5991/libtw2" }
uuid = "1.0"
tungstenite = { version = "0.21", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
qm-update = { path = "../../qm/update" }

[dev-dependencies]
ddnet-test = { path = "../../rust-bridge/test", features = ["link-test-libraries"] }
