[package]
name = "qm-update"
version = "0.1.0"
edition = "2021"
rust-version = "1.63"
publish = false
license = "Zlib"

[lib]
crate-type = ["rlib", "staticlib"]
path = "lib.rs"

[dependencies]
ed25519-dalek = "=2.1.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.19.1"
