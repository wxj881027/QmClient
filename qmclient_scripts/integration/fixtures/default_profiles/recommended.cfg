# 栖梦推荐外观回归种子：字体资源缺失场景。
# 放在另一份隔离配置根目录的 qmclient/settings.cfg。
# 字体与字重沿用默认值；字体可用场景通过推荐外观卡应用 LXGW WenKai 后另存。
qm_defaults_profile_version 1
qm_ui_scale 100
qm_ui_motion_level 2
cl_menu_panel_opacity 30
cl_menu_panel_elevated_opacity 30
cl_settings_tabbar_opacity 30
qm_gaussian_blur 1
qm_ui_popup_blur 1
ui_color 1291845632
cl_menu_panel_color 0
