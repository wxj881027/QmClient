[[message]]
key = "Renders the demo that is currently playing into a video file. It runs as fast as the encoder allows instead of in real time, so a five-minute demo usually finishes in tens of seconds."
[message.translations]
simplified_chinese = "把正在播放的 demo 渲染成视频文件。导出不按实时速度播放，而是尽量跑满编码器，所以 5 分钟的 demo 通常几十秒就能完成。"
traditional_chinese = "把正在播放的 demo 算繪成影片檔。匯出不按即時速度播放，而是盡量跑滿編碼器，所以 5 分鐘的 demo 通常幾十秒就能完成。"
japanese = "再生中のデモを動画ファイルに書き出します。リアルタイムではなくエンコーダーの上限まで回すため、5分のデモは通常数十秒で終わります。"
korean = "재생 중인 데모를 동영상 파일로 렌더링합니다. 실시간이 아니라 인코더가 허용하는 만큼 빠르게 돌아가므로 5분짜리 데모도 보통 수십 초면 끝납니다."
russian = "Рендерит текущий демо-файл в видео. Экспорт идёт не в реальном времени, а на максимальной скорости кодировщика, поэтому пятиминутное демо обычно готово за десятки секунд."
german = "Rendert die gerade laufende Demo in eine Videodatei. Der Export läuft nicht in Echtzeit, sondern so schnell der Encoder erlaubt – eine fünfminütige Demo ist meist in Sekunden fertig."
spanish = "Renderiza la demo que se está reproduciendo a un archivo de vídeo. No va en tiempo real, sino tan rápido como permite el codificador, así que una demo de cinco minutos suele tardar decenas de segundos."
french = "Encode la démo en cours de lecture dans un fichier vidéo. L'export ne suit pas le temps réel mais tourne aussi vite que l'encodeur le permet : une démo de cinq minutes prend souvent quelques dizaines de secondes."
brazilian_portuguese = "Renderiza a demo em reprodução em um arquivo de vídeo. O export roda o mais rápido que o codificador permitir, então uma demo de cinco minutos costuma ficar pronta em dezenas de segundos."
portuguese = "Renderiza a demo em reprodução para um ficheiro de vídeo. O export corre o mais rápido que o codificador permitir, por isso uma demo de cinco minutos costuma ficar pronta em dezenas de segundos."
turkish = "Oynatılan demoyu video dosyasına işler. Dışa aktarma gerçek zamanlı değil, kodlayıcının izin verdiği hızda çalışır; beş dakikalık bir demo genellikle onlarca saniyede biter."
polish = "Renderuje odtwarzane demo do pliku wideo. Eksport nie działa w czasie rzeczywistym, tylko tak szybko, jak pozwala koder, więc pięciominutowe demo zwykle gotowe jest w kilkadziesiąt sekund."

[[message]]
key = "Sets the size of the finished video; \"Follow window\" uses the current render resolution."
[message.translations]
simplified_chinese = "决定成片尺寸；选「跟随窗口」就用当前渲染分辨率。"
traditional_chinese = "決定成片尺寸；選「跟隨視窗」就用目前算繪解析度。"
japanese = "完成動画のサイズを決めます。「ウィンドウに合わせる」なら現在の描画解像度を使います。"
korean = "완성 영상의 크기를 정합니다. \"창에 맞추기\"는 현재 렌더 해상도를 그대로 씁니다."
russian = "Задаёт размер готового видео; «По размеру окна» использует текущее разрешение рендера."
german = "Legt die Größe des fertigen Videos fest; „Fenster folgen\" nutzt die aktuelle Renderauflösung."
spanish = "Fija el tamaño del vídeo final; «Seguir ventana» usa la resolución de render actual."
french = "Définit la taille de la vidéo finale ; « Suivre la fenêtre » reprend la résolution de rendu actuelle."
brazilian_portuguese = "Define o tamanho do vídeo final; \"Seguir janela\" usa a resolução de renderização atual."
portuguese = "Define o tamanho do vídeo final; \"Seguir janela\" usa a resolução de renderização atual."
turkish = "Bitmiş videonun boyutunu belirler; \"Pencereyi izle\" geçerli işleme çözünürlüğünü kullanır."
polish = "Ustawia rozmiar gotowego wideo; opcja „Jak okno\" bierze bieżącą rozdzielczość renderowania."

[[message]]
key = "Anything smaller than the window supersamples: the frame is drawn at window size and scaled down, so 1080p to 720p gives smoother edges. Sizes above the window are ignored."
[message.translations]
simplified_chinese = "比窗口小的尺寸相当于超采样：画面先按窗口分辨率画出来再缩小，所以 1080p 导出 720p 会得到更平滑的边缘。比窗口更大的尺寸会被忽略。"
traditional_chinese = "比視窗小的尺寸相當於超取樣：畫面先按視窗解析度畫出來再縮小，所以 1080p 匯出 720p 會得到更平滑的邊緣。比視窗更大的尺寸會被忽略。"
japanese = "ウィンドウより小さいサイズはスーパーサンプリングになります。ウィンドウ解像度で描いてから縮小するため、1080p から 720p にすると輪郭が滑らかになります。ウィンドウより大きいサイズは無視されます。"
korean = "창보다 작은 크기는 슈퍼샘플링이 됩니다. 창 해상도로 그린 뒤 줄이기 때문에 1080p에서 720p로 내보내면 경계가 더 부드럽습니다. 창보다 큰 크기는 무시됩니다."
russian = "Размер меньше окна даёт суперсэмплинг: кадр рисуется в размере окна и уменьшается, поэтому 1080p в 720p даёт более гладкие края. Размеры больше окна игнорируются."
german = "Kleiner als das Fenster bedeutet Supersampling: Das Bild wird in Fenstergröße gerendert und verkleinert, daher liefert 1080p auf 720p glattere Kanten. Größen über dem Fenster werden ignoriert."
spanish = "Un tamaño menor que la ventana aplica supermuestreo: el fotograma se dibuja al tamaño de la ventana y se reduce, así que 1080p a 720p da bordes más suaves. Los tamaños mayores que la ventana se ignoran."
french = "Une taille inférieure à la fenêtre fait du suréchantillonnage : l'image est rendue à la taille de la fenêtre puis réduite, donc 1080p vers 720p donne des bords plus lisses. Les tailles supérieures à la fenêtre sont ignorées."
brazilian_portuguese = "Um tamanho menor que a janela faz superamostragem: o quadro é desenhado no tamanho da janela e reduzido, então 1080p para 720p deixa as bordas mais suaves. Tamanhos maiores que a janela são ignorados."
portuguese = "Um tamanho menor que a janela faz superamostragem: a imagem é desenhada no tamanho da janela e reduzida, por isso 1080p para 720p deixa as bordas mais suaves. Tamanhos maiores que a janela são ignorados."
turkish = "Pencereden küçük boyut üst örnekleme yapar: kare pencere boyutunda çizilip küçültülür, bu yüzden 1080p'den 720p'ye geçiş kenarları yumuşatır. Pencereden büyük boyutlar yok sayılır."
polish = "Rozmiar mniejszy niż okno daje nadpróbkowanie: klatka jest rysowana w rozmiarze okna i zmniejszana, więc 1080p do 720p daje gładsze krawędzie. Rozmiary większe niż okno są ignorowane."

[[message]]
key = "\"Default (software)\" is x264: CPU only, best quality, slowest."
[message.translations]
simplified_chinese = "「Default (software)」就是 x264：纯 CPU、画质最好、速度最慢。"
traditional_chinese = "「Default (software)」就是 x264：純 CPU、畫質最好、速度最慢。"
japanese = "「Default (software)」は x264 です。CPU のみで画質は最良、速度は最も遅くなります。"
korean = "\"Default (software)\"는 x264입니다. CPU만 사용하고 화질이 가장 좋지만 가장 느립니다."
russian = "«Default (software)» — это x264: только процессор, лучшее качество и самая низкая скорость."
german = "„Default (software)\" ist x264: nur CPU, beste Qualität, am langsamsten."
spanish = "«Default (software)» es x264: solo CPU, la mejor calidad y la más lenta."
french = "« Default (software) » correspond à x264 : CPU uniquement, meilleure qualité, le plus lent."
brazilian_portuguese = "\"Default (software)\" é o x264: só CPU, melhor qualidade e o mais lento."
portuguese = "\"Default (software)\" é o x264: só CPU, melhor qualidade e o mais lento."
turkish = "\"Default (software)\" x264'tür: yalnızca CPU, en iyi kalite, en yavaş."
polish = "„Default (software)\" to x264: tylko CPU, najlepsza jakość, najwolniejszy."

[[message]]
key = "Entries with NVENC, AMF, Quick Sync or VideoToolbox use the GPU encoding chip and are several times faster. Only encoders that really work on this machine are listed."
[message.translations]
simplified_chinese = "带 NVENC、AMF、Quick Sync 或 VideoToolbox 字样的项用显卡的编码单元，速度快好几倍。列表里只出现这台机器真正可用的编码器。"
traditional_chinese = "帶 NVENC、AMF、Quick Sync 或 VideoToolbox 字樣的項目用顯示卡的編碼單元，速度快好幾倍。清單裡只出現這台機器真正可用的編碼器。"
japanese = "NVENC、AMF、Quick Sync、VideoToolbox を含む項目は GPU のエンコード回路を使い、数倍速くなります。このマシンで実際に動くエンコーダーだけが一覧に出ます。"
korean = "NVENC, AMF, Quick Sync, VideoToolbox가 붙은 항목은 GPU 인코딩 회로를 써서 몇 배 빠릅니다. 이 컴퓨터에서 실제로 동작하는 인코더만 목록에 나옵니다."
russian = "Пункты с NVENC, AMF, Quick Sync или VideoToolbox используют аппаратный кодировщик видеокарты и работают в несколько раз быстрее. В списке только те, что реально работают на этой машине."
german = "Einträge mit NVENC, AMF, Quick Sync oder VideoToolbox nutzen den Encoder-Chip der Grafikkarte und sind mehrere Male schneller. Gelistet wird nur, was auf dieser Maschine wirklich läuft."
spanish = "Las entradas con NVENC, AMF, Quick Sync o VideoToolbox usan el chip codificador de la GPU y son varias veces más rápidas. Solo aparecen los codificadores que de verdad funcionan en este equipo."
french = "Les entrées NVENC, AMF, Quick Sync ou VideoToolbox utilisent la puce d'encodage du GPU et vont plusieurs fois plus vite. Seuls les encodeurs réellement fonctionnels sur cette machine sont listés."
brazilian_portuguese = "Itens com NVENC, AMF, Quick Sync ou VideoToolbox usam o chip de codificação da GPU e são várias vezes mais rápidos. Só aparecem os codificadores que realmente funcionam nesta máquina."
portuguese = "Itens com NVENC, AMF, Quick Sync ou VideoToolbox usam o chip de codificação da GPU e são várias vezes mais rápidos. Só aparecem os codificadores que realmente funcionam nesta máquina."
turkish = "NVENC, AMF, Quick Sync veya VideoToolbox içeren seçenekler ekran kartının kodlama birimini kullanır ve birkaç kat hızlıdır. Listede yalnızca bu makinede gerçekten çalışan kodlayıcılar görünür."
polish = "Pozycje z NVENC, AMF, Quick Sync lub VideoToolbox używają układu kodującego GPU i są kilkukrotnie szybsze. Na liście są tylko kodery, które naprawdę działają na tej maszynie."

[[message]]
key = "0 to 51, lower is clearer and bigger. Leave it empty to use the video encoding CRF from the settings page."
[message.translations]
simplified_chinese = "0 到 51，数字越小越清晰、文件越大。留空则沿用设置页里的视频编码 CRF。"
traditional_chinese = "0 到 51，數字越小越清晰、檔案越大。留空則沿用設定頁裡的影片編碼 CRF。"
japanese = "0〜51 で、小さいほど高画質・大容量です。空欄なら設定ページの映像エンコード CRF を使います。"
korean = "0~51이며 작을수록 선명하고 파일이 커집니다. 비워 두면 설정 페이지의 비디오 인코딩 CRF를 사용합니다."
russian = "От 0 до 51: меньше — чётче и больше файл. Пустое поле означает CRF из настроек кодирования видео."
german = "0 bis 51, kleiner ist klarer und größer. Leer lassen nutzt den CRF aus den Video-Encoding-Einstellungen."
spanish = "De 0 a 51: cuanto menor, más nitidez y tamaño. Si lo dejas vacío se usa el CRF de codificación de vídeo de los ajustes."
french = "De 0 à 51 : plus le chiffre est bas, plus c'est net et lourd. Vide, le CRF d'encodage vidéo des réglages est utilisé."
brazilian_portuguese = "0 a 51: quanto menor, mais nítido e maior. Deixe vazio para usar o CRF de codificação de vídeo das configurações."
portuguese = "0 a 51: quanto menor, mais nítido e maior. Deixa vazio para usar o CRF de codificação de vídeo das definições."
turkish = "0-51 arası; düşük değer daha net ve daha büyük dosya demektir. Boş bırakırsan ayarlardaki video kodlama CRF değeri kullanılır."
polish = "Od 0 do 51: mniej znaczy wyraźniej i większy plik. Puste pole oznacza CRF z ustawień kodowania wideo."

[[message]]
key = "The scale name depends on the encoder (CRF, CQ, QP, ICQ) but the direction is the same. ProRes fixes quality by profile, so the field is disabled."
[message.translations]
simplified_chinese = "这套刻度在不同编码器下叫法不同（CRF、CQ、QP、ICQ），但方向一致。ProRes 的画质由 profile 固定，所以这一项不可编辑。"
traditional_chinese = "這套刻度在不同編碼器下叫法不同（CRF、CQ、QP、ICQ），但方向一致。ProRes 的畫質由 profile 固定，所以這一項不可編輯。"
japanese = "尺度の名前はエンコーダーごとに違いますが（CRF、CQ、QP、ICQ）、向きは同じです。ProRes は profile で画質が固定されるため、この項目は編集できません。"
korean = "이 척도의 이름은 인코더마다 다르지만(CRF, CQ, QP, ICQ) 방향은 같습니다. ProRes는 프로파일로 화질이 고정되어 이 항목을 편집할 수 없습니다."
russian = "Название шкалы зависит от кодировщика (CRF, CQ, QP, ICQ), но направление одно. В ProRes качество задаётся профилем, поэтому поле недоступно."
german = "Der Name der Skala hängt vom Encoder ab (CRF, CQ, QP, ICQ), die Richtung bleibt gleich. Bei ProRes legt das Profil die Qualität fest, daher ist das Feld gesperrt."
spanish = "El nombre de la escala depende del codificador (CRF, CQ, QP, ICQ), pero la dirección es la misma. ProRes fija la calidad por perfil, así que el campo se desactiva."
french = "Le nom de l'échelle dépend de l'encodeur (CRF, CQ, QP, ICQ), mais le sens reste le même. ProRes fixe la qualité par profil, donc le champ est désactivé."
brazilian_portuguese = "O nome da escala depende do codificador (CRF, CQ, QP, ICQ), mas a direção é a mesma. O ProRes fixa a qualidade pelo perfil, então o campo fica desativado."
portuguese = "O nome da escala depende do codificador (CRF, CQ, QP, ICQ), mas o sentido é o mesmo. O ProRes fixa a qualidade pelo perfil, por isso o campo fica desativado."
turkish = "Ölçeğin adı kodlayıcıya göre değişir (CRF, CQ, QP, ICQ) ama yön aynıdır. ProRes kaliteyi profile göre sabitlediği için bu alan düzenlenemez."
polish = "Nazwa skali zależy od kodera (CRF, CQ, QP, ICQ), ale kierunek jest ten sam. ProRes ustala jakość profilem, więc pole jest zablokowane."

[[message]]
key = "How much color detail is kept, and the setting that matters most for editing. 4:2:0 is smallest and most compatible, 4:2:2 is the common editing middle ground, 4:4:4 keeps thin lines and small colored text sharp."
[message.translations]
simplified_chinese = "决定保留多少颜色细节，也是对剪辑影响最大的一项。4:2:0 体积最小、兼容性最好，4:2:2 是剪辑常用的折中，4:4:4 能让细线和彩色小字保持锐利。"
traditional_chinese = "決定保留多少顏色細節，也是對剪輯影響最大的一項。4:2:0 體積最小、相容性最好，4:2:2 是剪輯常用的折中，4:4:4 能讓細線和彩色小字保持銳利。"
japanese = "色の情報をどれだけ残すかで、編集に最も影響する項目です。4:2:0 は最小で互換性が高く、4:2:2 は編集でよく使われる中間、4:4:4 は細い線や小さな色文字を鮮明に保ちます。"
korean = "색 정보를 얼마나 남길지 정하며 편집에 가장 큰 영향을 줍니다. 4:2:0은 가장 작고 호환성이 좋고, 4:2:2는 편집에서 흔히 쓰는 중간값, 4:4:4는 가는 선과 작은 색 글자를 선명하게 유지합니다."
russian = "Сколько цветовых деталей сохраняется — и это важнейший параметр для монтажа. 4:2:0 — самый маленький и совместимый, 4:2:2 — обычная середина для монтажа, 4:4:4 сохраняет резкими тонкие линии и мелкий цветной текст."
german = "Wie viel Farbdetail erhalten bleibt – und die wichtigste Einstellung für den Schnitt. 4:2:0 ist am kleinsten und kompatibelsten, 4:2:2 der übliche Mittelweg für den Schnitt, 4:4:4 hält dünne Linien und kleinen farbigen Text scharf."
spanish = "Cuánto detalle de color se conserva, y el ajuste que más importa para editar. 4:2:0 es el más pequeño y compatible, 4:2:2 el punto medio habitual para editar, y 4:4:4 mantiene nítidas las líneas finas y el texto pequeño de color."
french = "La quantité de détail couleur conservée, et le réglage le plus important pour le montage. 4:2:0 est le plus léger et compatible, 4:2:2 le compromis courant pour le montage, 4:4:4 garde nets les traits fins et les petits textes colorés."
brazilian_portuguese = "Quanto detalhe de cor é mantido, e o ajuste que mais importa para edição. 4:2:0 é o menor e mais compatível, 4:2:2 é o meio-termo comum para edição e 4:4:4 mantém nítidas as linhas finas e os textos pequenos coloridos."
portuguese = "Quanto detalhe de cor é mantido, e o ajuste que mais importa para edição. 4:2:0 é o menor e mais compatível, 4:2:2 é o meio-termo comum para edição e 4:4:4 mantém nítidas as linhas finas e os textos pequenos coloridos."
turkish = "Ne kadar renk detayının korunacağını belirler ve kurgu için en önemli ayardır. 4:2:0 en küçük ve en uyumlu, 4:2:2 kurguda yaygın orta yol, 4:4:4 ince çizgileri ve küçük renkli yazıları keskin tutar."
polish = "Ile szczegółów koloru zostaje zachowanych — to ustawienie najbardziej wpływa na montaż. 4:2:0 jest najmniejsze i najbardziej zgodne, 4:2:2 to typowy kompromis do montażu, a 4:4:4 zachowuje ostrość cienkich linii i drobnego kolorowego tekstu."

[[message]]
key = "Rendering reads back 8-bit frames, so 10-bit formats add nothing by themselves; the gain comes from chroma density. If the encoder cannot do 4:4:4, the export fails with an error instead of reducing quality silently."
[message.translations]
simplified_chinese = "渲染读回的是 8 位画面，所以换成 10 位格式本身不会多出细节；真正的收益来自色度密度。编码器不支持 4:4:4 时导出会直接报错，而不是偷偷降画质。"
traditional_chinese = "算繪讀回的是 8 位畫面，所以換成 10 位格式本身不會多出細節；真正的收益來自色度密度。編碼器不支援 4:4:4 時匯出會直接報錯，而不是偷偷降畫質。"
japanese = "描画の読み戻しは 8 ビットなので、10 ビット形式にしても情報は増えません。効果は色差の密度から来ます。エンコーダーが 4:4:4 に対応していない場合、画質を黙って下げずエラーで失敗します。"
korean = "렌더링 결과는 8비트이므로 10비트 형식 자체로는 디테일이 늘지 않습니다. 이득은 색차 밀도에서 옵니다. 인코더가 4:4:4를 지원하지 않으면 화질을 몰래 낮추지 않고 오류로 실패합니다."
russian = "Рендер отдаёт 8-битные кадры, поэтому 10-битные форматы сами по себе не добавляют деталей; выигрыш даёт плотность цветовых компонент. Если кодировщик не умеет 4:4:4, экспорт завершится ошибкой, а не снизит качество молча."
german = "Das Rendern liefert 8-Bit-Bilder, daher bringen 10-Bit-Formate allein nichts; der Gewinn kommt von der Farbdichte. Kann der Encoder kein 4:4:4, bricht der Export mit einem Fehler ab, statt die Qualität still zu senken."
spanish = "La renderización devuelve fotogramas de 8 bits, así que los formatos de 10 bits no añaden nada por sí mismos; la ganancia viene de la densidad de croma. Si el codificador no admite 4:4:4, la exportación falla con un error en lugar de bajar la calidad en silencio."
french = "Le rendu renvoie des images 8 bits : les formats 10 bits n'apportent rien en eux-mêmes, le gain vient de la densité de chrominance. Si l'encodeur ne gère pas le 4:4:4, l'export échoue avec une erreur au lieu de baisser la qualité en silence."
brazilian_portuguese = "A renderização devolve quadros de 8 bits, então formatos de 10 bits não acrescentam nada por si só; o ganho vem da densidade de croma. Se o codificador não aceita 4:4:4, o export falha com erro em vez de baixar a qualidade em silêncio."
portuguese = "A renderização devolve imagens de 8 bits, por isso os formatos de 10 bits não acrescentam nada por si só; o ganho vem da densidade de croma. Se o codificador não aceita 4:4:4, o export falha com erro em vez de baixar a qualidade em silêncio."
turkish = "İşleme 8 bit kare döndürür, bu yüzden 10 bit biçimler tek başına ayrıntı eklemez; kazanç kroma yoğunluğundan gelir. Kodlayıcı 4:4:4 desteklemiyorsa kalite sessizce düşürülmez, dışa aktarma hata verir."
polish = "Renderowanie zwraca klatki 8-bitowe, więc formaty 10-bitowe same w sobie nic nie dodają; zysk daje gęstość chrominancji. Jeśli koder nie obsługuje 4:4:4, eksport kończy się błędem zamiast po cichu obniżać jakość."

[[message]]
key = "MP4 is the most compatible for sharing, MOV is the editing standard and required by ProRes, and MKV suits lossless archives but is poorly supported by editors."
[message.translations]
simplified_chinese = "MP4 兼容性最好，适合分享；MOV 是剪辑软件的通用容器，ProRes 必须用它；MKV 适合无损归档，但剪辑软件支持很差。"
traditional_chinese = "MP4 相容性最好，適合分享；MOV 是剪輯軟體的通用容器，ProRes 必須用它；MKV 適合無損歸檔，但剪輯軟體支援很差。"
japanese = "MP4 は共有向けで最も互換性が高く、MOV は編集ソフトの標準で ProRes に必須、MKV は可逆アーカイブ向けですが編集ソフトの対応は乏しいです。"
korean = "MP4는 공유에 가장 호환성이 좋고, MOV는 편집 표준이며 ProRes에 필요하고, MKV는 무손실 보관에 알맞지만 편집 프로그램 지원이 부족합니다."
russian = "MP4 — самый совместимый для обмена, MOV — стандарт монтажа и обязателен для ProRes, MKV подходит для архивов без потерь, но плохо поддерживается монтажными программами."
german = "MP4 ist am kompatibelsten zum Teilen, MOV ist der Standard für den Schnitt und für ProRes nötig, MKV eignet sich für verlustfreie Archive, wird aber von Schnittprogrammen schlecht unterstützt."
spanish = "MP4 es el más compatible para compartir, MOV es el estándar de edición y lo exige ProRes, y MKV sirve para archivos sin pérdida pero los editores lo soportan mal."
french = "MP4 est le plus compatible pour le partage, MOV est le standard du montage et obligatoire pour ProRes, et MKV convient aux archives sans perte mais est mal pris en charge par les logiciels de montage."
brazilian_portuguese = "MP4 é o mais compatível para compartilhar, MOV é o padrão de edição e obrigatório para ProRes, e MKV serve para arquivos sem perdas, mas é mal suportado por editores."
portuguese = "MP4 é o mais compatível para partilhar, MOV é o padrão de edição e obrigatório para ProRes, e MKV serve para arquivos sem perdas, mas é mal suportado por editores."
turkish = "MP4 paylaşım için en uyumlusu, MOV kurgu standardı ve ProRes için zorunlu, MKV kayıpsız arşive uygun ama kurgu programlarında desteği zayıf."
polish = "MP4 jest najbardziej zgodny przy udostępnianiu, MOV to standard montażu i wymóg ProRes, a MKV nadaje się do archiwów bezstratnych, ale jest słabo obsługiwany przez edytory."

[[message]]
key = "Sets encoder, container and quality in one step: Daily is H.264 + MP4, High quality is HEVC + MP4 at a smaller size, Editing is all-intra H.264 + MP4 with instant seeking, and Exchange is ProRes 422 HQ + MOV for other editors."
[message.translations]
simplified_chinese = "一次配好编码器、容器和画质：日常分享是 H.264 + MP4，高画质是体积更小的 HEVC + MP4，剪辑是全帧内 H.264 + MP4（任意位置都能瞬间定位），交换格式是给别的剪辑软件用的 ProRes 422 HQ + MOV。"
traditional_chinese = "一次配好編碼器、容器和畫質：日常分享是 H.264 + MP4，高畫質是體積更小的 HEVC + MP4，剪輯是全幀內 H.264 + MP4（任意位置都能瞬間定位），交換格式是給別的剪輯軟體用的 ProRes 422 HQ + MOV。"
japanese = "エンコーダー・コンテナ・画質を一度に設定します。日常向けは H.264 + MP4、高画質はより小さい HEVC + MP4、編集向けは全フレーム内 H.264 + MP4（どこでも即座にシーク）、交換用は他の編集ソフト向けの ProRes 422 HQ + MOV です。"
korean = "인코더·컨테이너·화질을 한 번에 정합니다. 일상 공유는 H.264 + MP4, 고품질은 더 작은 HEVC + MP4, 편집용은 어디서든 즉시 탐색되는 전체 프레임 내 H.264 + MP4, 교환용은 다른 편집 프로그램을 위한 ProRes 422 HQ + MOV입니다."
russian = "Настраивает кодировщик, контейнер и качество за один шаг: «Повседневный» — H.264 + MP4, «Высокое качество» — HEVC + MP4 меньшего размера, «Монтаж» — полностью внутрикадровый H.264 + MP4 с мгновенным переходом, «Обмен» — ProRes 422 HQ + MOV для других редакторов."
german = "Setzt Encoder, Container und Qualität in einem Schritt: Alltag ist H.264 + MP4, Hohe Qualität ist HEVC + MP4 bei kleinerer Datei, Schnitt ist All-Intra-H.264 + MP4 mit sofortigem Springen, und Austausch ist ProRes 422 HQ + MOV für andere Schnittprogramme."
spanish = "Configura codificador, contenedor y calidad en un paso: Diario es H.264 + MP4, Alta calidad es HEVC + MP4 en un tamaño menor, Edición es todo intra H.264 + MP4 con salto instantáneo, e Intercambio es ProRes 422 HQ + MOV para otros editores."
french = "Règle l'encodeur, le conteneur et la qualité en une fois : Quotidien est H.264 + MP4, Haute qualité est HEVC + MP4 en plus léger, Montage est tout intra H.264 + MP4 avec navigation instantanée, et Échange est ProRes 422 HQ + MOV pour les autres logiciels de montage."
brazilian_portuguese = "Define codificador, contêiner e qualidade de uma vez: Diário é H.264 + MP4, Alta qualidade é HEVC + MP4 em tamanho menor, Edição é todos intra H.264 + MP4 com busca instantânea, e Intercâmbio é ProRes 422 HQ + MOV para outros editores."
portuguese = "Define codificador, contentor e qualidade de uma vez: Diário é H.264 + MP4, Alta qualidade é HEVC + MP4 em tamanho menor, Edição é todos intra H.264 + MP4 com navegação instantânea, e Intercâmbio é ProRes 422 HQ + MOV para outros editores."
turkish = "Kodlayıcı, kapsayıcı ve kaliteyi tek adımda ayarlar: Günlük H.264 + MP4, Yüksek kalite daha küçük boyutta HEVC + MP4, Kurgu anında atlama sağlayan tam iç H.264 + MP4, Değişim ise diğer kurgu programları için ProRes 422 HQ + MOV."
polish = "Ustawia koder, kontener i jakość w jednym kroku: Codzienny to H.264 + MP4, Wysoka jakość to HEVC + MP4 w mniejszym rozmiarze, Montaż to wewnątrzklatkowy H.264 + MP4 z natychmiastowym przewijaniem, a Wymiana to ProRes 422 HQ + MOV dla innych edytorów."

[[message]]
key = "How often a keyframe is written. Cut points can only land on keyframes: 0 uses the encoder default, 1 makes every frame a keyframe, and 60 leaves one keyframe per second at 60 fps."
[message.translations]
simplified_chinese = "隔多少帧写一个关键帧。剪辑切点只能落在关键帧上：0 用编码器默认值，1 让每一帧都是关键帧，60 在 60fps 下相当于每秒一个关键帧。"
traditional_chinese = "隔多少影格寫一個關鍵影格。剪輯切點只能落在關鍵影格上：0 用編碼器預設值，1 讓每一影格都是關鍵影格，60 在 60fps 下相當於每秒一個關鍵影格。"
japanese = "キーフレームを書き込む間隔です。カット点はキーフレームにしか置けないため、0 はエンコーダーの既定値、1 は全フレームをキーフレームに、60 は 60fps で毎秒 1 個のキーフレームになります。"
korean = "키프레임을 얼마나 자주 기록할지 정합니다. 컷 지점은 키프레임에만 놓을 수 있어 0은 인코더 기본값, 1은 모든 프레임을 키프레임으로, 60은 60fps에서 초당 하나의 키프레임이 됩니다."
russian = "Как часто записывается ключевой кадр. Точки склейки возможны только на ключевых кадрах: 0 — значение кодировщика по умолчанию, 1 — каждый кадр ключевой, 60 — один ключевой кадр в секунду при 60 fps."
german = "Wie oft ein Keyframe geschrieben wird. Schnittpunkte können nur auf Keyframes liegen: 0 nutzt den Encoder-Standard, 1 macht jedes Bild zum Keyframe, 60 bedeutet bei 60 fps ein Keyframe pro Sekunde."
spanish = "Cada cuánto se escribe un fotograma clave. Los puntos de corte solo pueden caer en fotogramas clave: 0 usa el valor del codificador, 1 hace que todos lo sean y 60 deja uno por segundo a 60 fps."
french = "Fréquence d'écriture d'une image clé. Les points de coupe ne peuvent tomber que sur des images clés : 0 utilise la valeur de l'encodeur, 1 rend chaque image clé, 60 en laisse une par seconde à 60 fps."
brazilian_portuguese = "Com que frequência um keyframe é gravado. Cortes só podem cair em keyframes: 0 usa o padrão do codificador, 1 torna todo quadro um keyframe e 60 deixa um por segundo a 60 fps."
portuguese = "Com que frequência um keyframe é gravado. Cortes só podem cair em keyframes: 0 usa o padrão do codificador, 1 torna cada imagem um keyframe e 60 deixa um por segundo a 60 fps."
turkish = "Anahtar karenin ne sıklıkla yazılacağını belirler. Kesim noktaları yalnızca anahtar karelere denk gelebilir: 0 kodlayıcı varsayılanı, 1 her kareyi anahtar kare yapar, 60 ise 60 fps'te saniyede bir anahtar kare bırakır."
polish = "Jak często zapisywana jest klatka kluczowa. Cięcia mogą wypadać tylko na klatkach kluczowych: 0 to wartość kodera, 1 czyni każdą klatkę kluczową, a 60 daje jedną klatkę kluczową na sekundę przy 60 fps."

[[message]]
key = "NVIDIA hardware encoders refuse 1 and fall back to 2, with a note in the log; use a software encoder when you need true all-intra."
[message.translations]
simplified_chinese = "NVIDIA 硬件编码器不接受 1，会自动降到 2（隔帧关键帧），并在日志里提示；需要严格全帧内请用软件编码器。"
traditional_chinese = "NVIDIA 硬體編碼器不接受 1，會自動降到 2（隔影格關鍵影格），並在日誌裡提示；需要嚴格全幀內請用軟體編碼器。"
japanese = "NVIDIA のハードウェアエンコーダーは 1 を受け付けず 2 に落ち、ログに記録します。厳密な全フレーム内が必要ならソフトウェアエンコーダーを使ってください。"
korean = "NVIDIA 하드웨어 인코더는 1을 받아들이지 않고 2로 낮추며 로그에 남깁니다. 완전한 전체 프레임 내가 필요하면 소프트웨어 인코더를 쓰세요."
russian = "Аппаратные кодировщики NVIDIA не принимают 1 и откатываются к 2 с записью в лог; для настоящего внутрикадрового режима используйте программный кодировщик."
german = "Hardware-Encoder von NVIDIA lehnen 1 ab und fallen auf 2 zurück, mit Hinweis im Log; für echtes All-Intra den Software-Encoder nutzen."
spanish = "Los codificadores hardware de NVIDIA rechazan 1 y bajan a 2, con un aviso en el registro; usa un codificador software si necesitas todo intra real."
french = "Les encodeurs matériels NVIDIA refusent 1 et reviennent à 2, avec une note dans le journal ; utilise un encodeur logiciel pour un vrai tout intra."
brazilian_portuguese = "Codificadores de hardware da NVIDIA recusam 1 e caem para 2, com aviso no log; use um codificador de software quando precisar de todos intra de verdade."
portuguese = "Codificadores de hardware da NVIDIA recusam 1 e caem para 2, com aviso no registo; usa um codificador de software quando precisares de todos intra a sério."
turkish = "NVIDIA donanım kodlayıcıları 1 değerini kabul etmez ve günlüğe not düşerek 2'ye düşer; gerçek tam iç gerekiyorsa yazılım kodlayıcı kullan."
polish = "Sprzętowe kodery NVIDIA odrzucają 1 i wracają do 2, zostawiając wpis w logu; do prawdziwego trybu wewnątrzklatkowego użyj kodera programowego."

[[message]]
key = "Optional start and end time in seconds. Leave both empty to export the whole demo."
[message.translations]
simplified_chinese = "可选的起止时间，单位是秒。两个都留空就导出整段 demo。"
traditional_chinese = "可選的起止時間，單位是秒。兩個都留空就匯出整段 demo。"
japanese = "任意で指定できる開始・終了時刻（秒）。両方空欄ならデモ全体を書き出します。"
korean = "선택 사항인 시작·끝 시간(초)입니다. 둘 다 비우면 데모 전체를 내보냅니다."
russian = "Необязательные время начала и конца в секундах. Оставьте оба поля пустыми, чтобы экспортировать всё демо."
german = "Optionaler Start- und Endzeitpunkt in Sekunden. Beide leer lassen exportiert die ganze Demo."
spanish = "Hora de inicio y fin opcionales en segundos. Déjalas vacías para exportar la demo completa."
french = "Heure de début et de fin facultatives, en secondes. Laisse les deux vides pour exporter toute la démo."
brazilian_portuguese = "Início e fim opcionais em segundos. Deixe os dois vazios para exportar a demo inteira."
portuguese = "Início e fim opcionais em segundos. Deixa os dois vazios para exportar a demo inteira."
turkish = "İsteğe bağlı başlangıç ve bitiş zamanı (saniye). İkisini de boş bırakırsan demonun tamamı aktarılır."
polish = "Opcjonalny czas początku i końca w sekundach. Pozostaw oba puste, aby wyeksportować całe demo."

[[message]]
key = "Why is a ProRes file huge but not sharper? ProRes is an exchange format: every editor opens it and scrubbing is smooth. Its 10-bit profile carries the same 8-bit source, so raise chroma sampling for more detail."
[message.translations]
simplified_chinese = "为什么 ProRes 文件那么大却不会更清晰？ProRes 是交换格式，价值在于任何剪辑软件都能打开、时间线拖动流畅。它的 10 位精度装的还是同一份 8 位源，想要更多细节应该提高色彩采样。"
traditional_chinese = "為什麼 ProRes 檔案那麼大卻不會更清晰？ProRes 是交換格式，價值在於任何剪輯軟體都能開啟、時間軸拖動流暢。它的 10 位精度裝的還是同一份 8 位來源，想要更多細節應該提高色彩取樣。"
japanese = "ProRes はなぜ巨大なのに鮮明にならないのか？ProRes は交換用形式で、どの編集ソフトでも開けてシークが滑らかになるのが利点です。10 ビットのプロファイルでも中身は同じ 8 ビット素材なので、詳細が欲しいなら色差サンプリングを上げてください。"
korean = "ProRes 파일은 왜 거대한데 더 선명하지 않나요? ProRes는 교환 형식이라 어떤 편집 프로그램에서도 열리고 탐색이 부드럽습니다. 10비트 프로파일이지만 담는 원본은 같은 8비트이므로, 더 많은 디테일을 원하면 색차 샘플링을 올리세요."
russian = "Почему файл ProRes огромный, но не чётче? ProRes — формат обмена: его открывает любой редактор, а прокрутка плавная. Его 10-битный профиль несёт тот же 8-битный источник, поэтому за деталями повышайте цветовую субдискретизацию."
german = "Warum ist eine ProRes-Datei riesig, aber nicht schärfer? ProRes ist ein Austauschformat: Jedes Schnittprogramm öffnet sie und das Scrollen läuft flüssig. Das 10-Bit-Profil trägt dieselbe 8-Bit-Quelle, für mehr Details also die Farbabtastung erhöhen."
spanish = "¿Por qué un archivo ProRes es enorme pero no más nítido? ProRes es un formato de intercambio: cualquier editor lo abre y el desplazamiento es fluido. Su perfil de 10 bits lleva la misma fuente de 8 bits, así que sube el muestreo de color para más detalle."
french = "Pourquoi un fichier ProRes est-il énorme sans être plus net ? ProRes est un format d'échange : tous les logiciels de montage l'ouvrent et la navigation est fluide. Son profil 10 bits contient la même source 8 bits ; augmente plutôt l'échantillonnage des couleurs."
brazilian_portuguese = "Por que um arquivo ProRes é enorme mas não mais nítido? ProRes é um formato de intercâmbio: qualquer editor abre e a navegação é fluida. O perfil de 10 bits carrega a mesma fonte de 8 bits, então aumente a amostragem de cor para mais detalhe."
portuguese = "Por que um ficheiro ProRes é enorme mas não mais nítido? ProRes é um formato de intercâmbio: qualquer editor abre e a navegação é fluida. O perfil de 10 bits transporta a mesma fonte de 8 bits, por isso aumenta a amostragem de cor para mais detalhe."
turkish = "ProRes dosyası neden çok büyük ama daha net değil? ProRes bir değişim biçimidir: her kurgu programı açar ve zaman çizelgesinde gezinme akıcıdır. 10 bit profili aynı 8 bit kaynağı taşır; daha fazla ayrıntı için renk örneklemesini yükselt."
polish = "Dlaczego plik ProRes jest ogromny, ale nie ostrzejszy? ProRes to format wymiany: otwiera go każdy edytor, a przewijanie jest płynne. Jego profil 10-bitowy przenosi to samo źródło 8-bitowe, więc zwiększ próbkowanie koloru."

[[message]]
key = "Why does scrubbing lag in my editor? The file uses a normal GOP, so the editor decodes from the previous keyframe. Re-export with the Editing preset."
[message.translations]
simplified_chinese = "为什么剪辑软件里拖进度条会卡？因为成片用的是普通 GOP，拖动时要从上一个关键帧解码过来。换成剪辑预设重新导出即可。"
traditional_chinese = "為什麼剪輯軟體裡拖時間軸會卡？因為成片用的是普通 GOP，拖動時要從上一個關鍵影格解碼過來。換成剪輯預設重新匯出即可。"
japanese = "編集ソフトでシークすると引っかかるのはなぜ？通常の GOP なので、直前のキーフレームからデコードし直すためです。編集向けプリセットで書き出し直してください。"
korean = "편집 프로그램에서 탐색이 끊기는 이유는? 일반 GOP를 쓰기 때문에 이전 키프레임부터 다시 디코딩합니다. 편집용 프리셋으로 다시 내보내세요."
russian = "Почему прокрутка в редакторе тормозит? Файл использует обычный GOP, поэтому редактор декодирует от предыдущего ключевого кадра. Переэкспортируйте с пресетом «Монтаж»."
german = "Warum ruckelt das Scrollen im Schnittprogramm? Die Datei nutzt einen normalen GOP, also dekodiert das Programm ab dem vorherigen Keyframe. Neu exportieren mit dem Preset Schnitt."
spanish = "¿Por qué va a tirones al desplazar en mi editor? El archivo usa un GOP normal, así que el editor decodifica desde el fotograma clave anterior. Vuelve a exportar con el preajuste Edición."
french = "Pourquoi la navigation saccade-t-elle dans mon logiciel ? Le fichier utilise un GOP normal, donc le logiciel décode depuis l'image clé précédente. Réexporte avec le préréglage Montage."
brazilian_portuguese = "Por que a navegação trava no meu editor? O arquivo usa GOP normal, então o editor decodifica desde o keyframe anterior. Exporte de novo com a predefinição Edição."
portuguese = "Por que a navegação trava no meu editor? O ficheiro usa GOP normal, por isso o editor descodifica desde o keyframe anterior. Exporta outra vez com a predefinição Edição."
turkish = "Kurgu programımda gezinme neden takılıyor? Dosya normal GOP kullanıyor, bu yüzden program önceki anahtar kareden çözüyor. Kurgu ön ayarıyla yeniden aktar."
polish = "Dlaczego przewijanie w edytorze się zacina? Plik używa zwykłego GOP, więc edytor dekoduje od poprzedniej klatki kluczowej. Wyeksportuj ponownie z presetem Montaż."

[[message]]
key = "Why will some players not open a 4:4:4 file? H.264 4:4:4 uses the High 4:4:4 Predictive profile, which some hardware decoders and phones lack. Use 4:2:0 for wide compatibility."
[message.translations]
simplified_chinese = "为什么有些播放器打不开 4:4:4 的成片？4:4:4 的 H.264 使用 High 4:4:4 Predictive profile，部分硬件解码器和手机不支持。需要广泛兼容就用 4:2:0。"
traditional_chinese = "為什麼有些播放器打不開 4:4:4 的成片？4:4:4 的 H.264 使用 High 4:4:4 Predictive profile，部分硬體解碼器和手機不支援。需要廣泛相容就用 4:2:0。"
japanese = "一部のプレイヤーで 4:4:4 のファイルが開けないのはなぜ？4:4:4 の H.264 は High 4:4:4 Predictive プロファイルを使い、一部のハードウェアデコーダーやスマートフォンが対応していません。広い互換性が必要なら 4:2:0 を使ってください。"
korean = "일부 플레이어에서 4:4:4 파일이 열리지 않는 이유는? 4:4:4 H.264는 High 4:4:4 Predictive 프로파일을 쓰는데 일부 하드웨어 디코더와 휴대폰이 지원하지 않습니다. 폭넓은 호환성이 필요하면 4:2:0을 쓰세요."
russian = "Почему некоторые проигрыватели не открывают файл 4:4:4? H.264 4:4:4 использует профиль High 4:4:4 Predictive, который поддерживают не все аппаратные декодеры и телефоны. Для широкой совместимости используйте 4:2:0."
german = "Warum öffnen manche Player eine 4:4:4-Datei nicht? H.264 4:4:4 nutzt das Profil High 4:4:4 Predictive, das manche Hardware-Decoder und Handys nicht beherrschen. Für breite Kompatibilität 4:2:0 verwenden."
spanish = "¿Por qué algunos reproductores no abren un archivo 4:4:4? El H.264 4:4:4 usa el perfil High 4:4:4 Predictive, que algunos decodificadores hardware y móviles no admiten. Usa 4:2:0 para amplia compatibilidad."
french = "Pourquoi certains lecteurs n'ouvrent-ils pas un fichier 4:4:4 ? Le H.264 4:4:4 utilise le profil High 4:4:4 Predictive, que certains décodeurs matériels et téléphones n'ont pas. Utilise 4:2:0 pour une large compatibilité."
brazilian_portuguese = "Por que alguns players não abrem um arquivo 4:4:4? O H.264 4:4:4 usa o perfil High 4:4:4 Predictive, que alguns decodificadores de hardware e celulares não têm. Use 4:2:0 para compatibilidade ampla."
portuguese = "Por que alguns leitores não abrem um ficheiro 4:4:4? O H.264 4:4:4 usa o perfil High 4:4:4 Predictive, que alguns descodificadores de hardware e telemóveis não têm. Usa 4:2:0 para compatibilidade ampla."
turkish = "Bazı oynatıcılar 4:4:4 dosyayı neden açmıyor? 4:4:4 H.264, High 4:4:4 Predictive profilini kullanır; bazı donanım çözücüler ve telefonlar bunu desteklemez. Geniş uyumluluk için 4:2:0 kullan."
polish = "Dlaczego niektóre odtwarzacze nie otwierają pliku 4:4:4? H.264 4:4:4 używa profilu High 4:4:4 Predictive, którego część dekoderów sprzętowych i telefonów nie obsługuje. Dla szerokiej zgodności użyj 4:2:0."

