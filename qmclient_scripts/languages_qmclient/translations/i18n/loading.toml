[[message]]
key = "DDraceNetwork is a cooperative online game where the goal is for you and your group of tees to reach the finish line of the map. As a newcomer you should start on Novice servers, which host the easiest maps. Consider the ping to choose a server close to you."
[message.translations]
simplified_chinese = "DDraceNetwork 是一款在线合作游戏，你和你团体里的 Tee 的目标是抵达地图的终点。作为新手你应该从有着最简单的地图的简单（Novice）服务器入门。根据延迟来选择离你相近的服务器。"
traditional_chinese = "DDraceNetwork 是一款在線合作遊戲，你和你團體裡的 Tee 的目標是抵達地圖的終點。作為新手你應該從有著最簡單的地圖的簡單（Novice）伺服器入門。根據延遲來選擇離你相近的伺服器。"
japanese = "DDraceNetwork は協力型オンラインゲームで、あなたとあなたのグループの Tee がマップのゴールに到達することを目指します。初心者は最も簡単なマップがある Novice サーバーから始めるべきです。自分に近いサーバーを選ぶために ping を考慮してください。"
korean = "DDraceNetwork는 협동 온라인 게임으로, 당신과 당신의 티 그룹이 맵의 결승선에 도달하는 것이 목표입니다. 초보자라면 가장 쉬운 맵을 제공하는 Novice 서버에서 시작해야 합니다. 핑을 고려하여 가까운 서버를 선택하세요."
russian = "DDraceNetwork — это кооперативная онлайн-игра, где ваша цель и цель вашей группы ти — достичь финиша карты. Новичкам стоит начинать на серверах Novice, где находятся самые простые карты. Учитывайте пинг при выборе ближайшего к вам сервера."
german = "DDraceNetwork ist ein kooperatives Online-Spiel, bei dem du und deine Gruppe von Tees das Ziel der Karte erreichen müsst. Als Neuling solltest du auf Novice-Servern beginnen, die die einfachsten Karten hosten. Wähle einen Server in deiner Nähe basierend auf dem Ping."
spanish = "DDraceNetwork es un juego cooperativo en línea donde el objetivo es que tú y tu grupo de tees lleguéis a la línea de meta del mapa. Como novato, deberías empezar en servidores Novice, que albergan los mapas más fáciles. Considera el ping para elegir un servidor cercano a ti."
french = "DDraceNetwork est un jeu en ligne coopératif où le but est que vous et votre groupe de tees atteigniez la ligne d'arrivée de la carte. En tant que nouveau venu, vous devriez commencer sur les serveurs Novice, qui hébergent les cartes les plus faciles. Tenez compte du ping pour choisir un serveur proche de chez vous."
brazilian_portuguese = "DDraceNetwork é um jogo cooperativo online onde o objetivo é que você e seu grupo de tees alcancem a linha de chegada do mapa. Como novato, você deve começar em servidores Novice, que hospedam os mapas mais fáceis. Considere o ping para escolher um servidor próximo a você."
portuguese = "DDraceNetwork é um jogo cooperativo online onde o objetivo é tu e o teu grupo de tees chegarem à linha de chegada do mapa. Como novato, deves começar nos servidores Novice, que albergam os mapas mais fáceis. Considera o ping para escolher um servidor perto de ti."
turkish = "DDraceNetwork, sizin ve tee grubunuzun haritanın bitiş çizgisine ulaşmayı hedeflediği işbirlikçi bir çevrimiçi oyundur. Yeni başlayan biri olarak, en kolay haritaları barındıran Novice sunucularında başlamalısınız. Size yakın bir sunucu seçmek için ping'i göz önünde bulundurun."
polish = "DDraceNetwork to kooperacyjna gra online, w której celem jest dotarcie z grupą tee do mety mapy. Jako nowy gracz powinieneś zacząć na serwerach Novice, które hostują najłatwiejsze mapy. Wybierz serwer blisko siebie, biorąc pod uwagę ping."

