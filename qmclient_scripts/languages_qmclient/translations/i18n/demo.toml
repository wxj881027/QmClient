[[message]]
key = "Quality from 0 to 51; lower is clearer and larger. Leave empty to use the video encoding CRF."
[message.translations]
simplified_chinese = "画质范围 0-51，数值越低越清晰、文件越大；留空使用下方视频编码的 CRF。"
traditional_chinese = "畫質範圍 0-51，數值越低越清晰、檔案越大；留空使用下方影片編碼的 CRF。"
japanese = "画質は 0～51 です。小さいほど高画質でファイルが大きくなります。空欄の場合は下の動画エンコード CRF を使用します。"
korean = "품질 범위는 0-51이며 낮을수록 선명하고 파일이 커집니다. 비워 두면 아래 동영상 인코딩 CRF를 사용합니다."
russian = "Качество от 0 до 51: меньше — четче и больше файл. Оставьте пустым, чтобы использовать CRF из раздела кодирования видео."
german = "Qualität von 0 bis 51; niedriger ist schärfer und größer. Leer lassen, um das CRF der Video-Encodierung zu verwenden."
spanish = "Calidad de 0 a 51; más bajo es más nítido y más grande. Déjalo vacío para usar el CRF de codificación de vídeo."
french = "Qualité de 0 à 51 ; plus bas est plus net et plus volumineux. Laissez vide pour utiliser le CRF de l’encodage vidéo."
brazilian_portuguese = "Qualidade de 0 a 51; menor é mais nítido e maior. Deixe vazio para usar o CRF da codificação de vídeo."
portuguese = "Qualidade de 0 a 51; mais baixo é mais nítido e maior. Deixe vazio para usar o CRF da codificação de vídeo."
turkish = "Kalite 0-51 arasındadır; düşük değer daha net ve daha büyük dosya demektir. Vide bırakırsanız aşağıdaki video kodlama CRF değeri kullanılır."
polish = "Jakość od 0 do 51; niżej oznacza ostrzejszy obraz i większy plik. Pozostaw puste, aby użyć CRF z kodowania wideo."

