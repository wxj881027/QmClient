german = "Schnittpunkte können nur auf Keyframes liegen. Kleinere Werte ermöglichen mehr Schnittpunkte und größere Dateien; 0 verwendet den Encoder-Standard."
spanish = "Los puntos de corte solo pueden caer en fotogramas clave. Valores menores añaden más puntos y archivos más grandes; 0 usa el valor predeterminado del codificador."
french = "Les points de coupe ne peuvent tomber que sur des images clés. Des valeurs plus petites ajoutent des points de coupe et augmentent la taille ; 0 utilise la valeur par défaut de l’encodeur."
brazilian_portuguese = "Os pontos de corte só podem cair em quadros-chave. Valores menores adicionam mais pontos e arquivos maiores; 0 usa o padrão do codificador."
portuguese = "Os pontos de corte só podem cair em fotogramas-chave. Valores menores adicionam mais pontos e ficheiros maiores; 0 usa a predefinição do codificador."
