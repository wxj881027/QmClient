simplified_chinese = "剪辑切点只能落在关键帧上；数值越小切点越密、文件越大；0 使用编码器默认值。"
traditional_chinese = "剪輯切點只能落在關鍵影格上；數值越小切點越密、檔案越大；0 使用編碼器預設值。"
