[message.translations]
simplified_chinese = "此连接不支持在线改名，请使用存档中的名字重新连接。"
traditional_chinese = "此連線不支援線上改名，請使用存檔中的名字重新連線。"
japanese = "この接続では接続中に名前を変更できません。保存された名前で再接続してください。"
korean = "이 연결에서는 접속 중 이름을 변경할 수 없습니다. 저장된 이름으로 다시 접속하세요."
russian = "Это соединение не поддерживает смену имени во время игры. Переподключитесь с сохранёнными именами."
german = "Diese Verbindung erlaubt keine Namensänderung während der Verbindung. Zuerst mit den gespeicherten Namen neu verbinden."
spanish = "Esta conexión no permite cambiar nombres durante la sesión. Reconéctate con los nombres guardados."
french = "Cette connexion ne permet pas de changer de nom en cours de session. Reconnectez-vous avec les noms sauvegardés."
brazilian_portuguese = "Esta conexão não permite mudar nomes durante a sessão. Reconecte com os nomes salvos."
portuguese = "Esta ligação não permite mudar nomes durante a sessão. Volta a ligar com os nomes guardados."
turkish = "Bu bağlantıda bağlıyken ad değiştirilemez. Önce kayıtlı adlarla yeniden bağlanın."
polish = "To połączenie nie pozwala zmieniać nazw w trakcie sesji. Połącz się ponownie z zapisanymi nazwami."

[[message]]
key = "Finish or reset the current race before restoring a save."
[message.translations]
simplified_chinese = "请先结束或重置当前比赛，再恢复存档。"
traditional_chinese = "請先結束或重設目前的比賽，再恢復存檔。"
japanese = "現在のレースを終了またはリセットしてからセーブを復元してください。"
korean = "현재 레이스를 끝내거나 초기화한 뒤 저장 데이터를 복원하세요."
russian = "Завершите или сбросьте текущую гонку перед восстановлением."
german = "Vor der Wiederherstellung das aktuelle Rennen beenden oder zurücksetzen."
spanish = "Termina o reinicia la carrera actual antes de restaurar una partida."
french = "Terminez ou réinitialisez la course actuelle avant de restaurer une sauvegarde."
brazilian_portuguese = "Termine ou reinicie a corrida atual antes de restaurar um jogo salvo."
portuguese = "Termina ou reinicia a corrida atual antes de restaurar um jogo guardado."
turkish = "Bir kaydı geri yüklemeden önce mevcut yarışı bitirin veya sıfırlayın."
polish = "Zakończ lub zresetuj bieżący wyścig przed przywróceniem zapisu."

[[message]]
key = "Restoring save %d: main '%s', dummy '%s'."
[message.translations]
simplified_chinese = "正在恢复存档 %d：本体“%s”，分身“%s”。"
traditional_chinese = "正在恢復存檔 %d：本體「%s」，分身「%s」。"
japanese = "セーブ %d を復元中：メイン「%s」、ダミー「%s」。"
korean = "저장 데이터 %d 복원 중: 본체 '%s', 더미 '%s'."
russian = "Восстановление сохранения %d: основной '%s', дамми '%s'."
german = "Spielstand %d wird wiederhergestellt: Hauptspieler '%s', Dummy '%s'."
spanish = "Restaurando partida %d: principal '%s', dummy '%s'."
french = "Restauration de la sauvegarde %d : principal '%s', dummy '%s'."
brazilian_portuguese = "Restaurando jogo salvo %d: principal '%s', dummy '%s'."
portuguese = "A restaurar o jogo guardado %d: principal '%s', dummy '%s'."
turkish = "%d numaralı kayıt geri yükleniyor: ana oyuncu '%s', kukla '%s'."
polish = "Przywracanie zapisu %d: główny '%s', dummy '%s'."

[[message]]
key = "Save restore stopped: connection, names or team were not ready. The local record was kept."
[message.translations]
simplified_chinese = "连接、名字或队伍尚未就绪，存档恢复已停止。本地记录已保留。"
traditional_chinese = "連線、名字或隊伍尚未就緒，存檔恢復已停止。本機紀錄已保留。"
japanese = "接続、名前、またはチームの準備が整わず、復元を停止しました。ローカルの記録は保持されています。"
korean = "연결, 이름 또는 팀이 준비되지 않아 복원을 중단했습니다. 로컬 기록은 유지됩니다."
russian = "Восстановление остановлено: соединение, имена или команда не готовы. Локальная запись сохранена."
german = "Wiederherstellung beendet: Verbindung, Namen oder Team waren nicht bereit. Lokaler Eintrag behalten."
spanish = "Restauración detenida: la conexión, los nombres o el equipo no estaban listos. Se conservó el registro local."
french = "Restauration arrêtée : la connexion, les noms ou l’équipe n’étaient pas prêts. Entrée locale conservée."
brazilian_portuguese = "Restauração interrompida: conexão, nomes ou equipe não estavam prontos. O registro local foi mantido."
portuguese = "Restauração interrompida: ligação, nomes ou equipa não estavam prontos. O registo local foi mantido."
turkish = "Bağlantı, adlar veya takım hazır olmadığından geri yükleme durduruldu. Yerel kayıt korundu."
polish = "Przywracanie zatrzymane: połączenie, nazwy lub drużyna nie były gotowe. Lokalny wpis zachowano."

[[message]]
key = "Restore a two-player save? /qm Yes uses the newest; /qm Yes number selects another. /qm No dismisses."
[message.translations]
simplified_chinese = "是否恢复双人存档？/qm Yes 读取最新一条，/qm Yes 序号 选择其他存档，/qm No 忽略本次提示。"
traditional_chinese = "是否恢復雙人存檔？/qm Yes 讀取最新一筆，/qm Yes 序號 選擇其他存檔，/qm No 忽略本次提示。"
japanese = "2人用セーブを復元しますか？ /qm Yes で最新、/qm Yes 番号 で別のセーブを選択、/qm No で閉じます。"
korean = "2인 저장 데이터를 복원할까요? /qm Yes는 최신 데이터, /qm Yes 번호는 다른 데이터 선택, /qm No는 알림 닫기입니다."
russian = "Восстановить сохранение для двоих? /qm Yes — последнее, /qm Yes номер — другое, /qm No — отмена."
german = "Spielstand für zwei Spieler laden? /qm Yes lädt den neuesten, /qm Yes Nummer wählt einen anderen, /qm No lehnt ab."
spanish = "¿Restaurar una partida de dos jugadores? /qm Yes carga la más reciente; /qm Yes número elige otra; /qm No descarta."
french = "Restaurer une sauvegarde à deux ? /qm Yes charge la plus récente ; /qm Yes numéro en choisit une autre ; /qm No ignore."
brazilian_portuguese = "Restaurar um jogo salvo de dois jogadores? /qm Yes carrega o mais recente; /qm Yes número escolhe outro; /qm No dispensa."
portuguese = "Restaurar um jogo guardado de dois jogadores? /qm Yes carrega o mais recente; /qm Yes número escolhe outro; /qm No ignora."
turkish = "İki kişilik kayıt geri yüklensin mi? /qm Yes en yeniyi yükler; /qm Yes numara başka kayıt seçer; /qm No kapatır."
polish = "Przywrócić zapis dla dwóch graczy? /qm Yes wczyta najnowszy; /qm Yes numer wybierze inny; /qm No odrzuci."

