[[message]]
key = "Rescue: auto mode teleports out of freeze; manual mode records a rescue point on landing and teleports there while frozen"
[message.translations]
simplified_chinese = "救援：自动模式下传送出冻结；手动模式下落地记录救援点，冻结时传送出去"
traditional_chinese = "救援：自動模式下傳送出凍結；手動模式下落地記錄救援點，凍結時傳送出去"
japanese = "レスキュー：オートモードではフリーズからテレポートで脱出、マニュアルモードでは着地時にレスキューポイントを記録、フリーズ中にそこへテレポート"
korean = "구출: 자동 모드는 얼음에서 텔레포트; 수동 모드는 착지 시 구출 지점을 기록하고 얼음에 갇혔을 때 그곳으로 텔레포트합니다."
russian = "Спасение: в автоматическом режиме телепортирует из заморозки; в ручном режиме записывает точку спасения при приземлении и телепортирует туда при заморозке"
german = "Rettung: Automatikmodus teleportiert aus dem Freeze; manueller Modus zeichnet bei Landung einen Rettungspunkt auf und teleportiert dorthin, während man gefroren ist"
spanish = "Rescate: el modo automático teletransporta fuera de congelación; el modo manual registra un punto de rescate al aterrizar y teletransporta allí mientras está congelado"
french = "Sauvetage : le mode automatique téléporte hors du gel ; le mode manuel enregistre un point de sauvetage à l'atterrissage et téléporte là-bas lorsqu'il est gelé"
brazilian_portuguese = "Resgate: modo automático teleporta para fora do congelamento; modo manual registra um ponto de resgate ao aterrissar e teleporta para lá enquanto congelado."
portuguese = "Salvamento: modo automático teleporta para fora do congelamento; modo manual regista um ponto de salvamento ao aterrar e teleporta para lá enquanto congelado"
turkish = "Kurtarma: otomatik mod donmadan ışınlar; manuel mod inişte bir kurtarma noktası kaydeder ve donduğunda oraya ışınlanır."
polish = "Ratowanie: tryb automatyczny teleportuje z zamrożenia; tryb ręczny zapisuje punkt ratunkowy przy lądowaniu i teleportuje tam podczas zamrożenia."

