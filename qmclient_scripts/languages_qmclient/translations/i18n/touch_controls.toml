key = "You can manage your touch controls settings on this page. Only changes that are saved will be available after restarting the client. You can share your touch controls with others by exporting them to the clipboard.\\n\\nYou can find more detailed information about the touch controls on the DDNet Wiki."
[message.translations]
simplified_chinese = "可在此管理触控设置；须保存后重启才生效。可导出到剪贴板分享。\n\n更多说明见 DDNet Wiki。"
traditional_chinese = "可在此管理觸控設定；須保存後重啟才生效。可匯出到剪貼簿分享。\n\n更多說明見 DDNet Wiki。"
japanese = "このページでタッチコントロールの設定を管理できます。保存された変更のみがクライアント再起動後に有効になります。クリップボードにエクスポートすることで、タッチコントロールを他の人と共有できます。\\n\\nタッチコントロールの詳細については、DDNet Wiki をご覧ください。"
korean = "이 페이지에서 터치 컨트롤 설정을 관리할 수 있습니다. 저장된 변경 사항만 클라이언트를 다시 시작한 후에 적용됩니다. 터치 컨트롤을 클립보드로 내보내 다른 사람과 공유할 수 있습니다.\\n\\n터치 컨트롤에 대한 자세한 정보는 DDNet Wiki 에서 확인할 수 있습니다."
russian = "Вы можете управлять настройками сенсорного управления на этой странице. Только сохранённые изменения будут доступны после перезапуска клиента. Вы можете поделиться своими настройками сенсорного управления с другими, экспортировав их в буфер обмена.\\n\\nБолее подробную информацию о сенсорном управлении можно найти на DDNet Wiki."
german = "Du kannst auf dieser Seite deine Touch-Steuerungseinstellungen verwalten. Nur gespeicherte Änderungen sind nach einem Neustart des Clients verfügbar. Du kannst deine Touch-Steuerung mit anderen teilen, indem du sie in die Zwischenablage exportierst.\\n\\nWeitere detaillierte Informationen zur Touch-Steuerung findest du im DDNet Wiki."
spanish = "Puedes gestionar la configuración de los controles táctiles en esta página. Solo los cambios guardados estarán disponibles después de reiniciar el cliente. Puedes compartir tus controles táctiles con otros exportándolos al portapapeles.\\n\\nPuedes encontrar información más detallada sobre los controles táctiles en la DDNet Wiki."
french = "Vous pouvez gérer les paramètres des commandes tactiles sur cette page. Seules les modifications sauvegardées seront disponibles après le redémarrage du client. Vous pouvez partager vos commandes tactiles avec d’autres en les exportant dans le presse-papiers.\\n\\nVous trouverez des informations plus détaillées sur les commandes tactiles sur le Wiki DDNet."
brazilian_portuguese = "Você pode gerenciar suas configurações de controles de toque nesta página. Apenas alterações salvas estarão disponíveis após reiniciar o cliente. Você pode compartilhar seus controles de toque com outros exportando-os para a área de transferência.\\n\\nVocê pode encontrar informações mais detalhadas sobre os controles de toque na DDNet Wiki."
portuguese = "Pode gerir as suas definições de controlos táteis nesta página. Apenas as alterações guardadas estarão disponíveis após reiniciar o cliente. Pode partilhar os seus controlos táteis com outros exportando-os para a área de transferência.\\n\\nPode encontrar informações mais detalhadas sobre os controlos táteis na DDNet Wiki."
turkish = "Bu sayfada dokunmatik kontrol ayarlarınızı yönetebilirsiniz. Yalnızca kaydedilen değişiklikler istemciyi yeniden başlattıktan sonra kullanılabilir olacaktır. Dokunmatik kontrollerinizi panoya dışa aktararak başkalarıyla paylaşabilirsiniz.\\n\\nDokunmatik kontroller hakkında daha ayrıntılı bilgiyi DDNet Wiki'de bulabilirsiniz."
polish = "Możesz zarządzać ustawieniami sterowania dotykowego na tej stronie. Tylko zapisane zmiany będą dostępne po ponownym uruchomieniu klienta. Możesz udostępnić swoje sterowanie dotykowe innym, eksportując je do schowka.\\n\\nWięcej szczegółowych informacji o sterowaniu dotykowym znajdziesz na DDNet Wiki."

[[message]]
key = "You can select buttons directly in the list below, or long press on a touch button on the screen to select it. You can also move and resize buttons by touch."
[message.translations]
simplified_chinese = "可在下方列表选择按键，也可长按屏幕选择；还可直接拖动或缩放按键。"
traditional_chinese = "可在下方列表選擇按鍵，也可長按螢幕選擇；還可直接拖動或縮放按鍵。"
japanese = "以下のリストから直接ボタンを選択するか、画面上のタッチボタンを長押しして選択できます。また、タッチでボタンを移動およびサイズ変更することもできます。"
korean = "아래 목록에서 직접 버튼을 선택하거나, 화면의 터치 버튼을 길게 눌러 선택할 수 있습니다. 터치로 버튼을 이동하거나 크기를 조정할 수도 있습니다."
russian = "Вы можете выбирать кнопки непосредственно в списке ниже или долгим нажатием на сенсорную кнопку на экране. Вы также можете перемещать и изменять размер кнопок касанием."
german = "Du kannst Buttons direkt in der Liste unten auswählen oder einen Touch-Button auf dem Bildschirm lange drücken, um ihn auszuwählen. Du kannst Buttons auch durch Berühren verschieben und in der Größe ändern."
spanish = "Puedes seleccionar botones directamente en la lista de abajo, o mantener presionado un botón táctil en la pantalla para seleccionarlo. También puedes mover y redimensionar los botones táctilmente."
french = "Vous pouvez sélectionner les boutons directement dans la liste ci-dessous, ou appuyer longuement sur un bouton tactile à l’écran pour le sélectionner. Vous pouvez également déplacer et redimensionner les boutons par le toucher."
brazilian_portuguese = "Você pode selecionar botões diretamente na lista abaixo, ou pressionar longamente um botão de toque na tela para selecioná-lo. Você também pode mover e redimensionar botões pelo toque."
portuguese = "Pode selecionar botões diretamente na lista abaixo, ou pressionar longamente um botão tátil no ecrã para o selecionar. Também pode mover e redimensionar botões através do toque."
turkish = "Aşağıdaki listeden doğrudan düğmeleri seçebilir veya ekrandaki bir dokunmatik düğmeye uzun basarak seçebilirsiniz. Ayrıca düğmeleri dokunarak taşıyabilir ve yeniden boyutlandırabilirsiniz."
polish = "Możesz wybierać przyciski bezpośrednio z listy poniżej lub długo nacisnąć przycisk dotykowy na ekranie, aby go zaznaczyć. Możesz także przesuwać i zmieniać rozmiar przycisków dotykiem."

[[message]]
key = "You'll lose unsaved changes after deselecting."
[message.translations]
simplified_chinese = "你的更改在取消选择后不会被保存。"
traditional_chinese = "你的更改在取消選擇後不會被保存。"
japanese = "選択を解除すると、保存されていない変更は失われます。"
korean = "선택 해제 후 저장되지 않은 변경 사항이 손실됩니다."
russian = "Вы потеряете несохранённые изменения после отмены выбора."
german = "Nach dem Abwählen gehen nicht gespeicherte Änderungen verloren."
spanish = "Perderás los cambios no guardados al deseleccionar."
