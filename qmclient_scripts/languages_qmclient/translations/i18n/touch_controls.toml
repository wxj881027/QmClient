[[message]]
key = "Buttons with this behavior cycle between executing one of two or more specified commands."
[message.translations]
simplified_chinese = "具有此行为的按键会循环执行多个指定命令中的一个。"
traditional_chinese = "具有此行為的按鈕會循環執行兩個或多個指定命令中的一個。"
japanese = "この動作のボタンは、指定した2つ以上のコマンドを順に実行します。"
korean = "이 동작을 가진 버튼은 두 개 이상의 지정된 명령어 중 하나를 실행하는 순환 동작을 합니다."
russian = "Кнопки с таким поведением циклически выполняют одну из двух или более указанных команд."
german = "Buttons mit diesem Verhalten wechseln zwischen der Ausführung von zwei oder mehr angegebenen Befehlen."
spanish = "Los botones con este comportamiento alternan entre ejecutar uno de dos o más comandos especificados."
french = "Les boutons avec ce comportement alternent entre l’exécution d’une ou plusieurs commandes spécifiées."
brazilian_portuguese = "Botões com este comportamento alternam entre executar um de dois ou mais comandos especificados."
portuguese = "Botões com este comportamento alternam entre executar um de dois ou mais comandos especificados."
turkish = "Bu davranışa sahip düğmeler, iki veya daha fazla belirtilen komuttan birini yürütmek arasında geçiş yapar."
polish = "Przyciski z tym zachowaniem cyklicznie wykonują jedną z dwóch lub więcej określonych komend."

[[message]]
key = "Buttons with this behavior execute console commands like regular key binds."
[message.translations]
simplified_chinese = "具有此行为的按键会像键盘按键绑定一样执行控制台命令。"
traditional_chinese = "具有此行為的按鈕會像一般按鍵綁定一樣執行控制台命令。"
japanese = "この動作のボタンは、通常のキーバインドのようにコンソールコマンドを実行します。"
korean = "이 동작을 가진 버튼은 일반 키 바인드처럼 콘솔 명령어를 실행합니다."
russian = "Кнопки с таким поведением выполняют консольные команды, как обычные привязки клавиш."
german = "Buttons mit diesem Verhalten führen Konsolenbefehle wie normale Tastenbelegungen aus."
spanish = "Los botones con este comportamiento ejecutan comandos de consola como las combinaciones de teclas normales."
french = "Les boutons avec ce comportement exécutent des commandes console comme des touches de raccourci classiques."
