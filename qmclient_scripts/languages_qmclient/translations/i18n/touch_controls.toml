brazilian_portuguese = "Você perderá alterações não salvas ao desmarcar."
portuguese = "Perderá as alterações não guardadas após desselecionar."
turkish = "Seçimi kaldırdıktan sonra kaydedilmemiş değişiklikleri kaybedeceksiniz."
polish = "Po odznaczeniu stracisz niezapisane zmiany."

