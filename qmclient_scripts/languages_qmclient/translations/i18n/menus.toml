french = "Préréglage lors de l'encodage vidéo avec libx264, défaut 5 (medium), 0 est ultrafast, 9 est placebo (le plus lent, déconseillé)"
brazilian_portuguese = "Predefinição ao codificar vídeo com libx264, padrão 5 (medium), 0 é ultrafast, 9 é placebo (mais lento, não recomendado)"
portuguese = "Predefinição ao codificar vídeo com libx264, padrão 5 (medium), 0 é ultrafast, 9 é placebo (mais lento, não recomendado)"
turkish = "libx264 ile video kodlarken ön ayar, varsayılan 5 (medium), 0 ultrafast, 9 placebo (en yavaş, önerilmez)"
polish = "Preset podczas kodowania wideo za pomocą libx264, domyślnie 5 (medium), 0 to ultrafast, 9 to placebo (najwolniejszy, niezalecany)"

