german = "Legt die Größe des Cursors im Spiel fest."
spanish = "Ajusta la escala del cursor en el juego."
french = "Définit l'échelle du curseur en jeu."
brazilian_portuguese = "Define a escala do cursor no jogo."
portuguese = "Define a escala do cursor no jogo."
turkish = "Oyun içi imlecin ölçeğini ayarlar."
polish = "Ustawia skalę kursora w grze."

[[message]]
key = "Increase the scale if the pointer is hard to see; decrease it for a cleaner look."
[message.translations]
simplified_chinese = "看不清指针时调大缩放，想要画面更干净时调小。"
traditional_chinese = "如果光標不容易看清，就調高比例；想要更簡潔的外觀，就調低。"
japanese = "ポインタが見づらいときは拡大率を上げ、すっきり見せたいときは下げます。"
korean = "포인터가 잘 보이지 않으면 크기를 키우고, 더 깔끔하게 보이게 하려면 줄이세요."
russian = "Увеличьте масштаб, если указатель плохо виден; уменьшите для более аккуратного вида."
german = "Erhöhe die Größe, wenn der Zeiger schwer zu sehen ist; verringere sie für ein saubereres Bild."
spanish = "Aumenta la escala si el puntero se ve mal; redúcela para un aspecto más limpio."
french = "Augmentez l'échelle si le pointeur est difficile à voir ; réduisez-la pour un rendu plus net."
brazilian_portuguese = "Aumente a escala se o ponteiro for difícil de ver; diminua para um visual mais limpo."
portuguese = "Aumente a escala se o ponteiro for difícil de ver; diminua para um aspeto mais limpo."
turkish = "İmleci görmekte zorlanıyorsanız ölçeği artırın; daha temiz bir görünüm için azaltın."
polish = "Zwiększ skalę, jeśli wskaźnik jest słabo widoczny; zmniejsz ją dla czystszego wyglądu."

[[message]]
key = "A very large cursor can hide small UI elements underneath it."
[message.translations]
simplified_chinese = "光标放得太大时会挡住它下面的小界面元素。"
traditional_chinese = "過大的光標可能會遮住下方的小型介面元素。"
japanese = "カーソルが大きすぎると、下にある小さな UI 要素が隠れることがあります。"
korean = "커서가 너무 크면 그 아래의 작은 UI 요소를 가릴 수 있습니다."
russian = "Слишком крупный курсор может скрывать мелкие элементы интерфейса под собой."
german = "Ein sehr großer Cursor kann kleine UI-Elemente darunter verdecken."
spanish = "Un cursor muy grande puede ocultar los elementos pequeños de la interfaz que hay debajo."
french = "Un curseur très grand peut masquer les petits éléments d'interface en dessous."
brazilian_portuguese = "Um cursor muito grande pode esconder elementos pequenos da interface embaixo dele."
portuguese = "Um cursor muito grande pode esconder elementos pequenos da interface por baixo."
turkish = "Çok büyük bir imleç altındaki küçük arayüz öğelerini gizleyebilir."
polish = "Bardzo duży kursor może zasłaniać małe elementy interfejsu pod nim."

[[message]]
key = "Chooses the font family and weight used by the menus."
[message.translations]
simplified_chinese = "选择菜单使用的字体和字重。"
traditional_chinese = "選擇選單使用的字型家族與字重。"
japanese = "メニューで使用するフォントファミリーとウェイトを選択します。"
korean = "메뉴에서 사용할 글꼴 패밀리와 굵기를 선택합니다."
russian = "Выбирает семейство и начертание шрифта для меню."
german = "Wählt Schriftfamilie und -stärke für die Menüs."
spanish = "Elige la familia y el grosor de fuente de los menús."
french = "Choisit la famille et la graisse de police des menus."
brazilian_portuguese = "Escolhe a família e o peso da fonte usados nos menus."
portuguese = "Escolhe a família e o peso do tipo de letra usados nos menus."
turkish = "Menülerde kullanılan yazı tipi ailesini ve kalınlığını seçer."
polish = "Wybiera rodzinę i grubość czcionki używanej w menu."

[[message]]
key = "Pick a family; if it offers several weights, choose one that stays readable at small sizes."
[message.translations]
simplified_chinese = "先选字体，若有多个字重，挑一个小字号下依然清晰的。"
traditional_chinese = "選一個字型家族；如果它提供多種字重，選一個在小字號下仍清楚可讀的。"
japanese = "ファミリーを選んでください。複数のウェイトがある場合は、小さいサイズでも読みやすいものを選びましょう。"
korean = "패밀리를 고르세요. 굵기가 여러 개라면 작은 크기에서도 잘 읽히는 것을 선택하세요."
russian = "Выберите семейство; если у него несколько начертаний, возьмите то, что читается в мелком размере."
german = "Wähle eine Familie; bietet sie mehrere Stärken, nimm eine, die auch klein gut lesbar bleibt."
spanish = "Elige una familia; si ofrece varios grosores, elige uno que siga siendo legible en tamaños pequeños."
french = "Choisissez une famille ; si elle propose plusieurs graisses, prenez celle qui reste lisible en petite taille."
brazilian_portuguese = "Escolha uma família; se houver vários pesos, use um que continue legível em tamanhos pequenos."
portuguese = "Escolha uma família; se tiver vários pesos, opte por um que continue legível em tamanhos pequenos."
turkish = "Bir aile seçin; birden fazla kalınlık sunuyorsa küçük boyutlarda okunabilen birini tercih edin."
polish = "Wybierz rodzinę; jeśli oferuje kilka grubości, weź taką, która pozostaje czytelna przy małych rozmiarach."

[[message]]
key = "Fonts without CJK glyphs show fallback squares for Chinese text."
[message.translations]
simplified_chinese = "不含中日韩字形的字体在显示中文时会变成方块。"
traditional_chinese = "缺少中日韓字元的字型，顯示中文時會出現替代方塊。"
japanese = "CJK 字形を持たないフォントでは、中国語のテキストが代替の四角で表示されます。"
korean = "CJK 글리프가 없는 글꼴은 중국어 텍스트가 대체 사각형으로 표시됩니다."
russian = "Шрифты без глифов CJK показывают для китайского текста запасные квадраты."
german = "Schriften ohne CJK-Glyphen zeigen für chinesischen Text Ersatzvierecke."
spanish = "Las fuentes sin glifos CJK muestran cuadrados de reserva en el texto en chino."
french = "Les polices sans glyphes CJK affichent des carrés de remplacement pour le texte chinois."
brazilian_portuguese = "Fontes sem glifos CJK mostram quadrados de reserva no texto em chinês."
portuguese = "Tipos de letra sem glifos CJK mostram quadrados de substituição no texto em chinês."
turkish = "CJK glifleri olmayan yazı tipleri, Çince metinde yedek kareler gösterir."
polish = "Czcionki bez glifów CJK pokazują dla chińskiego tekstu zastępcze kwadraty."

[[message]]
key = "Adjusts TClient-specific HUD elements that are not part of the standard DDNet HUD."
[message.translations]
simplified_chinese = "调整不属于标准 DDNet HUD 的 TClient 专属 HUD 元素。"
traditional_chinese = "調整不屬於標準 DDNet HUD 的 TClient 專屬 HUD 元素。"
japanese = "標準の DDNet HUD にはない TClient 固有の HUD 要素を調整します。"
korean = "표준 DDNet HUD에 없는 TClient 전용 HUD 요소를 조정합니다."
russian = "Настраивает элементы HUD, характерные для TClient и отсутствующие в стандартном HUD DDNet."
german = "Passt HUD-Elemente an, die es nur in TClient gibt und nicht im Standard-HUD von DDNet."
spanish = "Ajusta elementos del HUD propios de TClient que no forman parte del HUD estándar de DDNet."
french = "Règle les éléments du HUD propres à TClient qui ne font pas partie du HUD standard de DDNet."
brazilian_portuguese = "Ajusta elementos do HUD específicos do TClient que não fazem parte do HUD padrão do DDNet."
portuguese = "Ajusta elementos do HUD próprios do TClient que não fazem parte do HUD padrão do DDNet."
turkish = "Standart DDNet HUD'unda bulunmayan TClient'e özgü HUD öğelerini ayarlar."
polish = "Dostraja elementy HUD charakterystyczne dla TClient, których nie ma w standardowym HUD DDNet."

[[message]]
key = "Open the card and enable only the elements you want; each option explains what it draws."
[message.translations]
simplified_chinese = "打开卡片，只启用需要的元素；每个选项都说明了它画什么。"
traditional_chinese = "展開卡片，只啟用需要的元素；每個選項都說明它會繪製什麼。"
japanese = "カードを開いて必要な要素だけを有効にしてください。各オプションには描画内容の説明があります。"
korean = "카드를 열어 필요한 요소만 켜세요. 각 옵션에는 무엇을 그리는지 설명이 있습니다."
russian = "Откройте карточку и включите только нужные элементы; каждая опция поясняет, что она рисует."
german = "Öffne die Karte und aktiviere nur die gewünschten Elemente; jede Option erklärt, was sie zeichnet."
spanish = "Abre la tarjeta y activa solo los elementos que quieras; cada opción explica qué dibuja."
french = "Ouvrez la carte et activez uniquement les éléments voulus ; chaque option indique ce qu’elle dessine."
brazilian_portuguese = "Abra o cartão e ative só os elementos que quiser; cada opção explica o que ela desenha."
portuguese = "Abra o cartão e ative apenas os elementos que quiser; cada opção explica o que desenha."
turkish = "Kartı açın ve yalnızca istediğiniz öğeleri etkinleştirin; her seçenek ne çizdiğini açıklar."
polish = "Otwórz kartę i włącz tylko potrzebne elementy; każda opcja opisuje, co rysuje."

[[message]]
key = "A crowded HUD hides the game, so start with one element and add more if needed."
[message.translations]
simplified_chinese = "HUD 太满会挡住游戏画面，先从一项开始，需要时再加。"
traditional_chinese = "HUD 太擁擠會遮住遊戲畫面，先開一個元素，有需要再加。"
japanese = "HUD が混み合うとゲームが見えなくなるので、まず 1 つだけ有効にして、必要なら追加しましょう。"
korean = "HUD가 복잡하면 게임이 가려지니, 하나부터 켜고 필요하면 더 추가하세요."
russian = "Перегруженный HUD закрывает игру — начните с одного элемента и добавляйте по необходимости."
german = "Ein überfülltes HUD verdeckt das Spiel; starte mit einem Element und ergänze bei Bedarf."
spanish = "Un HUD recargado tapa el juego; empieza con un elemento y añade más si hace falta."
french = "Un HUD surchargé masque le jeu ; commencez par un élément et ajoutez-en au besoin."
brazilian_portuguese = "Um HUD cheio esconde o jogo; comece com um elemento e adicione mais se precisar."
portuguese = "Um HUD sobrecarregado esconde o jogo; comece com um elemento e acrescente mais se precisar."
turkish = "Kalabalık bir HUD oyunu gizler; tek bir öğeyle başlayın, gerekirse ekleyin."
polish = "Zatłoczony HUD zasłania grę, więc zacznij od jednego elementu i dodawaj kolejne w razie potrzeby."

[[message]]
key = "Fine-tunes the improved anti-ping prediction that smooths other players' movement."
[message.translations]
simplified_chinese = "微调改进的抗延迟预测，让其他玩家的移动更平滑。"
traditional_chinese = "微調改良後的 anti-ping 預測，讓其他玩家的移動更順暢。"
japanese = "他のプレイヤーの動きを滑らかにする改良版 anti-ping 予測を微調整します。"
korean = "다른 플레이어의 움직임을 부드럽게 만드는 개선된 anti-ping 예측을 미세 조정합니다."
russian = "Тонко настраивает улучшенное предсказание anti-ping, сглаживающее движение других игроков."
german = "Stimmt die verbesserte Anti-Ping-Vorhersage fein ab, die die Bewegung anderer Spieler glättet."
spanish = "Ajusta la predicción anti-ping mejorada que suaviza el movimiento de los demás jugadores."
french = "Affine la prédiction anti-ping améliorée qui lisse le mouvement des autres joueurs."
brazilian_portuguese = "Ajusta a previsão anti-ping aprimorada que suaviza o movimento dos outros jogadores."
portuguese = "Ajusta a predição anti-ping melhorada que suaviza o movimento dos outros jogadores."
turkish = "Diğer oyuncuların hareketini yumuşatan geliştirilmiş anti-ping tahminini ince ayarlar."
polish = "Dostraja ulepszone przewidywanie anti-ping, które wygładza ruch innych graczy."

[[message]]
key = "Start from the default value; raise it slightly if other players look jumpy, lower it if you seem behind them."
[message.translations]
simplified_chinese = "先保持默认值；其他玩家看起来跳动就稍微调高，感觉自己落后于他们就调低。"
traditional_chinese = "從預設值開始；其他玩家看起來一跳一跳時稍微調高，覺得自己比他們慢半拍時調低。"
japanese = "デフォルト値から始め、他のプレイヤーの動きが飛んで見えるなら少し上げ、自分が遅れて見えるなら下げます。"
korean = "기본값에서 시작하세요. 다른 플레이어가 튀어 보이면 조금 올리고, 내가 뒤처져 보이면 낮추세요."
russian = "Начните со значения по умолчанию: слегка увеличьте, если другие игроки дёргаются, и уменьшите, если кажется, что вы отстаёте от них."
german = "Beginne mit dem Standardwert: etwas erhöhen, wenn andere Spieler ruckartig wirken, verringern, wenn du ihnen hinterherzuhängen scheinst."
spanish = "Empieza con el valor por defecto: súbelo un poco si otros jugadores se ven a saltos y bájalo si parece que vas por detrás de ellos."
french = "Pars de la valeur par défaut : augmente-la légèrement si les autres joueurs semblent saccadés, baisse-la si tu sembles être en retard sur eux."
brazilian_portuguese = "Comece pelo valor padrão: aumente um pouco se outros jogadores parecerem aos saltos e diminua se você parecer atrasado em relação a eles."
portuguese = "Comece pelo valor predefinido: aumente um pouco se os outros jogadores parecerem aos saltos e diminua se parecer que está atrasado em relação a eles."
turkish = "Varsayılan değerle başlayın; diğer oyuncular sıçrıyormuş gibi görünüyorsa biraz artırın, onların gerisinde kaldığınızı düşünüyorsanız azaltın."
polish = "Zacznij od wartości domyślnej: nieco ją zwiększ, jeśli inni gracze wyglądają na skaczących, i zmniejsz, jeśli wydaje ci się, że zostajesz z tyłu."

[[message]]
key = "Extreme values make movement feel wrong, so change one step at a time."
[message.translations]
simplified_chinese = "极端值会让移动手感变怪，每次只改一档。"
traditional_chinese = "極端數值會讓移動手感變得不對，請一次只調一格。"
japanese = "極端な値は動きの感触を不自然にするので、一度に一段階ずつ変えてください。"
korean = "극단적인 값은 움직임이 어색하게 느껴지게 하니 한 번에 한 단계씩 바꾸세요."
russian = "Крайние значения искажают ощущение движения, поэтому меняйте по одному шагу."
german = "Extreme Werte lassen die Bewegung falsch wirken, ändere sie daher schrittweise."
spanish = "Los valores extremos hacen que el movimiento se sienta mal, así que cambia de uno en uno."
french = "Des valeurs extrêmes faussent la sensation de mouvement : change un cran à la fois."
brazilian_portuguese = "Valores extremos fazem o movimento parecer errado, então mude um passo por vez."
portuguese = "Valores extremos fazem o movimento parecer errado, por isso mude um passo de cada vez."
turkish = "Aşırı değerler hareket hissini bozar, bu yüzden her seferinde bir adım değiştirin."
polish = "Skrajne wartości psują odczucie ruchu, więc zmieniaj je po jednym kroku."

[[message]]
key = "Groups input helpers: fast input, automatic margin, sub-tick aiming and cursor behavior."
[message.translations]
simplified_chinese = "归集输入辅助功能：快速输入、自动边距、亚 tick 瞄准和光标行为。"
traditional_chinese = "將輸入輔助集中分組：快速輸入、自動邊距、子 tick 瞄準與游標行為。"
japanese = "入力支援をまとめた項目です。高速入力、自動マージン、サブティック照準、カーソルの挙動を含みます。"
korean = "입력 보조 기능을 묶은 항목입니다. 빠른 입력, 자동 여백, 서브 틱 조준, 커서 동작을 포함합니다."
russian = "Объединяет средства ввода: быстрый ввод, автоматический отступ, прицеливание по подтикам и поведение курсора."
german = "Bündelt Eingabehilfen: schnelle Eingabe, automatischer Rand, Unter-Tick-Zielen und Cursorverhalten."
spanish = "Agrupa ayudas de entrada: entrada rápida, margen automático, puntería por subtics y comportamiento del cursor."
french = "Regroupe les aides à la saisie : entrée rapide, marge automatique, visée par sous-tic et comportement du curseur."
brazilian_portuguese = "Agrupa auxílios de entrada: entrada rápida, margem automática, mira por subtique e comportamento do cursor."
portuguese = "Agrupa auxiliares de entrada: entrada rápida, margem automática, pontaria por subtique e comportamento do cursor."
turkish = "Girdi yardımcılarını gruplar: hızlı girdi, otomatik kenar boşluğu, alt tik nişan alma ve imleç davranışı."
polish = "Grupuje ułatwienia sterowania: szybkie wejście, automatyczny margines, celowanie w podtaktach i zachowanie kursora."

[[message]]
key = "Enable fast input if your key presses feel late; turn on auto margin to stop the cursor sticking to screen edges."
[message.translations]
simplified_chinese = "按键感觉延迟就启用快速输入；光标卡在屏幕边缘时打开自动边距。"
traditional_chinese = "按鍵感覺延遲時開啟快速輸入；開啟自動邊距可讓游標不再卡在畫面邊緣。"
japanese = "キー入力が遅れて感じるなら高速入力を有効に、カーソルが画面端に張り付くなら自動マージンをオンにします。"
korean = "키 입력이 늦게 느껴지면 빠른 입력을 켜고, 커서가 화면 가장자리에 붙는 것이 싫으면 자동 여백을 켜세요."
russian = "Включите быстрый ввод, если нажатия клавиш ощущаются с задержкой; автоматический отступ не даёт курсору залипать у краёв экрана."
german = "Aktiviere die schnelle Eingabe, wenn Tastendrücke verspätet ankommen; der automatische Rand verhindert, dass der Cursor an Bildschirmrändern klebt."
spanish = "Activa la entrada rápida si las teclas llegan tarde; el margen automático evita que el cursor se quede pegado a los bordes de la pantalla."
french = "Active l'entrée rapide si les touches semblent en retard ; la marge automatique empêche le curseur de coller aux bords de l'écran."
brazilian_portuguese = "Ative a entrada rápida se as teclas parecerem atrasadas; a margem automática impede que o cursor grude nas bordas da tela."
portuguese = "Ative a entrada rápida se as teclas parecerem atrasadas; a margem automática impede que o cursor fique preso às margens do ecrã."
turkish = "Tuş basışları geç geliyorsa hızlı girdiyi açın; imlecin ekran kenarlarına yapışmasını önlemek için otomatik kenar boşluğunu açın."
polish = "Włącz szybkie wejście, jeśli naciśnięcia klawiszy wydają się spóźnione; automatyczny margines nie pozwala kursorowi przyklejać się do krawędzi ekranu."

[[message]]
key = "Fast input changes how inputs are timed, so disable it if a server reports unusual behavior."
[message.translations]
simplified_chinese = "快速输入会改变输入发送的时机，服务器报告异常时请关掉。"
traditional_chinese = "快速輸入會改變輸入的計時方式，若伺服器回報異常行為請關閉。"
japanese = "高速入力は入力のタイミングを変えるため、サーバーで異常が報告される場合は無効にしてください。"
korean = "빠른 입력은 입력 타이밍을 바꾸므로 서버에서 이상 동작이 보고되면 끄세요."
russian = "Быстрый ввод меняет тайминг ввода, поэтому отключите его, если сервер сообщает о странном поведении."
german = "Die schnelle Eingabe verändert das Timing der Eingaben; deaktiviere sie, wenn ein Server ungewöhnliches Verhalten meldet."
spanish = "La entrada rápida cambia la temporización de las entradas; desactívala si un servidor informa de un comportamiento extraño."
french = "L'entrée rapide modifie la temporisation des entrées : désactive-la si un serveur signale un comportement inhabituel."
brazilian_portuguese = "A entrada rápida muda a temporização das entradas; desative-a se um servidor relatar comportamento incomum."
portuguese = "A entrada rápida altera a temporização das entradas; desative-a se um servidor reportar um comportamento invulgar."
turkish = "Hızlı girdi, girdilerin zamanlamasını değiştirir; bir sunucu olağandışı davranış bildirirse kapatın."
polish = "Szybkie wejście zmienia taktowanie wejść, więc wyłącz je, jeśli serwer zgłasza nietypowe zachowanie."

[[message]]
key = "Shows a small companion that follows your Tee and reacts to what you do."
[message.translations]
simplified_chinese = "显示一只跟随你的 Tee、并对你的动作作出反应的小宠物。"
traditional_chinese = "顯示一隻小夥伴，跟著你的 Tee 並對你的動作做出反應。"
japanese = "Tee についてくる小さな相棒を表示し、あなたの行動に反応します。"
korean = "Tee를 따라다니며 내 행동에 반응하는 작은 친구를 표시합니다."
russian = "Показывает маленького спутника, который следует за вашим Tee и реагирует на ваши действия."
german = "Zeigt einen kleinen Begleiter, der deinem Tee folgt und auf dein Handeln reagiert."
spanish = "Muestra un pequeño compañero que sigue a tu Tee y reacciona a lo que haces."
french = "Affiche un petit compagnon qui suit ton Tee et réagit à tes actions."
brazilian_portuguese = "Mostra um pequeno companheiro que segue seu Tee e reage ao que você faz."
portuguese = "Mostra um pequeno companheiro que segue o teu Tee e reage ao que fazes."
turkish = "Tee'ni takip eden ve yaptıklarına tepki veren küçük bir yol arkadaşı gösterir."
polish = "Pokazuje małego towarzysza, który podąża za twoim Tee i reaguje na twoje działania."

[[message]]
key = "Enable the pet, pick its skin and size, then move around to watch how it follows."
[message.translations]
simplified_chinese = "启用宠物，选好皮肤和大小，再跑动看看它怎么跟随。"
traditional_chinese = "啟用寵物，選好皮膚與大小，再走動看看牠跟隨的樣子。"
japanese = "ペットを有効にし、スキンとサイズを選んでから動き回り、追従の様子を確認します。"
korean = "펫을 켜고 스킨과 크기를 고른 뒤 움직이며 따라오는 모습을 확인하세요."
russian = "Включите питомца, выберите скин и размер, затем подвигайтесь и посмотрите, как он следует."
german = "Aktiviere das Haustier, wähle Skin und Größe und bewege dich dann, um zu sehen, wie es folgt."
spanish = "Activa la mascota, elige su skin y tamaño y muévete para ver cómo te sigue."
french = "Active l'animal, choisis son skin et sa taille, puis déplace-toi pour voir comment il suit."
brazilian_portuguese = "Ative o mascote, escolha a skin e o tamanho e depois se mova para ver como ele segue."
portuguese = "Ative o mascote, escolha a skin e o tamanho e depois mexa-se para ver como ele segue."
turkish = "Evcil hayvanı açın, skinini ve boyutunu seçin, sonra hareket ederek nasıl takip ettiğini izleyin."
polish = "Włącz zwierzaka, wybierz jego skin i rozmiar, a potem poruszaj się i obserwuj, jak podąża."

[[message]]
key = "Pets are purely cosmetic; turn them off if the extra drawing hurts performance."
[message.translations]
simplified_chinese = "宠物只是装饰，额外绘制影响性能时请关掉。"
traditional_chinese = "寵物純屬裝飾；如果額外繪製影響效能，就把它們關掉。"
japanese = "ペットは見た目だけの要素です。描画の負荷で動作が重い場合は無効にしてください。"
korean = "펫은 순전히 꾸미기용입니다. 추가 렌더링으로 성능이 떨어지면 끄세요."
russian = "Питомцы чисто косметические: отключите их, если лишняя отрисовка снижает производительность."
german = "Haustiere sind rein kosmetisch; deaktiviere sie, wenn die zusätzliche Darstellung die Leistung beeinträchtigt."
spanish = "Las mascotas son solo estéticas; desactívalas si el dibujo extra afecta al rendimiento."
french = "Les animaux sont purement esthétiques : désactive-les si le dessin supplémentaire nuit aux performances."
brazilian_portuguese = "Mascotes são puramente cosméticos; desative-os se o desenho extra prejudicar o desempenho."
portuguese = "Os mascotes são puramente cosméticos; desativa-os se o desenho extra prejudicar o desempenho."
turkish = "Evcil hayvanlar tamamen görseldir; ek çizim performansı düşürüyorsa kapatın."
polish = "Zwierzaki są wyłącznie ozdobne; wyłącz je, jeśli dodatkowe rysowanie obniża wydajność."

[[message]]
key = "Draws a marker on selected players so you can find them in the world."
[message.translations]
simplified_chinese = "在选定的玩家身上绘制标记，方便在地图里找到他们。"
traditional_chinese = "在選定的玩家身上繪製標記，方便在世界中找到他們。"
japanese = "選択したプレイヤーにマーカーを描き、ワールド内で見つけやすくします。"
korean = "선택한 플레이어 위에 표시를 그려 월드에서 쉽게 찾을 수 있게 합니다."
russian = "Рисует метку на выбранных игроках, чтобы их было легче найти в мире."
german = "Zeichnet eine Markierung über ausgewählten Spielern, damit du sie in der Welt leichter findest."
spanish = "Dibuja una marca sobre los jugadores elegidos para que puedas encontrarlos en el mundo."
french = "Dessine un marqueur sur les joueurs choisis pour les repérer dans le monde."
brazilian_portuguese = "Desenha um marcador nos jogadores escolhidos para você encontrá-los no mundo."
portuguese = "Desenha um marcador nos jogadores escolhidos para os encontrares no mundo."
turkish = "Seçili oyuncuların üzerine işaret çizer, böylece onları dünyada bulabilirsiniz."
polish = "Rysuje znacznik na wybranych graczach, aby łatwiej ich znaleźć na mapie."

[[message]]
key = "Enable the indicator; choose its distance mode and whether war-list players get a different color."
[message.translations]
simplified_chinese = "启用指示器，选择距离模式，并决定敌对列表玩家是否使用不同颜色。"
traditional_chinese = "啟用指示器；選擇它的距離模式，並設定 war-list 玩家是否使用不同顏色。"
japanese = "インジケーターを有効にし、距離モードと、war-list のプレイヤーを別の色で表示するかを選びます。"
korean = "표시기를 켜고 거리 모드와 war-list 플레이어에게 다른 색을 적용할지 선택하세요."
russian = "Включите индикатор, выберите режим расстояния и то, получат ли игроки из war-list другой цвет."
german = "Aktiviere den Indikator, wähle den Entfernungsmodus und ob Spieler auf der war-list eine andere Farbe bekommen."
spanish = "Activa el indicador, elige el modo de distancia y si los jugadores de la war-list reciben otro color."
french = "Active l'indicateur, choisis le mode de distance et si les joueurs de la war-list ont une autre couleur."
brazilian_portuguese = "Ative o indicador, escolha o modo de distância e se os jogadores da war-list recebem outra cor."
portuguese = "Ativa o indicador, escolhe o modo de distância e se os jogadores da war-list recebem outra cor."
turkish = "Göstergeyi açın; mesafe modunu ve war-list oyuncularının farklı renk alıp almayacağını seçin."
polish = "Włącz wskaźnik, wybierz tryb odległości oraz czy gracze z war-list mają dostawać inny kolor."

[[message]]
key = "Markers are drawn on your screen only and never change the game itself."
[message.translations]
simplified_chinese = "标记只画在你自己的屏幕上，不会改变游戏本身。"
traditional_chinese = "標記只繪製在你的畫面上，永遠不會改變遊戲本身。"
japanese = "マーカーは自分の画面にだけ描かれ、ゲーム自体には影響しません。"
korean = "표시는 내 화면에만 그려지며 게임 자체는 바뀌지 않습니다."
russian = "Метки рисуются только на вашем экране и никогда не меняют саму игру."
german = "Markierungen werden nur auf deinem Bildschirm gezeichnet und verändern das Spiel selbst nie."
spanish = "Las marcas solo se dibujan en tu pantalla y nunca cambian el juego."
french = "Les marqueurs ne sont dessinés que sur ton écran et ne changent jamais le jeu."
brazilian_portuguese = "Os marcadores são desenhados apenas na sua tela e nunca mudam o jogo."
portuguese = "Os marcadores são desenhados apenas no teu ecrã e nunca alteram o jogo."
turkish = "İşaretler yalnızca sizin ekranınızda çizilir ve oyunun kendisini asla değiştirmez."
polish = "Znaczniki są rysowane tylko na twoim ekranie i nigdy nie zmieniają samej gry."

[[message]]
key = "Applies an animated rainbow color to selected elements such as nameplates or the hook."
[message.translations]
simplified_chinese = "为名牌、钩索等选定元素加上流动的彩虹色。"
traditional_chinese = "為名牌或鉤子等選定元素套用動畫彩虹色彩。"
japanese = "ネームプレートやフックなどの選択した要素に、アニメーションする虹色を適用します。"
korean = "이름표나 훅 같은 선택한 요소에 움직이는 무지개 색을 적용합니다."
russian = "Применяет анимированный радужный цвет к выбранным элементам, например к никам или хуку."
german = "Wendet eine animierte Regenbogenfarbe auf ausgewählte Elemente wie Namensschilder oder den Hook an."
spanish = "Aplica un color arcoíris animado a los elementos elegidos, como los nombres o el gancho."
french = "Applique une couleur arc-en-ciel animée aux éléments choisis, comme les noms ou le grappin."
brazilian_portuguese = "Aplica uma cor arco-íris animada aos elementos escolhidos, como as placas de nome ou o gancho."
portuguese = "Aplica uma cor de arco-íris animada aos elementos selecionados, como os nomes ou o gancho."
turkish = "İsim etiketleri veya kanca gibi seçili öğelere hareketli gökkuşağı rengi uygular."
polish = "Stosuje animowany kolor tęczy do wybranych elementów, takich jak nicki lub hak."

[[message]]
key = "Choose which parts get the rainbow; adjust speed and saturation to taste."
[message.translations]
simplified_chinese = "选择哪些部分使用彩虹色，再按喜好调整速度和饱和度。"
traditional_chinese = "選擇哪些部分套用彩虹效果；依喜好調整速度與飽和度。"
japanese = "虹色を適用する部分を選び、速度と彩度を好みに合わせて調整します。"
korean = "무지개 효과를 적용할 부분을 선택하고 속도와 채도를 원하는 대로 조정하세요."
russian = "Выберите, к каким частям применять радугу; скорость и насыщенность настройте по вкусу."
german = "Wähle, welche Teile den Regenbogen bekommen; passe Geschwindigkeit und Sättigung nach Geschmack an."
spanish = "Elige qué partes llevan el arcoíris y ajusta la velocidad y la saturación a tu gusto."
french = "Choisissez les éléments qui reçoivent l'arc-en-ciel, puis ajustez la vitesse et la saturation à votre goût."
brazilian_portuguese = "Escolha quais partes recebem o arco-íris e ajuste a velocidade e a saturação como preferir."
portuguese = "Escolha que partes recebem o arco-íris e ajuste a velocidade e a saturação a seu gosto."
turkish = "Gökkuşağının hangi kısımlara uygulanacağını seçin; hızı ve doygunluğu isteğinize göre ayarlayın."
polish = "Wybierz, które części mają tęczę; prędkość i nasycenie dopasuj do upodobań."

[[message]]
key = "Fast flashing colors are hard to read, so keep the speed moderate."
[message.translations]
simplified_chinese = "颜色闪得太快会难以辨认，速度保持适中。"
traditional_chinese = "快速閃爍的顏色難以辨識，請把速度保持在適中範圍。"
japanese = "速く点滅する色は読みにくいので、速度は控えめにしてください。"
korean = "빠르게 깜빡이는 색은 읽기 어려우니 속도를 적당히 유지하세요."
russian = "Быстро мигающие цвета плохо читаются, поэтому держите скорость умеренной."
german = "Schnell blinkende Farben sind schwer zu lesen, halte die Geschwindigkeit daher moderat."
spanish = "Los colores que parpadean rápido se leen mal, así que mantén la velocidad moderada."
french = "Les couleurs qui clignotent vite sont difficiles à lire, gardez donc une vitesse modérée."
brazilian_portuguese = "Cores que piscam rápido são difíceis de ler, então mantenha a velocidade moderada."
portuguese = "Cores a piscar depressa são difíceis de ler, por isso mantenha a velocidade moderada."
turkish = "Hızlı yanıp sönen renkler zor okunur, bu yüzden hızı ölçülü tutun."
polish = "Szybko migające kolory są trudne do odczytania, więc utrzymuj umiarkowaną prędkość."

[[message]]
key = "Shows a trail behind Tees so their recent movement stays visible."
[message.translations]
simplified_chinese = "在 Tee 身后显示拖尾，让它们最近的移动保持可见。"
traditional_chinese = "在 Tee 身後顯示拖尾，讓最近的移動軌跡保持可見。"
japanese = "Tee の後ろに軌跡を表示し、最近の動きを見えるようにします。"
korean = "Tee 뒤에 잔상을 표시해 최근 움직임을 눈에 띄게 합니다."
russian = "Показывает шлейф за Tee, чтобы недавнее движение оставалось заметным."
german = "Zeigt eine Spur hinter den Tees, damit ihre letzten Bewegungen sichtbar bleiben."
spanish = "Muestra un rastro detrás de los Tees para que su movimiento reciente siga visible."
french = "Affiche une traînée derrière les Tees pour garder leurs derniers déplacements visibles."
brazilian_portuguese = "Mostra um rastro atrás dos Tees para deixar o movimento recente visível."
portuguese = "Mostra um rasto atrás dos Tees para manter visível o movimento recente."
turkish = "Tee'lerin arkasında iz göstererek son hareketlerini görünür tutar."
polish = "Pokazuje smugę za Tee, dzięki czemu ostatnie ruchy pozostają widoczne."

[[message]]
key = "Enable trails, choose length and fade, then turn off other players' trails if the screen gets crowded."
[message.translations]
simplified_chinese = "启用拖尾，选好长度和淡化，画面挤时再关掉其他玩家的拖尾。"
traditional_chinese = "啟用拖尾並選擇長度與淡出效果；畫面太雜亂時可關閉其他玩家的拖尾。"
japanese = "軌跡を有効にして長さとフェードを選び、画面がごちゃつくなら他プレイヤーの軌跡はオフにします。"
korean = "잔상을 켜고 길이와 사라짐을 정한 뒤, 화면이 복잡하면 다른 플레이어의 잔상을 끄세요."
russian = "Включите шлейфы, выберите длину и затухание, а если экран перегружен — отключите шлейфы других игроков."
german = "Aktiviere Spuren, wähle Länge und Ausblenden und schalte die Spuren anderer Spieler ab, wenn das Bild zu voll wird."
spanish = "Activa los rastros, elige duración y desvanecido y desactiva los de otros jugadores si la pantalla se satura."
french = "Activez les traînées, réglez leur longueur et leur fondu, puis coupez celles des autres joueurs si l'écran devient trop chargé."
brazilian_portuguese = "Ative os rastros, escolha duração e esmaecimento e desligue os rastros dos outros jogadores se a tela ficar cheia."
portuguese = "Ative os rastros, escolha o comprimento e o desvanecimento e desligue os dos outros jogadores se o ecrã ficar sobrecarregado."
turkish = "İzleri açın, uzunluk ve solma seçin, ekran kalabalıklaşırsa diğer oyuncuların izlerini kapatın."
polish = "Włącz smugi, ustaw długość i zanikanie, a gdy ekran robi się tłoczny, wyłącz smugi innych graczy."

[[message]]
key = "Trails add drawing work, so lower the length on low-end machines."
[message.translations]
simplified_chinese = "拖尾会增加绘制负担，低配机器上把长度调小。"
traditional_chinese = "拖尾會增加繪製負擔，在低階電腦上請縮短長度。"
japanese = "軌跡は描画負荷が増えるため、低スペック環境では長さを短くしてください。"
korean = "잔상은 그리기 부담이 늘어나므로 저사양 컴퓨터에서는 길이를 줄이세요."
russian = "Шлейфы увеличивают нагрузку на отрисовку, поэтому на слабых машинах уменьшите длину."
german = "Spuren kosten Zeichenleistung, verkürze die Länge daher auf schwächeren Rechnern."
spanish = "Los rastros añaden trabajo de dibujado, así que reduce la duración en equipos modestos."
french = "Les traînées ajoutent du travail de rendu, réduisez donc leur longueur sur les machines modestes."
brazilian_portuguese = "Os rastros aumentam o trabalho de desenho, então reduza a duração em máquinas fracas."
portuguese = "Os rastros aumentam o trabalho de desenho, por isso reduza o comprimento em máquinas modestas."
turkish = "İzler çizim yükü ekler, bu yüzden zayıf makinelerde uzunluğu azaltın."
polish = "Smugi zwiększają obciążenie rysowania, więc na słabszych komputerach skróć długość."

[[message]]
key = "Draws outlines around map tiles so block edges are easier to see."
[message.translations]
simplified_chinese = "在地图图块周围绘制轮廓，让方块边缘更容易看清。"
traditional_chinese = "在地圖圖塊周圍繪製描邊，讓方塊邊緣更容易辨識。"
japanese = "マップタイルの周囲に輪郭を描き、ブロックの境界を見やすくします。"
korean = "맵 타일 주위에 윤곽선을 그려 블록 경계를 쉽게 볼 수 있게 합니다."
russian = "Рисует контуры вокруг тайлов карты, чтобы границы блоков было легче различать."
german = "Zeichnet Umrisse um Kartentiles, damit Blockkanten besser zu erkennen sind."
spanish = "Dibuja contornos alrededor de los bloques del mapa para ver mejor sus bordes."
french = "Dessine un contour autour des tuiles de la carte pour mieux voir les bords des blocs."
brazilian_portuguese = "Desenha contornos ao redor dos blocos do mapa para facilitar a visualização das bordas."
portuguese = "Desenha contornos à volta dos blocos do mapa para ver melhor as arestas."
turkish = "Harita karolarının çevresine çerçeve çizerek blok kenarlarını daha kolay görünür kılar."
polish = "Rysuje obrysy wokół kafelków mapy, aby krawędzie bloków były lepiej widoczne."

[[message]]
key = "Enable the outlines, choose color and thickness, then test on a map with many different tiles."
[message.translations]
simplified_chinese = "启用轮廓，选好颜色和粗细，再到图块种类多的地图上测试。"
traditional_chinese = "啟用描邊並選擇顏色與粗細，再到圖塊種類豐富的地圖上測試。"
japanese = "輪郭を有効にして色と太さを選び、タイルの多いマップで試してください。"
korean = "윤곽선을 켜고 색과 두께를 고른 뒤, 타일이 다양한 맵에서 시험해 보세요."
russian = "Включите контуры, выберите цвет и толщину, затем проверьте на карте с разнообразными тайлами."
german = "Aktiviere die Umrisse, wähle Farbe und Stärke und teste dann auf einer Karte mit vielen verschiedenen Tiles."
spanish = "Activa los contornos, elige color y grosor y pruébalo en un mapa con muchos tipos de bloques."
french = "Activez les contours, choisissez la couleur et l'épaisseur, puis testez sur une carte aux tuiles variées."
brazilian_portuguese = "Ative os contornos, escolha cor e espessura e teste em um mapa com muitos tipos de blocos."
portuguese = "Ative os contornos, escolha a cor e a espessura e teste num mapa com muitos tipos de blocos."
turkish = "Çerçeveleri açın, renk ve kalınlık seçin, ardından farklı karoların çok olduğu bir haritada deneyin."
polish = "Włącz obrysy, wybierz kolor i grubość, a potem sprawdź je na mapie z wieloma rodzajami kafelków."

[[message]]
key = "Outlines can be distracting in fast maps; lower the opacity instead of disabling them."
[message.translations]
simplified_chinese = "快节奏地图里轮廓容易分散注意，可以调低不透明度而不是关掉。"
traditional_chinese = "在快速節奏的地圖中描邊可能干擾視線；建議降低不透明度，而不是直接關閉。"
japanese = "速いマップでは輪郭が邪魔になることがあるので、切らずに不透明度を下げてください。"
korean = "빠른 맵에서는 윤곽선이 방해될 수 있으니 끄지 말고 불투명도를 낮추세요."
russian = "На быстрых картах контуры могут отвлекать; снизьте непрозрачность вместо отключения."
german = "Auf schnellen Karten können Umrisse ablenken; verringere lieber die Deckkraft, statt sie abzuschalten."
spanish = "En mapas rápidos los contornos pueden distraer; baja la opacidad en vez de desactivarlos."
french = "Sur les cartes rapides, les contours peuvent distraire, baissez l'opacité plutôt que de les désactiver."
brazilian_portuguese = "Em mapas rápidos os contornos podem distrair; diminua a opacidade em vez de desativá-los."
portuguese = "Em mapas rápidos os contornos podem distrair; reduza a opacidade em vez de os desativar."
turkish = "Hızlı haritalarda çerçeveler dikkat dağıtabilir; kapatmak yerine saydamlığı azaltın."
polish = "Na szybkich mapach obrysy mogą rozpraszać; zmniejsz krycie zamiast je wyłączać."

[[message]]
key = "Turns on extra visual effects such as tiny Tees and the jelly-like Tee animation."
[message.translations]
simplified_chinese = "开启迷你 Tee、Q 弹 Tee 动画等额外视效。"
traditional_chinese = "開啟額外視覺效果，例如迷你 Tee 與果凍般的 Tee 動畫。"
japanese = "ミニ Tee やゼリーのような Tee アニメーションなどの追加視覚効果を有効にします。"
korean = "작은 Tee와 젤리 같은 Tee 애니메이션 등 추가 시각 효과를 켭니다."
russian = "Включает дополнительные визуальные эффекты, например крошечных Tee и «желейную» анимацию Tee."
german = "Schaltet zusätzliche visuelle Effekte ein, etwa winzige Tees und die geleeartige Tee-Animation."
spanish = "Activa efectos visuales adicionales, como Tees diminutos y la animación gelatinosa del Tee."
french = "Active des effets visuels supplémentaires, comme les Tees minuscules et l'animation gélatineuse du Tee."
brazilian_portuguese = "Ativa efeitos visuais extras, como Tees minúsculos e a animação gelatinosa do Tee."
portuguese = "Ativa efeitos visuais extra, como Tees minúsculos e a animação gelatinosa do Tee."
turkish = "Küçük Tee'ler ve jöle gibi Tee animasyonu gibi ekstra görsel efektleri açar."
polish = "Włącza dodatkowe efekty wizualne, takie jak maleńkie Tee i galaretowata animacja Tee."

[[message]]
key = "Enable the effects you like; turn tiny Tees off if distant players become hard to see."
[message.translations]
simplified_chinese = "启用喜欢的特效；远处玩家看不清时就关掉迷你 Tee。"
traditional_chinese = "啟用你喜歡的效果；若遠處玩家不易辨識，可關閉迷你 Tee。"
japanese = "好みの効果を有効にしてください。遠くのプレイヤーが見えにくい場合はミニ Tee をオフにします。"
korean = "원하는 효과를 켜세요. 멀리 있는 플레이어가 잘 안 보이면 작은 Tee를 끄면 됩니다."
russian = "Включите нужные эффекты; отключите крошечных Tee, если далёких игроков стало плохо видно."
german = "Aktiviere die Effekte, die dir gefallen; schalte winzige Tees aus, wenn weit entfernte Spieler schwer zu erkennen sind."
spanish = "Activa los efectos que te gusten; desactiva los Tees diminutos si te cuesta ver a los jugadores lejanos."
french = "Activez les effets qui vous plaisent ; désactivez les Tees minuscules si les joueurs éloignés deviennent difficiles à voir."
brazilian_portuguese = "Ative os efeitos que você gosta; desative os Tees minúsculos se os jogadores distantes ficarem difíceis de ver."
portuguese = "Ative os efeitos de que gosta; desative os Tees minúsculos se os jogadores distantes ficarem difíceis de ver."
turkish = "Sevdiğiniz efektleri açın; uzaktaki oyuncular zor görünmeye başlarsa küçük Tee'leri kapatın."
polish = "Włącz efekty, które lubisz; wyłącz maleńkie Tee, jeśli odlegli gracze stają się słabo widoczni."

[[message]]
key = "These effects are cosmetic and can cost a little performance on weaker GPUs."
[message.translations]
simplified_chinese = "这些特效只是观感，较弱显卡上会多占一点性能。"
traditional_chinese = "這些效果僅為外觀，在較弱的 GPU 上可能稍微影響效能。"
japanese = "これらの効果は見た目だけのもので、非力な GPU では少し性能を消費します。"
korean = "이 효과들은 겉모습만을 위한 것이며, 성능이 낮은 GPU에서는 약간의 성능을 사용합니다."
russian = "Эти эффекты только косметические и могут немного снизить производительность на слабых GPU."
german = "Diese Effekte sind rein optisch und können auf schwächeren GPUs etwas Leistung kosten."
spanish = "Estos efectos son solo estéticos y pueden costar algo de rendimiento en GPU débiles."
french = "Ces effets sont purement esthétiques et peuvent coûter un peu de performance sur les GPU faibles."
brazilian_portuguese = "Esses efeitos são apenas visuais e podem custar um pouco de desempenho em GPUs mais fracas."
portuguese = "Estes efeitos são apenas visuais e podem custar algum desempenho em GPUs mais fracas."
turkish = "Bu efektler yalnızca görseldir ve zayıf GPU'larda biraz performans kaybına yol açabilir."
polish = "Te efekty są tylko wizualne i mogą trochę obciążać słabsze GPU."

[[message]]
key = "Changes the font used by the menus and how large the in-game cursor is drawn."
[message.translations]
simplified_chinese = "更改菜单使用的字体，以及游戏内光标的绘制大小。"
traditional_chinese = "變更選單使用的字型，以及遊戲內游標的繪製大小。"
japanese = "メニューで使うフォントと、ゲーム内カーソルの描画サイズを変更します。"
korean = "메뉴에 사용되는 글꼴과 게임 내 커서의 크기를 변경합니다."
russian = "Меняет шрифт меню и размер отрисовки игрового курсора."
german = "Ändert die Schriftart der Menüs und wie groß der Cursor im Spiel gezeichnet wird."
spanish = "Cambia la fuente de los menús y el tamaño con que se dibuja el cursor del juego."
french = "Modifie la police des menus et la taille de dessin du curseur en jeu."
brazilian_portuguese = "Muda a fonte usada nos menus e o tamanho com que o cursor do jogo é desenhado."
portuguese = "Muda o tipo de letra usado nos menus e o tamanho com que o cursor do jogo é desenhado."
turkish = "Menülerde kullanılan yazı tipini ve oyun içi imlecin çizim boyutunu değiştirir."
polish = "Zmienia czcionkę używaną w menu oraz rozmiar kursora rysowanego w grze."

[[message]]
key = "Pick a font family and weight here; use the cursor scale to make the pointer easier to see on large screens."
[message.translations]
simplified_chinese = "在这里选择字体和字重；大屏幕上用光标缩放让指针更容易看清。"
traditional_chinese = "在此選擇字型家族與字重；使用游標縮放讓指針在大螢幕上更易看見。"
japanese = "ここでフォントファミリーとウェイトを選びます。大きな画面でポインターを見やすくするにはカーソル倍率を使ってください。"
korean = "여기서 글꼴 패밀리와 굵기를 고르세요. 큰 화면에서 포인터를 더 쉽게 보려면 커서 배율을 사용하세요."
russian = "Выберите здесь семейство и начертание шрифта; масштаб курсора поможет лучше видеть указатель на больших экранах."
german = "Wähle hier Schriftfamilie und Schriftschnitt; mit der Cursor-Skalierung ist der Zeiger auf großen Bildschirmen besser zu sehen."
spanish = "Elige aquí la familia y el grosor de la fuente; usa la escala del cursor para ver mejor el puntero en pantallas grandes."
french = "Choisissez ici la famille et la graisse de police ; utilisez l'échelle du curseur pour mieux voir le pointeur sur grand écran."
brazilian_portuguese = "Escolha aqui a família e o peso da fonte; use a escala do cursor para ver melhor o ponteiro em telas grandes."
portuguese = "Escolha aqui a família e o peso do tipo de letra; use a escala do cursor para ver melhor o ponteiro em ecrãs grandes."
turkish = "Yazı tipi ailesini ve kalınlığını burada seçin; büyük ekranlarda imleci daha kolay görmek için imleç ölçeğini kullanın."
polish = "Wybierz tutaj rodzinę i grubość czcionki; użyj skali kursora, aby wskaźnik był lepiej widoczny na dużych ekranach."

[[message]]
key = "Custom fonts only cover the characters they include, so pick a font with CJK support if Chinese text looks different."
[message.translations]
simplified_chinese = "自定义字体只包含它自带的字形，中文显示异常时请选支持中日韩字符的字体。"
traditional_chinese = "自訂字型僅涵蓋其包含的字元；若中文顯示不符預期，請選擇支援 CJK 的字型。"
japanese = "カスタムフォントは含まれる文字しか表示できないため、中国語の表示がおかしい場合は CJK 対応フォントを選んでください。"
korean = "사용자 지정 글꼴은 포함된 문자만 표시하므로, 중국어 텍스트가 다르게 보이면 CJK를 지원하는 글꼴을 선택하세요."
russian = "Свои шрифты содержат только входящие в них символы, поэтому при неверном отображении китайского текста выберите шрифт с поддержкой CJK."
german = "Eigene Schriftarten decken nur die enthaltenen Zeichen ab; wähle bei abweichender chinesischer Darstellung eine Schriftart mit CJK-Unterstützung."
spanish = "Las fuentes personalizadas solo cubren los caracteres que incluyen, así que elige una fuente con soporte CJK si el texto chino se ve distinto."
french = "Les polices personnalisées ne couvrent que les caractères qu'elles contiennent ; choisissez une police prenant en charge le CJK si le texte chinois s'affiche mal."
brazilian_portuguese = "Fontes personalizadas cobrem apenas os caracteres que incluem, então escolha uma fonte com suporte a CJK se o texto em chinês aparecer diferente."
portuguese = "Tipos de letra personalizados cobrem apenas os caracteres que incluem, por isso escolha um tipo com suporte a CJK se o texto em chinês aparecer diferente."
turkish = "Özel yazı tipleri yalnızca içerdikleri karakterleri kapsar; Çince metin farklı görünüyorsa CJK destekli bir yazı tipi seçin."
polish = "Własne czcionki obejmują tylko zawarte w nich znaki, więc jeśli tekst chiński wygląda inaczej, wybierz czcionkę z obsługą CJK."

[[message]]
key = "Controls what appears next to other players' names, such as clan tags, friend marks and client identifiers."
[message.translations]
simplified_chinese = "控制其他玩家名字旁显示的内容，例如战队标签、好友标记和客户端标识。"
traditional_chinese = "控制其他玩家名稱旁顯示的內容，例如戰隊標籤、好友標記與客戶端識別碼。"
japanese = "他のプレイヤーの名前の横に表示するもの（クランタグ、フレンドマーク、クライアント識別子など）を制御します。"
korean = "다른 플레이어 이름 옆에 표시할 항목(클랜 태그, 친구 표시, 클라이언트 식별자 등)을 제어합니다."
russian = "Определяет, что показывать рядом с именами других игроков: клан-теги, отметки друзей, идентификаторы клиентов."
german = "Legt fest, was neben den Namen anderer Spieler erscheint, etwa Clan-Tags, Freund-Markierungen und Client-Kennungen."
spanish = "Controla lo que aparece junto al nombre de otros jugadores, como etiquetas de clan, marcas de amigos e identificadores de cliente."
french = "Contrôle ce qui s'affiche à côté du nom des autres joueurs : tags de clan, marques d'amis et identifiants de client."
brazilian_portuguese = "Controla o que aparece ao lado dos nomes de outros jogadores, como tags de clã, marcas de amigo e identificadores de cliente."
portuguese = "Controla o que aparece ao lado dos nomes de outros jogadores, como etiquetas de clã, marcas de amigo e identificadores de cliente."
turkish = "Diğer oyuncuların adlarının yanında görünenleri denetler: klan etiketleri, arkadaş işaretleri ve istemci tanımlayıcıları gibi."
polish = "Określa, co wyświetla się obok nazw innych graczy, np. tagi klanów, oznaczenia znajomych i identyfikatory klienta."

[[message]]
key = "Enable the badges you want; tune the nameplate size where it overlaps the game view."
[message.translations]
simplified_chinese = "启用需要的标记；名牌挡住游戏画面时再调整名牌大小。"
traditional_chinese = "啟用你想要的名牌標記；若與遊戲畫面重疊，調整名牌大小。"
japanese = "必要なバッジを有効にします。ゲーム画面と重なる場合はネームプレートのサイズを調整してください。"
korean = "원하는 배지를 켜세요. 게임 화면과 겹치면 이름표 크기를 조정하세요."
russian = "Включите нужные значки; если они перекрывают игровое поле, настройте размер таблички с именем."
german = "Aktiviere die gewünschten Abzeichen; passe die Namensschild-Größe an, wenn es die Spielansicht überdeckt."
spanish = "Activa las insignias que quieras; ajusta el tamaño del cartel si se superpone a la vista del juego."
french = "Activez les badges voulus ; ajustez la taille de la plaque nominative si elle chevauche la vue de jeu."
brazilian_portuguese = "Ative os emblemas que quiser; ajuste o tamanho da placa de nome onde ela se sobrepõe à visão do jogo."
portuguese = "Ative os emblemas que quiser; ajuste o tamanho da placa de nome onde esta se sobrepõe à vista do jogo."
turkish = "İstediğiniz rozetleri açın; oyun görüntüsüyle çakışıyorsa isim levhası boyutunu ayarlayın."
polish = "Włącz wybrane odznaki; jeśli nachodzą na widok gry, dostosuj rozmiar tabliczki z nazwą."

[[message]]
key = "Too many badges make busy servers hard to read, so keep only the ones you actually use."
[message.translations]
simplified_chinese = "标记太多会让拥挤的服务器难以看清，只留实际会用到的。"
traditional_chinese = "標記過多會讓熱鬧的伺服器難以辨識，只保留實際用到的項目即可。"
japanese = "バッジが多すぎると混雑したサーバーが見づらくなるため、実際に使うものだけを残してください。"
korean = "배지가 너무 많으면 붐비는 서버에서 알아보기 어려우니 실제로 쓰는 것만 남기세요."
russian = "Слишком много значков мешают читать оживлённые серверы — оставьте только те, что действительно нужны."
german = "Zu viele Abzeichen machen volle Server unübersichtlich; behalte nur die, die du wirklich nutzt."
spanish = "Demasiadas insignias dificultan la lectura en servidores concurridos; deja solo las que realmente uses."
french = "Trop de badges rendent les serveurs animés illisibles ; ne gardez que ceux que vous utilisez vraiment."
brazilian_portuguese = "Emblemas demais deixam servidores cheios difíceis de ler; mantenha apenas os que você realmente usa."
portuguese = "Emblemas a mais tornam os servidores cheios difíceis de ler; mantenha apenas os que realmente usa."
turkish = "Çok fazla rozet, kalabalık sunucularda okumayı zorlaştırır; yalnızca gerçekten kullandıklarınızı bırakın."
polish = "Zbyt wiele odznak utrudnia odczyt na zatłoczonych serwerach, więc zostaw tylko te, których naprawdę używasz."

[[message]]
key = "Changes how the vote menu looks and how you interact with running votes."
[message.translations]
simplified_chinese = "更改投票菜单的外观，以及你参与进行中投票的方式。"
traditional_chinese = "變更投票選單的外觀，以及你與進行中投票的互動方式。"
japanese = "投票メニューの見た目と、進行中の投票への操作方法を変更します。"
korean = "투표 메뉴의 모양과 진행 중인 투표를 다루는 방식을 변경합니다."
russian = "Меняет внешний вид меню голосований и способ взаимодействия с идущими голосованиями."
german = "Ändert das Aussehen des Abstimmungsmenüs und wie du mit laufenden Abstimmungen umgehst."
spanish = "Cambia el aspecto del menú de votaciones y cómo interactúas con las votaciones en curso."
french = "Modifie l'apparence du menu de vote et la façon d'interagir avec les votes en cours."
brazilian_portuguese = "Muda a aparência do menu de votação e como você interage com votações em andamento."
portuguese = "Muda o aspeto do menu de votação e a forma como interage com votações em curso."
turkish = "Oylama menüsünün görünümünü ve süren oylamalarla etkileşiminizi değiştirir."
polish = "Zmienia wygląd menu głosowania i sposób obsługi trwających głosowań."

[[message]]
key = "Adjust the display options; open a vote to check the layout before joining a busy server."
[message.translations]
simplified_chinese = "调整显示选项，进拥挤的服务器前先开一个投票查看布局。"
traditional_chinese = "調整顯示選項；在加入熱鬧的伺服器前，先開啟一項投票確認版面。"
japanese = "表示オプションを調整します。混雑したサーバーに入る前に、投票を開いてレイアウトを確認してください。"
korean = "표시 옵션을 조정하세요. 붐비는 서버에 접속하기 전에 투표를 열어 배치를 확인하세요."
russian = "Настройте параметры отображения; перед заходом на оживлённый сервер откройте голосование и проверьте вид."
german = "Passe die Anzeigeoptionen an; öffne vor dem Beitritt auf einen vollen Server eine Abstimmung, um das Layout zu prüfen."
spanish = "Ajusta las opciones de visualización; abre una votación para comprobar el diseño antes de entrar en un servidor concurrido."
french = "Ajustez les options d'affichage ; ouvrez un vote pour vérifier la disposition avant de rejoindre un serveur animé."
brazilian_portuguese = "Ajuste as opções de exibição; abra uma votação para conferir o layout antes de entrar em um servidor cheio."
portuguese = "Ajuste as opções de apresentação; abra uma votação para verificar o esquema antes de entrar num servidor cheio."
turkish = "Görünüm seçeneklerini ayarlayın; kalabalık bir sunucuya katılmadan önce bir oylama açıp yerleşimi kontrol edin."
polish = "Dostosuj opcje wyświetlania; przed dołączeniem do zatłoczonego serwera otwórz głosowanie i sprawdź układ."

[[message]]
key = "This only affects your own screen; votes still follow the server rules."
[message.translations]
simplified_chinese = "这只影响你自己的屏幕，投票仍按服务器规则进行。"
traditional_chinese = "這僅影響你自己的畫面；投票仍遵循伺服器規則。"
japanese = "これは自分の画面だけに影響します。投票はサーバーのルールに従います。"
korean = "이 설정은 본인 화면에만 영향을 줍니다. 투표는 여전히 서버 규칙을 따릅니다."
russian = "Это влияет только на ваш экран; голосования по-прежнему подчиняются правилам сервера."
german = "Das betrifft nur deinen eigenen Bildschirm; Abstimmungen richten sich weiterhin nach den Serverregeln."
spanish = "Esto solo afecta a tu pantalla; las votaciones siguen las reglas del servidor."
french = "Cela n'affecte que votre écran ; les votes suivent toujours les règles du serveur."
brazilian_portuguese = "Isso afeta apenas a sua tela; as votações continuam seguindo as regras do servidor."
portuguese = "Isto afeta apenas o seu ecrã; as votações continuam a seguir as regras do servidor."
turkish = "Bu yalnızca kendi ekranınızı etkiler; oylamalar yine sunucu kurallarına göre işler."
polish = "To wpływa tylko na twój ekran; głosowania nadal podlegają regułom serwera."

[[message]]
key = "Draws temporary strokes on your own screen background while a bound key is held and the mouse moves."
[message.translations]
simplified_chinese = "按住绑定键并移动鼠标时，在你自己的屏幕背景上绘制临时笔画。"
traditional_chinese = "按住綁定的按鍵並移動滑鼠時，在你自己的螢幕背景畫上暫時的筆跡。"
japanese = "割り当てたキーを押しながらマウスを動かすと、自分の画面の背景に一時的な線を描きます。"
korean = "지정한 키를 누른 채 마우스를 움직이면 내 화면 배경에 임시 획을 그립니다."
russian = "Рисует временные штрихи на фоне вашего экрана, пока удерживается назначенная клавиша и движется мышь."
german = "Zeichnet temporäre Striche auf deinem eigenen Bildschirmhintergrund, während eine belegte Taste gehalten wird und sich die Maus bewegt."
spanish = "Dibuja trazos temporales en el fondo de tu propia pantalla mientras mantienes una tecla asignada y mueves el ratón."
french = "Dessine des traits temporaires sur le fond de votre propre écran tant qu'une touche assignée est maintenue et que la souris bouge."
brazilian_portuguese = "Desenha traços temporários no fundo da sua própria tela enquanto uma tecla atribuída está pressionada e o mouse se move."
portuguese = "Desenha traços temporários no fundo do seu próprio ecrã enquanto uma tecla atribuída está premida e o rato se move."
turkish = "Atanmış bir tuş basılıyken fare hareket ettikçe kendi ekran arka planınıza geçici çizgiler çizer."
polish = "Rysuje tymczasowe pociągnięcia na tle własnego ekranu, gdy przytrzymasz przypisany klawisz i poruszasz myszą."

[[message]]
key = "Bind a key to \"Draw at mouse position\", hold it in game and move the mouse to draw, then set color, width and how long strokes stay visible."
[message.translations]
simplified_chinese = "给“绘制鼠标所在位置”绑定一个按键，在游戏中按住并移动鼠标即可绘制，再设置颜色、宽度和笔画的显示时长。"
traditional_chinese = "把按鍵綁定到「在滑鼠位置繪製」，在遊戲中按住它並移動滑鼠來畫，然後設定顏色、粗細以及筆跡停留多久。"
japanese = "「マウス位置に描画」にキーを割り当て、ゲーム内で押したままマウスを動かして描き、色、太さ、線が残る時間を設定します。"
korean = "\"마우스 위치에 그리기\"에 키를 지정하고, 게임에서 누른 채 마우스를 움직여 그린 뒤 색상과 두께, 획이 남는 시간을 설정하세요."
russian = "Назначьте клавишу на «Рисовать у курсора», удерживайте её в игре и двигайте мышь, чтобы рисовать, затем задайте цвет, толщину и время, в течение которого штрихи остаются видны."
german = "Belege eine Taste mit „Am Mauszeiger zeichnen\", halte sie im Spiel gedrückt und bewege die Maus, um zu zeichnen, dann stelle Farbe, Breite und Anzeigedauer der Striche ein."
spanish = "Asigna una tecla a «Dibujar en la posición del ratón», manténla pulsada en el juego y mueve el ratón para dibujar; después ajusta color, grosor y cuánto tiempo quedan visibles los trazos."
french = "Assignez une touche à « Dessiner à la position de la souris », maintenez-la enfoncée en jeu et bougez la souris pour dessiner, puis réglez la couleur, l'épaisseur et la durée d'affichage des traits."
brazilian_portuguese = "Atribua uma tecla a «Desenhar na posição do mouse», segure-a no jogo e mova o mouse para desenhar; depois ajuste cor, espessura e por quanto tempo os traços ficam visíveis."
portuguese = "Atribua uma tecla a «Desenhar na posição do rato», mantenha-a premida no jogo e mova o rato para desenhar; depois ajuste a cor, a espessura e o tempo que os traços ficam visíveis."
turkish = "\"Fare konumunda çiz\" için bir tuş atayın, oyunda basılı tutup fareyi hareket ettirerek çizin; ardından rengi, kalınlığı ve çizgilerin ne kadar görünür kalacağını ayarlayın."
polish = "Przypisz klawisz do „Rysuj w pozycji myszy\", przytrzymaj go w grze i poruszaj myszą, aby rysować, a potem ustaw kolor, grubość i czas widoczności pociągnięć."

[[message]]
key = "Strokes are local only and vanish when you leave the map; set the fade time to 0 to keep them until you draw again."
[message.translations]
simplified_chinese = "笔画只在本地显示，离开地图就会消失；把消失时间设为 0 可保留到下次绘制。"
traditional_chinese = "筆跡只在本機顯示，離開地圖就會消失；把淡出時間設為 0，就能保留到你下次再畫。"
japanese = "線はローカルにだけ描かれ、マップを離れると消えます。フェード時間を 0 にすると、次に描くまで残ります。"
korean = "획은 로컬에만 남고 맵을 나가면 사라집니다. 사라지는 시간을 0으로 두면 다시 그릴 때까지 유지됩니다."
russian = "Штрихи видны только локально и исчезают при выходе с карты; поставьте время затухания 0, чтобы они оставались до нового рисования."
german = "Striche sind nur lokal sichtbar und verschwinden beim Verlassen der Karte; setze die Ausblendzeit auf 0, damit sie bis zum nächsten Zeichnen bleiben."
spanish = "Los trazos son solo locales y desaparecen al salir del mapa; pon el tiempo de desvanecimiento en 0 para conservarlos hasta que vuelvas a dibujar."
french = "Les traits restent uniquement locaux et disparaissent quand vous quittez la carte ; mettez la durée d'estompage à 0 pour les garder jusqu'au prochain dessin."
brazilian_portuguese = "Os traços são apenas locais e somem quando você sai do mapa; defina o tempo de desvanecimento como 0 para mantê-los até desenhar de novo."
portuguese = "Os traços são apenas locais e desaparecem quando sai do mapa; defina o tempo de desvanecimento como 0 para os manter até desenhar de novo."
turkish = "Çizgiler yalnızca yereldir ve haritadan ayrılınca kaybolur; tekrar çizene kadar kalsın diye solma süresini 0 yapın."
polish = "Pociągnięcia są tylko lokalne i znikają po opuszczeniu mapy; ustaw czas zanikania na 0, aby zostały do następnego rysowania."

[[message]]
key = "Renames your Tee automatically when you get close to the finish, so the finish is recorded under the name you prepared."
[message.translations]
simplified_chinese = "靠近终点时自动给你的 Tee 改名，让通关记录使用你预先准备的名字。"
traditional_chinese = "靠近終點時自動幫你的 Tee 改名，讓這次終點成績記在你事先準備好的名字下。"
japanese = "ゴールに近づくと Tee の名前を自動で変更し、準備しておいた名前でゴールが記録されます。"
korean = "결승점에 가까워지면 Tee 이름을 자동으로 바꿔서, 준비해 둔 이름으로 결승 기록이 남습니다."
russian = "Автоматически переименовывает вашего Tee при приближении к финишу, чтобы финиш записался под подготовленным именем."
german = "Benennt deinen Tee automatisch um, sobald du dich dem Ziel näherst, damit der Zieleinlauf unter dem vorbereiteten Namen erfasst wird."
spanish = "Cambia el nombre de tu Tee automáticamente al acercarte a la meta, para que el récord quede con el nombre que preparaste."
french = "Renomme automatiquement votre Tee à l'approche de l'arrivée, afin que l'arrivée soit enregistrée sous le nom que vous avez préparé."
brazilian_portuguese = "Renomeia seu Tee automaticamente ao chegar perto da meta, para que a chegada seja registrada com o nome que você preparou."
portuguese = "Muda o nome do seu Tee automaticamente quando se aproxima da meta, para que a chegada fique registada com o nome que preparou."
turkish = "Bitişe yaklaştığınızda Tee'nizin adını otomatik olarak değiştirir; böylece bitiş, hazırladığınız adla kaydedilir."
polish = "Automatycznie zmienia nazwę twojego Tee, gdy zbliżasz się do mety, dzięki czemu meta zostaje zapisana pod przygotowaną nazwą."

[[message]]
key = "Enable \"Try to rename before finishing\", then fill in the finishing name and run to the finish to test it."
[message.translations]
simplified_chinese = "启用“过终点前尝试改名”，填好终点名称，再跑到终点测试。"
traditional_chinese = "先打開「完賽前嘗試改名」，填好完賽名字，再跑到終點測試。"
japanese = "「ゴール前に名前を変えてみる」をオンにして、ゴール時の名前を入力し、ゴールまで走って試してください。"
korean = "\"결승 전 이름 변경 시도\"를 켜고 결승 때 쓸 이름을 입력한 다음 결승점까지 달려서 확인하세요."
russian = "Включите «Пытаться переименовать перед финишем», впишите имя для финиша и добегите до финиша, чтобы проверить."
german = "Aktiviere „Vor dem Ziel umbenennen versuchen\", trage den Zielnamen ein und lauf zum Ziel, um es zu testen."
spanish = "Activa «Intentar cambiar el nombre antes de terminar», escribe el nombre de meta y corre hasta la meta para probarlo."
french = "Activez « Essayer de renommer avant d'arriver », saisissez le nom d'arrivée et courez jusqu'à l'arrivée pour tester."
brazilian_portuguese = "Ative «Tentar renomear antes de terminar», preencha o nome de chegada e corra até a meta para testar."
portuguese = "Ative «Tentar mudar o nome antes de terminar», preencha o nome de chegada e corra até à meta para testar."
turkish = "\"Bitişten önce ad değiştirmeyi dene\" seçeneğini açın, bitiş adını girin ve denemek için bitişe koşun."
polish = "Włącz „Próbuj zmienić nazwę przed metą\", wpisz nazwę na metę i przebiegnij do mety, aby sprawdzić."

[[message]]
key = "It only changes your name, not your skin or clan; names that are too long are cut off."
[message.translations]
simplified_chinese = "它只改名字，不改皮肤和战队；名字过长会被截断。"
traditional_chinese = "它只改名，不改皮膚和戰隊；名字太長會被截斷。"
japanese = "変わるのは名前だけで、スキンやクランは変わりません。長すぎる名前は切り捨てられます。"
korean = "이름만 바뀌고 스킨이나 클랜은 그대로입니다. 너무 긴 이름은 잘려 나갑니다."
russian = "Меняется только имя, но не скин или клан; слишком длинные имена обрезаются."
german = "Es ändert nur den Namen, nicht Skin oder Clan; zu lange Namen werden abgeschnitten."
spanish = "Solo cambia el nombre, no la skin ni el clan; los nombres demasiado largos se recortan."
french = "Seul le nom change, pas le skin ni le clan ; les noms trop longs sont tronqués."
brazilian_portuguese = "Só o nome muda, não a skin nem o clã; nomes longos demais são cortados."
portuguese = "Só o nome muda, não a skin nem o clã; nomes demasiado longos são cortados."
turkish = "Yalnızca adınızı değiştirir, skin veya klanınızı değil; çok uzun adlar kesilir."
polish = "Zmienia tylko nazwę, a nie skórkę czy klan; zbyt długie nazwy są ucinane."

[[message]]
key = "Shows the real position of other players as a translucent ghost next to the position the client predicts."
[message.translations]
simplified_chinese = "把其他玩家的真实位置以半透明影子显示在客户端预测的位置旁边。"
traditional_chinese = "把其他玩家的真實位置畫成半透明的影子，放在客戶端預測的位置旁邊。"
japanese = "他のプレイヤーの実際の位置を、クライアントが予測した位置の隣に半透明のゴーストとして表示します。"
korean = "다른 플레이어의 실제 위치를 클라이언트가 예측한 위치 옆에 반투명 고스트로 표시합니다."
russian = "Показывает реальное положение других игроков полупрозрачным призраком рядом с местом, которое предсказывает клиент."
german = "Zeigt die echte Position anderer Spieler als halbtransparenten Geist neben der Position, die der Client vorhersagt."
spanish = "Muestra la posición real de otros jugadores como un fantasma translúcido junto a la posición que predice el cliente."
french = "Affiche la position réelle des autres joueurs sous forme de fantôme translucide à côté de la position prédite par le client."
brazilian_portuguese = "Mostra a posição real de outros jogadores como um fantasma translúcido ao lado da posição prevista pelo cliente."
portuguese = "Mostra a posição real dos outros jogadores como um fantasma translúcido ao lado da posição prevista pelo cliente."
turkish = "Diğer oyuncuların gerçek konumunu, istemcinin tahmin ettiği konumun yanında yarı saydam bir hayalet olarak gösterir."
polish = "Pokazuje rzeczywistą pozycję innych graczy jako półprzezroczystego ducha obok pozycji przewidywanej przez klienta."

[[message]]
key = "Enable \"Show unpredicted ghosts of other players\", then tune the predicted and unpredicted ghost opacity."
[message.translations]
simplified_chinese = "启用“显示其他玩家未预测的影子”，再调整预测影子和未预测影子的不透明度。"
traditional_chinese = "打開「顯示其他玩家未預測的影子」，再調整預測影子和未預測影子的不透明度。"
japanese = "「他のプレイヤーの未予測ゴーストを表示」をオンにし、予測ゴーストと未予測ゴーストの不透明度を調整します。"
korean = "\"다른 플레이어의 예측되지 않은 고스트 표시\"를 켠 뒤 예측 고스트와 예측되지 않은 고스트의 불투명도를 조정하세요."
russian = "Включите «Показывать непредсказанных призраков других игроков» и настройте непрозрачность предсказанного и непредсказанного призраков."
german = "Aktiviere „Unvorhergesagte Geister anderer Spieler anzeigen\" und justiere die Deckkraft der vorhergesagten und unvorhergesagten Geister."
spanish = "Activa «Mostrar fantasmas no predichos de otros jugadores» y ajusta la opacidad del fantasma predicho y del no predicho."
french = "Activez « Afficher les fantômes non prédits des autres joueurs » puis réglez l'opacité des fantômes prédits et non prédits."
brazilian_portuguese = "Ative «Mostrar fantasmas não previstos de outros jogadores» e ajuste a opacidade dos fantasmas previstos e não previstos."
portuguese = "Ative «Mostrar fantasmas não previstos de outros jogadores» e ajuste a opacidade dos fantasmas previstos e não previstos."
turkish = "\"Diğer oyuncuların tahmin edilmemiş hayaletlerini göster\" seçeneğini açın, sonra tahmin edilen ve edilmeyen hayalet opaklığını ayarlayın."
polish = "Włącz „Pokaż nieprzewidziane duchy innych graczy\", a potem ustaw krycie duchów przewidywanych i nieprzewidzianych."

[[message]]
key = "Ghosts only affect your own view; bind the toggle key or lower the opacity when the screen gets crowded."
[message.translations]
simplified_chinese = "影子只影响你自己的视角；画面挤时绑一个切换键或调低不透明度。"
traditional_chinese = "影子只影響你自己的畫面；畫面太擁擠時，綁定切換鍵或調低不透明度。"
japanese = "ゴーストは自分の表示にだけ影響します。画面が混み合ってきたら切り替えキーを割り当てるか、不透明度を下げてください。"
korean = "고스트는 내 화면에만 영향을 줍니다. 화면이 복잡해지면 전환 키를 지정하거나 불투명도를 낮추세요."
russian = "Призраки влияют только на ваш обзор; назначьте клавишу переключения или уменьшите непрозрачность, когда экран перегружен."
german = "Geister wirken nur auf deine eigene Ansicht; belege eine Umschalttaste oder senke die Deckkraft, wenn der Bildschirm zu voll wird."
spanish = "Los fantasmas solo afectan a tu vista; asigna una tecla de alternancia o baja la opacidad cuando la pantalla se sature."
french = "Les fantômes n'affectent que votre vue ; assignez une touche de bascule ou baissez l'opacité quand l'écran devient chargé."
brazilian_portuguese = "Os fantasmas afetam só a sua visão; atribua uma tecla de alternância ou diminua a opacidade quando a tela ficar carregada."
portuguese = "Os fantasmas afetam apenas a sua vista; atribua uma tecla de alternância ou reduza a opacidade quando o ecrã ficar carregado."
turkish = "Hayaletler yalnızca sizin görüşünüzü etkiler; ekran kalabalıklaştığında açma/kapama tuşu atayın ya da opaklığı azaltın."
polish = "Duchy wpływają tylko na twój widok; gdy ekran staje się zatłoczony, przypisz klawisz przełączania albo zmniejsz krycie."

[[message]]
key = "Runs commands automatically when you connect to a server, split into a connect part and a join part."
[message.translations]
simplified_chinese = "连接服务器时自动执行指令，分为连接段和加入段。"
traditional_chinese = "連線到伺服器時自動執行指令，分成連線階段和加入階段。"
japanese = "サーバーに接続したときにコマンドを自動で実行します。接続時と参加時の二段階に分かれています。"
korean = "서버에 연결하면 명령어를 자동으로 실행하며, 연결 단계와 참가 단계로 나뉩니다."
russian = "Автоматически выполняет команды при подключении к серверу, разделив их на часть подключения и часть входа."
german = "Führt beim Verbinden mit einem Server automatisch Befehle aus, getrennt in einen Verbindungs- und einen Beitrittsteil."
spanish = "Ejecuta comandos automáticamente al conectarte a un servidor, divididos en una parte de conexión y una de entrada."
french = "Exécute des commandes automatiquement lors de la connexion à un serveur, réparties en une partie pour la connexion et une partie pour rejoindre le serveur."
brazilian_portuguese = "Executa comandos automaticamente ao conectar em um servidor, divididos em uma parte de conexão e uma de entrada."
portuguese = "Executa comandos automaticamente ao ligar-se a um servidor, divididos numa parte de ligação e numa de entrada."
turkish = "Bir sunucuya bağlandığınızda komutları otomatik çalıştırır; bağlanma ve katılma olarak iki bölüme ayrılır."
polish = "Automatycznie wykonuje polecenia po połączeniu z serwerem, podzielone na część połączenia i część dołączania."

[[message]]
key = "Fill in the connect and join command fields, separate several commands with semicolons, and raise the delay if the server is not ready yet."
[message.translations]
simplified_chinese = "填写连接段和加入段的指令栏，多条指令用分号隔开；服务器还没准备好就调高延迟。"
traditional_chinese = "填好連線指令和加入指令欄位，多條指令用分號隔開；伺服器還沒準備好時，把延遲調大。"
japanese = "接続コマンドと参加コマンドの欄を入力し、複数のコマンドはセミコロンで区切ります。サーバーの準備ができていないときは遅延を増やしてください。"
korean = "연결 명령어와 참가 명령어 입력란을 채우고, 여러 명령어는 세미콜론으로 구분하세요. 서버가 아직 준비되지 않았다면 지연을 늘리세요."
russian = "Заполните поля команд подключения и входа, разделяйте несколько команд точкой с запятой, а если сервер ещё не готов — увеличьте задержку."
german = "Fülle die Felder für Verbindungs- und Beitrittsbefehle aus, trenne mehrere Befehle mit Semikolons und erhöhe die Verzögerung, wenn der Server noch nicht bereit ist."
spanish = "Rellena los campos de comandos de conexión y de entrada, separa varios comandos con punto y coma y sube el retardo si el servidor aún no está listo."
french = "Remplissez les champs de commandes de connexion et de rejoindre, séparez plusieurs commandes par des points-virgules et augmentez le délai si le serveur n'est pas encore prêt."
brazilian_portuguese = "Preencha os campos de comandos de conexão e de entrada, separe vários comandos com ponto e vírgula e aumente o atraso se o servidor ainda não estiver pronto."
portuguese = "Preencha os campos de comandos de ligação e de entrada, separe vários comandos com ponto e vírgula e aumente o atraso se o servidor ainda não estiver pronto."
turkish = "Bağlanma ve katılma komutu alanlarını doldurun, birden fazla komutu noktalı virgülle ayırın ve sunucu henüz hazır değilse gecikmeyi artırın."
polish = "Wypełnij pola poleceń połączenia i dołączania, oddziel kilka poleceń średnikami, a jeśli serwer nie jest jeszcze gotowy, zwiększ opóźnienie."

[[message]]
key = "Commands run once per connection, not on every map change; remove the parts that print errors."
[message.translations]
simplified_chinese = "指令每次连接只执行一次，不会在每次换图时执行；把会报错的部分去掉。"
traditional_chinese = "指令每次連線只執行一次，不是每次更換地圖都執行；會報錯的部分請刪掉。"
japanese = "コマンドは接続ごとに一度だけ実行され、マップが変わるたびには実行されません。エラーを出す部分は削除してください。"
korean = "명령어는 연결마다 한 번만 실행되며 맵이 바뀔 때마다 실행되지 않습니다. 오류를 출력하는 부분은 지우세요."
russian = "Команды выполняются один раз за подключение, а не при каждой смене карты; уберите части, которые выводят ошибки."
german = "Befehle laufen einmal pro Verbindung, nicht bei jedem Kartenwechsel; entferne die Teile, die Fehler ausgeben."
spanish = "Los comandos se ejecutan una vez por conexión, no con cada cambio de mapa; quita las partes que muestran errores."
french = "Les commandes s'exécutent une fois par connexion, pas à chaque changement de carte ; retirez les parties qui affichent des erreurs."
brazilian_portuguese = "Os comandos rodam uma vez por conexão, não a cada troca de mapa; remova as partes que mostram erros."
portuguese = "Os comandos correm uma vez por ligação, não a cada mudança de mapa; remova as partes que mostram erros."
turkish = "Komutlar her harita değişiminde değil, bağlantı başına bir kez çalışır; hata yazdıran kısımları kaldırın."
polish = "Polecenia działają raz na połączenie, a nie przy każdej zmianie mapy; usuń części, które wypisują błędy."

[[message]]
key = "Shows how many Tees in your team are frozen and how many are still active, as a row of Tee icons."
[message.translations]
simplified_chinese = "用一排 Tee 图标显示你队伍里有多少 Tee 被冻结、多少仍在活动。"
traditional_chinese = "以一排 Tee 圖示顯示隊伍中有多少 Tee 被凍結、還有多少仍在活動。"
japanese = "チーム内でフリーズしている Tee と、まだアクティブな Tee の数を、Tee アイコンの列で表示します。"
korean = "팀에서 얼어붙은 Tee와 아직 활성 상태인 Tee의 수를 Tee 아이콘 행으로 표시합니다."
russian = "Показывает в виде ряда иконок Tee, сколько Tee в вашей команде заморожено, а сколько ещё активно."
german = "Zeigt als Reihe von Tee-Symbolen an, wie viele Tees in deinem Team eingefroren und wie viele noch aktiv sind."
spanish = "Muestra cuántos Tees de tu equipo están congelados y cuántos siguen activos, en forma de fila de iconos de Tee."
french = "Affiche, sous la forme d'une rangée d'icônes de Tee, combien de Tees de votre équipe sont gelés et combien sont encore actifs."
brazilian_portuguese = "Mostra quantos Tees da sua equipe estão congelados e quantos ainda estão ativos, em uma fileira de ícones de Tee."
portuguese = "Mostra quantos Tees da sua equipa estão congelados e quantos continuam ativos, numa fileira de ícones de Tee."
turkish = "Takımınızdaki kaç Tee'nin donmuş, kaçının hâlâ aktif olduğunu bir Tee simgesi satırı olarak gösterir."
polish = "Pokazuje w postaci rzędu ikon Tee, ile Tee w twojej drużynie jest zamrożonych, a ile wciąż aktywnych."

[[message]]
key = "Enable the frozen Tee HUD, choose whether to count active or frozen Tees, then set the icon size and the maximum number of rows."
[message.translations]
simplified_chinese = "启用冻结 Tee HUD，选择统计活动中的还是被冻结的 Tee，再设置图标大小和最大行数。"
traditional_chinese = "先啟用凍結 Tee HUD，選擇要計算活動中的 Tee 還是凍結的 Tee，再設定圖示大小與最大列數。"
japanese = "フリーズ Tee HUD を有効にし、アクティブな Tee とフリーズした Tee のどちらを数えるかを選んでから、アイコンサイズと最大行数を設定します。"
korean = "얼어붙은 Tee HUD를 켜고, 활성 Tee와 얼어붙은 Tee 중 무엇을 셀지 고른 다음 아이콘 크기와 최대 행 수를 설정하세요."
russian = "Включите HUD замороженных Tee, выберите, считать ли активных или замороженных Tee, затем задайте размер иконки и максимальное число строк."
german = "Aktiviere das eingefrorene Tee-HUD, wähle, ob aktive oder eingefrorene Tees gezählt werden, und stelle dann die Symbolgröße und die maximale Zeilenzahl ein."
spanish = "Activa el HUD de Tee congelado, elige si contar Tees activos o congelados y luego ajusta el tamaño del icono y el número máximo de filas."
french = "Activez le HUD du Tee gelé, choisissez de compter les Tees actifs ou les Tees gelés, puis réglez la taille des icônes et le nombre maximal de lignes."
brazilian_portuguese = "Ative o HUD de Tee congelado, escolha se quer contar Tees ativos ou congelados e depois defina o tamanho do ícone e o número máximo de linhas."
portuguese = "Ative o HUD de Tee congelado, escolha se conta Tees ativos ou congelados e depois defina o tamanho do ícone e o número máximo de linhas."
turkish = "Donmuş Tee HUD'unu açın, aktif mi yoksa donmuş Tee'leri mi sayacağınızı seçin, ardından simge boyutunu ve maksimum satır sayısını ayarlayın."
polish = "Włącz HUD zamrożonych Tee, wybierz, czy liczyć aktywnych czy zamrożonych Tee, a następnie ustaw rozmiar ikony i maksymalną liczbę wierszy."

[[message]]
key = "It only counts your own team and only appears on your screen; lower the icon size when it covers the crosshair."
[message.translations]
simplified_chinese = "它只统计你自己的队伍，也只显示在你的屏幕上；挡住准星时把图标调小。"
traditional_chinese = "它只計算你自己的隊伍，也只顯示在你的畫面上；當它遮住準星時，把圖示大小調小。"
japanese = "数えるのは自分のチームだけで、表示も自分の画面だけです。クロスヘアに重なる場合は、アイコンサイズを小さくしてください。"
korean = "자기 팀만 세고 본인 화면에만 표시됩니다. 조준점을 가릴 때는 아이콘 크기를 줄이세요."
russian = "HUD учитывает только вашу команду и отображается только на вашем экране; если он перекрывает прицел, уменьшите размер иконки."
german = "Gezählt wird nur dein eigenes Team, und sichtbar ist es nur auf deinem Bildschirm; verkleinere die Symbolgröße, wenn es das Fadenkreuz verdeckt."
spanish = "Solo cuenta tu propio equipo y solo aparece en tu pantalla; reduce el tamaño del icono si tapa la mira."
french = "Il ne compte que votre propre équipe et ne s'affiche que sur votre écran ; réduisez la taille des icônes s'il masque le réticule."
brazilian_portuguese = "Ele conta apenas a sua própria equipe e só aparece na sua tela; diminua o tamanho do ícone se ele cobrir a mira."
portuguese = "Conta apenas a sua própria equipa e só aparece no seu ecrã; reduza o tamanho do ícone se tapar a mira."
turkish = "Yalnızca kendi takımınızı sayar ve yalnızca sizin ekranınızda görünür; nişangahı kapatıyorsa simge boyutunu küçültün."
polish = "Liczy tylko twoją własną drużynę i pojawia się wyłącznie na twoim ekranie; zmniejsz rozmiar ikon, jeśli zasłania celownik."

[[message]]
key = "Chooses windowed or fullscreen mode, the monitor and the resolution; switching recreates the swap chain, so the screen may flash briefly."
[message.translations]
simplified_chinese = "选择窗口化模式或全屏模式，以及显示器和分辨率；切换时会重建交换链，画面可能短暂闪烁。"
traditional_chinese = "選擇視窗化模式或全螢幕模式，以及顯示器與解析度；切換時會重建交換鏈，畫面可能短暫閃爍。"
japanese = "ウィンドウモードかフルスクリーンモードか、使用するモニターと解像度を選びます。切り替えるとスワップチェーンが再作成されるため、画面が一瞬ちらつくことがあります。"
korean = "창 모드 또는 전체 화면 모드와 모니터, 해상도를 선택합니다. 전환하면 스왑 체인이 다시 생성되어 화면이 잠깐 깜빡일 수 있습니다."
russian = "Выбирает оконный или полноэкранный режим, монитор и разрешение; при переключении цепочка буферов пересоздаётся, поэтому экран может коротко мигнуть."
german = "Legt Fenster- oder Vollbildmodus, Monitor und Auflösung fest; ein Wechsel baut die Swapchain neu auf, der Bildschirm kann kurz flackern."
spanish = "Elige el modo ventana o pantalla completa, el monitor y la resolución; al cambiar se recrea la cadena de intercambio, así que la pantalla puede parpadear un instante."
french = "Choisit le mode fenêtré ou plein écran, l'écran et la résolution ; en changer recrée la chaîne de swap et l'écran peut clignoter un instant."
brazilian_portuguese = "Escolhe entre janela e tela cheia, além do monitor e da resolução; a troca recria a swap chain, então a tela pode piscar por um instante."
portuguese = "Escolhe o modo janelado ou ecrã completo, o monitor e a resolução; ao mudar, a cadeia de troca é recriada e o ecrã pode piscar por um instante."
turkish = "Pencereli veya tam ekran modunu, monitörü ve çözünürlüğü seçer; değiştirmek takas zincirini yeniden oluşturur, bu yüzden ekran kısa süreliğine yanıp sönebilir."
polish = "Wybiera tryb okienkowy lub pełnoekranowy, monitor i rozdzielczość; przełączenie odtwarza łańcuch wymiany, więc ekran może na chwilę mignąć."

[[message]]
key = "Pick the mode first, then the monitor and resolution; the refresh rate follows the monitor's current mode."
[message.translations]
simplified_chinese = "先选择模式，再选择显示器和分辨率；刷新率由显示器当前的模式决定。"
traditional_chinese = "先選擇模式，再選擇顯示器與解析度；刷新率由顯示器目前的模式決定。"
japanese = "まずモードを選び、次にモニターと解像度を選びます。リフレッシュレートはモニターの現在のモードによって決まります。"
korean = "먼저 모드를 고른 다음 모니터와 해상도를 선택하세요. 재생률은 모니터의 현재 모드에 따라 결정됩니다."
russian = "Сначала выберите режим, затем монитор и разрешение; частота обновления следует текущему режиму монитора."
german = "Wähle zuerst den Modus, dann Monitor und Auflösung; die Bildwiederholfrequenz folgt dem aktuellen Modus des Monitors."
spanish = "Elige primero el modo y luego el monitor y la resolución; la frecuencia de actualización sigue al modo actual del monitor."
french = "Choisis d'abord le mode, puis l'écran et la résolution ; la fréquence de rafraîchissement suit le mode actuel de l'écran."
brazilian_portuguese = "Escolha primeiro o modo, depois o monitor e a resolução; a taxa de atualização segue o modo atual do monitor."
portuguese = "Escolhe primeiro o modo, depois o monitor e a resolução; a taxa de atualização segue o modo atual do monitor."
turkish = "Önce modu, ardından monitörü ve çözünürlüğü seçin; yenileme hızı monitörün geçerli modunu izler."
polish = "Najpierw wybierz tryb, potem monitor i rozdzielczość; częstotliwość odświeżania zależy od bieżącego trybu monitora."

[[message]]
key = "If exclusive fullscreen fails, switch back to windowed or borderless first."
[message.translations]
simplified_chinese = "如果独占全屏模式无法启动，请先切回窗口化或无边框模式。"
traditional_chinese = "如果獨佔全螢幕模式無法啟動，請先切回視窗化或無邊框模式。"
japanese = "排他フルスクリーンに失敗する場合は、まずウィンドウモードかボーダーレスに戻してください。"
korean = "독점 전체 화면 모드가 실패하면 먼저 창 모드나 테두리 없는 모드로 돌아가세요."
russian = "Если эксклюзивный полноэкранный режим не запускается, сначала вернитесь в оконный режим или в режим без рамки."
german = "Scheitert das exklusive Vollbild, wechsle zuerst zurück auf Fenstermodus oder randlos."
spanish = "Si falla la pantalla completa exclusiva, vuelve primero al modo ventana o sin bordes."
french = "Si le plein écran exclusif échoue, repasse d'abord en fenêtré ou en sans bordure."
brazilian_portuguese = "Se a tela cheia exclusiva falhar, volte primeiro para janela ou janela sem bordas."
portuguese = "Se o modo de ecrã completo exclusivo não funcionar, volta primeiro ao modo janelado ou sem bordas."
turkish = "Özel tam ekran başarısız olursa önce pencereli veya kenarlıksız moda dönün."
polish = "Jeśli ekskluzywny tryb pełnoekranowy nie działa, najpierw wróć do trybu okienkowego lub bez ramek."

[[message]]
key = "Controls how UI surfaces are drawn: card surface opacity, border width, corner rounding, segment count and the rainbow title effect."
[message.translations]
simplified_chinese = "控制界面表面的绘制方式：卡片表面不透明度、边框宽度、圆角、分段数和彩虹标题效果。"
traditional_chinese = "控制介面表面的繪製方式：卡片表面不透明度、邊框寬度、圓角、分段數與彩虹標題效果。"
japanese = "UI の表面をどう描画するかを設定します。カード表面の不透明度、枠線の幅、角丸、セグメント数、カードタイトルの虹色効果です。"
korean = "UI 표면을 그리는 방식을 설정합니다. 카드 표면 불투명도, 테두리 너비, 모서리 둥글림, 세그먼트 수, 카드 제목 무지개 효과입니다."
russian = "Управляет отрисовкой поверхностей интерфейса: прозрачность поверхности карточки, толщина рамки, скругление углов, число сегментов и радужный эффект заголовка."
german = "Steuert, wie UI-Oberflächen gezeichnet werden: Deckkraft der Kartenoberfläche, Randbreite, Eckenrundung, Segmentanzahl und der Regenbogen-Titeleffekt."
spanish = "Controla cómo se dibujan las superficies de la interfaz: opacidad de la superficie de las tarjetas, ancho del borde, redondeo de las esquinas, número de segmentos y el efecto arcoíris del título."
french = "Contrôle le rendu des surfaces de l'interface : opacité de la surface des cartes, épaisseur des bordures, arrondi des coins, nombre de segments et effet arc-en-ciel du titre."
brazilian_portuguese = "Controla como as superfícies da interface são desenhadas: opacidade da superfície do cartão, largura da borda, arredondamento dos cantos, número de segmentos e o efeito arco-íris do título."
portuguese = "Controla o desenho das superfícies da UI: opacidade da superfície dos cartões, largura das bordas, arredondamento dos cantos, número de segmentos e efeito arco-íris do título."
turkish = "Arayüz yüzeylerinin nasıl çizileceğini denetler: kart yüzeyi opaklığı, kenarlık genişliği, köşe yuvarlaması, dilim sayısı ve gökkuşağı başlık efekti."
polish = "Steruje rysowaniem powierzchni interfejsu: kryciem powierzchni karty, grubością obramowania, zaokrągleniem rogów, liczbą segmentów i efektem tęczowego tytułu."

[[message]]
key = "Adjust one value at a time; corners and segments are drawn per frame, so large segment counts cost GPU time."
[message.translations]
simplified_chinese = "一次只调整一个值；圆角和分段每帧都会绘制，分段数过高会占用 GPU 时间。"
traditional_chinese = "一次只調整一個值；圓角與分段每幀都會繪製，分段數過高會佔用 GPU 時間。"
japanese = "値を一つずつ調整してください。角丸とセグメントは毎フレーム描画されるため、セグメント数が多いと GPU 時間を消費します。"
korean = "한 번에 값 하나씩 조정하세요. 모서리 둥글림과 세그먼트는 매 프레임 그려지므로 세그먼트 수가 많으면 GPU 시간을 사용합니다."
russian = "Меняйте по одному значению; скругления и сегменты рисуются каждый кадр, поэтому большое число сегментов нагружает GPU."
german = "Ändere jeweils nur einen Wert; Ecken und Segmente werden pro Frame gezeichnet, hohe Segmentzahlen kosten GPU-Zeit."
spanish = "Ajusta un valor cada vez; las esquinas y los segmentos se dibujan por fotograma, así que un número alto de segmentos consume tiempo de GPU."
french = "Règle une valeur à la fois ; les coins et les segments sont redessinés à chaque image, donc un grand nombre de segments coûte du temps GPU."
brazilian_portuguese = "Ajuste um valor por vez; cantos e segmentos são desenhados a cada quadro, então muitos segmentos custam tempo de GPU."
portuguese = "Ajusta um valor de cada vez; cantos e segmentos são desenhados a cada frame, por isso muitos segmentos custam tempo de GPU."
turkish = "Her seferinde tek bir değeri değiştirin; köşeler ve dilimler her karede çizilir, bu yüzden yüksek dilim sayıları GPU süresini artırır."
polish = "Zmieniaj wartości pojedynczo; rogi i segmenty są rysowane co klatkę, więc duża liczba segmentów obciąża GPU."

[[message]]
key = "Very thick borders or high segment counts make text look blurry; keep them near the defaults."
[message.translations]
simplified_chinese = "边框过粗或分段数过高会让文字显得模糊；请尽量让这些值接近默认值。"
traditional_chinese = "邊框太粗或分段數過高會讓文字顯得模糊；請盡量讓這些值接近預設值。"
japanese = "枠線を太くしすぎたり、セグメント数を増やしすぎたりすると、文字がぼやけて見えます。既定値に近い値に保ってください。"
korean = "테두리가 너무 두껍거나 세그먼트 수가 너무 많으면 글자가 흐릿하게 보입니다. 기본값에 가깝게 유지하세요."
russian = "Слишком толстые рамки или большое число сегментов делают текст размытым; держите значения близко к стандартным."
german = "Sehr dicke Ränder oder viele Segmente lassen Text unscharf wirken; bleib nahe an den Standardwerten."
spanish = "Los bordes muy gruesos o un número alto de segmentos hacen que el texto se vea borroso; mantén los valores cerca de los predeterminados."
french = "Des bordures très épaisses ou un nombre de segments élevé rendent le texte flou ; reste proche des valeurs par défaut."
brazilian_portuguese = "Bordas muito grossas ou muitos segmentos deixam o texto borrado; mantenha perto dos padrões."
portuguese = "Bordas muito espessas ou muitos segmentos deixam o texto desfocado; mantém os valores perto dos predefinidos."
turkish = "Çok kalın kenarlıklar veya yüksek dilim sayıları metni bulanık gösterir; varsayılan değerlere yakın tutun."
polish = "Bardzo grube obramowania lub duża liczba segmentów rozmywają tekst; trzymaj je blisko wartości domyślnych."

[[message]]
key = "Sets UI icon color and weight for the icon font shared by menus and cards."
[message.translations]
simplified_chinese = "为菜单和卡片共用的图标字体设置界面图标的颜色和字重。"
traditional_chinese = "為選單與卡片共用的圖示字型設定介面圖示的顏色與字重。"
japanese = "メニューとカードが共通で使うアイコンフォントについて、UI アイコンの色とウェイトを設定します。"
korean = "메뉴와 카드가 함께 쓰는 아이콘 글꼴의 UI 아이콘 색상과 굵기를 설정합니다."
russian = "Задаёт цвет и начертание значков интерфейса для шрифта значков, общего для меню и карточек."
german = "Legt Symbolfarbe und -stärke der Symbolschrift fest, die Menüs und Karten gemeinsam nutzen."
spanish = "Define el color y el grosor de los iconos de la interfaz en la fuente de iconos que comparten los menús y las tarjetas."
french = "Définit la couleur et la graisse des icônes de l'interface, dans la police d'icônes commune aux menus et aux cartes."
brazilian_portuguese = "Define a cor e o peso dos ícones da interface na fonte de ícones usada por menus e cartões."
portuguese = "Define a cor e o peso dos ícones da UI para a fonte de ícones partilhada por menus e cartões."
turkish = "Menülerde ve kartlarda kullanılan simge yazı tipinin rengini ve ağırlığını ayarlar."
polish = "Ustawia kolor i grubość ikon interfejsu w czcionce ikon wspólnej dla menu i kart."

[[message]]
key = "Pick a color preset or a custom color, then choose regular or bold weight."
[message.translations]
simplified_chinese = "选择预设颜色或自定义颜色，再选择常规或粗体。"
traditional_chinese = "選擇預設顏色或自訂顏色，再選擇標準或粗體。"
japanese = "プリセット色かカスタム色を選び、次にウェイトを標準か太字から選びます。"
korean = "프리셋 색상이나 사용자 지정 색상을 고른 다음 보통 또는 굵게를 선택하세요."
russian = "Выберите пресет цвета или свой цвет, затем обычное или жирное начертание."
german = "Wähle eine Farbvoreinstellung oder eine eigene Farbe und dann die Stärke Normal oder Fett."
spanish = "Elige un preajuste de color o un color personalizado y después el grosor normal o negrita."
french = "Choisis un préréglage de couleur ou une couleur personnalisée, puis une graisse normale ou grasse."
brazilian_portuguese = "Escolha uma predefinição de cor ou uma cor personalizada e depois o peso normal ou negrito."
portuguese = "Escolhe uma predefinição de cor ou uma cor personalizada e depois o peso regular ou negrito."
turkish = "Bir renk ön ayarı veya özel bir renk seçin, ardından normal veya kalın yazı ağırlığını seçin."
polish = "Wybierz preset kolorów lub własny kolor, a następnie grubość zwykłą albo pogrubioną."

[[message]]
key = "Custom colors too close to the surface make icons disappear; keep contrast."
[message.translations]
simplified_chinese = "自定义颜色与界面表面太接近时，图标会看不见；请保持对比度。"
traditional_chinese = "自訂顏色與介面表面太接近時，圖示會看不見；請保持對比度。"
japanese = "カスタム色が表面の色に近すぎると、アイコンが見えなくなります。コントラストを確保してください。"
korean = "사용자 지정 색상이 표면 색과 너무 비슷하면 아이콘이 보이지 않습니다. 대비를 유지하세요."
russian = "Свои цвета, слишком близкие к фону поверхности, делают значки незаметными; следите за контрастом."
german = "Eigene Farben, die der Oberfläche zu ähnlich sind, lassen Symbole verschwinden; achte auf genug Kontrast."
spanish = "Los colores personalizados demasiado parecidos a la superficie hacen que los iconos desaparezcan; mantén el contraste."
french = "Une couleur personnalisée trop proche du fond fait disparaître les icônes ; garde du contraste."
brazilian_portuguese = "Cores personalizadas muito próximas da superfície fazem os ícones sumirem; mantenha o contraste."
portuguese = "Cores personalizadas demasiado próximas da superfície fazem os ícones desaparecer; mantém o contraste."
turkish = "Yüzeye çok yakın özel renkler simgeleri görünmez yapar; kontrastı koruyun."
polish = "Własne kolory zbyt bliskie powierzchni sprawiają, że ikony znikają; zadbaj o kontrast."

[[message]]
key = "Lists the display modes the graphics backend reports for the selected monitor."
[message.translations]
simplified_chinese = "列出图形后端针对所选显示器报告的显示模式。"
traditional_chinese = "列出圖形後端針對所選顯示器回報的顯示模式。"
japanese = "選択したモニターについて、グラフィックスバックエンドが報告する表示モードを一覧表示します。"
korean = "그래픽 백엔드가 선택한 모니터에 대해 보고하는 표시 모드를 나열합니다."
russian = "Перечисляет режимы отображения, которые графический бэкенд сообщает для выбранного монитора."
german = "Listet die Anzeigemodi auf, die das Grafik-Backend für den gewählten Monitor meldet."
spanish = "Enumera los modos de pantalla que indica el backend gráfico para el monitor seleccionado."
french = "Liste les modes d'affichage signalés par le backend graphique pour l'écran sélectionné."
brazilian_portuguese = "Lista os modos de exibição que o backend gráfico informa para o monitor selecionado."
portuguese = "Lista os modos de apresentação que o backend gráfico reporta para o monitor selecionado."
turkish = "Grafik arka ucunun seçili monitör için bildirdiği ekran modlarını listeler."
polish = "Pokazuje tryby wyświetlania zgłaszane przez backend grafiki dla wybranego monitora."

[[message]]
key = "Pick a mode from the list; unsupported modes are not offered."
[message.translations]
simplified_chinese = "从列表中选择模式；不支持的模式不会显示。"
traditional_chinese = "從清單中選擇模式；不受支援的模式不會顯示。"
japanese = "一覧からモードを選びます。サポートされていないモードは表示されません。"
korean = "목록에서 모드를 선택하세요. 지원하지 않는 모드는 나타나지 않습니다."
russian = "Выберите режим из списка; неподдерживаемые режимы не предлагаются."
german = "Wähle einen Modus aus der Liste; nicht unterstützte Modi werden nicht angeboten."
spanish = "Elige un modo de la lista; los modos no compatibles no se ofrecen."
french = "Choisis un mode dans la liste ; les modes non pris en charge ne sont pas proposés."
brazilian_portuguese = "Escolha um modo da lista; modos sem suporte não são oferecidos."
portuguese = "Escolhe um modo da lista; os modos não suportados não são apresentados."
turkish = "Listeden bir mod seçin; desteklenmeyen modlar sunulmaz."
polish = "Wybierz tryb z listy; nieobsługiwane tryby nie są oferowane."

[[message]]
key = "Unusual refresh rates can cause tearing; prefer the monitor's native rate."
[message.translations]
simplified_chinese = "不常见的刷新率可能导致画面撕裂；建议优先使用显示器的原生刷新率。"
traditional_chinese = "不常見的刷新率可能造成畫面撕裂；建議優先使用顯示器的原生刷新率。"
japanese = "特殊なリフレッシュレートはティアリングの原因になります。モニターのネイティブなリフレッシュレートをおすすめします。"
korean = "일반적이지 않은 재생률은 티어링을 일으킬 수 있으니 모니터의 기본 재생률을 사용하는 것이 좋습니다."
russian = "Необычные частоты обновления могут вызывать разрывы изображения; предпочитайте родную частоту монитора."
german = "Ungewöhnliche Bildwiederholfrequenzen können Tearing verursachen; nutze lieber die native Frequenz des Monitors."
spanish = "Las frecuencias de actualización poco habituales pueden causar desgarro de imagen; prefiere la frecuencia nativa del monitor."
french = "Des fréquences de rafraîchissement inhabituelles peuvent provoquer du tearing ; privilégie la fréquence native de l'écran."
brazilian_portuguese = "Taxas de atualização incomuns podem causar rasgos na imagem; prefira a taxa nativa do monitor."
portuguese = "Taxas de atualização invulgares podem causar rasgamento; dá preferência à taxa nativa do monitor."
turkish = "Sıra dışı yenileme hızları yırtılmaya yol açabilir; monitörün doğal hızını tercih edin."
polish = "Nietypowe częstotliwości odświeżania mogą powodować rozrywanie obrazu; wybierz natywną częstotliwość monitora."

[[message]]
key = "Sets how much motion the interface plays: transitions, card entrance, reorder animations and scroll feel."
[message.translations]
simplified_chinese = "设置界面的动效强度：过渡、卡片进入、重排动画和滚动手感。"
traditional_chinese = "設定介面的動效強度：轉場、卡片進場、重新排序動畫與捲動手感。"
japanese = "インターフェースの動きの量を設定します。トランジション、カードの登場、並べ替えアニメーション、スクロールの感触が対象です。"
korean = "인터페이스에서 재생되는 움직임의 정도를 설정합니다. 전환, 카드 등장, 순서 변경 애니메이션, 스크롤 느낌이 포함됩니다."
russian = "Задаёт, сколько анимации будет в интерфейсе: переходы, появление карточек, анимации перестановки и поведение прокрутки."
german = "Legt fest, wie viel Bewegung die Oberfläche zeigt: Übergänge, Karten-Einblendung, Sortieranimationen und Scrollverhalten."
spanish = "Define cuánto movimiento reproduce la interfaz: transiciones, entrada de las tarjetas, animaciones al reordenar y sensación de desplazamiento."
french = "Définit l'ampleur des animations de l'interface : transitions, apparition des cartes, réorganisation et ressenti du défilement."
brazilian_portuguese = "Define quanta animação a interface executa: transições, entrada dos cartões, animações de reordenação e a sensação de rolagem."
portuguese = "Define a quantidade de movimento da interface: transições, entrada dos cartões, animações de reordenação e sensação de deslocamento."
turkish = "Arayüzün ne kadar hareket oynatacağını ayarlar: geçişler, kart girişi, sıralama animasyonları ve kaydırma hissi."
polish = "Ustawia intensywność ruchu interfejsu: przejścia, wejście kart, animacje zmiany kolejności i płynność przewijania."

[[message]]
key = "Choose off, simple or full; the individual switches below only apply to full."
[message.translations]
simplified_chinese = "可选择关闭、精简或完整；下方各个开关只在“完整”下生效。"
traditional_chinese = "可選擇關閉、精簡或完整；下方各個開關只在「完整」下生效。"
japanese = "オフ・簡易・フルから選びます。下の個別スイッチはフルのときだけ適用されます。"
korean = "끄기, 간단, 전체 중에서 선택하세요. 아래의 개별 스위치는 전체일 때만 적용됩니다."
russian = "Выберите «Выкл», «Простой» или «Полный»; отдельные переключатели ниже действуют только в полном режиме."
german = "Wähle Aus, Einfach oder Voll; die einzelnen Schalter darunter wirken nur bei Voll."
spanish = "Elige desactivado, simple o completo; los interruptores de abajo solo se aplican a completo."
french = "Choisis entre désactivé, simple et complet ; les interrupteurs ci-dessous ne s'appliquent qu'au mode complet."
brazilian_portuguese = "Escolha desligado, simples ou completo; os controles individuais abaixo só valem no modo completo."
portuguese = "Escolhe desligado, simples ou completo; os interruptores individuais abaixo só se aplicam ao modo completo."
turkish = "Kapalı, basit veya tam seçin; aşağıdaki ayrı anahtarlar yalnızca tam seçeneğinde geçerlidir."
polish = "Wybierz wyłączony, prosty lub pełny; pojedyncze przełączniki poniżej działają tylko w trybie pełnym."

[[message]]
key = "Turn motion off on weaker machines; cards then open and scroll immediately."
[message.translations]
simplified_chinese = "配置较低的机器请关闭动效；卡片便会立即打开和滚动。"
traditional_chinese = "效能較弱的機器請關閉動效；卡片便會立即開啟和捲動。"
japanese = "性能の低い環境では動きをオフにしてください。カードがすぐに開き、スクロールもすぐに反応します。"
korean = "성능이 낮은 환경에서는 움직임을 끄세요. 그러면 카드가 즉시 열리고 스크롤도 바로 됩니다."
russian = "На слабых машинах отключите анимацию: карточки будут открываться и прокручиваться мгновенно."
german = "Schalte die Bewegung auf schwächeren Rechnern ab; Karten öffnen und scrollen dann sofort."
spanish = "Desactiva el movimiento en equipos modestos; así las tarjetas se abren y se desplazan al instante."
french = "Désactive les animations sur une machine modeste ; les cartes s'ouvrent alors et défilent instantanément."
brazilian_portuguese = "Desligue a animação em máquinas mais fracas; assim os cartões abrem e rolam na hora."
portuguese = "Desliga o movimento em máquinas mais fracas; os cartões abrem e deslocam-se de imediato."
turkish = "Zayıf makinelerde hareketi kapatın; kartlar o zaman hemen açılır ve kaydırılır."
polish = "Na słabszych komputerach wyłącz ruch; karty otwierają się i przewijają wtedy od razu."

[[message]]
key = "Enables audio output and selects the playback device."
[message.translations]
simplified_chinese = "启用音频输出并选择播放设备。"
traditional_chinese = "啟用音訊輸出並選擇播放裝置。"
japanese = "音声出力を有効にし、再生デバイスを選択します。"
korean = "오디오 출력을 활성화하고 재생 장치를 선택합니다."
russian = "Включает вывод звука и выбирает устройство воспроизведения."
german = "Aktiviert die Audioausgabe und wählt das Wiedergabegerät."
spanish = "Activa la salida de audio y selecciona el dispositivo de reproducción."
french = "Active la sortie audio et sélectionne le périphérique de lecture."
brazilian_portuguese = "Ativa a saída de áudio e seleciona o dispositivo de reprodução."
portuguese = "Ativa a saída de áudio e escolhe o dispositivo de reprodução."
turkish = "Ses çıkışını etkinleştirir ve oynatma cihazını seçer."
polish = "Włącza wyjście dźwięku i wybiera urządzenie odtwarzające."

[[message]]
key = "Turn sound on, then pick a device; the list comes from the audio backend at startup."
[message.translations]
simplified_chinese = "先开启声音，再选择设备；设备列表由音频后端在启动时提供。"
traditional_chinese = "先開啟音效，再選擇裝置；裝置清單由音訊後端在啟動時提供。"
japanese = "サウンドをオンにしてからデバイスを選びます。一覧は起動時にオーディオバックエンドから取得されます。"
korean = "소리를 켠 다음 장치를 선택하세요. 목록은 시작할 때 오디오 백엔드에서 가져옵니다."
russian = "Включите звук, затем выберите устройство; список берётся из аудиобэкенда при запуске."
german = "Schalte den Ton ein und wähle ein Gerät; die Liste stammt beim Start vom Audio-Backend."
spanish = "Activa el sonido y elige un dispositivo; la lista la genera el backend de audio al iniciar."
french = "Active le son, puis choisis un périphérique ; la liste vient du backend audio au démarrage."
brazilian_portuguese = "Ligue o som e escolha um dispositivo; a lista vem do backend de áudio na inicialização."
portuguese = "Liga o som e escolhe um dispositivo; a lista vem do backend de áudio no arranque."
turkish = "Sesi açın, ardından bir cihaz seçin; liste açılışta ses arka ucundan alınır."
polish = "Włącz dźwięk i wybierz urządzenie; lista pochodzi z backendu audio przy starcie."

[[message]]
key = "If a device disappears after unplugging headphones, reselect it or restart the client."
[message.translations]
simplified_chinese = "如果拔掉耳机后设备消失，请重新选择该设备或重启客户端。"
traditional_chinese = "如果拔掉耳機後裝置消失，請重新選擇該裝置或重新啟動客戶端。"
japanese = "ヘッドホンを外した後にデバイスが消えた場合は、もう一度選択するかクライアントを再起動してください。"
korean = "헤드폰을 뽑은 뒤 장치가 사라지면 다시 선택하거나 클라이언트를 재시작하세요."
russian = "Если после отключения наушников устройство пропало, выберите его заново или перезапустите клиент."
german = "Verschwindet ein Gerät nach dem Abziehen der Kopfhörer, wähle es neu oder starte den Client neu."
spanish = "Si un dispositivo desaparece tras desconectar los auriculares, vuelve a seleccionarlo o reinicia el cliente."
french = "Si un périphérique disparaît après avoir débranché un casque, resélectionne-le ou redémarre le client."
brazilian_portuguese = "Se um dispositivo sumir depois de desconectar o fone, selecione-o de novo ou reinicie o cliente."
portuguese = "Se um dispositivo desaparecer ao desligar os auscultadores, volta a selecioná-lo ou reinicia o cliente."
turkish = "Kulaklığı çıkardıktan sonra bir cihaz kaybolursa yeniden seçin veya istemciyi yeniden başlatın."
polish = "Jeśli po odłączeniu słuchawek urządzenie zniknie, wybierz je ponownie lub uruchom klienta od nowa."

[[message]]
key = "Sets master, music and game volume separately."
[message.translations]
simplified_chinese = "分别设置主音量、音乐音量和游戏音量。"
traditional_chinese = "分別設定主音量、音樂音量與遊戲音量。"
japanese = "マスター音量、音楽音量、ゲーム音量を個別に設定します。"
korean = "마스터 볼륨, 음악 볼륨, 게임 볼륨을 각각 설정합니다."
russian = "Задаёт общую громкость, громкость музыки и звуков игры по отдельности."
german = "Legt Gesamt-, Musik- und Spiellautstärke getrennt fest."
spanish = "Define por separado el volumen general, el de la música y el del juego."
french = "Règle séparément le volume principal, celui de la musique et celui du jeu."
brazilian_portuguese = "Define separadamente o volume geral, o da música e o do jogo."
portuguese = "Define separadamente o volume principal, o da música e o do jogo."
turkish = "Ana, müzik ve oyun ses düzeyini ayrı ayrı ayarlar."
polish = "Ustawia osobno głośność główną, muzyki i gry."

[[message]]
key = "Drag the three sliders; master scales the other two."
[message.translations]
simplified_chinese = "拖动三个滑块；主音量会按比例调整另外两个音量。"
traditional_chinese = "拖動三個滑桿；主音量會按比例調整另外兩個音量。"
japanese = "3 つのスライダーをドラッグします。マスターは残り 2 つの音量をまとめて増減させます。"
korean = "슬라이더 세 개를 드래그하세요. 마스터는 나머지 두 볼륨을 비례하여 조절합니다."
russian = "Двигайте три ползунка; общая громкость масштабирует две остальные."
german = "Ziehe die drei Regler; die Gesamtlautstärke skaliert die anderen beiden."
spanish = "Arrastra los tres deslizadores; el general escala los otros dos."
french = "Fais glisser les trois curseurs ; le volume principal module les deux autres."
brazilian_portuguese = "Arraste os três controles; o volume geral escala os outros dois."
portuguese = "Arrasta as três barras deslizantes; o volume principal escala os outros dois."
turkish = "Üç kaydırıcıyı sürükleyin; ana ses diğer ikisini ölçekler."
polish = "Przeciągnij trzy suwaki; głośność główna skaluje pozostałe dwa."

[[message]]
key = "Music and game volume are multiplied by master, so raising master alone can clip."
[message.translations]
simplified_chinese = "音乐音量和游戏音量都会与主音量相乘，因此只调高主音量可能导致破音。"
traditional_chinese = "音樂音量與遊戲音量都會與主音量相乘，因此只調高主音量可能造成破音。"
japanese = "音楽とゲームの音量はマスターと掛け合わされるため、マスターだけを上げると音が割れることがあります。"
korean = "음악과 게임 볼륨은 마스터 볼륨과 곱해지므로 마스터만 올리면 소리가 깨질 수 있습니다."
russian = "Громкость музыки и игры умножается на общую, поэтому если поднять только общую, звук начнёт искажаться."
german = "Musik- und Spiellautstärke werden mit der Gesamtlautstärke multipliziert; nur diese zu erhöhen kann den Ton übersteuern."
spanish = "El volumen de música y de juego se multiplica por el general, así que subir solo el general puede saturar el sonido."
french = "Les volumes musique et jeu sont multipliés par le volume principal : monter ce dernier seul peut provoquer de la saturation."
brazilian_portuguese = "Os volumes de música e de jogo são multiplicados pelo volume geral, então subir só o geral pode distorcer o áudio."
portuguese = "O volume da música e o do jogo são multiplicados pelo principal, por isso subir apenas o principal pode saturar."
turkish = "Müzik ve oyun sesi ana sesle çarpılır, bu yüzden yalnızca ana sesi yükseltmek kırpılmaya yol açabilir."
polish = "Głośność muzyki i gry jest mnożona przez główną, więc samo podniesienie głównej może przesterować dźwięk."

[[message]]
key = "Lists and activates custom audio packs that replace game sounds."
[message.translations]
simplified_chinese = "列出并启用用于替换游戏音效的自定义音频包。"
traditional_chinese = "列出並啟用可替換遊戲音效的自訂音效包。"
japanese = "ゲーム内の効果音を置き換えるカスタムオーディオパックを一覧表示し、有効化します。"
korean = "게임 소리를 대체하는 사용자 지정 오디오 팩을 목록으로 보여 주고 활성화합니다."
russian = "Перечисляет пользовательские аудиопакеты, заменяющие звуки игры, и включает их."
german = "Listet eigene Audio-Pakete auf und aktiviert sie; sie ersetzen die Spielgeräusche."
spanish = "Enumera y activa paquetes de audio personalizados que sustituyen los sonidos del juego."
french = "Liste et active les packs audio personnalisés qui remplacent les sons du jeu."
brazilian_portuguese = "Lista e ativa pacotes de áudio personalizados que substituem os sons do jogo."
portuguese = "Lista e ativa pacotes de áudio personalizados que substituem os sons do jogo."
turkish = "Oyun seslerinin yerini alan özel ses paketlerini listeler ve etkinleştirir."
polish = "Wyświetla i aktywuje własne paczki dźwięków zastępujące dźwięki gry."

[[message]]
key = "Pick a pack to activate it; samples are reloaded when the selection changes."
[message.translations]
simplified_chinese = "选中音频包即启用；切换音频包时会重新加载声音采样。"
traditional_chinese = "選擇一個音效包即可啟用；切換選擇時會重新載入音訊樣本。"
japanese = "パックを選ぶと有効になります。選択を変えるとサンプルが読み込み直されます。"
korean = "팩을 고르면 활성화되며, 선택을 바꾸면 샘플이 다시 로드됩니다."
russian = "Выберите пакет, чтобы включить его; при смене выбора сэмплы загружаются заново."
german = "Wähle ein Paket, um es zu aktivieren; bei geänderter Auswahl werden die Samples neu geladen."
spanish = "Elige un paquete para activarlo; las muestras se recargan al cambiar la selección."
french = "Choisis un pack pour l'activer ; les sons sont rechargés quand la sélection change."
brazilian_portuguese = "Escolha um pacote para ativá-lo; as amostras recarregam quando a seleção muda."
portuguese = "Escolhe um pacote para o ativar; as amostras são recarregadas quando a seleção muda."
turkish = "Etkinleştirmek için bir paket seçin; seçim değiştiğinde örnekler yeniden yüklenir."
polish = "Wybierz paczkę, aby ją aktywować; próbki są przeładowywane po zmianie wyboru."

[[message]]
key = "A pack missing files falls back to the default sounds."
[message.translations]
simplified_chinese = "音频包缺少文件时会回退到默认音效。"
traditional_chinese = "音效包缺少檔案時，會退回預設音效。"
japanese = "ファイルが足りないパックでは、既定の効果音が使われます。"
korean = "파일이 빠진 팩은 기본 소리로 대체됩니다."
russian = "Если в пакете не хватает файлов, используются звуки по умолчанию."
german = "Fehlen einem Paket Dateien, greifen die Standardklänge."
spanish = "Si a un paquete le faltan archivos, se usan los sonidos predeterminados."
french = "Un pack auquel il manque des fichiers revient aux sons par défaut."
brazilian_portuguese = "Um pacote com arquivos faltando recorre aos sons padrão."
portuguese = "Um pacote com ficheiros em falta recorre aos sons predefinidos."
turkish = "Dosyaları eksik bir paket varsayılan seslere geri döner."
polish = "Paczka z brakującymi plikami wraca do domyślnych dźwięków."

[[message]]
key = "Controls demo recording and playback behavior."
[message.translations]
simplified_chinese = "控制 demo 的录制与回放行为。"
traditional_chinese = "控制回放錄製與播放的行為。"
japanese = "デモの録画と再生の動作を制御します。"
korean = "데모 녹화와 재생 동작을 제어합니다."
russian = "Управляет записью и воспроизведением демо."
german = "Steuert Aufnahme und Wiedergabe von Demos."
spanish = "Controla el comportamiento de grabación y reproducción de las demos."
french = "Contrôle l'enregistrement et la lecture des démos."
brazilian_portuguese = "Controla o comportamento de gravação e reprodução de demos."
portuguese = "Controla o comportamento de gravação e reprodução de demos."
turkish = "Demo kaydı ve oynatma davranışını denetler."
polish = "Steruje nagrywaniem i odtwarzaniem dem."

[[message]]
key = "Choose when recording starts and how demos are named; playback speed and camera follow are separate."
[message.translations]
simplified_chinese = "设置录制何时开始以及 demo 的命名方式；回放速度和镜头跟随另行设置。"
traditional_chinese = "選擇錄製何時開始以及回放的命名方式；播放速度與鏡頭跟隨是另外的設定。"
japanese = "録画を始めるタイミングとデモの命名方法を選びます。再生速度とカメラ追従は別項目です。"
korean = "녹화 시작 시점과 데모 이름을 붙이는 방식을 고릅니다. 재생 속도와 카메라 추적은 따로 설정합니다."
russian = "Выберите, когда начинается запись и как называются демо; скорость воспроизведения и слежение камеры настраиваются отдельно."
german = "Lege fest, wann die Aufnahme startet und wie Demos benannt werden; Wiedergabegeschwindigkeit und Kameraverfolgung sind separat."
spanish = "Elige cuándo empieza la grabación y cómo se nombran las demos; la velocidad de reproducción y el seguimiento de cámara van aparte."
french = "Choisis quand l'enregistrement démarre et le nom des démos ; la vitesse de lecture et le suivi de caméra sont réglés ailleurs."
brazilian_portuguese = "Escolha quando a gravação começa e como as demos são nomeadas; velocidade de reprodução e câmera automática são opções à parte."
portuguese = "Escolhe quando a gravação começa e como as demos são nomeadas; a velocidade de reprodução e o seguimento da câmara são opções à parte."
turkish = "Kaydın ne zaman başlayacağını ve demoların nasıl adlandırılacağını seçin; oynatma hızı ve kamera takibi ayrıdır."
polish = "Wybierz, kiedy zaczyna się nagrywanie i jak nazywane są dema; prędkość odtwarzania i podążanie kamery ustawia się osobno."

[[message]]
key = "Demos store raw network data, so long sessions produce large files."
[message.translations]
simplified_chinese = "demo 保存的是原始网络数据，因此长时间的对局会生成很大的文件。"
traditional_chinese = "回放會儲存原始網路資料，因此長時間的遊戲過程會產生很大的檔案。"
japanese = "デモは生のネットワークデータを保存するため、長時間のプレイではファイルが大きくなります。"
korean = "데모는 원시 네트워크 데이터를 저장하므로 오래 플레이하면 파일이 커집니다."
russian = "Демо хранят необработанные сетевые данные, поэтому долгие сессии дают большие файлы."
german = "Demos speichern Rohdaten des Netzwerks, lange Sitzungen ergeben daher große Dateien."
spanish = "Las demos guardan datos de red sin procesar, así que las sesiones largas generan archivos grandes."
french = "Les démos stockent les données réseau brutes : une longue session produit des fichiers volumineux."
brazilian_portuguese = "As demos guardam os dados brutos da rede, então sessões longas geram arquivos grandes."
portuguese = "As demos guardam dados de rede em bruto, por isso sessões longas geram ficheiros grandes."
turkish = "Demolar ham ağ verisi saklar, bu yüzden uzun oturumlar büyük dosyalar üretir."
polish = "Dema zapisują surowe dane sieciowe, więc długie sesje dają duże pliki."

[[message]]
key = "Toggles DDNet gameplay indicators and assists such as race time, team markers and hints."
[message.translations]
simplified_chinese = "开关 DDNet 的玩法指示与辅助功能，例如竞速时间、队友标记和提示。"
traditional_chinese = "開關 DDNet 的遊戲指示與輔助，例如跑圖計時、隊友標記與操作提示。"
japanese = "レースタイム、チームマーカー、ヒントなど、DDNet のゲーム内表示と補助を切り替えます。"
korean = "레이스 시간, 팀 표시, 힌트 같은 DDNet 게임 표시와 보조 기능을 켜고 끕니다."
russian = "Включает и выключает игровые индикаторы и помощники DDNet: время гонки, метки команды и подсказки."
german = "Schaltet DDNet-Spielanzeigen und Hilfen wie Rennzeit, Team-Markierungen und Hinweise ein oder aus."
spanish = "Activa o desactiva indicadores y ayudas de DDNet, como el tiempo de carrera, las marcas de equipo y las pistas."
french = "Active les indicateurs et aides de jeu DDNet comme le temps de course, les marqueurs d'équipe et les astuces."
brazilian_portuguese = "Liga e desliga indicadores e auxílios de jogo do DDNet, como tempo de corrida, marcadores de equipe e dicas."
portuguese = "Ativa ou desativa indicadores e auxílios de jogo do DDNet, como tempo de corrida, marcadores de equipa e dicas."
turkish = "Yarış süresi, takım işaretleri ve ipuçları gibi DDNet oyun göstergelerini ve yardımcılarını açar ya da kapatır."
polish = "Włącza wskaźniki i asysty rozgrywki DDNet, takie jak czas wyścigu, znaczniki drużyny i podpowiedzi."

[[message]]
key = "Enable the indicators you need; each one draws on your own screen only."
[message.translations]
simplified_chinese = "启用你需要的指示；每一项只绘制在你自己的屏幕上。"
traditional_chinese = "只啟用你需要的指示；每一個都只畫在你自己的畫面上。"
japanese = "必要な表示だけを有効にしてください。どれも自分の画面にしか描画されません。"
korean = "필요한 표시만 켜세요. 각 표시는 본인 화면에만 그려집니다."
russian = "Включите нужные индикаторы; каждый из них рисуется только на вашем экране."
german = "Aktiviere nur die Anzeigen, die du brauchst; jede erscheint nur auf deinem Bildschirm."
spanish = "Activa los indicadores que necesites; cada uno se dibuja solo en tu pantalla."
french = "Active les indicateurs dont tu as besoin ; chacun ne s'affiche que pour toi."
brazilian_portuguese = "Ative os indicadores que você precisa; cada um é desenhado só na sua tela."
portuguese = "Ativa os indicadores de que precisas; cada um é desenhado apenas no teu ecrã."
turkish = "İhtiyacınız olan göstergeleri etkinleştirin; her biri yalnızca kendi ekranınızda çizilir."
polish = "Włącz potrzebne wskaźniki; każdy rysuje tylko na twoim ekranie."

[[message]]
key = "Indicators that read game state can lag behind the server; do not rely on them for frame-perfect input."
[message.translations]
simplified_chinese = "读取游戏状态的指示可能比服务器滞后；不要依赖它们做逐帧精确的输入。"
traditional_chinese = "讀取遊戲狀態的指示可能落後於伺服器；需要精確到幀的輸入時，別依賴它們。"
japanese = "ゲームの状態を読む表示はサーバーより遅れることがあります。フレーム単位の精密な入力には頼らないでください。"
korean = "게임 상태를 읽는 표시는 서버보다 늦을 수 있으니, 프레임 단위의 정확한 입력을 이것에 기대지 마세요."
russian = "Индикаторы, читающие состояние игры, могут отставать от сервера; не полагайтесь на них для ввода с точностью до кадра."
german = "Anzeigen, die den Spielzustand auslesen, können dem Server hinterherhinken; verlass dich bei framegenauner Eingabe nicht darauf."
spanish = "Los indicadores que leen el estado del juego pueden ir por detrás del servidor; no confíes en ellos para entradas al fotograma exacto."
french = "Les indicateurs qui lisent l'état du jeu peuvent accuser un retard sur le serveur ; ne t'appuie pas dessus pour une entrée à l'image près."
brazilian_portuguese = "Indicadores que leem o estado do jogo podem atrasar em relação ao servidor; não confie neles para entradas que exigem precisão de quadro."
portuguese = "Os indicadores que leem o estado do jogo podem atrasar-se em relação ao servidor; não confies neles para entradas com precisão de frame."
turkish = "Oyun durumunu okuyan göstergeler sunucunun gerisinde kalabilir; kare hassasiyetli girdi için bunlara güvenmeyin."
polish = "Wskaźniki odczytujące stan gry mogą odstawać od serwera; nie opieraj na nich wejścia co do klatki."

[[message]]
key = "Chooses the menu background map and the colors drawn behind the UI."
[message.translations]
simplified_chinese = "选择菜单背景地图，以及绘制在界面后方的颜色。"
traditional_chinese = "選擇選單背景地圖，以及繪製在介面後方的顏色。"
japanese = "メニューの背景マップと、UI の背後に描画する色を選びます。"
korean = "메뉴 배경 맵과 UI 뒤에 그려지는 색을 고릅니다."
russian = "Выбирает карту фона меню и цвета, которые рисуются за интерфейсом."
german = "Wählt die Hintergrundkarte des Menüs und die Farben hinter der UI."
spanish = "Elige el mapa de fondo del menú y los colores que se dibujan tras la interfaz."
french = "Choisit la carte de fond du menu et les couleurs dessinées derrière l'interface."
brazilian_portuguese = "Escolhe o mapa de fundo do menu e as cores desenhadas atrás da interface."
portuguese = "Escolhe o mapa de fundo do menu e as cores desenhadas atrás da UI."
turkish = "Menü arka plan haritasını ve arayüzün arkasına çizilen renkleri seçer."
polish = "Wybiera mapę tła menu i kolory rysowane za interfejsem."

[[message]]
key = "Pick a map or a solid color, then adjust brightness and blur."
[message.translations]
simplified_chinese = "选择一张地图或一种纯色，再调整亮度和模糊。"
traditional_chinese = "選擇地圖或單一顏色，然後調整亮度與模糊。"
japanese = "マップか単色を選び、明るさとぼかしを調整します。"
korean = "맵이나 단색을 고른 뒤 밝기와 흐림을 조절합니다."
russian = "Выберите карту или сплошной цвет, затем настройте яркость и размытие."
german = "Wähle eine Karte oder eine Volltonfarbe und stelle dann Helligkeit und Weichzeichnen ein."
spanish = "Elige un mapa o un color sólido y luego ajusta el brillo y el desenfoque."
french = "Choisis une carte ou une couleur unie, puis règle la luminosité et le flou."
brazilian_portuguese = "Escolha um mapa ou uma cor sólida e depois ajuste o brilho e o desfoque."
portuguese = "Escolhe um mapa ou uma cor sólida e ajusta a luminosidade e o desfoque."
turkish = "Bir harita veya düz bir renk seçin, ardından parlaklığı ve bulanıklığı ayarlayın."
polish = "Wybierz mapę lub jednolity kolor, a potem dostosuj jasność i rozmycie."

[[message]]
key = "Bright backgrounds reduce text contrast; keep the overlay dark enough."
[message.translations]
simplified_chinese = "背景过亮会降低文字对比度；请让遮罩保持足够暗。"
traditional_chinese = "過亮的背景會降低文字對比度；請讓遮罩保持足夠暗。"
japanese = "明るい背景は文字のコントラストを下げます。オーバーレイは十分に暗く保ってください。"
korean = "밝은 배경은 글자 대비를 떨어뜨리니, 오버레이는 충분히 어둡게 유지하세요."
russian = "Светлый фон снижает контраст текста; держите затемнение достаточно тёмным."
german = "Helle Hintergründe mindern den Textkontrast; halte die Überlagerung dunkel genug."
spanish = "Los fondos claros reducen el contraste del texto; mantén la capa lo bastante oscura."
french = "Un fond clair réduit le contraste du texte ; garde l'overlay assez sombre."
brazilian_portuguese = "Fundos claros reduzem o contraste do texto; mantenha a sobreposição escura o suficiente."
portuguese = "Fundos claros reduzem o contraste do texto; mantém a sobreposição suficientemente escura."
turkish = "Parlak arka planlar metin kontrastını düşürür; katmanı yeterince koyu tutun."
polish = "Jasne tła zmniejszają kontrast tekstu; utrzymuj nakładkę dostatecznie ciemną."

[[message]]
key = "Collects the remaining DDNet client preferences that do not belong to other cards."
[message.translations]
simplified_chinese = "汇总剩下的、不属于其他卡片的 DDNet 客户端偏好设置。"
traditional_chinese = "收納其餘不屬於其他卡片的 DDNet 用戶端偏好設定。"
japanese = "ほかのカードに属さない DDNet クライアントの設定をまとめています。"
korean = "다른 카드에 속하지 않는 나머지 DDNet 클라이언트 설정을 모아 둡니다."
russian = "Собирает оставшиеся настройки клиента DDNet, не относящиеся к другим карточкам."
german = "Sammelt die übrigen DDNet-Client-Einstellungen, die zu keiner anderen Karte gehören."
spanish = "Reúne las preferencias del cliente DDNet que no encajan en otras tarjetas."
french = "Regroupe les autres préférences du client DDNet qui ne relèvent d'aucune autre carte."
brazilian_portuguese = "Reúne as demais preferências do cliente DDNet que não pertencem a outros cartões."
portuguese = "Reúne as restantes preferências do cliente DDNet que não pertencem a outros cartões."
turkish = "Diğer kartlara ait olmayan kalan DDNet istemci tercihlerini toplar."
polish = "Zbiera pozostałe ustawienia klienta DDNet, które nie należą do innych kart."

[[message]]
key = "Review the entries and change only what you understand; defaults are tuned for normal play."
[message.translations]
simplified_chinese = "先浏览各项，只修改你理解的内容；默认值已按正常游玩调校。"
traditional_chinese = "先看清楚每一項，只改你理解的部分；預設值已針對正常遊玩調校過。"
japanese = "各項目を確認し、理解できたものだけを変更してください。既定値は通常のプレイ向けに調整されています。"
korean = "항목을 살펴보고 이해한 것만 바꾸세요. 기본값은 일반적인 플레이에 맞춰져 있습니다."
russian = "Проверьте записи и меняйте только то, что понимаете; значения по умолчанию рассчитаны на обычную игру."
german = "Sieh dir die Einträge an und ändere nur, was du verstehst; die Standardwerte sind auf normales Spiel abgestimmt."
spanish = "Revisa las entradas y cambia solo lo que entiendas; los valores predeterminados están pensados para el juego normal."
french = "Parcours les entrées et ne change que ce que tu comprends ; les valeurs par défaut sont réglées pour un jeu normal."
brazilian_portuguese = "Revise as opções e mude só o que você entende; os padrões são ajustados para o jogo normal."
portuguese = "Revê as entradas e muda apenas o que compreendes; os valores predefinidos estão afinados para jogo normal."
turkish = "Girdileri gözden geçirin ve yalnızca anladığınızı değiştirin; varsayılanlar normal oyun için ayarlanmıştır."
polish = "Przejrzyj pozycje i zmieniaj tylko to, co rozumiesz; wartości domyślne są dobrane do normalnej gry."

[[message]]
key = "Options here affect networking or identity; test on a server before using them in matches."
[message.translations]
simplified_chinese = "这里的选项会影响网络或身份；在对局中使用前请先在服务器上测试。"
traditional_chinese = "這裡的選項會影響網路或身分識別；在比賽中使用前，先到伺服器上測試。"
japanese = "ここでの設定は通信や識別情報に影響します。試合で使う前にサーバーで試してください。"
korean = "여기 설정은 네트워크나 신원에 영향을 줍니다. 경기에서 쓰기 전에 서버에서 시험해 보세요."
russian = "Настройки здесь влияют на сеть или идентичность; проверьте их на сервере, прежде чем использовать в матчах."
german = "Die Optionen hier betreffen Netzwerk oder Identität; teste sie auf einem Server, bevor du sie im Match nutzt."
spanish = "Las opciones de aquí afectan a la red o a la identidad; pruébalas en un servidor antes de usarlas en partidas."
french = "Ces options touchent au réseau ou à ton identité ; teste-les sur un serveur avant de les utiliser en match."
brazilian_portuguese = "As opções aqui afetam rede ou identidade; teste em um servidor antes de usar em partidas."
portuguese = "Estas opções afetam a rede ou a identidade; testa num servidor antes de as usares em partidas."
turkish = "Buradaki seçenekler ağı veya kimliği etkiler; maçlarda kullanmadan önce bir sunucuda test edin."
polish = "Opcje tutaj wpływają na sieć lub tożsamość; przetestuj je na serwerze, zanim użyjesz ich w meczach."

[[message]]
key = "Configures the main HUD: health, ammo, timer, race progress and their positions."
[message.translations]
simplified_chinese = "配置主 HUD：生命值、弹药、计时器、竞速进度及其位置。"
traditional_chinese = "設定主 HUD：生命值、彈藥、計時器、跑圖進度及其位置。"
japanese = "メイン HUD を設定します。体力、弾薬、タイマー、レースの進行状況とそれぞれの位置です。"
korean = "기본 HUD를 설정합니다. 체력, 탄약, 타이머, 레이스 진행 상황과 각 요소의 위치입니다."
russian = "Настраивает основной HUD: здоровье, патроны, таймер, прогресс гонки и их положение."
german = "Konfiguriert das Haupt-HUD: Leben, Munition, Timer, Rennfortschritt und deren Positionen."
spanish = "Configura el HUD principal: salud, munición, temporizador, progreso de carrera y sus posiciones."
french = "Configure le HUD principal : vie, munitions, chronomètre, progression de course et leurs positions."
brazilian_portuguese = "Configura o HUD principal: vida, munição, cronômetro, progresso da corrida e suas posições."
portuguese = "Configura o HUD principal: vida, munições, temporizador, progresso da corrida e as respetivas posições."
turkish = "Ana HUD'u yapılandırır: can, mermi, süre, yarış ilerlemesi ve bunların konumları."
polish = "Konfiguruje główny HUD: zdrowie, amunicję, timer, postęp wyścigu i ich pozycje."

[[message]]
key = "Enable each element, then set its position and size; the HUD draws on top of the game world."
[message.translations]
simplified_chinese = "逐个启用元素，再设置它们的位置和大小；HUD 绘制在游戏世界之上。"
traditional_chinese = "逐一啟用元素，再設定它的位置與大小；HUD 會畫在遊戲世界之上。"
japanese = "各要素を有効にしてから位置と大きさを設定します。HUD はゲームの世界の上に描画されます。"
korean = "각 요소를 켠 다음 위치와 크기를 정하세요. HUD는 게임 화면 위에 그려집니다."
russian = "Включите каждый нужный элемент, затем задайте его положение и размер; HUD рисуется поверх игрового мира."
german = "Aktiviere jedes Element und lege Position und Größe fest; das HUD liegt über der Spielwelt."
spanish = "Activa cada elemento y ajusta su posición y tamaño; el HUD se dibuja sobre el mundo del juego."
french = "Active chaque élément, puis règle sa position et sa taille ; le HUD s'affiche par-dessus le monde du jeu."
brazilian_portuguese = "Ative cada elemento e defina posição e tamanho; o HUD é desenhado sobre o mundo do jogo."
portuguese = "Ativa cada elemento e define a sua posição e tamanho; o HUD é desenhado por cima do mundo do jogo."
turkish = "Her öğeyi etkinleştirin, ardından konumunu ve boyutunu ayarlayın; HUD oyun dünyasının üstüne çizilir."
polish = "Włącz każdy element, a potem ustaw jego pozycję i rozmiar; HUD jest rysowany nad światem gry."

[[message]]
key = "Elements too close to the edges overlap on ultrawide screens."
[message.translations]
simplified_chinese = "在超宽屏上，太靠近屏幕边缘的元素会互相重叠。"
traditional_chinese = "在超寬螢幕上，太靠近邊緣的元素會互相重疊。"
japanese = "ウルトラワイド画面では、端に寄りすぎた要素が重なります。"
korean = "울트라와이드 화면에서는 가장자리에 너무 가까운 요소가 겹칩니다."
russian = "Элементы, стоящие слишком близко к краям, на ультрашироких экранах перекрываются."
german = "Elemente zu nah am Rand überlappen sich auf Ultrawide-Bildschirmen."
spanish = "Los elementos demasiado cerca de los bordes se solapan en pantallas ultrapanorámicas."
french = "Des éléments trop près des bords se chevauchent sur les écrans ultra-larges."
brazilian_portuguese = "Elementos muito perto das bordas se sobrepõem em telas ultrawide."
portuguese = "Em ecrãs ultrawide, elementos demasiado próximos das margens sobrepõem-se."
turkish = "Kenarlara çok yakın öğeler ultra geniş ekranlarda üst üste biner."
polish = "Elementy zbyt blisko krawędzi nachodzą na siebie na ekranach ultrapanoramicznych."

[[message]]
key = "Adjusts DDRace-specific HUD parts such as team state, freeze bars and race time."
[message.translations]
simplified_chinese = "调整 DDRace 专用的 HUD 部分，例如队伍状态、冻结条和竞速时间。"
traditional_chinese = "調整 DDRace 專屬的 HUD 部分，例如隊伍狀態、凍結條與跑圖計時。"
japanese = "チーム状態、フリーズバー、レースタイムなど、DDRace 固有の HUD 部分を調整します。"
korean = "팀 상태, 프리즈 바, 레이스 시간처럼 DDRace 전용 HUD 부분을 조절합니다."
russian = "Настраивает специфичные для DDRace части HUD: состояние команды, полосы заморозки и время гонки."
german = "Passt DDRace-spezifische HUD-Teile an, etwa Teamstatus, Freeze-Balken und Rennzeit."
spanish = "Ajusta partes del HUD propias de DDRace, como el estado del equipo, las barras de congelación y el tiempo de carrera."
french = "Ajuste les parties du HUD propres à DDRace : état d'équipe, barres de freeze et temps de course."
brazilian_portuguese = "Ajusta partes do HUD específicas do DDRace, como estado da equipe, barras de congelamento e tempo de corrida."
portuguese = "Ajusta partes do HUD específicas do DDRace, como estado da equipa, barras de congelamento e tempo de corrida."
turkish = "Takım durumu, donma çubukları ve yarış süresi gibi DDRace'e özgü HUD parçalarını ayarlar."
polish = "Dostosowuje elementy HUD specyficzne dla DDRace, takie jak stan drużyny, paski zamrożenia i czas wyścigu."

[[message]]
key = "Enable the DDRace elements you use and set their scale."
[message.translations]
simplified_chinese = "启用你用到的 DDRace 元素，并设置它们的缩放比例。"
traditional_chinese = "啟用你會用到的 DDRace 元素，並設定它們的縮放比例。"
japanese = "使う DDRace 要素を有効にし、その拡大率を設定します。"
korean = "사용하는 DDRace 요소를 켜고 크기 배율을 설정합니다."
russian = "Включите нужные элементы DDRace и задайте их масштаб."
german = "Aktiviere die DDRace-Elemente, die du nutzt, und stelle ihre Skalierung ein."
spanish = "Activa los elementos de DDRace que uses y ajusta su escala."
french = "Active les éléments DDRace que tu utilises et règle leur échelle."
brazilian_portuguese = "Ative os elementos de DDRace que você usa e defina a escala deles."
portuguese = "Ativa os elementos DDRace que usas e define a respetiva escala."
turkish = "Kullandığınız DDRace öğelerini etkinleştirin ve ölçeklerini ayarlayın."
polish = "Włącz używane elementy DDRace i ustaw ich skalę."

[[message]]
key = "DDRace HUD is driven by server messages, so it stays empty on servers without DDRace."
[message.translations]
simplified_chinese = "DDRace HUD 由服务器消息驱动，因此在没有 DDRace 的服务器上会一直空白。"
traditional_chinese = "DDRace HUD 由伺服器訊息驅動，所以在沒有 DDRace 的伺服器上會一直空白。"
japanese = "DDRace HUD はサーバーのメッセージで動くため、DDRace のないサーバーでは空のままです。"
korean = "DDRace HUD는 서버 메시지로 동작하므로 DDRace가 없는 서버에서는 비어 있습니다."
russian = "HUD DDRace управляется сообщениями сервера, поэтому на серверах без DDRace он остаётся пустым."
german = "Das DDRace-HUD wird von Servermeldungen gesteuert und bleibt auf Servern ohne DDRace leer."
spanish = "El HUD de DDRace depende de los mensajes del servidor, así que queda vacío en servidores sin DDRace."
french = "Le HUD DDRace dépend des messages du serveur : il reste vide sur les serveurs sans DDRace."
brazilian_portuguese = "O HUD de DDRace é guiado por mensagens do servidor, então fica vazio em servidores sem DDRace."
portuguese = "O HUD do DDRace é alimentado por mensagens do servidor, por isso fica vazio em servidores sem DDRace."
turkish = "DDRace HUD'u sunucu mesajlarıyla çalışır, bu yüzden DDRace olmayan sunucularda boş kalır."
polish = "HUD DDRace działa na komunikatach serwera, więc na serwerach bez DDRace pozostaje pusty."

[[message]]
key = "Sets chat position, width, font size and visibility."
[message.translations]
simplified_chinese = "设置聊天的位置、宽度、字号和显示状态。"
traditional_chinese = "設定聊天的位置、寬度、字型大小與顯示狀態。"
japanese = "チャットの位置、幅、文字サイズ、表示/非表示を設定します。"
korean = "채팅의 위치, 너비, 글꼴 크기, 표시 여부를 설정합니다."
russian = "Задаёт положение чата, ширину, размер шрифта и видимость."
german = "Legt Position, Breite, Schriftgröße und Sichtbarkeit des Chats fest."
spanish = "Define la posición, el ancho, el tamaño de fuente y la visibilidad del chat."
french = "Définit la position, la largeur, la taille de police et la visibilité du chat."
brazilian_portuguese = "Define posição, largura, tamanho da fonte e visibilidade do chat."
portuguese = "Define a posição, a largura, o tamanho da fonte e a visibilidade do chat."
turkish = "Sohbet konumunu, genişliğini, yazı tipi boyutunu ve görünürlüğünü ayarlar."
polish = "Ustawia pozycję, szerokość, rozmiar czcionki i widoczność czatu."

[[message]]
key = "Choose a position, then adjust width and size; the preview card shows the result."
[message.translations]
simplified_chinese = "先选择位置，再调整宽度和尺寸；预览卡片会显示效果。"
traditional_chinese = "先選一個位置，再調整寬度與大小；預覽卡片會顯示結果。"
japanese = "位置を選んでから幅とサイズを調整します。プレビューカードに結果が表示されます。"
korean = "위치를 고른 뒤 너비와 크기를 조정하세요. 미리보기 카드에 결과가 표시됩니다."
russian = "Выберите положение, затем настройте ширину и размер; карточка предпросмотра покажет результат."
german = "Wähle eine Position und stelle Breite und Größe ein; die Vorschaukarte zeigt das Ergebnis."
spanish = "Elige una posición y ajusta el ancho y el tamaño; la tarjeta de vista previa muestra el resultado."
french = "Choisis une position, puis règle la largeur et la taille ; la carte d'aperçu montre le résultat."
brazilian_portuguese = "Escolha uma posição e ajuste largura e tamanho; o cartão de prévia mostra o resultado."
portuguese = "Escolhe uma posição e ajusta a largura e o tamanho; o cartão de pré-visualização mostra o resultado."
turkish = "Bir konum seçin, ardından genişliği ve boyutu ayarlayın; önizleme kartı sonucu gösterir."
polish = "Wybierz pozycję, a potem dostosuj szerokość i rozmiar; karta podglądu pokazuje wynik."

[[message]]
key = "Wide chat lines cover the game; keep the width to what you actually read."
[message.translations]
simplified_chinese = "聊天行过宽会遮挡游戏画面；宽度以实际阅读需要为准。"
traditional_chinese = "聊天行太寬會遮住遊戲畫面；寬度保持在實際會閱讀的範圍即可。"
japanese = "チャット行が広いとゲーム画面を覆うので、実際に読む幅にとどめてください。"
korean = "채팅 줄이 넓으면 게임 화면을 가리므로 실제로 읽는 폭만 유지하세요."
russian = "Широкие строки чата закрывают игру; держите ширину в пределах того, что реально читаете."
german = "Breite Chatzeilen verdecken das Spiel; begrenze die Breite auf das, was du wirklich liest."
spanish = "Las líneas de chat anchas tapan el juego; limita el ancho a lo que realmente leas."
french = "Des lignes de chat larges couvrent le jeu ; garde une largeur adaptée à ce que tu lis vraiment."
brazilian_portuguese = "Linhas de chat muito largas cobrem o jogo; ajuste a largura ao que você realmente lê."
portuguese = "Linhas de chat largas tapam o jogo; limita a largura ao que lês de facto."
turkish = "Geniş sohbet satırları oyunu kaplar; genişliği gerçekten okuduğunuz düzeyde tutun."
polish = "Szerokie wiersze czatu zasłaniają grę; ustaw szerokość pod to, co naprawdę czytasz."

[[message]]
key = "Styles chat names and message colors, including gradients."
[message.translations]
simplified_chinese = "设置聊天中的名字和消息颜色样式，支持渐变效果。"
traditional_chinese = "設定聊天名稱與訊息顏色，包含漸層。"
japanese = "チャットの名前とメッセージの色を、グラデーションも含めて設定します。"
korean = "그라데이션을 포함해 채팅 이름과 메시지 색상을 꾸밉니다."
russian = "Задаёт стиль имён в чате и цвета сообщений, включая градиенты."
german = "Gestaltet Chatnamen und Nachrichtenfarben, auch als Verlauf."
spanish = "Personaliza los nombres del chat y los colores de los mensajes, incluidos los degradados."
french = "Style les noms et les couleurs des messages du chat, dégradés compris."
brazilian_portuguese = "Define o estilo dos nomes e as cores das mensagens do chat, incluindo degradês."
portuguese = "Define o estilo dos nomes e as cores das mensagens do chat, incluindo gradientes."
turkish = "Sohbet adlarını ve mesaj renklerini, renk geçişleri dahil, biçimlendirir."
polish = "Stylizuje kolory nazw i wiadomości czatu, łącznie z gradientami."

[[message]]
key = "Pick the parts to colorize, then choose a gradient mode and colors."
[message.translations]
simplified_chinese = "勾选需要上色的部分，再选择渐变模式和颜色。"
traditional_chinese = "先選要上色的部分，再設定漸層模式與顏色。"
japanese = "色を付ける部分を選び、グラデーションモードと色を選びます。"
korean = "색을 입힐 부분을 고른 뒤 그라데이션 모드와 색상을 선택하세요."
russian = "Выберите части для раскраски, затем режим градиента и цвета."
german = "Wähle die Teile zum Einfärben und dann Verlaufsmodus und Farben."
spanish = "Elige qué partes colorear y luego un modo de degradado y sus colores."
french = "Choisis les parties à colorer, puis un mode de dégradé et les couleurs."
brazilian_portuguese = "Escolha quais partes colorir e depois o modo de degradê e as cores."
portuguese = "Escolhe as partes a colorir e depois o modo de gradiente e as cores."
turkish = "Renklendirilecek kısımları seçin, ardından bir renk geçişi modu ve renkleri seçin."
polish = "Wybierz elementy do pokolorowania, a potem tryb gradientu i kolory."

[[message]]
key = "Low contrast between name and message text makes chat hard to scan in fights."
[message.translations]
simplified_chinese = "名字与消息文本对比度过低时，对局中很难快速看清聊天内容。"
traditional_chinese = "名稱與訊息文字對比太低時，混戰中很難快速看清聊天內容。"
japanese = "名前とメッセージの文字のコントラストが低いと、乱戦中にチャットを読み取るのが難しくなります。"
korean = "이름과 메시지 텍스트의 대비가 낮으면 난전 중에 채팅을 빠르게 훑기 어렵습니다."
russian = "Низкий контраст между именем и текстом сообщения мешает читать чат в бою."
german = "Geringer Kontrast zwischen Name und Nachrichtentext macht den Chat im Gefecht schwer lesbar."
spanish = "Un contraste bajo entre el nombre y el texto del mensaje hace que cueste leer el chat en pleno combate."
french = "Un faible contraste entre le nom et le message rend le chat difficile à lire en pleine action."
brazilian_portuguese = "Pouco contraste entre nome e texto da mensagem deixa o chat difícil de ler em meio à luta."
portuguese = "Um contraste baixo entre o nome e o texto da mensagem torna o chat difícil de ler em combate."
turkish = "Ad ile mesaj metni arasındaki düşük kontrast, sohbeti çatışmalarda okumayı zorlaştırır."
polish = "Niski kontrast między nazwą a tekstem wiadomości utrudnia czytanie czatu w walce."

[[message]]
key = "Renders a live preview of the current chat appearance."
[message.translations]
simplified_chinese = "实时预览当前聊天的外观效果。"
traditional_chinese = "即時預覽目前的聊天外觀。"
japanese = "現在のチャットの見た目をリアルタイムでプレビューします。"
korean = "현재 채팅 모양을 실시간으로 미리 보여 줍니다."
russian = "Показывает живой предпросмотр текущего вида чата."
german = "Zeigt eine Live-Vorschau des aktuellen Chat-Aussehens."
spanish = "Muestra una vista previa en vivo del aspecto actual del chat."
french = "Affiche un aperçu en direct de l'apparence actuelle du chat."
brazilian_portuguese = "Exibe uma prévia ao vivo da aparência atual do chat."
portuguese = "Mostra uma pré-visualização em direto do aspeto atual do chat."
turkish = "Geçerli sohbet görünümünün canlı önizlemesini çizer."
polish = "Renderuje podgląd na żywo bieżącego wyglądu czatu."

[[message]]
key = "Change values in the chat cards and watch this preview update."
[message.translations]
simplified_chinese = "在聊天设置卡片中修改数值，此处的预览会同步更新。"
traditional_chinese = "在聊天卡片中變更數值，觀察這個預覽隨之更新。"
japanese = "チャットのカードで値を変えると、このプレビューが更新されます。"
korean = "채팅 카드에서 값을 바꾸면 이 미리보기가 갱신됩니다."
russian = "Измените значения в карточках чата — предпросмотр обновится сразу."
german = "Ändere Werte in den Chat-Karten und beobachte, wie sich diese Vorschau aktualisiert."
spanish = "Cambia valores en las tarjetas de chat y observa cómo se actualiza esta vista previa."
french = "Modifie les valeurs dans les cartes du chat et regarde l'aperçu se mettre à jour."
brazilian_portuguese = "Mude os valores nos cartões do chat e veja a prévia se atualizar."
portuguese = "Muda valores nos cartões do chat e vê esta pré-visualização a atualizar-se."
turkish = "Sohbet kartlarındaki değerleri değiştirin ve bu önizlemenin güncellenmesini izleyin."
polish = "Zmieniaj wartości na kartach czatu i obserwuj aktualizację tego podglądu."

[[message]]
key = "The preview uses your own name and colors; other players may look different."
[message.translations]
simplified_chinese = "预览使用你自己的名字和配色，其他玩家的显示可能不同。"
traditional_chinese = "預覽使用你自己的名稱與顏色；其他玩家的顯示可能不同。"
japanese = "プレビューは自分の名前と色を使うため、他のプレイヤーは違って見える場合があります。"
korean = "미리보기는 내 이름과 색상을 사용하므로 다른 플레이어는 다르게 보일 수 있습니다."
russian = "В предпросмотре используются ваши имя и цвета; у других игроков вид может отличаться."
german = "Die Vorschau nutzt deinen Namen und deine Farben; bei anderen Spielern kann es anders aussehen."
spanish = "La vista previa usa tu propio nombre y tus colores; otros jugadores pueden verse distintos."
french = "L'aperçu utilise ton nom et tes couleurs ; chez les autres joueurs, le rendu peut différer."
brazilian_portuguese = "A prévia usa o seu nome e as suas cores; os outros jogadores podem parecer diferentes."
portuguese = "A pré-visualização usa o teu nome e as tuas cores; os outros jogadores podem parecer diferentes."
turkish = "Önizleme kendi adınızı ve renklerinizi kullanır; diğer oyuncular farklı görünebilir."
polish = "Podgląd używa twojej nazwy i kolorów; u innych graczy może wyglądać inaczej."

[[message]]
key = "Previews player and dummy nameplates with the current settings."
[message.translations]
simplified_chinese = "按当前设置预览玩家和分身的名字牌。"
traditional_chinese = "以目前設定預覽玩家與 dummy 的名牌。"
japanese = "現在の設定でプレイヤーとダミーのネームプレートをプレビューします。"
korean = "현재 설정으로 플레이어와 더미의 이름표를 미리 보여 줍니다."
russian = "Показывает таблички с именами игрока и дамми при текущих настройках."
german = "Zeigt Namensschilder von Spieler und Dummy mit den aktuellen Einstellungen als Vorschau."
spanish = "Muestra una vista previa de las placas de nombre del jugador y del dummy con los ajustes actuales."
