korean = "나머지 모든 바인드로, 점수판, 관전, 콘솔, 스크린샷, 이모티콘, 연습 도구가 있습니다."
russian = "Все остальные привязки: таблица лидеров, наблюдение, консоль, снимки экрана, эмоции и инструменты тренировки."
german = "Alle übrigen Bindungen: Bestenliste, Zuschauen, Konsole, Screenshots, Emoticons und Übungswerkzeuge."
spanish = "El resto de binds: tabla de puntuaciones, espectador, consola, capturas, emoticonos y herramientas de práctica."
french = "Tous les autres binds : tableau des scores, spectateur, console, captures d'écran, emoticons et outils d'entraînement."
brazilian_portuguese = "Todos os outros binds: placar, modo espectador, console, capturas de tela, emoticons e ferramentas de treino."
portuguese = "Todos os outros binds: placar, modo de espetar, consola, capturas de ecrã, emoticons e ferramentas de treino."
turkish = "Geri kalan tüm bağlamalar: skor tablosu, izleme, konsol, ekran görüntüsü, ifade ve alıştırma araçları."
polish = "Wszystkie pozostałe wiązania: tablica wyników, obserwacja, konsola, zrzuty ekranu, emotikony i narzędzia treningowe."

[[message]]
key = "Click the key field next to an action such as \"Scoreboard\", \"Spectate mode\" or \"Pie menu\" and press the key you want."
[message.translations]
simplified_chinese = "点计分板、观战模式或饼菜单这类动作旁边的按键栏，按下想用的键。"
traditional_chinese = "點計分板、觀戰模式或餅菜單這類動作旁邊的按鍵欄，按下想用的鍵。"
japanese = "スコアボード、観戦モード、パイメニューなどの横にあるキー欄をクリックし、使いたいキーを押します。"
korean = "점수판, 관전 모드 또는 파이 메뉴 같은 동작 옆의 키 칸을 클릭하고 원하는 키를 누르세요."
russian = "Щёлкните поле клавиши рядом с действием вроде таблицы лидеров, режима наблюдения или кругового меню и нажмите нужную клавишу."
german = "Klicke das Tastenfeld neben einer Aktion wie Bestenliste, Zuschauermodus oder Kreis-Menü an und drücke die gewünschte Taste."
spanish = "Haz clic en el campo de tecla junto a una acción como Tabla de puntuaciones, Modo de espectador o Menú circular y pulsa la tecla que quieras."
french = "Clique sur le champ de touche à côté d'une action comme Tableau des scores, Mode spectateur ou Menu circulaire et appuie sur la touche voulue."
brazilian_portuguese = "Clique no campo de tecla ao lado de uma ação como Placar, Modo espectador ou Menu radial e pressione a tecla desejada."
portuguese = "Clica no campo da tecla ao lado de uma ação como Placar, Modo de espetar ou Menu circular e prime a tecla que queres."
turkish = "Skor tablosu, İzleme modu veya Pasta menüsü gibi bir eylemin yanındaki tuş alanına tıkla ve istediğin tuşa bas."
polish = "Kliknij pole klawisza obok akcji takiej jak Tablica wyników, Tryb obserwacji lub Menu kołowe i naciśnij wybrany klawisz."

[[message]]
key = "\"Active disconnect\" leaves the server without closing the client, so bind it only for deliberate use."
[message.translations]
simplified_chinese = "主动断开只退出服务器、不关闭客户端，所以只在你有意使用时才绑它。"
traditional_chinese = "主動斷開只退出伺服器、不關閉客戶端，所以只在你有意使用時才綁它。"
japanese = "アクティブ切断はクライアントを閉じずにサーバーから抜けるだけなので、意図して使うときだけ押せる位置に置きましょう。"
korean = "능동적 연결 끊기는 클라이언트를 닫지 않고 서버에서만 나가니, 일부러 쓸 때만 누르도록 두세요."
russian = "Активное отключение выходит с сервера, не закрывая клиент, поэтому назначайте его только для осознанного использования."
german = "Aktive Trennung verlässt den Server, ohne den Client zu schließen; belege sie nur für bewusstes Nutzen."
spanish = "La desconexión activa sale del servidor sin cerrar el cliente, así que asígnala solo para usarla a propósito."
french = "La déconnexion active quitte le serveur sans fermer le client : ne l'assigne que pour un usage volontaire."
brazilian_portuguese = "A desconexão ativa sai do servidor sem fechar o cliente, então só a atribua para uso deliberado."
portuguese = "A desconexão ativa sai do servidor sem fechar o cliente, por isso só a atribui para uso deliberado."
turkish = "Aktif bağlantı kesme, istemciyi kapatmadan sunucudan çıkar; yalnızca bilerek kullanacağın bir tuşa ata."
polish = "Aktywne rozłączenie opuszcza serwer bez zamykania klienta, więc przypisz je tylko do świadomego użycia."

[[message]]
key = "Binds that use commands the client does not recognize, listed by their raw command text."
[message.translations]
simplified_chinese = "使用客户端无法识别的命令的绑定，按原始命令文本列出。"
traditional_chinese = "使用客戶端無法辨識的命令的綁定，按原始命令文本列出。"
japanese = "クライアントが認識しないコマンドを使うバインドで、生のコマンド文字列のまま一覧に出ます。"
korean = "클라이언트가 인식하지 못하는 명령을 쓰는 바인드로, 원래 명령 텍스트 그대로 나열됩니다."
russian = "Привязки на командах, которых клиент не знает; показываются как есть, исходным текстом команды."
german = "Bindungen mit Befehlen, die der Client nicht kennt, aufgelistet mit ihrem rohen Befehlstext."
spanish = "Binds con comandos que el cliente no reconoce, listados con su texto de comando sin procesar."
french = "Binds utilisant des commandes que le client ne reconnaît pas, listés avec leur texte brut."
brazilian_portuguese = "Binds com comandos que o cliente não reconhece, listados pelo texto bruto do comando."
portuguese = "Binds com comandos que o cliente não reconhece, listados pelo texto bruto do comando."
turkish = "İstemcinin tanımadığı komutları kullanan bağlamalar; ham komut metinleriyle listelenir."
polish = "Wiązania z komendami, których klient nie rozpoznaje, wyświetlane jako surowy tekst komendy."

[[message]]
key = "The card only appears while such a bind exists; click its key field to change the key, and the row label is the command it runs."
[message.translations]
simplified_chinese = "只有存在这类绑定时卡片才会出现；点它的按键栏就能换键，行标题就是它执行的命令。"
traditional_chinese = "只有存在這類綁定時卡片才會出現；點它的按鍵欄就能換鍵，列標題就是它執行的命令。"
japanese = "該当するバインドがあるときだけ表示されます。キー欄をクリックしてキーを変えられ、行の見出しは実行されるコマンドです。"
korean = "그런 바인드가 있을 때만 카드가 나타납니다. 키 칸을 클릭해 키를 바꾸고, 행 이름이 실행되는 명령입니다."
russian = "Карточка видна, только пока такая привязка существует; щёлкните поле клавиши, чтобы её сменить, а подпись строки — это выполняемая команда."
german = "Die Karte erscheint nur, solange es eine solche Bindung gibt; zum Ändern klickst du ihr Tastenfeld an, die Zeilenbeschriftung ist der ausgeführte Befehl."
spanish = "La tarjeta solo aparece mientras exista ese bind; haz clic en su campo de tecla para cambiarla, y la etiqueta de la fila es el comando que ejecuta."
french = "La carte n'apparaît que tant qu'un tel bind existe ; clique sur son champ de touche pour changer la touche, et le libellé de ligne est la commande exécutée."
brazilian_portuguese = "O cartão só aparece enquanto esse bind existir; clique no campo de tecla para trocar a tecla, e o rótulo da linha é o comando executado."
portuguese = "O cartão só aparece enquanto esse bind existir; clica no campo da tecla para trocar a tecla, e a etiqueta da linha é o comando executado."
turkish = "Kart yalnızca böyle bir bağlama varken görünür; tuşu değiştirmek için tuş alanına tıkla, satır etiketi ise çalıştırdığı komuttur."
polish = "Karta pojawia się tylko wtedy, gdy takie wiązanie istnieje; kliknij jego pole klawisza, aby zmienić klawisz, a etykieta wiersza to uruchamiana komenda."

[[message]]
key = "Rows here usually come from old configs, so test each command before you rely on it."
[message.translations]
simplified_chinese = "这里的行多半来自旧配置，所以先试一遍命令，确认能用再依赖它。"
traditional_chinese = "這裡的列多半來自舊配置，所以先試一遍命令，確認能用再依賴它。"
japanese = "ここに並ぶのは古い設定由来のものが多いので、頼る前にコマンドを試してください。"
korean = "여기 있는 행은 대개 오래된 설정에서 온 것이니, 믿고 쓰기 전에 명령을 시험해 보세요."
russian = "Такие строки обычно приходят из старых конфигов, поэтому проверьте каждую команду, прежде чем на неё полагаться."
german = "Solche Zeilen stammen meist aus alten Configs; teste jeden Befehl, bevor du dich darauf verlässt."
spanish = "Estas filas suelen venir de configs antiguos, así que prueba cada comando antes de fiarte de él."
french = "Ces lignes viennent souvent d'anciennes configs : teste chaque commande avant de t'y fier."
brazilian_portuguese = "Essas linhas costumam vir de configs antigos, então teste cada comando antes de confiar nele."
portuguese = "Estas linhas costumam vir de configs antigos, por isso testa cada comando antes de confiar nele."
turkish = "Buradaki satırlar çoğunlukla eski yapılandırmalardan gelir; güvenmeden önce her komutu dene."
polish = "Te wiersze pochodzą zwykle ze starych konfiguracji, więc przetestuj każdą komendę, zanim na niej polegniesz."

[[message]]
key = "Automatic demos, game-end screenshots and CSV exports, their file limits and save folders, plus screenshot watermarks."
[message.translations]
simplified_chinese = "自动录像、结束时截图和 CSV 导出，它们的文件上限和保存目录，以及截图水印。"
traditional_chinese = "自動錄影、結束時截圖和 CSV 匯出，它們的檔案上限和儲存目錄，以及截圖浮水印。"
japanese = "自動デモ、試合終了時のスクリーンショットと CSV 書き出し、その保存数上限と保存先、さらにスクリーンショットの透かし。"
korean = "데모 자동 녹화, 경기 종료 스크린샷과 CSV 내보내기, 파일 수 제한과 저장 폴더, 그리고 스크린샷 워터마크입니다."
russian = "Автозапись демо, снимки по завершении игры и экспорт в CSV, их лимиты файлов и папки сохранения, а также водяные знаки на снимках."
german = "Automatische Demos, Screenshots am Spielende und CSV-Export, ihre Dateilimits und Speicherordner sowie Wasserzeichen auf Screenshots."
spanish = "Demos automáticas, capturas al terminar la partida y exportación a CSV, sus límites de archivos y carpetas, más la marca de agua de las capturas."
french = "Démos automatiques, captures de fin de partie et exports CSV, leurs limites de fichiers et dossiers d'enregistrement, plus le filigrane des captures."
brazilian_portuguese = "Demos automáticas, capturas ao fim da partida e exportação para CSV, seus limites de arquivos e pastas, além da marca d'água das capturas."
portuguese = "Demos automáticas, capturas no fim da partida e exportação para CSV, os seus limites de ficheiros e pastas, além da marca de água das capturas."
turkish = "Otomatik demolar, oyun sonu ekran görüntüleri ve CSV dışa aktarımı, dosya sınırları ve kayıt klasörleri, ayrıca ekran görüntüsü filigranı."
polish = "Automatyczne dema, zrzuty na koniec gry i eksport CSV, ich limity plików i foldery zapisu oraz znak wodny na zrzutach."

[[message]]
key = "Turn on \"Automatically record demos\" or a screenshot option, set \"Max demos\" or \"Max Screenshots\", and fill \"Demo directory\" or \"Screenshot directory\" to move the files."
[message.translations]
simplified_chinese = "打开自动录制回放或某个截图选项，设置最大回放数或最大截图数，再填好回放保存目录或截图保存目录就能把文件换地方。"
traditional_chinese = "開啟自動錄製回放或某個截圖選項，設定最大回放數或最大截圖數，再填好回放儲存目錄或截圖儲存目錄就能把檔案換地方。"
japanese = "デモを自動録画、またはスクリーンショットの項目をオンにし、最大デモ数や最大スクリーンショット数を設定、デモの保存先かスクリーンショットの保存先を入れると保存場所を移せます。"
korean = "데모 자동 녹화나 스크린샷 항목을 켜고 최대 데모 수 또는 최대 스크린샷 수를 정한 뒤, 데모 저장 폴더나 스크린샷 저장 폴더를 채우면 파일 위치가 바뀝니다."
russian = "Включите автоматическую запись демо или нужную опцию снимков, задайте макс. демок или макс. скриншотов и укажите папку демо или папку снимков экрана, чтобы перенести файлы."
german = "Schalte Automatisch Demos aufzeichnen oder eine Screenshot-Option ein, stelle Max. Demos oder Max. Screenshots ein und trage Demo-Verzeichnis oder Screenshot-Verzeichnis ein, um die Dateien zu verschieben."
spanish = "Activa Grabar demos automáticamente o una opción de captura, fija el máximo de demos o de capturas y rellena Carpeta de demos o Carpeta de capturas para mover los archivos."
french = "Active Enregistrer automatiquement les démos ou une option de capture, règle Max démos ou Max captures d'écran, puis remplis Dossier des démos ou Dossier des captures d’écran pour déplacer les fichiers."
brazilian_portuguese = "Ative Gravar demos automaticamente ou uma opção de captura, defina Máx. demos ou Máx. screenshots e preencha Pasta de demos ou Pasta de capturas de tela para mover os arquivos."
portuguese = "Ativa Gravar demos automaticamente ou uma opção de captura, define Máx. demos ou Máx. Screenshots e preenche Pasta de demos ou Pasta de capturas de ecrã para mover os ficheiros."
turkish = "Demoları otomatik kaydet veya bir ekran görüntüsü seçeneğini aç, Maksimum demo ya da Maksimum Ekran Görüntüsü değerini ayarla ve dosyaları taşımak için Demo kayıt dizini veya Ekran görüntüsü dizinini doldur."
polish = "Włącz Automatycznie nagrywaj dema lub opcję zrzutów, ustaw Maks. dema albo Maks. zrzutów ekranu i wpisz Katalog nagrań demo lub Katalog zrzutów ekranu, aby przenieść pliki."

[[message]]
key = "Old files are deleted once the save limit is reached, so copy any demo you want to keep somewhere else."
[message.translations]
simplified_chinese = "达到保存上限后旧文件会被删掉，想留的回放记得另存一份。"
traditional_chinese = "達到儲存上限後舊檔案會被刪掉，想留的回放記得另存一份。"
japanese = "保存上限に達すると古いファイルは削除されるので、残したいデモは別の場所にコピーしておきましょう。"
korean = "저장 한도에 도달하면 오래된 파일이 삭제되니, 남기고 싶은 데모는 다른 곳에 복사해 두세요."
russian = "При достижении лимита старые файлы удаляются, поэтому копируйте нужные демо в другое место."
german = "Alte Dateien werden gelöscht, sobald das Speicherlimit erreicht ist; kopiere Demos, die du behalten willst, woandershin."
spanish = "Los archivos viejos se borran al alcanzar el límite de guardado, así que copia aparte cualquier demo que quieras conservar."
french = "Les anciens fichiers sont supprimés une fois la limite atteinte : copie ailleurs toute démo que tu veux garder."
brazilian_portuguese = "Os arquivos antigos são apagados quando o limite é atingido, então copie para outro lugar qualquer demo que queira guardar."
portuguese = "Os ficheiros antigos são apagados quando o limite é atingido, por isso copia para outro sítio qualquer demo que queiras guardar."
turkish = "Kayıt sınırına ulaşınca eski dosyalar silinir; saklamak istediğin demoyu başka bir yere kopyala."
polish = "Po osiągnięciu limitu zapisu stare pliki są usuwane, więc skopiuj w inne miejsce każde demo, które chcesz zachować."

[[message]]
key = "Shortcuts that open your QmClient settings, profiles, war list and chat binds, plus configuration packages."
[message.translations]
simplified_chinese = "打开 QmClient 设置、配置文件、敌对列表和聊天绑定的快捷方式，还有配置包。"
traditional_chinese = "開啟 QmClient 設置、配置文件、敵對列表和聊天綁定的捷徑，還有配置包。"
japanese = "QmClient の設定、プロファイル、敵対リスト、チャットバインドを開くショートカットと、設定パッケージ。"
korean = "QmClient 설정, 프로필, 전쟁 목록, 채팅 바인드를 여는 바로가기와 설정 패키지입니다."
russian = "Ярлыки для настроек QmClient, профилей, списка врагов и чат-привязок, а также пакеты настроек."
german = "Verknüpfungen zu deinen QmClient-Einstellungen, Profilen, der Kriegsliste und Chat-Binds sowie Konfigurationspakete."
spanish = "Accesos que abren tus ajustes de QmClient, perfiles, lista de guerra y binds de chat, además de los paquetes de configuración."
french = "Raccourcis qui ouvrent tes réglages QmClient, profils, liste de guerre et touches de discussion, plus les paquets de configuration."
brazilian_portuguese = "Atalhos que abrem as configurações do QmClient, perfis, lista de guerra e atalhos de chat, além dos pacotes de configurações."
portuguese = "Atalhos que abrem as configurações do QmClient, perfis, lista de guerra e binds de chat, além dos pacotes de configurações."
turkish = "QmClient ayarlarını, profilleri, savaş listesini ve sohbet bağlantılarını açan kısayollar ile yapılandırma paketleri."
polish = "Skróty otwierające ustawienia QmClient, profile, listę wojenną i wiązania czatu oraz pakiety konfiguracji."

[[message]]
key = "Click \"QmClient Settings\", \"Profiles\", \"War List\" or \"Chat Binds\" to open that file, then use \"Configuration packages\" to export or import a whole set."
[message.translations]
simplified_chinese = "点 QmClient 设置、配置文件、敌对列表或聊天绑定就能打开对应文件；要整包导出或导入就用配置包。"
traditional_chinese = "點 QmClient 設置、配置文件、敵對列表或聊天綁定就能開啟對應檔案；要整包匯出或匯入就用配置包。"
japanese = "QmClient 設定、プロファイル、敵対リスト、チャットバインドをクリックするとそのファイルが開きます。まとめて書き出し・読み込みするには設定パッケージを使います。"
korean = "QmClient 설정, 프로필, 전쟁 목록 또는 채팅 바인드를 클릭하면 해당 파일이 열립니다. 통째로 내보내거나 가져오려면 설정 패키지를 쓰세요."
russian = "Нажмите настройки QmClient, профили, список врагов или чат-привязки, чтобы открыть файл, а пакеты настроек служат для экспорта и импорта всего набора."
german = "Klicke QmClient-Einstellungen, Profile, Kriegsliste oder Chat-Binds an, um die Datei zu öffnen; zum Exportieren oder Importieren eines ganzen Satzes dienen die Konfigurationspakete."
spanish = "Haz clic en Ajustes de QmClient, Perfiles, Lista de Guerra o Binds de Chat para abrir ese archivo, y usa los paquetes de configuración para exportar o importar todo un conjunto."
french = "Clique sur Paramètres QmClient, Profils, Liste de guerre ou Touches de discussion pour ouvrir le fichier, puis utilise les paquets de configuration pour exporter ou importer un ensemble complet."
brazilian_portuguese = "Clique em Configurações do QmClient, Perfis, Lista de Guerra ou Atalhos de Chat para abrir o arquivo, e use os pacotes de configurações para exportar ou importar um conjunto inteiro."
portuguese = "Clica em Definições do QmClient, Perfis, Lista de Guerra ou Binds de Chat para abrir o ficheiro, e usa os pacotes de configurações para exportar ou importar um conjunto inteiro."
turkish = "O dosyayı açmak için QmClient Ayarları, Profiller, Savaş Listesi veya Sohbet Bağlantıları'na tıkla; tüm bir seti dışa ya da içe aktarmak için yapılandırma paketlerini kullan."
polish = "Kliknij Ustawienia QmClient, Profile, Lista wojenna lub Wiązania czatu, aby otworzyć plik, a pakietów konfiguracji użyj do eksportu lub importu całego zestawu."

[[message]]
key = "An import replaces settings and binds and then restarts the client, so export your current setup first."
[message.translations]
simplified_chinese = "导入会覆盖现有设置和绑定并重启客户端，所以先把你当前的配置导出备份。"
traditional_chinese = "匯入會覆蓋現有設定和綁定並重啟客戶端，所以先把你目前的配置匯出備份。"
japanese = "読み込むと設定とバインドが置き換わり、その後クライアントが再起動します。先に今の設定を書き出しておきましょう。"
korean = "가져오기는 설정과 바인드를 덮어쓴 뒤 클라이언트를 다시 시작하니, 먼저 지금 설정을 내보내 두세요."
russian = "Импорт заменяет настройки и привязки, а затем перезапускает клиент, поэтому сначала экспортируйте текущую конфигурацию."
german = "Ein Import ersetzt Einstellungen und Bindungen und startet den Client neu; exportiere vorher dein aktuelles Setup."
spanish = "Importar sustituye los ajustes y binds y reinicia el cliente, así que exporta antes tu configuración actual."
french = "Un import remplace les réglages et les binds puis redémarre le client : exporte d'abord ta configuration actuelle."
brazilian_portuguese = "A importação substitui configurações e binds e reinicia o cliente, então exporte sua configuração atual antes."
portuguese = "A importação substitui configurações e binds e reinicia o cliente, por isso exporta primeiro a tua configuração atual."
turkish = "İçe aktarma ayarları ve bağlamaları değiştirip istemciyi yeniden başlatır; önce mevcut kurulumunu dışa aktar."
polish = "Import zastępuje ustawienia i wiązania, a potem restartuje klienta, więc najpierw wyeksportuj obecną konfigurację."

[[message]]
key = "Redeems a sponsor code, sets the custom title it unlocks and picks how that title looks in chat."
[message.translations]
simplified_chinese = "领取认证码，设置它解锁的自定义头衔，并选择这个头衔在聊天里的显示样式。"
traditional_chinese = "領取認證碼，設定它解鎖的自訂頭銜，並選擇這個頭銜在聊天裡的顯示樣式。"
japanese = "認証コードを引き換え、解除されるカスタム称号を設定し、チャットでの見せ方を選びます。"
korean = "인증 코드를 등록하고 그것으로 열리는 사용자 지정 칭호를 설정하며, 채팅에서 칭호가 보이는 방식을 고릅니다."
russian = "Активирует код спонсора, задаёт открываемый им свой титул и выбирает, как этот титул выглядит в чате."
german = "Löst einen Unterstützercode ein, legt den freigeschalteten eigenen Titel fest und wählt, wie er im Chat aussieht."
spanish = "Canjea un código de patrocinador, define el título personalizado que desbloquea y elige cómo se ve en el chat."
french = "Échange un code de soutien, définit le titre personnalisé qu'il débloque et choisit son apparence dans le chat."
brazilian_portuguese = "Resgata um código de apoiador, define o título personalizado que ele libera e escolhe como ele aparece no chat."
portuguese = "Resgata um código de apoiante, define o título personalizado que ele desbloqueia e escolhe o seu aspeto no chat."
turkish = "Destekçi kodunu kullanır, açtığı özel unvanı belirler ve bu unvanın sohbette nasıl görüneceğini seçer."
polish = "Realizuje kod wspierającego, ustawia odblokowany własny tytuł i wybiera, jak wygląda on na czacie."

[[message]]
key = "Type your code into \"Sponsor code\" and press \"Redeem\", then edit \"Custom title\", choose a \"Chat message style\" and press \"Save\"."
[message.translations]
simplified_chinese = "在认证码里填入你的码并点领取，然后编辑自定义头衔、选一个发言样式，最后点保存。"
traditional_chinese = "在認證碼裡填入你的碼並點領取，然後編輯自訂頭銜、選一個發言樣式，最後點保存。"
japanese = "認証コードにコードを入れて引き換えを押し、カスタム称号を編集、チャットのスタイルを選んでから保存を押します。"
korean = "인증 코드에 코드를 입력하고 등록을 누른 뒤 사용자 지정 칭호를 편집하고 채팅 메시지 스타일을 골라 저장을 누르세요."
russian = "Введите свой код в поле кода спонсора и нажмите активировать, затем отредактируйте свой титул, выберите стиль сообщений и нажмите сохранить."
german = "Trage deinen Code in Unterstützercode ein und drücke Einlösen, bearbeite dann den eigenen Titel, wähle einen Stil der Chatnachricht und drücke Speichern."
spanish = "Escribe tu código en Código de patrocinador y pulsa Canjear; luego edita el título personalizado, elige un estilo del mensaje y pulsa Guardar."
french = "Saisis ton code dans Code de soutien et appuie sur Échanger, puis modifie le titre personnalisé, choisis un style des messages et appuie sur Sauvegarder."
brazilian_portuguese = "Digite seu código em Código de apoiador e clique em Resgatar; depois edite o título personalizado, escolha um estilo da mensagem e clique em Salvar."
portuguese = "Escreve o teu código em Código de apoiante e clica em Resgatar; depois edita o título personalizado, escolhe um estilo da mensagem e clica em Guardar."
turkish = "Kodunu Destekçi kodu alanına yaz ve Kullan düğmesine bas; ardından Özel unvanı düzenle, bir Sohbet mesajı stili seç ve Kaydet'e bas."
polish = "Wpisz kod w polu Kod wspierającego i naciśnij Wykorzystaj, potem edytuj Własny tytuł, wybierz Styl wiadomości i naciśnij Zapisz."

[[message]]
key = "Press \"Save\" after any change: the title and chat style are stored on your account, and \"Refresh\" reloads them."
[message.translations]
simplified_chinese = "任何改动之后都要点保存：头衔和发言样式存在你的账号上，点刷新可以重新载入。"
traditional_chinese = "任何改動之後都要點保存：頭銜和發言樣式存在你的帳號上，點刷新可以重新載入。"
japanese = "変更したら必ず保存を押してください。称号とチャットのスタイルはアカウントに保存され、更新で読み直せます。"
korean = "무엇이든 바꾼 뒤에는 저장을 누르세요. 칭호와 채팅 스타일은 계정에 저장되며 새로고침으로 다시 불러옵니다."
russian = "После любого изменения нажимайте сохранить: титул и стиль чата хранятся в аккаунте, а обновить подтягивает их заново."
german = "Drücke nach jeder Änderung Speichern: Titel und Chat-Stil liegen in deinem Konto, Aktualisieren lädt sie neu."
spanish = "Pulsa Guardar tras cualquier cambio: el título y el estilo de chat se guardan en tu cuenta, y Refrescar los recarga."
french = "Appuie sur Sauvegarder après chaque changement : le titre et le style de chat sont stockés sur ton compte, et Actualiser les recharge."
brazilian_portuguese = "Clique em Salvar depois de qualquer mudança: o título e o estilo de chat ficam na sua conta, e Atualizar recarrega tudo."
portuguese = "Clica em Guardar depois de qualquer alteração: o título e o estilo de chat ficam na tua conta, e Atualizar recarrega-os."
turkish = "Her değişiklikten sonra Kaydet'e bas: unvan ve sohbet stili hesabında tutulur, Yenile ise onları yeniden yükler."
polish = "Po każdej zmianie naciśnij Zapisz: tytuł i styl czatu są przechowywane na twoim koncie, a Odśwież wczytuje je ponownie."

[[message]]
key = "Where your title appears and how it looks: nameplate, style, motion, colors and glow."
[message.translations]
simplified_chinese = "你的头衔出现在哪里、长什么样：名牌、风格、动画、颜色和光晕。"
traditional_chinese = "你的頭銜出現在哪裡、長什麼樣：名牌、風格、動畫、顏色和光暈。"
japanese = "称号をどこに出すか、どう見せるか。ネームプレート、スタイル、アニメーション、色、発光です。"
korean = "칭호가 어디에 나타나고 어떻게 보일지를 정합니다. 이름표, 스타일, 애니메이션, 색상, 발광입니다."
russian = "Где показывается титул и как он выглядит: табличка с именем, стиль, анимация, цвета и свечение."
german = "Wo dein Titel erscheint und wie er aussieht: Namensschild, Stil, Animation, Farben und Leuchten."
spanish = "Dónde aparece tu título y cómo se ve: placa de nombre, estilo, animación, colores y brillo."
french = "Où apparaît ton titre et à quoi il ressemble : plaque de nom, style, animation, couleurs et lueur."
brazilian_portuguese = "Onde seu título aparece e como ele fica: placa de nome, estilo, animação, cores e brilho."
portuguese = "Onde aparece o teu título e como fica: placa de nome, estilo, animação, cores e brilho."
turkish = "Unvanının nerede görüneceği ve nasıl duracağı: isim etiketi, stil, animasyon, renkler ve parıltı."
polish = "Gdzie pojawia się twój tytuł i jak wygląda: plakietka z nazwą, styl, animacja, kolory i poświata."

[[message]]
key = "Turn on \"Show titles on nameplates\", pick a \"Title style\", then adjust \"Title motion\" and \"Wave amount\"; \"Advanced mode\" adds color and glow."
[message.translations]
simplified_chinese = "打开显示名牌头衔，选一个头衔风格，再调头衔动画和波浪幅度；高级模式里还能加颜色和光晕。"
traditional_chinese = "開啟顯示名牌頭銜，選一個頭銜風格，再調頭銜動畫和波浪幅度；進階模式裡還能加顏色和光暈。"
japanese = "ネームプレートに称号を表示をオンにし、称号スタイルを選んで、称号アニメーションと波の振幅を調整します。詳細モードでは色と発光も加えられます。"
korean = "이름표에 칭호 표시를 켜고 칭호 스타일을 고른 뒤 칭호 애니메이션과 파도 크기를 조정하세요. 고급 모드에서는 색상과 발광을 더할 수 있습니다."
russian = "Включите показывать титулы на табличках имён, выберите стиль титула, затем настройте анимацию титула и амплитуду волны; расширенный режим добавляет цвет и свечение."
german = "Schalte Titel auf Namensschildern anzeigen ein, wähle einen Titelstil und stelle dann Titelanimation und Wellenhöhe ein; der erweiterte Modus ergänzt Farbe und Leuchten."
spanish = "Activa Mostrar títulos en las placas de nombre, elige un estilo del título y ajusta la animación y la amplitud de onda; el modo avanzado añade color y brillo."
french = "Active Afficher les titres sur les plaques de nom, choisis un style du titre, puis règle l'animation et l'amplitude de l'onde ; le mode avancé ajoute couleur et lueur."
brazilian_portuguese = "Ative Mostrar títulos nas placas de nome, escolha um estilo do título e ajuste a animação do título e a amplitude da onda; o modo avançado adiciona cor e brilho."
portuguese = "Ativa Mostrar títulos nas placas de nome, escolhe um estilo do título e ajusta a animação do título e a amplitude da onda; o modo avançado acrescenta cor e brilho."
turkish = "İsim etiketlerinde unvanları göster seçeneğini aç, bir unvan stili seç, ardından unvan animasyonu ve dalga miktarını ayarla; gelişmiş mod renk ve parıltı ekler."
polish = "Włącz Pokaż tytuły na plakietkach z nazwami, wybierz Styl tytułu, a potem ustaw Animację tytułu i Amplitudę fali; tryb zaawansowany dodaje kolor i poświatę."

[[message]]
key = "Changes apply at once, so check \"Title preview\" to compare styles; press \"Save\" on the \"Sponsor title\" card to share one."
[message.translations]
simplified_chinese = "改动会立即生效，可以用头衔成品预览对比风格；想让别人也看到，就到赞助头衔卡里点保存。"
traditional_chinese = "改動會立即生效，可以用頭銜成品預覽比較風格；想讓別人也看到，就到贊助頭銜卡裡點保存。"
japanese = "変更はすぐ反映されるので、タイトルの仕上がりプレビューで見比べてください。他の人にも見せるには支援者の称号カードで保存を押します。"
korean = "변경은 바로 적용되니 칭호 완성 미리보기로 스타일을 비교해 보세요. 다른 사람에게도 보이게 하려면 후원자 칭호 카드에서 저장을 누르세요."
russian = "Изменения применяются сразу, сравнивайте стили в предпросмотре титула; чтобы титул увидели другие, нажмите сохранить на карточке титула спонсора."
german = "Änderungen wirken sofort; vergleiche Stile in der Titelvorschau und drücke zum Teilen Speichern auf der Karte Unterstützertitel."
spanish = "Los cambios se aplican al instante, compara estilos en la vista previa del título; para compartirlo, pulsa Guardar en la tarjeta Título de patrocinador."
french = "Les changements s'appliquent aussitôt : compare les styles dans l'aperçu du titre et appuie sur Sauvegarder sur la carte Titre de soutien pour le partager."
brazilian_portuguese = "As mudanças valem na hora, compare estilos na prévia do título; para compartilhar, clique em Salvar no cartão Título de apoiador."
portuguese = "As mudanças aplicam-se logo, compara estilos na pré-visualização do título; para partilhar, clica em Guardar no cartão Título de apoiante."
turkish = "Değişiklikler anında uygulanır; unvan önizlemesinde stilleri karşılaştır. Paylaşmak için Destekçi unvanı kartında Kaydet'e bas."
polish = "Zmiany działają od razu, więc porównuj style w Podglądzie tytułu; aby się nim podzielić, naciśnij Zapisz na karcie Tytuł wspierającego."

[[message]]
key = "View details"
[message.translations]
simplified_chinese = "查看说明"
traditional_chinese = "查看說明"
japanese = "説明を見る"
korean = "설명 보기"
russian = "Подробнее"
german = "Details ansehen"
spanish = "Ver detalles"
french = "Voir les détails"
brazilian_portuguese = "Ver detalhes"
portuguese = "Ver detalhes"
turkish = "Ayrıntıları gör"
polish = "Zobacz szczegóły"

[[message]]
key = "Assigns commands and labels to the slots of the radial bind wheel."
[message.translations]
simplified_chinese = "为环形绑定轮盘的各个槽位指定指令和标签。"
traditional_chinese = "為環形 Bind 輪盤的各槽位指派指令與標籤。"
japanese = "円形バインドホイールの各スロットにコマンドとラベルを割り当てます。"
korean = "원형 바인드 휠의 각 슬롯에 명령과 라벨을 지정합니다."
russian = "Назначает команды и подписи ячейкам кругового колеса привязок."
german = "Weist jedem Platz des runden Befehlsrads einen Befehl samt Beschriftung zu."
spanish = "Asigna comandos y etiquetas a las casillas de la rueda radial de binds."
french = "Attribue des commandes et des libellés aux emplacements de la roue de binds circulaire."
brazilian_portuguese = "Atribui comandos e rótulos aos espaços da roda radial de binds."
portuguese = "Atribui comandos e etiquetas aos espaços da roda radial de binds."
turkish = "Dairesel komut çarkının dilimlerine komut ve etiket atar."
polish = "Przypisuje polecenia i etykiety do pól koła poleceń."

[[message]]
key = "Pick a slot, type the command and its label, then hold the wheel key in game to test."
[message.translations]
simplified_chinese = "选一个槽位，输入指令和对应标签，再在游戏中按住轮盘键测试。"
traditional_chinese = "選一個槽位，輸入指令和對應標籤，再到遊戲裡按住輪盤鍵測試。"
japanese = "スロットを選んでコマンドとラベルを入力し、ゲーム内でホイールキーを押し続けて試します。"
korean = "슬롯을 고르고 명령과 라벨을 입력한 뒤, 게임에서 휠 키를 눌러 테스트하세요."
russian = "Выберите ячейку, введите команду и подпись, затем зажмите клавишу колеса в игре для проверки."
german = "Wähle einen Platz, gib Befehl und Beschriftung ein und halte zum Testen im Spiel die Radtaste gedrückt."
spanish = "Elige una casilla, escribe el comando y su etiqueta, y en el juego mantén pulsada la tecla de la rueda para probar."
french = "Choisis un emplacement, saisis la commande et son libellé, puis maintiens la touche de la roue en jeu pour tester."
brazilian_portuguese = "Escolha um espaço, digite o comando e o rótulo e, no jogo, segure a tecla da roda para testar."
portuguese = "Escolhe um espaço, escreve o comando e a etiqueta e, no jogo, mantém a tecla da roda premida para testar."
turkish = "Bir dilim seç, komutu ve etiketini yaz, sonra oyunda çark tuşunu basılı tutarak dene."
polish = "Wybierz pole, wpisz polecenie i jego etykietę, a potem przytrzymaj w grze klawisz koła, aby przetestować."

[[message]]
key = "Empty slots still take space, so clear the ones you no longer use."
[message.translations]
simplified_chinese = "空槽位同样占位置，不再使用的槽位请及时清空。"
traditional_chinese = "空槽位同樣佔位，用不到的記得清空。"
japanese = "空のスロットも場所を取るので、使わないものは消してください。"
korean = "빈 슬롯도 자리를 차지하니, 더 쓰지 않는 슬롯은 비워 두세요."
russian = "Пустые ячейки тоже занимают место, поэтому очищайте ненужные."
german = "Leere Plätze belegen weiterhin Raum, also leere die ungenutzten."
spanish = "Las casillas vacías siguen ocupando espacio, así que vacía las que ya no uses."
french = "Les emplacements vides prennent quand même de la place : vide ceux que tu n'utilises plus."
brazilian_portuguese = "Espaços vazios ainda ocupam lugar, então limpe os que você não usa mais."
portuguese = "Os espaços vazios continuam a ocupar lugar, por isso limpa os que já não usas."
turkish = "Boş dilimler de yer kaplar; artık kullanmadıklarını temizle."
polish = "Puste pola nadal zajmują miejsce, więc czyść te, których już nie używasz."

[[message]]
key = "Shows the bind wheel layout and which slot is currently selected."
[message.translations]
simplified_chinese = "显示绑定轮盘的布局，以及当前选中的槽位。"
traditional_chinese = "顯示 Bind 輪盤的佈局和目前選取的槽位。"
japanese = "バインドホイールの配置と、現在選択中のスロットを表示します。"
korean = "바인드 휠 배치와 현재 선택된 슬롯을 보여 줍니다."
russian = "Показывает раскладку колеса привязок и выбранную ячейку."
german = "Zeigt die Anordnung des Befehlsrads und den aktuell gewählten Platz."
spanish = "Muestra la distribución de la rueda de binds y la casilla seleccionada."
french = "Affiche la disposition de la roue de binds et l'emplacement sélectionné."
brazilian_portuguese = "Mostra o layout da roda de binds e o espaço selecionado no momento."
portuguese = "Mostra a disposição da roda de binds e o espaço selecionado neste momento."
turkish = "Komut çarkının yerleşimini ve seçili dilimi gösterir."
polish = "Pokazuje układ koła poleceń i aktualnie wybrane pole."

[[message]]
key = "Hold the wheel key to see the selection move; release it to run the highlighted slot."
[message.translations]
simplified_chinese = "按住轮盘键可以看到选中项移动，松开即执行高亮的槽位。"
traditional_chinese = "按住輪盤鍵可以看到選取移動，放開就執行高亮槽位的指令。"
japanese = "ホイールキーを押し続けると選択が動き、離すと強調表示されたスロットが実行されます。"
korean = "휠 키를 누르고 있으면 선택이 움직이고, 놓으면 강조된 슬롯이 실행됩니다."
russian = "Зажмите клавишу колеса — выбор будет двигаться; отпустите, чтобы сработала подсвеченная ячейка."
german = "Halte die Radtaste gedrückt, um die Auswahl zu bewegen, und lass sie los, um den markierten Platz auszuführen."
spanish = "Mantén la tecla de la rueda para mover la selección y suéltala para ejecutar la casilla resaltada."
french = "Maintiens la touche de la roue pour déplacer la sélection et relâche-la pour exécuter l'emplacement surligné."
brazilian_portuguese = "Segure a tecla da roda para mover a seleção e solte para executar o espaço destacado."
portuguese = "Mantém a tecla da roda premida para mover a seleção e larga-a para executar o espaço realçado."
turkish = "Seçimin hareket ettiğini görmek için çark tuşunu basılı tut, vurgulanan dilimi çalıştırmak için bırak."
polish = "Przytrzymaj klawisz koła, aby przesuwać zaznaczenie, a puść, aby uruchomić podświetlone pole."

[[message]]
key = "If the wheel feels crowded, remove unused slots in the editor card."
[message.translations]
simplified_chinese = "如果轮盘显得拥挤，就在编辑卡片里删掉不用的槽位。"
traditional_chinese = "覺得輪盤太擠的話，到編輯器卡片裡移除用不到的槽位。"
japanese = "ホイールが混み合って見えるなら、エディターカードで使っていないスロットを削除してください。"
korean = "휠이 너무 빽빽하면 편집기 카드에서 쓰지 않는 슬롯을 지우세요."
russian = "Если колесо кажется перегруженным, уберите лишние ячейки в карточке редактора."
german = "Wenn das Rad voll wirkt, entferne ungenutzte Plätze in der Editor-Karte."
spanish = "Si la rueda se ve saturada, quita las casillas sin usar en la tarjeta del editor."
french = "Si la roue te semble chargée, retire les emplacements inutilisés dans la carte de l'éditeur."
brazilian_portuguese = "Se a roda parecer cheia demais, remova os espaços sem uso no cartão do editor."
portuguese = "Se a roda parecer demasiado cheia, remove os espaços sem uso no cartão do editor."
turkish = "Çark kalabalık görünüyorsa düzenleyici kartından kullanılmayan dilimleri kaldır."
