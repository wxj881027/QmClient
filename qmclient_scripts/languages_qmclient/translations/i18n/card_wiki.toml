korean = "망치, 권총, 샷건 또는 다음 무기 옆의 키 칸을 클릭하고 원하는 키를 누르세요."
russian = "Щёлкните поле клавиши рядом с молотом, пистолетом, дробовиком или следующим оружием и нажмите нужную клавишу."
german = "Klicke das Tastenfeld neben Hammer, Pistole, Schrotflinte oder Nächste Waffe an und drücke die gewünschte Taste."
spanish = "Haz clic en el campo de tecla junto a Martillo, Pistola, Escopeta o Siguiente arma y pulsa la tecla que quieras."
french = "Clique sur le champ de touche à côté de Marteau, Pistolet, Fusil à pompe ou Arme suivante et appuie sur la touche voulue."
brazilian_portuguese = "Clique no campo de tecla ao lado de Martelo, Pistola, Escopeta ou Próxima arma e pressione a tecla desejada."
portuguese = "Clica no campo da tecla ao lado de Martelo, Pistola, Caçadeira ou Próxima arma e prime a tecla que queres."
turkish = "Çekiç, Tabanca, Pompalı tüfek veya Sonraki silah yanındaki tuş alanına tıkla ve kullanmak istediğin tuşa bas."
polish = "Kliknij pole klawisza obok Młotek, Pistolet, Strzelba lub Następna broń i naciśnij wybrany klawisz."

[[message]]
key = "Direct weapon keys are faster than cycling, so bind at least the weapons you use most."
[message.translations]
simplified_chinese = "直接选武器比一件件切换更快，至少把最常用的武器绑上对应的键。"
traditional_chinese = "直接選武器比一件件切換更快，至少把最常用的武器綁上對應的鍵。"
japanese = "武器を直接選ぶほうが切り替えより速いので、よく使う武器だけでもキーを割り当てましょう。"
korean = "무기를 바로 고르는 편이 돌려 가며 바꾸는 것보다 빠르니, 자주 쓰는 무기만이라도 키를 지정하세요."
russian = "Прямые клавиши оружия быстрее перебора, поэтому назначайте хотя бы те, что нужны чаще всего."
german = "Direkte Waffentasten sind schneller als Durchschalten; belege also mindestens deine häufigsten Waffen."
spanish = "Las teclas directas de arma son más rápidas que ir cambiando, así que asigna al menos las que más uses."
french = "Les touches d'arme directes sont plus rapides que le défilement : assigne au moins tes armes les plus utilisées."
brazilian_portuguese = "Teclas diretas de arma são mais rápidas que ficar alternando, então atribua ao menos as que você mais usa."
portuguese = "Teclas diretas de arma são mais rápidas do que andar a alternar, por isso atribui pelo menos as que mais usas."
turkish = "Doğrudan silah tuşları sırayla geçmekten hızlıdır; en azından en çok kullandığın silahlara tuş ata."
polish = "Bezpośrednie klawisze broni są szybsze niż przełączanie, więc przypisz przynajmniej te najczęściej używane."

[[message]]
key = "The two keys that cast your vote: one for yes and one for no."
[message.translations]
simplified_chinese = "投出你那一票的两个键：一个赞成，一个反对。"
traditional_chinese = "投出你那一票的兩個鍵：一個贊成，一個反對。"
japanese = "投票用のキーは二つ。賛成用と反対用が一つずつです。"
korean = "투표에 쓰는 두 개의 키로, 하나는 찬성, 하나는 반대입니다."
russian = "Две клавиши для голосования: одна за, другая против."
german = "Die zwei Tasten für deine Stimme: eine für ja, eine für nein."
spanish = "Las dos teclas con las que votas: una para sí y otra para no."
french = "Les deux touches qui portent ton vote : une pour oui, une pour non."
brazilian_portuguese = "As duas teclas que dão o seu voto: uma para sim e outra para não."
portuguese = "As duas teclas que dão o teu voto: uma para sim e outra para não."
turkish = "Oyunu veren iki tuş: biri evet, biri hayır için."
polish = "Dwa klawisze oddające twój głos: jeden za, drugi przeciw."

[[message]]
key = "Click the key field next to \"Vote yes\" and \"Vote no\" and press the key you want for each."
[message.translations]
simplified_chinese = "点赞成和反对旁边的按键栏，分别为它们按下想用的键。"
traditional_chinese = "點贊成和反對旁邊的按鍵欄，分別為它們按下想用的鍵。"
japanese = "賛成と反対の横にあるキー欄をクリックし、それぞれに使いたいキーを押します。"
korean = "찬성과 반대 옆의 키 칸을 클릭하고 각각 원하는 키를 누르세요."
russian = "Щёлкните поле клавиши рядом с за и против и нажмите нужную клавишу для каждого."
german = "Klicke das Tastenfeld neben Dafür stimmen und Dagegen stimmen an und drücke jeweils die gewünschte Taste."
spanish = "Haz clic en el campo de tecla junto a Votar sí y Votar no y pulsa la tecla que quieras en cada uno."
french = "Clique sur le champ de touche à côté de Voter oui et Voter non et appuie sur la touche voulue pour chacun."
brazilian_portuguese = "Clique no campo de tecla ao lado de Votar sim e Votar não e pressione a tecla desejada em cada um."
portuguese = "Clica no campo da tecla ao lado de Votar sim e Votar não e prime a tecla que queres em cada um."
turkish = "Evet oyu ve Hayır oyu yanındaki tuş alanına tıkla ve her biri için istediğin tuşa bas."
polish = "Kliknij pole klawisza obok Głosuj za i Głosuj przeciw i naciśnij wybrany klawisz dla każdego."

[[message]]
key = "Votes often appear while you are still moving, so keep both keys easy to reach."
[message.translations]
simplified_chinese = "投票提示经常在你还在跑动时就跳出来，所以两个键都要放在手边。"
traditional_chinese = "投票提示經常在你還在跑動時就跳出來，所以兩個鍵都要放在手邊。"
japanese = "投票は動いている最中に出ることが多いので、どちらのキーも押しやすい位置に置いてください。"
korean = "투표는 아직 움직이는 중에 뜨는 경우가 많으니 두 키 모두 손이 닿기 쉽게 두세요."
russian = "Голосования часто появляются на ходу, поэтому держите обе клавиши под рукой."
german = "Abstimmungen kommen oft, während du noch unterwegs bist; halte beide Tasten gut erreichbar."
spanish = "Las votaciones suelen aparecer mientras sigues moviéndote, así que ten ambas teclas a mano."
french = "Les votes tombent souvent pendant que tu bouges encore : garde les deux touches à portée."
brazilian_portuguese = "As votações costumam aparecer enquanto você ainda está se movendo, então deixe as duas teclas à mão."
portuguese = "As votações aparecem muitas vezes enquanto ainda te moves, por isso mantém as duas teclas à mão."
turkish = "Oylamalar çoğu zaman sen hâlâ hareket ederken çıkar; iki tuşu da elinin altında tut."
polish = "Głosowania pojawiają się często, gdy wciąż się ruszasz, więc trzymaj oba klawisze pod ręką."

[[message]]
key = "Keys that open chat, team chat and chat commands, plus voice chat and repeating your last line."
[message.translations]
simplified_chinese = "打开聊天、队伍聊天和聊天指令的按键，还有语音聊天和重复上一句话的按键。"
traditional_chinese = "開啟聊天、隊伍聊天和聊天指令的按鍵，還有語音聊天和重複上一句話的按鍵。"
japanese = "チャット、チームチャット、チャットコマンドを開くキーに加え、ボイスチャットと直前の発言の繰り返し。"
korean = "채팅, 팀 채팅, 채팅 명령어를 여는 키와 음성 채팅, 마지막 문장 반복 키입니다."
russian = "Клавиши открытия чата, командного чата и команд, а также голосового чата и повтора последней строки."
german = "Tasten für Chat, Team-Chat und Chat-Befehle sowie Sprachchat und das Wiederholen deiner letzten Zeile."
spanish = "Teclas que abren el chat, el chat de equipo y los comandos, además del chat de voz y repetir tu último mensaje."
french = "Touches qui ouvrent le chat, le chat d'équipe et les commandes, plus le chat vocal et la répétition de ta dernière ligne."
brazilian_portuguese = "Teclas que abrem o chat, o chat da equipe e os comandos, além do chat de voz e repetir a sua última linha."
portuguese = "Teclas que abrem o chat, o chat de equipa e os comandos, além do chat de voz e repetir a tua última linha."
turkish = "Sohbeti, takım sohbetini ve sohbet komutlarını açan tuşlarla sesli sohbet ve son satırını yineleme."
polish = "Klawisze otwierające czat, czat drużynowy i komendy oraz czat głosowy i powtarzanie ostatniej linii."

[[message]]
key = "Click the key field beside \"Chat\", \"Team chat\" or \"Chat command\" and press the key you want to use."
[message.translations]
simplified_chinese = "点聊天、队伍聊天或聊天框指令旁边的按键栏，按下想用的键。"
