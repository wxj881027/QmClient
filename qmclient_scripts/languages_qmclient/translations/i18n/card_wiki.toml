[[message]]
key = "A grab bag of small convenience switches that do not deserve their own card: chat completion, the Qm scoreboard badge, tune zone colors, message merging, repeat and combo."
[message.translations]
simplified_chinese = "一堆不值得单独成卡的小开关：聊天补全、Qm 计分板标识、tune 区域着色、消息合并、复读和连击。"
traditional_chinese = "一堆不值得單獨成卡的小開關：聊天補全、Qm 計分板標識、tune 區域著色、訊息合併、復讀和連擊。"
japanese = "単独のカードにするほどではない小粒なスイッチ集です。チャット補完、Qm スコアボードバッジ、チューンゾーンの色分け、メッセージ統合、リピート、コンボ。"
korean = "따로 카드를 만들 만큼 크지 않은 소소한 스위치 모음입니다. 채팅 자동 완성, Qm 스코어보드 배지, 튠 영역 색상, 메시지 병합, 반복, 콤보."
russian = "Набор мелких удобных переключателей, которые не заслуживают отдельной карточки: автодополнение чата, значок Qm в таблице счёта, раскраска tune-зон, объединение сообщений, повтор и комбо."
german = "Eine Sammlung kleiner Komfortschalter, die keine eigene Karte verdienen: Chat-Vervollständigung, Qm-Badge im Scoreboard, Tune-Zonen-Farben, Nachrichtenzusammenfassung, Wiederholung und Combo."
spanish = "Un cajón de sastre con interruptores pequeños que no merecen su propia tarjeta: autocompletado del chat, insignia Qm en la tabla de puntos, colores de tune zones, fusión de mensajes, repetición y combo."
french = "Un fourre-tout de petits réglages qui ne méritent pas leur propre carte : complétion du chat, badge Qm dans le tableau des scores, couleurs des tune zones, fusion des messages, répétition et combo."
brazilian_portuguese = "Uma coletânea de ajustes pequenos que não merecem um cartão próprio: autocompletar do chat, selo Qm no placar, cores das tune zones, junção de mensagens, repetição e combo."
portuguese = "Uma coletânea de ajustes pequenos que não merecem um cartão próprio: autocompletar do chat, selo Qm na tabela de pontuação, cores das tune zones, junção de mensagens, repetição e combo."
turkish = "Kendi kartını hak etmeyen küçük kolaylık anahtarları: sohbet tamamlama, skor tablosunda Qm rozeti, tune bölgesi renkleri, mesaj birleştirme, tekrar ve kombo."
polish = "Zestaw drobnych udogodnień, które nie zasługują na własną kartę: dopełnianie czatu, odznaka Qm w tabeli wyników, kolory stref tune, scalanie wiadomości, powtarzanie i combo."

[[message]]
key = "Switch on only the ones you recognize; chat completion affects the chat input, and \"Show Qm badge\" adds the Qm marker next to names on the scoreboard."
[message.translations]
simplified_chinese = "只打开看得懂的项；聊天补全作用于聊天输入框，显示 Qm 标识会在计分板名字旁加一个 Qm 标记。"
traditional_chinese = "只開啟看得懂的項目；聊天補全作用於聊天輸入框，顯示 Qm 標識會在計分板名字旁加一個 Qm 標記。"
japanese = "分かるものだけをオンにしてください。チャット補完はチャット入力欄に作用し、「Qm バッジを表示」はスコアボードの名前の横に Qm の印を付けます。"
korean = "알아보는 항목만 켜세요. 채팅 자동 완성은 채팅 입력창에 적용되고, \"Qm 배지 표시\"는 스코어보드 이름 옆에 Qm 표시를 붙입니다."
russian = "Включайте только то, что понимаете: автодополнение работает в поле чата, а «Показывать значок Qm» добавляет метку Qm рядом с именами в таблице счёта."
german = "Aktiviere nur, was du kennst: Chat-Vervollständigung wirkt im Chat-Eingabefeld, und „Qm-Badge anzeigen\" setzt eine Qm-Marke neben die Namen im Scoreboard."
spanish = "Activa solo lo que reconozcas: el autocompletado afecta a la entrada del chat y «Mostrar insignia Qm» añade una marca Qm junto a los nombres en la tabla de puntos."
french = "N'active que ce que tu reconnais : la complétion agit sur la saisie du chat, et « Afficher le badge Qm » ajoute une marque Qm à côté des noms du tableau des scores."
brazilian_portuguese = "Ligue só o que você reconhece: o autocompletar age na entrada do chat e \"Mostrar selo Qm\" adiciona uma marca Qm ao lado dos nomes no placar."
portuguese = "Liga só o que reconheces: o autocompletar age na entrada do chat e \"Mostrar selo Qm\" acrescenta uma marca Qm ao lado dos nomes na tabela de pontuação."
turkish = "Yalnızca tanıdıklarını aç: sohbet tamamlama sohbet girişini etkiler, \"Qm rozetini göster\" ise skor tablosunda isimlerin yanına Qm işareti ekler."
polish = "Włączaj tylko to, co rozumiesz: dopełnianie działa w polu czatu, a „Pokaż odznakę Qm\" dodaje znacznik Qm obok nazw w tabeli wyników."

[[message]]
key = "Leave \"Automatic updates\" off if you update by hand: it can restart the client to install a build."
[message.translations]
simplified_chinese = "如果你习惯手动更新，就把自动更新留着关闭：它可能会重启客户端来安装新版本。"
traditional_chinese = "如果你習慣手動更新，就把自動更新留著關閉：它可能會重啟客戶端來安裝新版本。"
japanese = "手動で更新するなら「自動更新」はオフのままにしてください。ビルドのインストール時にクライアントを再起動することがあります。"
korean = "직접 업데이트한다면 \"자동 업데이트\"는 꺼 두세요. 새 빌드를 설치하려고 클라이언트를 다시 시작할 수 있습니다."
russian = "Если обновляетесь вручную, оставьте «Автоматические обновления» выключенными: клиент может перезапуститься, чтобы установить сборку."
german = "Lass „Automatische Updates\" aus, wenn du selbst aktualisierst: Der Client kann sich zum Installieren eines Builds neu starten."
spanish = "Si actualizas a mano, deja «Actualizaciones automáticas» desactivado: puede reiniciar el cliente para instalar una versión."
french = "Si tu mets à jour à la main, laisse « Mises à jour automatiques » désactivé : le client peut redémarrer pour installer une version."
brazilian_portuguese = "Se você atualiza manualmente, deixe \"Atualizações automáticas\" desligado: ele pode reiniciar o cliente para instalar uma versão."
portuguese = "Se atualizas manualmente, deixa \"Atualizações automáticas\" desligado: pode reiniciar o cliente para instalar uma versão."
turkish = "Elle güncelliyorsan \"Otomatik güncellemeler\"i kapalı bırak: yeni sürümü kurmak için istemciyi yeniden başlatabilir."
polish = "Jeśli aktualizujesz ręcznie, zostaw „Automatyczne aktualizacje\" wyłączone: klient może się zrestartować, aby zainstalować kompilację."

[[message]]
key = "Writes a chat message, and optionally sends an emoticon, whenever your tee dies in water."
[message.translations]
simplified_chinese = "你的 Tee 掉水死亡时自动发一条聊天消息，也可以顺便发一个表情。"
traditional_chinese = "你的 Tee 掉水死亡時自動發一條聊天訊息，也可以順便發一個表情。"
japanese = "自分の Tee が水に落ちて死亡したとき、チャットを自動で送ります。表情も一緒に送れます。"
korean = "내 Tee가 물에 빠져 죽을 때 채팅을 자동으로 보내며, 원하면 이모티콘도 함께 보냅니다."
russian = "Когда ваш ти при падении в воду погибает, автоматически отправляет сообщение в чат и, по желанию, эмоцию."
german = "Schickt automatisch eine Chatnachricht und optional ein Emoticon, wenn dein Tee im Wasser stirbt."
spanish = "Escribe un mensaje en el chat y, opcionalmente, envía un emoticono cuando tu tee muere en el agua."
french = "Écrit un message dans le chat et, en option, envoie un emoticon lorsque ton tee meurt dans l'eau."
brazilian_portuguese = "Escreve uma mensagem no chat e, opcionalmente, envia um emoticon quando seu tee morre na água."
portuguese = "Escreve uma mensagem no chat e, opcionalmente, envia um emoticon quando o teu tee morre na água."
turkish = "Tee'n suda öldüğünde sohbete otomatik mesaj yazar, istersen bir ifade de gönderir."
polish = "Pisze wiadomość na czacie i opcjonalnie wysyła emotikonę, gdy twój tee ginie w wodzie."

[[message]]
key = "Turn on \"Auto chat in water\", type the \"Chat message\" you want, and optionally enable \"Send emoticon in water\" with its ID."
[message.translations]
simplified_chinese = "打开「掉水自动发言」，填上想要的聊天内容，想要表情就再开启「掉水发表情」并选好表情 ID。"
traditional_chinese = "開啟「掉水自動發言」，填上想要的聊天內容，想要表情就再開啟「掉水發表情」並選好表情 ID。"
japanese = "「水中で自動チャット」をオンにして送りたい「チャットメッセージ」を入力し、必要なら「水中で表情を送信」と表情 ID も設定します。"
korean = "\"물에 빠지면 자동 채팅\"을 켜고 보낼 \"채팅 메시지\"를 입력한 뒤, 원하면 \"물에 빠지면 이모티콘 보내기\"와 이모티콘 ID를 설정하세요."
russian = "Включите «Автосообщение при падении в воду», впишите нужное «Сообщение в чат» и при желании включите «Отправлять эмоцию» с её ID."
german = "Aktiviere „Auto-Chat im Wasser\", trage die gewünschte „Chatnachricht\" ein und aktiviere bei Bedarf „Emoticon im Wasser senden\" samt ID."
spanish = "Activa «Chat automático en el agua», escribe el «Mensaje de chat» que quieras y, si lo deseas, activa «Enviar emoticono en el agua» con su ID."
french = "Active « Chat auto dans l'eau », saisis le « Message de chat » voulu et, en option, active « Envoyer un emoticon dans l'eau » avec son ID."
brazilian_portuguese = "Ligue \"Chat automático na água\", digite a \"Mensagem de chat\" desejada e, se quiser, ative \"Enviar emoticon na água\" com o ID."
portuguese = "Liga \"Chat automático na água\", escreve a \"Mensagem de chat\" pretendida e, se quiseres, ativa \"Enviar emoticon na água\" com o ID."
turkish = "\"Suda otomatik sohbet\"i aç, istediğin \"Sohbet mesajı\"nı yaz ve istersen \"Suda ifade gönder\"i ID'siyle etkinleştir."
polish = "Włącz „Automatyczny czat w wodzie\", wpisz wybraną „Wiadomość na czacie\", a w razie potrzeby włącz „Wysyłaj emotikonę w wodzie\" wraz z jej ID."

[[message]]
key = "The message is sent on every water death, so keep it short; leaving \"Chat message\" empty disables sending."
[message.translations]
simplified_chinese = "每次掉水都会发一次，所以内容尽量短；聊天内容留空就不会发送。"
traditional_chinese = "每次掉水都會發一次，所以內容盡量短；聊天內容留空就不會發送。"
japanese = "水に落ちるたびに送信されるので短くしておきましょう。「チャットメッセージ」を空にすると送信しません。"
korean = "물에 빠질 때마다 전송되니 짧게 쓰세요. \"채팅 메시지\"를 비우면 전송하지 않습니다."
russian = "Сообщение уходит при каждой смерти в воде, поэтому пишите коротко; пустое «Сообщение в чат» отключает отправку."
german = "Die Nachricht geht bei jedem Wassertod raus, halte sie also kurz; ein leeres „Chatnachricht\"-Feld deaktiviert den Versand."
spanish = "Se envía en cada muerte en el agua, así que déjalo corto; con «Mensaje de chat» vacío no se envía nada."
french = "Le message part à chaque mort dans l'eau, reste donc concis ; un « Message de chat » vide désactive l'envoi."
brazilian_portuguese = "A mensagem vai a cada morte na água, então mantenha curta; com \"Mensagem de chat\" vazia nada é enviado."
portuguese = "A mensagem vai a cada morte na água, por isso mantém-na curta; com \"Mensagem de chat\" vazia nada é enviado."
turkish = "Mesaj her suda ölümde gönderilir, bu yüzden kısa tut; \"Sohbet mesajı\" boşsa gönderim yapılmaz."
polish = "Wiadomość idzie przy każdym zgonie w wodzie, więc trzymaj ją krótką; puste „Wiadomość na czacie\" wyłącza wysyłanie."

[[message]]
key = "Animates the weapon in your hand when you switch or reload, plus an optional hammer rotation mode."
[message.translations]
simplified_chinese = "切换武器或换弹时，让手里的武器做出动作；另外还有一个可选的锤子旋转模式。"
traditional_chinese = "切換武器或換彈時，讓手裡的武器做出動作；另外還有一個可選的錘子旋轉模式。"
japanese = "武器を持ち替えたりリロードしたりするときに、手元の武器を動かします。任意でハンマーの回転モードも使えます。"
korean = "무기를 바꾸거나 재장전할 때 손에 든 무기에 움직임을 넣고, 선택적으로 해머 회전 모드도 쓸 수 있습니다."
russian = "Анимирует оружие в руке при смене и перезарядке, а также даёт необязательный режим вращения молота."
german = "Animiert die Waffe in der Hand beim Wechseln oder Nachladen, dazu ein optionaler Hammer-Drehmodus."
spanish = "Anima el arma en la mano al cambiar o recargar, además de un modo opcional de rotación del martillo."
french = "Anime l'arme en main lors d'un changement ou d'un rechargement, avec en option un mode de rotation du marteau."
brazilian_portuguese = "Anima a arma na mão ao trocar ou recarregar, além de um modo opcional de rotação do martelo."
portuguese = "Anima a arma na mão ao trocar ou recarregar, além de um modo opcional de rotação do martelo."
turkish = "Silah değiştirirken veya şarjör doldururken elindeki silahı hareket ettirir; isteğe bağlı bir çekiç döndürme modu da vardır."
polish = "Animuje broń w ręce przy zmianie lub przeładowaniu, a dodatkowo daje opcjonalny tryb obrotu młotka."

[[message]]
key = "Turn on \"Weapon switch animation\" or \"Play a flip animation while reloading weapons\", then pick an \"Animation range\" and tune duration, distance and rotation."
[message.translations]
simplified_chinese = "打开武器切换动画或换弹翻转动画，再选动画范围，并调整时长、距离和旋转角度。"
traditional_chinese = "開啟武器切換動畫或換彈翻轉動畫，再選動畫範圍，並調整時長、距離和旋轉角度。"
japanese = "武器の持ち替えアニメーションかリロード時のフリップアニメーションをオンにし、アニメーション範囲を選んで長さ・距離・回転を調整します。"
korean = "무기 교체 애니메이션 또는 재장전 시 뒤집기 애니메이션을 켜고, 애니메이션 범위를 고른 뒤 길이·거리·회전을 조절하세요."
russian = "Включите анимацию смены оружия или переворот при перезарядке, выберите диапазон анимации и настройте длительность, дистанцию и поворот."
german = "Aktiviere die Waffenwechsel-Animation oder die Dreh-Animation beim Nachladen, wähle einen Animationsbereich und stelle Dauer, Distanz und Drehung ein."
spanish = "Activa la animación al cambiar de arma o el volteo al recargar, elige un rango de animación y ajusta duración, distancia y rotación."
french = "Active l'animation de changement d'arme ou le retournement au rechargement, choisis une portée d'animation et règle durée, distance et rotation."
brazilian_portuguese = "Ative a animação ao trocar de arma ou o giro ao recarregar, escolha um alcance da animação e ajuste duração, distância e rotação."
portuguese = "Ativa a animação ao trocar de arma ou o giro ao recarregar, escolhe um alcance da animação e ajusta duração, distância e rotação."
turkish = "Silah değiştirme animasyonunu veya şarjör doldururken dönme animasyonunu aç, animasyon aralığını seç ve süre, mesafe ile dönüşü ayarla."
polish = "Włącz animację zmiany broni lub obrót przy przeładowaniu, wybierz zasięg animacji i ustaw czas, odległość oraz obrót."

[[message]]
key = "\"Hammer Mode\" applies even with both animations off, so check it if your hammer keeps turning with the cursor."
[message.translations]
simplified_chinese = "锤子模式即使两个动画都关掉也照样生效；如果锤子一直跟着光标转，先检查这一项。"
traditional_chinese = "錘子模式即使兩個動畫都關掉也照樣生效；如果錘子一直跟著游標轉，先檢查這一項。"
japanese = "ハンマーモードは2つのアニメーションを両方オフにしても有効です。ハンマーがカーソルに合わせて回り続けるときはここを確認してください。"
korean = "해머 모드는 두 애니메이션을 모두 꺼도 그대로 적용됩니다. 해머가 계속 커서를 따라 돌면 이 항목을 확인하세요."
russian = "Режим молота работает даже при выключенных анимациях: если молот продолжает поворачиваться за курсором, проверьте его."
german = "Der Hammer-Modus gilt auch bei ausgeschalteten Animationen; dreht sich dein Hammer weiter mit dem Cursor, liegt es hier."
spanish = "El modo martillo se aplica aunque las dos animaciones estén desactivadas; si tu martillo sigue girando con el cursor, revisa esto."
french = "Le mode marteau s'applique même avec les deux animations désactivées ; si ton marteau continue de tourner avec le curseur, regarde ici."
brazilian_portuguese = "O modo martelo vale mesmo com as duas animações desligadas; se o martelo continua girando com o cursor, veja esta opção."
portuguese = "O modo martelo aplica-se mesmo com as duas animações desligadas; se o martelo continua a girar com o cursor, vê esta opção."
turkish = "Çekiç modu iki animasyon kapalıyken de geçerlidir; çekicin imleçle dönmeye devam ediyorsa buraya bak."
polish = "Tryb młotka działa nawet przy wyłączonych obu animacjach; jeśli młotek dalej obraca się za kursorem, sprawdź tę opcję."

[[message]]
key = "Plays a short effect when a tee's skin changes, and can copy the skin of the tee you just hammered."
[message.translations]
simplified_chinese = "皮肤的 Tee 换肤时播放一个短效果，还可以把刚锤到的那个人的皮肤复制过来。"
traditional_chinese = "皮膚的 Tee 換膚時播放一個短效果，還可以把剛錘到的那個人的皮膚複製過來。"
japanese = "Tee のスキンが変わったときに短いエフェクトを出します。たった今ハンマーで叩いた相手のスキンをコピーすることもできます。"
korean = "Tee의 스킨이 바뀔 때 짧은 효과를 재생하고, 방금 해머로 친 상대의 스킨을 복사할 수도 있습니다."
russian = "Проигрывает короткий эффект при смене скина и может скопировать скин того, кого вы только что ударили молотом."
german = "Spielt einen kurzen Effekt ab, wenn sich der Skin eines Tees ändert, und kann den Skin des gerade gehämmerten Tees übernehmen."
spanish = "Reproduce un efecto breve cuando cambia la skin de un tee y puede copiar la skin del tee al que acabas de dar con el martillo."
french = "Joue un effet court quand le skin d'un tee change, et peut copier le skin du tee que tu viens de frapper au marteau."
brazilian_portuguese = "Toca um efeito curto quando a skin de um tee muda e pode copiar a skin do tee que você acabou de acertar com o martelo."
portuguese = "Reproduz um efeito curto quando a skin de um tee muda e pode copiar a skin do tee que acabaste de acertar com o martelo."
turkish = "Bir tee'nin skini değiştiğinde kısa bir efekt oynatır ve az önce çekiçle vurduğun tee'nin skinini kopyalayabilir."
polish = "Odtwarza krótki efekt, gdy zmienia się skin tee, i potrafi skopiować skin tee, w które właśnie uderzyłeś młotkiem."

[[message]]
key = "Turn on \"Skin transition animation\", choose a \"Skin transition type\" and \"Animation range\", then set \"Skin transition duration\" and \"Skin transition intensity\"."
[message.translations]
simplified_chinese = "打开换肤过渡动画，选择过渡类型和动画范围，再调过渡时长和过渡强度。"
traditional_chinese = "開啟換膚過渡動畫，選擇過渡類型和動畫範圍，再調過渡時長和過渡強度。"
japanese = "スキン切り替えアニメーションをオンにし、切り替えタイプとアニメーション範囲を選んで、切り替えの長さと強さを設定します。"
korean = "스킨 전환 애니메이션을 켜고 전환 유형과 애니메이션 범위를 고른 뒤, 전환 시간과 강도를 설정하세요."
russian = "Включите анимацию смены скина, выберите тип и диапазон анимации, затем задайте длительность и интенсивность."
german = "Aktiviere die Skin-Wechsel-Animation, wähle Typ und Animationsbereich und stelle dann Dauer und Stärke des Wechsels ein."
spanish = "Activa la animación de transición de skin, elige el tipo y el rango de animación, y ajusta duración e intensidad."
french = "Active l'animation de transition de skin, choisis le type et la portée d'animation, puis règle durée et intensité."
brazilian_portuguese = "Ative a animação de transição de skin, escolha o tipo e o alcance da animação e ajuste duração e intensidade."
portuguese = "Ativa a animação de transição de skin, escolhe o tipo e o alcance da animação e ajusta duração e intensidade."
turkish = "Skin geçiş animasyonunu aç, geçiş türünü ve animasyon aralığını seç, ardından geçiş süresi ile yoğunluğunu ayarla."
polish = "Włącz animację przejścia skina, wybierz typ i zasięg animacji, a następnie ustaw czas trwania i intensywność."

[[message]]
key = "Enable \"Hammer skin steal\" only if you want your skin to change on every hammer hit, since other players see it too."
[message.translations]
simplified_chinese = "只有想每次锤中都换皮肤时才开启锤中偷皮——别人也会看到你的皮肤在变。"
traditional_chinese = "只有想每次錘中都換皮膚時才開啟錘中偷皮——別人也會看到你的皮膚在變。"
japanese = "ハンマーで叩くたびにスキンを変えたいときだけ、ハンマースキン強奪をオンにしてください。相手にも見えます。"
korean = "해머로 칠 때마다 스킨이 바뀌길 원할 때만 해머 스킨 강탈을 켜세요. 다른 플레이어에게도 보입니다."
russian = "Включайте кражу скина молотом только если хотите менять скин при каждом ударе: другие игроки это видят."
german = "Aktiviere das Skin-Stehlen per Hammer nur, wenn dein Skin bei jedem Treffer wechseln soll – andere Spieler sehen das mit."
spanish = "Activa el robo de skin con martillo solo si quieres cambiar de skin con cada golpe, porque los demás también lo ven."
french = "N'active le vol de skin au marteau que si tu veux changer de skin à chaque coup, car les autres joueurs le voient aussi."
brazilian_portuguese = "Ative o roubo de skin com martelo só se quiser trocar de skin a cada acerto, porque os outros também veem."
portuguese = "Ativa o roubo de skin com martelo só se quiseres trocar de skin a cada acerto, porque os outros também veem."
turkish = "Çekiçle skin çalmayı yalnızca her vuruşta skinin değişmesini istiyorsan aç; diğer oyuncular da görür."
polish = "Włącz kradzież skina młotkiem tylko wtedy, gdy chcesz zmieniać skin przy każdym trafieniu — inni też to widzą."

[[message]]
key = "Shows each player's latest chat message in a bubble above their head, in addition to the chat box."
[message.translations]
simplified_chinese = "除了聊天框之外，还在每个玩家头顶用气泡显示他最近一条聊天。"
traditional_chinese = "除了聊天框之外，還在每個玩家頭頂用氣泡顯示他最近一則聊天。"
japanese = "チャット欄に加えて、各プレイヤーの最新のチャットを頭上の吹き出しで表示します。"
korean = "채팅창과 별도로 각 플레이어의 최근 채팅을 머리 위 말풍선으로 보여 줍니다."
russian = "Показывает последнее сообщение каждого игрока в пузыре над головой, помимо окна чата."
german = "Zeigt die letzte Chatnachricht jedes Spielers zusätzlich zum Chatfenster in einer Blase über dem Kopf."
spanish = "Muestra el último mensaje de chat de cada jugador en un globo sobre su cabeza, además de la caja de chat."
french = "Affiche le dernier message de chat de chaque joueur dans une bulle au-dessus de sa tête, en plus de la fenêtre de chat."
brazilian_portuguese = "Mostra a última mensagem de chat de cada jogador em um balão sobre a cabeça, além da caixa de chat."
portuguese = "Mostra a última mensagem de chat de cada jogador num balão sobre a cabeça, além da caixa de chat."
turkish = "Sohbet kutusuna ek olarak her oyuncunun son mesajını başının üstünde baloncukla gösterir."
polish = "Pokazuje ostatnią wiadomość czatu każdego gracza w dymku nad głową, oprócz okna czatu."

[[message]]
key = "Turn on \"Show chat bubbles above players\", then adjust \"Duration\", \"Bubble opacity\" and \"Font size\", or pick your own colors."
[message.translations]
simplified_chinese = "打开在玩家头顶显示聊天气泡，再调显示时长、气泡不透明度和字号，也可以自己选颜色。"
traditional_chinese = "開啟在玩家頭頂顯示聊天氣泡，再調顯示時長、氣泡不透明度和字級，也可以自己選顏色。"
japanese = "プレイヤー頭上にチャット吹き出しを表示をオンにし、表示時間・吹き出しの不透明度・文字サイズを調整します。色も自由に選べます。"
korean = "플레이어 머리 위에 채팅 말풍선 표시를 켜고 표시 시간, 말풍선 불투명도, 글자 크기를 조절하세요. 색도 직접 고를 수 있습니다."
russian = "Включите показ пузырей над игроками, затем настройте длительность, непрозрачность пузыря и размер шрифта либо выберите свои цвета."
german = "Aktiviere Chatblasen über Spielern und stelle Dauer, Deckkraft und Schriftgröße ein; die Farben lassen sich frei wählen."
spanish = "Activa mostrar globos de chat sobre los jugadores y ajusta duración, opacidad del globo y tamaño de fuente; los colores son libres."
french = "Active l'affichage des bulles de chat au-dessus des joueurs, puis règle durée, opacité et taille de police, ou choisis tes couleurs."
brazilian_portuguese = "Ative mostrar balões de chat sobre os jogadores e ajuste duração, opacidade do balão e tamanho da fonte; as cores são livres."
portuguese = "Ativa mostrar balões de chat sobre os jogadores e ajusta duração, opacidade do balão e tamanho da letra; as cores são livres."
turkish = "Oyuncuların üstünde sohbet balonu göstermeyi aç, ardından süre, balon saydamlığı ve yazı boyutunu ayarla; renkleri de seçebilirsin."
polish = "Włącz pokazywanie dymków czatu nad graczami, a potem ustaw czas, krycie dymka i rozmiar czcionki; kolory wybierasz sam."

[[message]]
key = "Zen mode hides chat bubbles even when this is on, and a long \"Duration\" leaves old lines on screen."
[message.translations]
simplified_chinese = "禅模式开启时即使这里有开也不会显示气泡；显示时长设得太久，旧消息会一直挂在屏幕上。"
traditional_chinese = "禪模式開啟時即使這裡有開也不會顯示氣泡；顯示時長設得太久，舊訊息會一直掛在螢幕上。"
japanese = "禅モード中はここがオンでも吹き出しは出ません。表示時間を長くしすぎると古い行が画面に残ります。"
korean = "젠 모드에서는 이 항목이 켜져 있어도 말풍선이 보이지 않습니다. 표시 시간을 길게 하면 오래된 줄이 화면에 남습니다."
russian = "В дзен-режиме пузыри не показываются, даже если включены; слишком большая длительность оставляет старые строки на экране."
german = "Im Zen-Modus erscheinen keine Chatblasen, auch wenn dies an ist; eine zu lange Dauer lässt alte Zeilen stehen."
spanish = "El modo Zen oculta los globos aunque esto esté activado, y una duración muy larga deja líneas antiguas en pantalla."
french = "Le mode Zen masque les bulles même si c'est activé, et une durée trop longue laisse d'anciennes lignes à l'écran."
brazilian_portuguese = "O modo Zen oculta os balões mesmo com isto ligado, e uma duração longa deixa falas antigas na tela."
portuguese = "O modo Zen oculta os balões mesmo com isto ligado, e uma duração longa deixa falas antigas no ecrã."
turkish = "Zen modu açıkken bu seçenek açık olsa da balonlar görünmez; süreyi çok uzun yaparsan eski satırlar ekranda kalır."
polish = "Tryb Zen ukrywa dymki nawet przy włączonej opcji, a zbyt długi czas zostawia stare linie na ekranie."

[[message]]
key = "Smooths the camera while you free-spectate with the mouse in live games and demos, so pans glide instead of snapping."
[message.translations]
simplified_chinese = "在实况和回放里用鼠标自由观战时，让镜头平滑移动，而不是一格一格地跳。"
traditional_chinese = "在實況和回放裡用滑鼠自由觀戰時，讓鏡頭平滑移動，而不是一格一格地跳。"
japanese = "対戦中やデモでマウスを使って自由観戦するとき、カメラを滑らかに動かします。カクカクせずに流れるように移動します。"
korean = "실시간 게임과 데모에서 마우스로 자유 관전할 때 카메라를 부드럽게 움직여, 끊기지 않고 미끄러지듯 이동합니다."
russian = "Сглаживает камеру при свободном наблюдении мышью в игре и демо: панорама плавно скользит, а не прыгает."
german = "Glättet die Kamera beim freien Zuschauen mit der Maus in Spiel und Demo, sodass Schwenks gleiten statt springen."
spanish = "Suaviza la cámara al observar libremente con el ratón en partidas y demos, para que los desplazamientos fluyan en vez de saltar."
french = "Adoucit la caméra quand tu observes librement à la souris en jeu et en démo : les mouvements glissent au lieu de sauter."
brazilian_portuguese = "Suaviza a câmera ao assistir livremente com o mouse em partidas e demos, fazendo o movimento deslizar em vez de pular."
portuguese = "Suaviza a câmara ao observar livremente com o rato em partidas e demos, fazendo o movimento deslizar em vez de saltar."
turkish = "Canlı oyunda ve demoda fareyle serbest izlerken kamerayı yumuşatır; geçişler zıplamak yerine kayar."
polish = "Wygładza kamerę podczas swobodnego oglądania myszą w grze i demach, dzięki czemu przesunięcia płyną zamiast skakać."

[[message]]
key = "Turn on \"Smooth free spectator camera\" and set \"Cinematic smoothness\": low values stay snappy, high values drift slowly."
[message.translations]
simplified_chinese = "打开平滑自由观战镜头并设置电影镜头平滑度：数值低反应快，数值高镜头慢慢漂。"
traditional_chinese = "開啟平滑自由觀戰鏡頭並設定電影鏡頭平滑度：數值低反應快，數值高鏡頭慢慢漂。"
japanese = "自由観戦カメラの平滑化をオンにして映画的平滑度を設定します。低いほど機敏、高いほどゆっくり流れます。"
korean = "자유 관전 카메라 부드럽게를 켜고 영화식 부드러움을 설정하세요. 낮으면 민첩하고 높으면 천천히 흐릅니다."
russian = "Включите сглаживание свободной камеры и задайте кинематографичную плавность: меньше — резче, больше — медленнее."
german = "Aktiviere die geglättete freie Zuschauerkamera und stelle die filmische Glättung ein: niedrig reagiert schnell, hoch schwebt langsam."
spanish = "Activa la cámara libre suavizada y ajusta la suavidad cinematográfica: valores bajos responden rápido, altos se deslizan despacio."
french = "Active la caméra libre adoucie et règle la douceur cinématographique : bas réagit vite, haut dérive lentement."
brazilian_portuguese = "Ative a câmera livre suavizada e ajuste a suavidade cinematográfica: baixo responde rápido, alto desliza devagar."
portuguese = "Ativa a câmara livre suavizada e ajusta a suavidade cinematográfica: baixo responde rápido, alto desliza devagar."
turkish = "Yumuşak serbest izleme kamerasını aç ve sinematik yumuşatmayı ayarla: düşük değer çevik, yüksek değer ağır kayar."
polish = "Włącz wygładzanie kamery swobodnego oglądania i ustaw kinowe wygładzenie: niskie reaguje żwawo, wysokie płynie wolno."

[[message]]
key = "Only free spectating is affected, not normal play; set \"Cinematic smoothness\" to 0 to keep instant camera response."
[message.translations]
simplified_chinese = "只影响自由观战，不影响正常游玩；把电影镜头平滑度设成 0 就恢复即时响应。"
traditional_chinese = "只影響自由觀戰，不影響正常遊玩；把電影鏡頭平滑度設成 0 就恢復即時反應。"
japanese = "影響するのは自由観戦だけで、通常のプレイは変わりません。映画的平滑度を 0 にすると即時反応に戻ります。"
korean = "자유 관전에만 적용되고 일반 플레이에는 영향이 없습니다. 영화식 부드러움을 0으로 두면 즉시 반응합니다."
russian = "Затрагивает только свободное наблюдение, не обычную игру; плавность 0 возвращает мгновенный отклик."
german = "Betrifft nur das freie Zuschauen, nicht das normale Spiel; Glättung 0 stellt die sofortige Reaktion wieder her."
spanish = "Solo afecta a la observación libre, no al juego normal; con suavidad 0 la cámara responde al instante."
french = "Seule l'observation libre est concernée, pas le jeu normal ; une douceur à 0 rend la réponse immédiate."
brazilian_portuguese = "Só afeta a observação livre, não o jogo normal; com suavidade 0 a câmera responde na hora."
portuguese = "Só afeta a observação livre, não o jogo normal; com suavidade 0 a câmara responde de imediato."
turkish = "Yalnızca serbest izlemeyi etkiler, normal oyunu değil; sinematik yumuşatmayı 0 yaparsan kamera anında tepki verir."
polish = "Dotyczy tylko swobodnego oglądania, nie zwykłej gry; wygładzenie 0 przywraca natychmiastową reakcję."

[[message]]
key = "Adds point lookup, an after-death scoreboard, scrolling for crowded servers and a name filter to the scoreboard."
[message.translations]
simplified_chinese = "给计分板加上查分、死亡后显示、人多的服务器可滚动，以及按名字筛选。"
traditional_chinese = "給計分板加上查分、死亡後顯示、人多的伺服器可滾動，以及依名字篩選。"
japanese = "スコアボードにポイント確認、死亡後の表示、人数が多いサーバー向けのスクロール、名前フィルターを追加します。"
korean = "스코어보드에 점수 확인, 사망 후 표시, 사람이 많은 서버를 위한 스크롤, 이름 필터를 추가합니다."
russian = "Добавляет в таблицу счёта проверку очков, показ после смерти, прокрутку для людных серверов и фильтр по имени."
german = "Ergänzt das Scoreboard um Punkteabfrage, Anzeige nach dem Tod, Scrollen für volle Server und einen Namensfilter."
spanish = "Añade a la tabla de puntos consulta de puntos, mostrarla tras morir, desplazamiento en servidores llenos y filtro por nombre."
french = "Ajoute au tableau des scores la vérification des points, l'affichage après la mort, le défilement sur les serveurs bondés et un filtre par nom."
brazilian_portuguese = "Adiciona ao placar consulta de pontos, exibição após a morte, rolagem em servidores cheios e filtro por nome."
portuguese = "Adiciona à tabela de pontuação consulta de pontos, exibição após a morte, deslocamento em servidores cheios e filtro por nome."
turkish = "Skor tablosuna puan sorgulama, ölüm sonrası gösterim, kalabalık sunucular için kaydırma ve isim filtresi ekler."
polish = "Dodaje do tabeli wyników sprawdzanie punktów, wyświetlanie po śmierci, przewijanie na zatłoczonych serwerach i filtr po nazwie."

[[message]]
key = "Turn on \"Better scoreboard\", then enable what you need: \"Scoreboard point check\", \"Show scoreboard after death\" or \"Scroll mode\"."
[message.translations]
simplified_chinese = "打开更好的计分板，再按需要开启计分板查分、死亡后显示计分板或滚动模式。"
traditional_chinese = "開啟更好的計分板，再依需要開啟計分板查分、死亡後顯示計分板或滾動模式。"
japanese = "より良いスコアボードをオンにし、必要ならスコアボードのポイント確認、死亡後のスコアボード表示、スクロールモードを有効にします。"
korean = "더 나은 스코어보드를 켜고 필요에 따라 스코어보드 점수 확인, 사망 후 스코어보드 표시, 스크롤 모드를 켜세요."
russian = "Включите улучшенную таблицу счёта и отметьте нужное: проверка очков, показ после смерти или режим прокрутки."
german = "Aktiviere das bessere Scoreboard und schalte nach Bedarf Punkteabfrage, Anzeige nach dem Tod oder Scrollmodus ein."
spanish = "Activa la tabla de puntos mejorada y habilita lo que necesites: consulta de puntos, mostrarla tras morir o modo desplazamiento."
french = "Active le tableau des scores amélioré, puis ce dont tu as besoin : vérification des points, affichage après la mort ou mode défilement."
brazilian_portuguese = "Ative o placar melhorado e ligue o que precisar: consulta de pontos, mostrar placar após a morte ou modo rolagem."
portuguese = "Ativa a tabela de pontuação melhorada e liga o que precisares: consulta de pontos, mostrar após a morte ou modo deslocamento."
turkish = "Gelişmiş skor tablosunu aç, sonra ihtiyacına göre puan sorgulama, ölüm sonrası gösterim veya kaydırma modunu etkinleştir."
polish = "Włącz ulepszoną tabelę wyników, a potem to, czego potrzebujesz: sprawdzanie punktów, pokazywanie po śmierci lub tryb przewijania."

[[message]]
key = "\"Scoreboard filter\" keeps only players whose name or clan matches, so clear it when the scoreboard looks empty."
[message.translations]
simplified_chinese = "计分板筛选只保留名字或战队匹配的玩家；计分板看起来空了，先清掉筛选内容。"
traditional_chinese = "計分板篩選只保留名字或戰隊符合的玩家；計分板看起來空了，先清掉篩選內容。"
japanese = "スコアボードフィルターは名前かクランが一致するプレイヤーだけを残します。スコアボードが空に見えたら入力を消してください。"
korean = "스코어보드 필터는 이름이나 클랜이 일치하는 플레이어만 남깁니다. 스코어보드가 비어 보이면 필터를 지우세요."
russian = "Фильтр оставляет только игроков с подходящим именем или кланом; если таблица кажется пустой, очистите фильтр."
german = "Der Scoreboard-Filter behält nur Spieler mit passendem Namen oder Clan; ist das Scoreboard leer, leere den Filter."
spanish = "El filtro de la tabla solo deja jugadores cuyo nombre o clan coincide; si la tabla parece vacía, bórralo."
french = "Le filtre du tableau ne garde que les joueurs dont le nom ou le clan correspond ; si le tableau semble vide, efface-le."
brazilian_portuguese = "O filtro do placar mantém só jogadores cujo nome ou clã bate; se o placar parecer vazio, limpe o filtro."
portuguese = "O filtro da tabela mantém só jogadores cujo nome ou clã corresponde; se a tabela parecer vazia, limpa o filtro."
turkish = "Skor tablosu filtresi yalnızca adı veya klanı eşleşen oyuncuları bırakır; tablo boş görünüyorsa filtreyi temizle."
polish = "Filtr tabeli wyników zostawia tylko graczy o pasującej nazwie lub klanie; jeśli tabela wygląda na pustą, wyczyść filtr."

[[message]]
key = "Draws a guide line from a weapon to where a shot would go, and can preview the ninja flight path."
[message.translations]
simplified_chinese = "从武器画一条线，指示子弹会飞向哪里；还能预览忍者的飞行路线。"
traditional_chinese = "從武器畫一條線，指示子彈會飛向哪裡；還能預覽忍者的飛行路線。"
japanese = "武器から弾が飛ぶ方向へガイド線を描き、ニンジャの飛行経路も予測できます。"
korean = "무기에서 탄이 날아갈 방향으로 안내선을 그리고, 닌자 비행 경로도 예측합니다."
russian = "Рисует линию от оружия туда, куда полетит выстрел, и может показать траекторию полёта ниндзя."
german = "Zeichnet eine Linie vom Waffenrohr dorthin, wo der Schuss hingeht, und kann die Flugbahn des Ninja anzeigen."
spanish = "Dibuja una línea desde el arma hasta donde iría el disparo y puede prever la trayectoria del ninja."
french = "Trace une ligne de l'arme vers l'endroit où partirait le tir et peut prévisualiser la trajectoire du ninja."
brazilian_portuguese = "Desenha uma linha da arma até onde o tiro iria e pode prever a trajetória do ninja."
portuguese = "Desenha uma linha da arma até onde o tiro iria e pode prever a trajetória do ninja."
turkish = "Silahın namlusundan atışın gideceği yöne kılavuz çizgi çizer ve ninja uçuş yolunu öngörebilir."
polish = "Rysuje linię od broni do miejsca, w które poleci strzał, i potrafi przewidzieć tor lotu ninjy."

[[message]]
key = "Set \"Display mode\" to \"Show on key\" or \"Always show\", then pick \"Pistol guide line\" and \"Predict ninja path\", plus color, \"Line width\" and \"Opacity\"."
[message.translations]
simplified_chinese = "把显示方式设为按键显示或一直显示，再按需开启手枪辅助线和预测忍者路径，并调整颜色、线宽和透明度。"
traditional_chinese = "把顯示方式設為按鍵顯示或一直顯示，再依需要開啟手槍輔助線和預測忍者路徑，並調整顏色、線寬和透明度。"
japanese = "表示モードをキー表示か常に表示にし、ピストルのガイド線や忍者経路の予測を選び、色・線幅・不透明度を調整します。"
korean = "표시 방식을 키를 누를 때와 항상 표시 중에서 고르고, 권총 안내선과 닌자 경로 예측을 선택한 뒤 색, 선 두께, 불투명도를 조절하세요."
russian = "Задайте режим показа: по клавише или всегда, затем включите линию пистолета и предсказание пути ниндзя, а также настройте цвет, толщину и непрозрачность."
german = "Stelle den Anzeigemodus auf Taste oder immer ein, wähle Pistolenhilfslinie und Ninja-Pfadvorhersage und justiere Farbe, Linienstärke und Deckkraft."
spanish = "Pon el modo de visualización en mostrar con tecla o siempre visible, elige la línea guía de pistola y la predicción del ninja, y ajusta color, grosor y opacidad."
french = "Règle le mode d'affichage sur touche ou toujours, choisis la ligne guide du pistolet et la prédiction du ninja, puis règle couleur, épaisseur et opacité."
brazilian_portuguese = "Defina o modo de exibição como mostrar na tecla ou sempre mostrar, escolha a linha guia da pistola e a previsão do ninja, e ajuste cor, espessura e opacidade."
portuguese = "Define o modo de exibição como mostrar na tecla ou mostrar sempre, escolhe a linha guia da pistola e a previsão do ninja, e ajusta cor, espessura e opacidade."
turkish = "Görüntüleme modunu tuşla göster veya her zaman göster yap, tabanca kılavuz çizgisi ile ninja yol tahminini seç, renk, çizgi kalınlığı ve saydamlığı ayarla."
polish = "Ustaw tryb wyświetlania na pokazuj po klawiszu lub pokazuj zawsze, wybierz linię prowadzącą pistoletu i przewidywanie toru ninjy, potem dostosuj kolor, grubość linii i krycie."

[[message]]
key = "\"Show on key\" needs a key bound to +showweapontrajectory; if nothing appears, switch to \"Always show\"."
[message.translations]
simplified_chinese = "按键显示需要一个绑到 +showweapontrajectory 的键；什么都没出现就换成一直显示。"
traditional_chinese = "按鍵顯示需要一個綁到 +showweapontrajectory 的鍵；什麼都沒出現就換成一直顯示。"
japanese = "キー表示には +showweapontrajectory に割り当てたキーが必要です。何も出ないときは常に表示に切り替えてください。"
korean = "키를 누를 때 표시하려면 +showweapontrajectory에 키가 지정되어 있어야 합니다. 아무것도 안 보이면 항상 표시로 바꾸세요."
russian = "Для показа по клавише нужна привязка к +showweapontrajectory; если ничего не появляется, включите показ всегда."
german = "Anzeige per Taste braucht eine Taste auf +showweapontrajectory; erscheint nichts, auf immer anzeigen wechseln."
spanish = "Mostrar con tecla necesita una tecla asignada a +showweapontrajectory; si no aparece nada, cambia a siempre visible."
french = "L'affichage par touche exige une touche assignée à +showweapontrajectory ; si rien n'apparaît, passe à toujours afficher."
brazilian_portuguese = "Mostrar na tecla exige uma tecla atribuída a +showweapontrajectory; se nada aparecer, mude para sempre mostrar."
portuguese = "Mostrar na tecla exige uma tecla atribuída a +showweapontrajectory; se nada aparecer, muda para mostrar sempre."
turkish = "Tuşla göster için +showweapontrajectory komutuna bir tuş atanmalı; hiçbir şey görünmüyorsa her zaman göster seçeneğine geç."
polish = "Pokazuj po klawiszu wymaga przypisania klawisza do +showweapontrajectory; jeśli nic się nie pojawia, przełącz na pokazuj zawsze."

[[message]]
key = "Watches your friend list and reports friends coming online or joining your map, with optional automatic greeting."
[message.translations]
simplified_chinese = "盯着你的好友列表，在好友上线或进入你所在地图时提醒你，还可以自动打招呼。"
traditional_chinese = "盯著你的好友清單，在好友上線或進入你所在的地圖時提醒你，還可以自動打招呼。"
japanese = "フレンドリストを監視し、フレンドがオンラインになったり同じマップに入ったりしたら知らせます。自動あいさつも可能です。"
korean = "친구 목록을 지켜보다가 친구가 접속하거나 같은 맵에 들어오면 알려 주고, 자동 인사도 할 수 있습니다."
russian = "Следит за списком друзей и сообщает, когда друг заходит в сеть или на вашу карту; есть необязательное авто-приветствие."
german = "Beobachtet deine Freundesliste und meldet, wenn Freunde online kommen oder auf deine Map joinen; optional mit automatischer Begrüßung."
spanish = "Vigila tu lista de amigos y avisa cuando un amigo se conecta o entra en tu mapa, con saludo automático opcional."
french = "Surveille ta liste d'amis et signale quand un ami se connecte ou rejoint ta map, avec un salut automatique en option."
brazilian_portuguese = "Vigia sua lista de amigos e avisa quando um amigo entra online ou no seu mapa, com saudação automática opcional."
portuguese = "Vigia a tua lista de amigos e avisa quando um amigo entra online ou no teu mapa, com saudação automática opcional."
turkish = "Arkadaş listeni izler, bir arkadaş çevrimiçi olduğunda veya haritana girdiğinde haber verir; isteğe bağlı otomatik selamlama da var."
polish = "Obserwuje listę znajomych i informuje, gdy znajomy wejdzie online lub na twoją mapę, z opcjonalnym automatycznym powitaniem."

[[message]]
key = "Turn on \"Notify when friends come online\" and \"Auto refresh server list\", then tune \"Refresh interval\"; \"Auto greet friends entering map\" is optional."
[message.translations]
simplified_chinese = "打开好友上线提醒和自动刷新服务器列表，再调刷新间隔；自动问候进图好友是可选项。"
traditional_chinese = "開啟好友上線提醒和自動重新整理伺服器清單，再調重新整理間隔；自動問候進圖好友是選項。"
japanese = "フレンドのオンライン通知とサーバーリストの自動更新をオンにし、更新間隔を調整します。マップに入ったフレンドへの自動あいさつは任意です。"
korean = "친구 접속 알림과 서버 목록 자동 새로 고침을 켜고 새로 고침 간격을 조절하세요. 맵에 들어온 친구에게 자동 인사는 선택 사항입니다."
russian = "Включите уведомление о друзьях и автообновление списка серверов, задайте интервал; авто-приветствие вошедшим на карту — по желанию."
german = "Aktiviere die Meldung bei Freunden und die automatische Serverlisten-Aktualisierung und stelle das Intervall ein; die automatische Begrüßung ist optional."
spanish = "Activa el aviso de amigos en línea y la actualización automática de la lista de servidores, ajusta el intervalo; el saludo automático es opcional."
french = "Active la notification d'amis en ligne et l'actualisation auto de la liste des serveurs, règle l'intervalle ; le salut automatique est optionnel."
brazilian_portuguese = "Ative o aviso de amigos online e a atualização automática da lista de servidores, ajuste o intervalo; a saudação automática é opcional."
portuguese = "Ativa o aviso de amigos online e a atualização automática da lista de servidores, ajusta o intervalo; a saudação automática é opcional."
turkish = "Arkadaş çevrimiçi bildirimini ve sunucu listesini otomatik yenilemeyi aç, yenileme aralığını ayarla; otomatik selamlama isteğe bağlı."
polish = "Włącz powiadomienia o znajomych online i automatyczne odświeżanie listy serwerów, ustaw interwał; automatyczne powitanie jest opcjonalne."

[[message]]
key = "Auto greet posts a public chat line a few seconds after a friend joins, so leave \"Greeting text\" empty on strict servers."
[message.translations]
simplified_chinese = "自动问候会在好友进图几秒后公开发一条聊天；管得严的服务器上就把问候语留空。"
traditional_chinese = "自動問候會在好友進圖幾秒後公開發一則聊天；管得嚴的伺服器上就把問候語留空。"
japanese = "自動あいさつはフレンドが入って数秒後に公開チャットを送ります。厳しいサーバーではあいさつ文を空にしておきましょう。"
korean = "자동 인사는 친구가 들어온 몇 초 뒤 공개 채팅을 보냅니다. 엄격한 서버에서는 인사 문구를 비워 두세요."
russian = "Авто-приветствие через несколько секунд пишет в общий чат; на строгих серверах оставьте текст приветствия пустым."
german = "Die automatische Begrüßung schreibt wenige Sekunden nach dem Join in den öffentlichen Chat; auf strengen Servern den Text leer lassen."
spanish = "El saludo automático escribe en el chat público a los pocos segundos; en servidores estrictos deja el texto vacío."
french = "Le salut automatique écrit dans le chat public quelques secondes après l'arrivée ; sur les serveurs stricts, laisse le texte vide."
brazilian_portuguese = "A saudação automática escreve no chat público poucos segundos depois; em servidores rígidos, deixe o texto vazio."
portuguese = "A saudação automática escreve no chat público poucos segundos depois; em servidores rígidos, deixa o texto vazio."
turkish = "Otomatik selamlama, arkadaş girdikten birkaç saniye sonra genel sohbete yazar; katı sunucularda selamlama metnini boş bırak."
polish = "Automatyczne powitanie pisze na publicznym czacie kilka sekund po wejściu; na surowych serwerach zostaw tekst powitania pusty."

[[message]]
key = "Replaces or hides chat lines that match words on your own list before they are shown to you."
[message.translations]
simplified_chinese = "聊天显示给你之前，把命中自建词表的整行替换掉或直接隐藏。"
traditional_chinese = "聊天顯示給你之前，把命中自建詞表的整行替換掉或直接隱藏。"
japanese = "自分で作った語句リストに一致するチャット行を、表示前に置き換えるか非表示にします。"
korean = "직접 만든 단어 목록과 일치하는 채팅 줄을 보여 주기 전에 바꾸거나 숨깁니다."
russian = "Заменяет или скрывает строки чата, совпавшие со словами из вашего списка, ещё до показа."
german = "Ersetzt oder versteckt Chatzeilen, die zu deiner eigenen Wortliste passen, bevor du sie siehst."
spanish = "Sustituye u oculta las líneas de chat que coinciden con tu lista de palabras antes de mostrártelas."
french = "Remplace ou masque les lignes de chat correspondant à ta liste de mots avant de te les montrer."
brazilian_portuguese = "Substitui ou oculta linhas de chat que batem com a sua lista de palavras antes de você vê-las."
portuguese = "Substitui ou oculta linhas de chat que correspondem à tua lista de palavras antes de as veres."
turkish = "Kendi kelime listene uyan sohbet satırlarını sana gösterilmeden önce değiştirir veya gizler."
polish = "Zamienia lub ukrywa linie czatu pasujące do twojej listy słów, zanim je zobaczysz."

[[message]]
key = "Turn on \"Enable word filter list\", type the words into \"Word Filter\" separated by commas, then choose \"Replace mode\" or \"Hide player messages\" under \"Behavior\"."
[message.translations]
simplified_chinese = "打开启用屏蔽词列表，在屏蔽词里用逗号分隔填好词，再在行为里选替换模式或隐藏玩家消息。"
traditional_chinese = "開啟啟用屏蔽詞清單，在屏蔽詞裡用逗號分隔填好詞，再在行為裡選替換模式或隱藏玩家訊息。"
japanese = "ワードフィルターを有効にするをオンにし、ワードフィルターに語句をカンマ区切りで入力し、動作で置換モードかプレイヤーメッセージを隠すを選びます。"
korean = "단어 필터 사용을 켜고 단어 필터에 단어를 쉼표로 구분해 입력한 뒤, 동작에서 바꾸기 모드 또는 플레이어 메시지 숨기기를 고르세요."
russian = "Включите список фильтра, впишите слова через запятую и выберите в поведении режим замены или скрытие сообщений игрока."
german = "Aktiviere die Wortfilterliste, trage die Wörter durch Kommas getrennt ein und wähle unter Verhalten den Ersetzungsmodus oder Spielernachrichten verstecken."
spanish = "Activa la lista de filtro, escribe las palabras separadas por comas y elige en comportamiento el modo sustituir u ocultar mensajes de jugadores."
french = "Active la liste de filtre, saisis les mots séparés par des virgules, puis choisis dans comportement le mode remplacer ou masquer les messages des joueurs."
brazilian_portuguese = "Ative a lista de filtro, digite as palavras separadas por vírgulas e escolha em comportamento o modo substituir ou ocultar mensagens de jogadores."
portuguese = "Ativa a lista de filtro, escreve as palavras separadas por vírgulas e escolhe em comportamento o modo substituir ou ocultar mensagens de jogadores."
turkish = "Kelime filtresi listesini etkinleştir, kelimeleri virgülle ayırarak kelime filtresine yaz, sonra davranış altında değiştirme modu veya oyuncu mesajlarını gizle seçeneğini seç."
polish = "Włącz listę filtra, wpisz słowa oddzielone przecinkami, a następnie w zachowaniu wybierz tryb zamiany lub ukrywanie wiadomości graczy."

[[message]]
key = "\"Hide player messages\" removes the whole line, including team chat that merely mentions a blocked word."
[message.translations]
simplified_chinese = "隐藏玩家消息会整行删掉，连只是在团队聊天里提到屏蔽词的整句也一起消失。"
traditional_chinese = "隱藏玩家訊息會整行刪掉，連只是在團隊聊天裡提到屏蔽詞的整句也一起消失。"
japanese = "プレイヤーメッセージを隠すは行ごと消します。チームチャットで語句に触れただけの行も消えます。"
korean = "플레이어 메시지 숨기기는 줄 전체를 지웁니다. 팀 채팅에서 차단 단어를 언급하기만 해도 사라집니다."
russian = "Скрытие сообщений игрока убирает строку целиком, включая командный чат, где слово лишь упомянуто."
german = "Spielernachrichten verstecken entfernt die ganze Zeile, auch Teamchat, der das Wort nur erwähnt."
spanish = "Ocultar mensajes de jugadores borra la línea entera, incluido el chat de equipo que solo menciona la palabra."
french = "Masquer les messages des joueurs supprime toute la ligne, y compris le chat d'équipe qui ne fait que mentionner le mot."
brazilian_portuguese = "Ocultar mensagens de jogadores remove a linha inteira, inclusive o chat de time que só menciona a palavra."
portuguese = "Ocultar mensagens de jogadores remove a linha inteira, incluindo o chat de equipa que apenas menciona a palavra."
turkish = "Oyuncu mesajlarını gizle satırın tamamını kaldırır; kelimeyi yalnızca anan takım sohbeti de gider."
polish = "Ukrywanie wiadomości graczy usuwa całą linię, także czat drużynowy, który tylko wspomina słowo."

[[message]]
key = "Draws a small second view of your other tee in the HUD, so you can watch both tees at the same time."
[message.translations]
simplified_chinese = "在 HUD 上画出另一个分身的第二视角小窗，让你能同时盯住两个 Tee。"
traditional_chinese = "在 HUD 上畫出另一個分身的第二視角小窗，讓你能同時盯住兩個 Tee。"
japanese = "HUD にもう一方の Tee の小さな視点を表示し、2 体を同時に見られるようにします。"
korean = "HUD에 다른 Tee의 작은 화면을 추가해 두 Tee를 동시에 볼 수 있게 합니다."
russian = "Рисует в HUD маленькое второе окно с вашим другим ти, чтобы видеть оба сразу."
german = "Zeichnet ein kleines zweites Bild deines anderen Tees ins HUD, damit du beide gleichzeitig siehst."
spanish = "Dibuja en el HUD una pequeña segunda vista de tu otro tee para vigilar ambos a la vez."
french = "Affiche dans le HUD une petite seconde vue de ton autre tee pour surveiller les deux en même temps."
brazilian_portuguese = "Desenha no HUD uma pequena segunda visão do seu outro tee para acompanhar os dois ao mesmo tempo."
portuguese = "Desenha no HUD uma pequena segunda vista do teu outro tee para acompanhares os dois ao mesmo tempo."
turkish = "HUD'a diğer tee'nin küçük ikinci görünümünü çizer, böylece iki tee'yi aynı anda izleyebilirsin."
polish = "Rysuje w HUD mały drugi widok twojego drugiego tee, abyś widział oba jednocześnie."

[[message]]
key = "Turn on \"Enable dummy window\", then set \"Dummy window size\" and \"Dummy window zoom\"; \"Only show when the other Tee is not on screen\" hides it otherwise."
[message.translations]
simplified_chinese = "打开启用分身小窗，再调分身小窗大小和缩放；勾上只在另一个 Tee 不在画面内时显示，其它时候它就会藏起来。"
traditional_chinese = "開啟啟用分身小窗，再調分身小窗大小和縮放；勾上只在另一個 Tee 不在畫面內時顯示，其他時候它就會藏起來。"
japanese = "ダミーウィンドウを有効にするをオンにし、ダミーウィンドウのサイズとズームを設定します。もう一方の Tee が画面内にいるときは非表示にするオプションもあります。"
korean = "더미 창 사용을 켜고 더미 창 크기와 확대를 설정하세요. 다른 Tee가 화면에 보일 때만 숨기는 옵션도 있습니다."
russian = "Включите окно дамми, задайте размер и масштаб; опция показывать только когда второго ти не видно скрывает его в остальное время."
german = "Aktiviere das Dummy-Fenster, stelle Größe und Zoom ein; die Option nur zeigen, wenn der andere Tee nicht sichtbar ist blendet es sonst aus."
spanish = "Activa la ventana del dummy, ajusta tamaño y zoom; la opción de mostrarla solo cuando el otro tee no está en pantalla la oculta el resto del tiempo."
french = "Active la fenêtre du dummy, règle taille et zoom ; l'option de ne l'afficher que si l'autre tee n'est pas à l'écran la masque sinon."
brazilian_portuguese = "Ative a janela do dummy, ajuste tamanho e zoom; a opção de mostrar só quando o outro tee não está na tela a esconde no resto do tempo."
portuguese = "Ativa a janela do dummy, ajusta tamanho e zoom; a opção de mostrar só quando o outro tee não está no ecrã esconde-a no resto do tempo."
turkish = "Dummy penceresini etkinleştir, boyut ve yakınlaştırmayı ayarla; yalnızca diğer Tee ekranda değilken göster seçeneği diğer zamanlarda gizler."
polish = "Włącz okno dummy, ustaw rozmiar i powiększenie; opcja pokazuj tylko, gdy drugi tee nie jest na ekranie, ukrywa je w innym wypadku."

[[message]]
key = "It only appears with a connected dummy and renders an extra scene each frame, so lower \"Dummy window size\" if FPS drops."
[message.translations]
simplified_chinese = "只有连着分身时才会出现，而且每帧多渲染一个场景；掉帧就把分身小窗大小调小。"
traditional_chinese = "只有連著分身時才會出現，而且每幀多算繪一個場景；掉幀就把分身小窗大小調小。"
japanese = "ダミー接続時だけ表示され、毎フレーム追加のシーンを描画します。FPS が落ちるならダミーウィンドウのサイズを下げてください。"
korean = "더미가 연결되어 있을 때만 나오고 매 프레임 장면을 하나 더 그립니다. 프레임이 떨어지면 더미 창 크기를 줄이세요."
russian = "Появляется только при подключённом дамми и рисует дополнительную сцену каждый кадр; если FPS падает, уменьшите размер окна."
german = "Erscheint nur mit verbundenem Dummy und rendert jede Frame eine zusätzliche Szene; bei FPS-Verlust die Fenstergröße verkleinern."
spanish = "Solo aparece con un dummy conectado y renderiza una escena extra por fotograma; si bajan los FPS, reduce el tamaño de la ventana."
french = "N'apparaît qu'avec un dummy connecté et rend une scène supplémentaire par image ; si les FPS chutent, réduis la taille de la fenêtre."
brazilian_portuguese = "Só aparece com um dummy conectado e renderiza uma cena extra por quadro; se o FPS cair, reduza o tamanho da janela."
portuguese = "Só aparece com um dummy ligado e renderiza uma cena extra por imagem; se o FPS cair, reduz o tamanho da janela."
turkish = "Yalnızca bağlı bir dummy varken görünür ve her karede ek bir sahne çizer; FPS düşerse dummy penceresi boyutunu küçült."
polish = "Pojawia się tylko przy podłączonym dummy i renderuje dodatkową scenę w każdej klatce; jeśli FPS spada, zmniejsz rozmiar okna."

[[message]]
key = "Turns important server prompts and Echo messages into short popups instead of plain lines in the chat box."
[message.translations]
simplified_chinese = "把重要的服务器提示和 Echo 消息做成短提示卡，而不是聊天框里的普通一行。"
traditional_chinese = "把重要的伺服器提示和 Echo 訊息做成短提示卡，而不是聊天框裡的普通一行。"
japanese = "重要なサーバー案内や Echo メッセージを、チャット欄の一行ではなく短いポップアップで表示します。"
korean = "중요한 서버 안내와 Echo 메시지를 채팅창의 한 줄 대신 짧은 알림으로 보여 줍니다."
russian = "Показывает важные серверные объявления и сообщения Echo короткими всплывающими карточками вместо строк в чате."
german = "Zeigt wichtige Serverhinweise und Echo-Nachrichten als kurze Karten statt als Zeile im Chat."
spanish = "Muestra avisos importantes del servidor y mensajes Echo como tarjetas cortas en vez de líneas en el chat."
french = "Affiche les messages importants du serveur et d'Echo sous forme de courtes cartes au lieu de lignes dans le chat."
brazilian_portuguese = "Mostra avisos importantes do servidor e mensagens Echo como cartões curtos em vez de linhas no chat."
portuguese = "Mostra avisos importantes do servidor e mensagens Echo como cartões curtos em vez de linhas no chat."
turkish = "Önemli sunucu uyarılarını ve Echo mesajlarını sohbet kutusundaki satır yerine kısa kartlar olarak gösterir."
polish = "Pokazuje ważne komunikaty serwera i wiadomości Echo jako krótkie karty zamiast linii w oknie czatu."

[[message]]
key = "Turn on \"Show important server prompts as notifications\" or \"Route Echo messages to notifications\", then set \"Notification hold time\" and \"Notification text size\"."
[message.translations]
simplified_chinese = "打开把重要服务器提示显示为通知或把 Echo 消息转发到通知，再设置每条显示多久和通知文字大小。"
traditional_chinese = "開啟把重要伺服器提示顯示為通知或把 Echo 訊息轉發到通知，再設定每條顯示多久和通知文字大小。"
japanese = "重要なサーバー案内を通知で表示、または Echo メッセージを通知に回すをオンにし、表示時間と通知の文字サイズを設定します。"
korean = "중요 서버 안내를 알림으로 표시 또는 Echo 메시지를 알림으로 보내기를 켜고, 알림 표시 시간과 글자 크기를 설정하세요."
russian = "Включите показ важных серверных объявлений в уведомлениях или перенос Echo в уведомления, затем задайте время показа и размер текста."
german = "Aktiviere wichtige Serverhinweise als Benachrichtigung oder Echo-Nachrichten als Benachrichtigung und stelle Anzeigedauer und Textgröße ein."
spanish = "Activa mostrar avisos importantes como notificaciones o enviar mensajes Echo a notificaciones, y ajusta duración y tamaño del texto."
french = "Active l'affichage des messages importants en notifications ou le transfert d'Echo vers les notifications, puis règle la durée et la taille du texte."
brazilian_portuguese = "Ative mostrar avisos importantes como notificações ou enviar mensagens Echo para notificações, e defina o tempo e o tamanho do texto."
portuguese = "Ativa mostrar avisos importantes como notificações ou enviar mensagens Echo para notificações, e define o tempo e o tamanho do texto."
turkish = "Önemli sunucu uyarılarını bildirim olarak göster veya Echo mesajlarını bildirimlere yönlendir seçeneğini aç, sonra bildirim süresi ve yazı boyutunu ayarla."
polish = "Włącz pokazywanie ważnych komunikatów jako powiadomień lub kierowanie wiadomości Echo do powiadomień, a potem ustaw czas wyświetlania i rozmiar tekstu."

[[message]]
key = "\"Advanced options\" adds category filters and colors; join, version, rules and help texts still stay in chat."
[message.translations]
simplified_chinese = "高级选项里能加类别过滤和颜色；进服、版本、规则和帮助类文字仍然留在聊天里。"
traditional_chinese = "進階選項裡能加類別過濾和顏色；進服、版本、規則和幫助類文字仍然留在聊天裡。"
japanese = "詳細オプションでカテゴリ絞り込みと色を追加できます。参加・バージョン・ルール・ヘルプの文言はチャットに残ります。"
korean = "고급 옵션에서 분류 필터와 색을 추가할 수 있습니다. 접속, 버전, 규칙, 도움말 문구는 그대로 채팅에 남습니다."
russian = "В расширенных настройках есть фильтры по категориям и цвета; тексты входа, версии, правил и помощи остаются в чате."
german = "Unter Erweiterte Optionen gibt es Kategorie-Filter und Farben; Join-, Versions-, Regel- und Hilfetexte bleiben im Chat."
spanish = "En opciones avanzadas hay filtros por categoría y colores; los textos de entrada, versión, reglas y ayuda siguen en el chat."
french = "Dans les options avancées, filtres par catégorie et couleurs ; les textes de connexion, version, règles et aide restent dans le chat."
brazilian_portuguese = "Em opções avançadas há filtros por categoria e cores; textos de entrada, versão, regras e ajuda continuam no chat."
portuguese = "Em opções avançadas há filtros por categoria e cores; textos de entrada, versão, regras e ajuda continuam no chat."
turkish = "Gelişmiş seçeneklerde kategori filtreleri ve renkler var; giriş, sürüm, kural ve yardım metinleri sohbette kalır."
polish = "W opcjach zaawansowanych są filtry kategorii i kolory; teksty wejścia, wersji, zasad i pomocy zostają na czacie."

[[message]]
key = "A ready-made look: the LXGW WenKai font, UI size, animations, panel transparency and UI colors, listed before you apply."
[message.translations]
simplified_chinese = "一套现成外观：LXGW WenKai 字体、UI 尺寸、动画、面板透明度与 UI 颜色，应用前会先列出。"
traditional_chinese = "一套現成外觀：LXGW WenKai 字型、UI 尺寸、動畫、面板透明度與 UI 顏色，套用前先列出。"
japanese = "すぐ使える外観一式です。LXGW WenKai フォント、UI サイズ、アニメーション、パネルの透明度、UI の色を適用前に一覧表示します。"
korean = "바로 쓸 수 있는 외형 세트입니다. LXGW WenKai 글꼴, UI 크기, 애니메이션, 패널 투명도, UI 색상을 적용 전에 보여 줍니다."
russian = "Готовый набор оформления: шрифт LXGW WenKai, размер UI, анимации, прозрачность панелей и цвета UI — со списком до применения."
german = "Ein fertiges Aussehen: Schrift LXGW WenKai, UI-Größe, Animationen, Panel-Transparenz und UI-Farben, vor dem Anwenden aufgelistet."
spanish = "Un aspecto listo para usar: fuente LXGW WenKai, tamaño de la UI, animaciones, transparencia de paneles y colores de la UI, listados antes de aplicar."
french = "Un rendu prêt à l'emploi : police LXGW WenKai, taille de l'UI, animations, transparence des panneaux et couleurs de l'UI, listés avant application."
brazilian_portuguese = "Um visual pronto: fonte LXGW WenKai, tamanho da UI, animações, transparência dos painéis e cores da UI, listados antes de aplicar."
portuguese = "Um aspeto pronto: tipo de letra LXGW WenKai, tamanho da UI, animações, transparência dos painéis e cores da UI, listados antes de aplicar."
turkish = "Hazır bir görünüm: LXGW WenKai yazı tipi, UI boyutu, animasyonlar, panel saydamlığı ve UI renkleri, uygulamadan önce listelenir."
polish = "Gotowy wygląd: czcionka LXGW WenKai, rozmiar UI, animacje, przezroczystość paneli i kolory UI, wymienione przed zastosowaniem."

[[message]]
key = "Read the listed rows, then press \"Apply Qm recommended appearance\"; if the font is missing, the panel says so and your current fonts stay."
[message.translations]
simplified_chinese = "先看列出的各项，再按应用 Qm 推荐外观；若缺少字体，面板会提示，当前字体会保留。"
traditional_chinese = "先看列出的項目，再按套用 Qm 推薦外觀；若缺少字型，面板會提示，目前字型會保留。"
japanese = "一覧を確認してから Qm 推奨外観を適用のボタンを押します。フォントが無い場合はパネルに表示され、現在のフォントはそのまま残ります。"
korean = "목록을 확인한 뒤 Qm 권장 외형 적용을 누릅니다. 글꼴이 없으면 패널에 표시되고 현재 글꼴은 그대로 유지됩니다."
russian = "Проверьте список и нажмите применить рекомендуемое оформление Qm; если шрифта нет, панель сообщит об этом, а текущие шрифты останутся."
german = "Liste prüfen, dann Qm-empfohlenes Aussehen anwenden drücken; fehlt die Schrift, meldet das Panel es und die aktuellen Schriften bleiben."
spanish = "Revisa las filas listadas y pulsa aplicar el aspecto recomendado de Qm; si falta la fuente, el panel lo indica y tus fuentes actuales se mantienen."
french = "Lisez les lignes listées puis appuyez sur appliquer l'apparence recommandée Qm ; si la police manque, le panneau l'indique et vos polices actuelles sont conservées."
brazilian_portuguese = "Veja as linhas listadas e pressione aplicar a aparência recomendada do Qm; se a fonte faltar, o painel avisa e suas fontes atuais permanecem."
portuguese = "Veja as linhas listadas e prima aplicar o aspeto recomendado do Qm; se o tipo de letra faltar, o painel avisa e os seus tipos de letra atuais mantêm-se."
turkish = "Listelenen satırları okuyup Qm önerilen görünümü uygula düğmesine basın; yazı tipi yoksa panel bunu söyler ve mevcut yazı tipleriniz kalır."
polish = "Przejrzyj listę i naciśnij zastosuj zalecany wygląd Qm; jeśli brakuje czcionki, panel to zgłosi, a obecne czcionki zostaną."

[[message]]
key = "Applying overwrites your font, UI scale, animation and panel colors at once, so note the values you like first."
[message.translations]
simplified_chinese = "应用会一次覆盖字体、UI 缩放、动画与面板颜色，先记下你喜欢的那几项数值。"
traditional_chinese = "套用會一次覆蓋字型、UI 縮放、動畫與面板顏色，先記下你喜歡的數值。"
japanese = "適用するとフォント、UI 倍率、アニメーション、パネルの色が一括で上書きされるので、好みの値は先に控えておきましょう。"
korean = "적용하면 글꼴, UI 배율, 애니메이션, 패널 색상이 한 번에 덮어써지므로 좋아하는 값은 미리 적어 두세요."
russian = "Применение сразу перезапишет шрифт, масштаб UI, анимацию и цвета панелей, поэтому сначала запишите понравившиеся значения."
german = "Anwenden überschreibt Schrift, UI-Skalierung, Animation und Panelfarben auf einmal, also notieren Sie vorher Ihre Wunschwerte."
spanish = "Aplicar sobrescribe a la vez fuente, escala de la UI, animación y colores de panel, así que anota antes los valores que te gusten."
french = "L'application remplace d'un coup police, échelle de l'UI, animation et couleurs des panneaux : notez d'abord les valeurs qui vous plaisent."
brazilian_portuguese = "Aplicar substitui de uma vez fonte, escala da UI, animação e cores dos painéis, então anote antes os valores de que gosta."
portuguese = "Aplicar substitui de uma vez o tipo de letra, a escala da UI, a animação e as cores dos painéis, por isso anote antes os valores de que gosta."
turkish = "Uygulamak yazı tipi, UI ölçeği, animasyon ve panel renklerini birden ezer; hoşunuza giden değerleri önceden not edin."
polish = "Zastosowanie nadpisze naraz czcionkę, skalę UI, animacje i kolory paneli, więc najpierw zapisz lubiane wartości."

[[message]]
key = "Font size, background opacity, colors and command highlighting of the local console you open with F1."
[message.translations]
simplified_chinese = "用 F1 打开的本地控制台的字体大小、背景不透明度、颜色与命令高亮。"
traditional_chinese = "用 F1 開啟的本機主控台的字型大小、背景不透明度、顏色與指令高亮。"
japanese = "F1 で開くローカルコンソールのフォントサイズ、背景の不透明度、色、コマンドの強調表示。"
korean = "F1로 여는 로컬 콘솔의 글꼴 크기, 배경 불투명도, 색상, 명령 강조 표시입니다."
russian = "Размер шрифта, непрозрачность фона, цвета и подсветка команд локальной консоли, открываемой по F1."
german = "Schriftgröße, Hintergrunddeckkraft, Farben und Befehlshervorhebung der lokalen Konsole, die F1 öffnet."
spanish = "Tamaño de fuente, opacidad del fondo, colores y resaltado de comandos de la consola local que abres con F1."
french = "Taille de police, opacité du fond, couleurs et surlignage des commandes de la console locale ouverte avec F1."
brazilian_portuguese = "Tamanho da fonte, opacidade do fundo, cores e destaque de comandos do console local aberto com F1."
portuguese = "Tamanho do tipo de letra, opacidade do fundo, cores e realce de comandos da consola local aberta com F1."
turkish = "F1 ile açtığınız yerel konsolun yazı tipi boyutu, arka plan saydamlığı, renkleri ve komut vurgulaması."
polish = "Rozmiar czcionki, krycie tła, kolory i podświetlanie poleceń lokalnej konsoli otwieranej klawiszem F1."

[[message]]
key = "Set \"Console font size\" and \"Console background opacity\", tick \"Highlight console commands\", then choose a \"Console color scheme\"."
[message.translations]
simplified_chinese = "设置控制台字体大小和控制台背景不透明度，勾选高亮控制台命令，再选择控制台配色方案。"
traditional_chinese = "設定主控台字型大小與主控台背景不透明度，勾選高亮主控台指令，再選擇主控台配色方案。"
japanese = "コンソールのフォントサイズと背景の不透明度を設定し、コンソールのコマンドを強調表示にチェックを入れ、コンソールの配色を選びます。"
korean = "콘솔 글꼴 크기와 콘솔 배경 불투명도를 설정하고 콘솔 명령 강조 표시를 체크한 뒤 콘솔 색상 구성을 고릅니다."
russian = "Задайте размер шрифта консоли и непрозрачность фона консоли, включите подсветку команд консоли, затем выберите цветовую схему консоли."
german = "Schriftgröße der Konsole und Hintergrunddeckkraft der Konsole einstellen, Konsolenbefehle hervorheben aktivieren, dann ein Farbschema der Konsole wählen."
spanish = "Ajusta el tamaño de fuente de la consola y la opacidad del fondo de la consola, marca resaltar comandos de la consola y elige un esquema de color de la consola."
french = "Réglez la taille de police de la console et l'opacité du fond de la console, cochez surligner les commandes de la console, puis choisissez un jeu de couleurs de la console."
brazilian_portuguese = "Defina o tamanho da fonte do console e a opacidade do fundo do console, marque destacar comandos do console e escolha um esquema de cores do console."
portuguese = "Defina o tamanho do tipo de letra da consola e a opacidade do fundo da consola, marque realçar comandos da consola e escolha um esquema de cores da consola."
turkish = "Konsol yazı tipi boyutunu ve konsol arka plan saydamlığını ayarlayın, konsol komutlarını vurgula seçeneğini işaretleyin, sonra bir konsol renk şeması seçin."
polish = "Ustaw rozmiar czcionki konsoli i krycie tła konsoli, zaznacz podświetlanie poleceń konsoli, a następnie wybierz schemat kolorów konsoli."

[[message]]
key = "Your own colors appear only under \"Custom\"; press \"Reset console appearance\" if the text becomes hard to read."
[message.translations]
simplified_chinese = "自选颜色只在选自定义时出现；文字难读时按重置控制台外观。"
traditional_chinese = "自選顏色只在選自訂時出現；文字難以辨讀時按重設主控台外觀。"
japanese = "独自の色はカスタムを選んだときだけ現れます。文字が読みにくくなったらコンソールの外観をリセットのボタンを押します。"
korean = "직접 고른 색은 사용자 지정에서만 나타나며, 글자가 읽기 어려워지면 콘솔 모양 초기화를 누릅니다."
russian = "Свои цвета видны только при выборе настраиваемой схемы; если текст стал плохо читаться, нажмите сброс оформления консоли."
german = "Eigene Farben erscheinen nur unter Benutzerdefiniert; wird der Text schlecht lesbar, Konsole-Darstellung zurücksetzen drücken."
spanish = "Tus colores solo aparecen en personalizado; si el texto cuesta leerlo, pulsa restablecer la apariencia de la consola."
french = "Vos couleurs n'apparaissent qu'en personnalisé ; si le texte devient illisible, appuyez sur réinitialiser l'apparence de la console."
brazilian_portuguese = "Suas cores só aparecem em personalizado; se o texto ficar difícil de ler, pressione redefinir a aparência do console."
portuguese = "As suas cores só aparecem em personalizado; se o texto ficar difícil de ler, prima repor o aspeto da consola."
turkish = "Kendi renkleriniz yalnızca özel seçeneğinde görünür; yazı okunamaz hale gelirse konsol görünümünü sıfırla düğmesine basın."
polish = "Własne kolory widać tylko w opcji niestandardowej; jeśli tekst stał się nieczytelny, naciśnij przywróć wygląd konsoli."

[[message]]
key = "Colors and opacity of the popup list that suggests chat commands and emoticons while you type in chat."
[message.translations]
simplified_chinese = "在聊天里输入时，提示聊天命令与表情的弹出列表的颜色和不透明度。"
traditional_chinese = "在聊天中輸入時，提示聊天指令與表情的彈出清單的顏色與不透明度。"
japanese = "チャット入力中にチャットコマンドや顔文字を候補表示するポップアップの色と不透明度。"
korean = "채팅 입력 중 채팅 명령과 이모티콘을 추천하는 팝업 목록의 색상과 불투명도입니다."
russian = "Цвета и прозрачность всплывающего списка с подсказками команд чата и смайликов при вводе в чат."
german = "Farben und Deckkraft der Einblendliste, die beim Tippen im Chat Chatbefehle und Emoticons vorschlägt."
spanish = "Colores y opacidad de la lista emergente que sugiere comandos de chat y emoticonos mientras escribes en el chat."
french = "Couleurs et opacité de la liste qui suggère commandes de chat et émoticônes pendant la saisie."
brazilian_portuguese = "Cores e opacidade da lista que sugere comandos de chat e emoticons enquanto você digita no chat."
portuguese = "Cores e opacidade da lista que sugere comandos de chat e emoticons enquanto escreve no chat."
turkish = "Sohbette yazarken sohbet komutlarını ve ifadeleri öneren açılır listenin renkleri ve saydamlığı."
polish = "Kolory i krycie listy podpowiadającej polecenia czatu i emotikony podczas pisania na czacie."

[[message]]
key = "Set \"Background color\" and \"Background opacity\", then \"Text color\", \"Selected text color\" and \"Selection background color\"; a preview follows."
[message.translations]
simplified_chinese = "设置背景颜色和背景不透明度，再设文字颜色、选中文字颜色与选中背景颜色；下方会实时预览。"
traditional_chinese = "設定背景顏色與背景不透明度，再設文字顏色、選取文字顏色與選取背景顏色；下方會即時預覽。"
japanese = "背景色と背景の不透明度を設定し、次に文字色、選択文字色、選択背景色を決めます。下にプレビューが付きます。"
korean = "배경색과 배경 불투명도를 설정한 뒤 글자색, 선택 글자색, 선택 배경색을 정합니다. 아래에 미리보기가 나옵니다."
russian = "Задайте цвет фона и непрозрачность фона, затем цвет текста, цвет выделенного текста и цвет фона выделения; ниже есть предпросмотр."
german = "Hintergrundfarbe und Hintergrunddeckkraft einstellen, dann Textfarbe, Farbe des markierten Textes und Markierungsfarbe; eine Vorschau folgt."
spanish = "Ajusta el color de fondo y la opacidad del fondo, luego el color del texto, el color del texto seleccionado y el color de fondo de selección; hay una vista previa."
french = "Réglez la couleur de fond et l'opacité du fond, puis la couleur du texte, la couleur du texte sélectionné et la couleur de fond de sélection ; un aperçu suit."
brazilian_portuguese = "Defina a cor de fundo e a opacidade do fundo, depois a cor do texto, a cor do texto selecionado e a cor de fundo da seleção; há uma prévia abaixo."
portuguese = "Defina a cor de fundo e a opacidade do fundo, depois a cor do texto, a cor do texto selecionado e a cor de fundo da seleção; segue-se uma pré-visualização."
turkish = "Arka plan rengini ve arka plan saydamlığını, ardından metin rengi, seçili metin rengi ve seçim arka plan rengini ayarlayın; altında önizleme görünür."
polish = "Ustaw kolor tła i krycie tła, potem kolor tekstu, kolor zaznaczonego tekstu i kolor tła zaznaczenia; poniżej jest podgląd."

[[message]]
key = "A see-through panel looks fine in the menu but is hard to read in game, so check it on a bright map before keeping it."
[message.translations]
simplified_chinese = "半透明面板在菜单里好看，进了游戏却难读，想保留就先在明亮的地图上试一下。"
traditional_chinese = "半透明面板在選單裡好看，進遊戲卻難讀，想保留就先用明亮的地圖試一下。"
japanese = "透けるパネルはメニューでは良く見えても、ゲーム内では読みにくいので、残す前に明るいマップで確認しましょう。"
korean = "반투명 패널은 메뉴에서는 괜찮아 보이지만 게임에서는 읽기 어려우니, 유지하기 전에 밝은 맵에서 확인하세요."
russian = "Прозрачная панель хороша в меню, но в игре её трудно читать, поэтому проверьте её на светлой карте, прежде чем оставлять."
german = "Ein durchsichtiges Panel sieht im Menü gut aus, ist im Spiel aber schwer lesbar; prüfen Sie es auf einer hellen Karte, bevor Sie es behalten."
spanish = "Un panel transparente se ve bien en el menú pero cuesta leerlo en partida, así que pruébalo en un mapa claro antes de quedártelo."
french = "Un panneau translucide est joli dans le menu mais illisible en jeu : testez-le sur une carte claire avant de le garder."
brazilian_portuguese = "Um painel transparente fica bem no menu mas é difícil de ler no jogo, então teste em um mapa claro antes de mantê-lo."
portuguese = "Um painel translúcido fica bem no menu mas é difícil de ler em jogo, por isso teste num mapa claro antes de o manter."
turkish = "Saydam panel menüde iyi görünür ama oyunda okunması zordur; tutmak isterseniz önce aydınlık bir haritada deneyin."
polish = "Przezroczysty panel ładnie wygląda w menu, ale w grze trudno go czytać, więc sprawdź go na jasnej mapie, zanim zostawisz."

[[message]]
key = "Hides names, skins, flags and blocked words on screen, so a stream does not show other players' details."
[message.translations]
simplified_chinese = "在屏幕上隐藏名字、皮肤、旗帜和被屏蔽的词语，直播时不会露出其他玩家的信息。"
traditional_chinese = "在畫面上隱藏名字、外觀、旗幟與被封鎖的詞語，直播時不會露出其他玩家的資訊。"
japanese = "画面上で名前、スキン、国旗、伏せ字を隠し、配信で他のプレイヤーの情報が出ないようにします。"
korean = "화면에서 이름, 스킨, 국기, 차단 단어를 숨겨 방송에 다른 플레이어의 정보가 나오지 않게 합니다."
russian = "Скрывает на экране имена, скины, флаги и запрещённые слова, чтобы в стрим не попадали данные других игроков."
german = "Blendet Namen, Skins, Flaggen und gesperrte Wörter am Bildschirm aus, damit im Stream keine Daten anderer Spieler erscheinen."
spanish = "Oculta en pantalla nombres, skins, banderas y palabras bloqueadas para que la retransmisión no muestre datos de otros jugadores."
french = "Masque à l'écran noms, skins, drapeaux et mots bloqués pour que le stream ne montre pas les infos des autres joueurs."
brazilian_portuguese = "Oculta na tela nomes, skins, bandeiras e palavras bloqueadas para a transmissão não mostrar dados de outros jogadores."
portuguese = "Oculta no ecrã nomes, skins, bandeiras e palavras bloqueadas para a transmissão não mostrar dados de outros jogadores."
turkish = "Ekranda adları, skinleri, bayrakları ve engellenen sözcükleri gizler; yayında diğer oyuncuların bilgileri görünmez."
polish = "Ukrywa na ekranie nazwy, skórki, flagi i zablokowane słowa, żeby stream nie pokazywał danych innych graczy."

[[message]]
key = "Tick \"Replace non-friend names with ID\", \"Replace non-friend skins with default\" or \"Use default flags on scoreboard\"; words come from a \"Word list file\"."
[message.translations]
simplified_chinese = "勾选用 ID 替换非好友名字、用默认皮肤替换非好友皮肤或计分板使用默认旗帜；词语来自词表文件。"
traditional_chinese = "勾選用 ID 取代非好友名字、用預設外觀取代非好友外觀或計分板使用預設旗幟；詞語來自詞表檔案。"
japanese = "フレンド以外の名前を ID に置き換える、フレンド以外のスキンを既定に置き換える、スコアボードで既定の国旗を使う のいずれかにチェックを入れます。語句は単語リストファイルから読みます。"
korean = "친구가 아닌 이름을 ID로 바꾸기, 친구가 아닌 스킨을 기본으로 바꾸기, 스코어보드에 기본 국기 사용 중 하나를 체크합니다. 단어는 단어 목록 파일에서 가져옵니다."
russian = "Включите замену имён не-друзей на ID, замену скинов не-друзей на стандартные или стандартные флаги на табло; слова берутся из файла списка слов."
german = "Namen von Nicht-Freunden durch ID ersetzen, Skins von Nicht-Freunden durch Standard ersetzen oder Standardflaggen im Scoreboard verwenden anhaken; Wörter kommen aus einer Wortlistendatei."
spanish = "Marca sustituir nombres de no amigos por ID, sustituir skins de no amigos por la predeterminada o usar banderas predeterminadas en el marcador; las palabras salen de un archivo de lista de palabras."
french = "Cochez remplacer les noms des non-amis par l'ID, remplacer les skins des non-amis par celui par défaut ou utiliser les drapeaux par défaut au tableau des scores ; les mots viennent d'un fichier de liste de mots."
brazilian_portuguese = "Marque substituir nomes de não amigos por ID, substituir skins de não amigos pela padrão ou usar bandeiras padrão no placar; as palavras vêm de um arquivo de lista de palavras."
portuguese = "Marque substituir nomes de não amigos por ID, substituir skins de não amigos pela predefinida ou usar bandeiras predefinidas no placar; as palavras vêm de um ficheiro de lista de palavras."
turkish = "Arkadaş olmayan adları ID ile değiştir, arkadaş olmayan skinleri varsayılanla değiştir veya skor tablosunda varsayılan bayrakları kullan seçeneklerini işaretleyin; sözcükler bir sözcük listesi dosyasından gelir."
polish = "Zaznacz zamień nazwy nie-znajomych na ID, zamień skórki nie-znajomych na domyślne lub używaj domyślnych flag na tablicy wyników; słowa pochodzą z pliku listy słów."

[[message]]
key = "It only changes what you see: your own name, chat and skin are still sent to the server and stay visible to others."
[message.translations]
simplified_chinese = "它只改你看到的画面：你自己的名字、聊天和皮肤仍会发到服务器，别人照样看得见。"
traditional_chinese = "它只改你看到的畫面：你自己的名字、聊天與外觀仍會送到伺服器，別人照樣看得見。"
japanese = "変わるのは自分の見え方だけです。自分の名前、チャット、スキンはサーバーに送られ、他の人には見えたままです。"
korean = "내가 보는 화면만 바뀝니다. 내 이름, 채팅, 스킨은 그대로 서버로 전송되고 다른 사람에게도 보입니다."
russian = "Меняется только то, что видите вы: ваше имя, чат и скин по-прежнему уходят на сервер и видны другим."
german = "Es ändert nur Ihre Sicht: Ihr eigener Name, Chat und Skin gehen weiter an den Server und bleiben für andere sichtbar."
spanish = "Solo cambia lo que tú ves: tu nombre, chat y skin siguen enviándose al servidor y los demás los ven."
french = "Cela ne change que ce que vous voyez : votre nom, votre chat et votre skin sont toujours envoyés au serveur et restent visibles."
brazilian_portuguese = "Isso só muda o que você vê: seu nome, chat e skin continuam sendo enviados ao servidor e seguem visíveis aos outros."
portuguese = "Isto só muda o que vê: o seu nome, chat e skin continuam a ser enviados ao servidor e permanecem visíveis para os outros."
turkish = "Yalnızca sizin gördüğünüzü değiştirir: kendi adınız, sohbetiniz ve skininiz sunucuya gitmeye ve başkalarına görünmeye devam eder."
polish = "Zmienia tylko to, co widzisz: twoja nazwa, czat i skórka nadal trafiają na serwer i pozostają widoczne dla innych."

[[message]]
key = "Opacity of entity layers on the map such as death, freeze, unfreeze, teleport, checkpoint and switch tiles."
[message.translations]
simplified_chinese = "地图上死亡、冻结、解冻、传送、检查点与开关等实体层的透明度。"
traditional_chinese = "地圖上死亡、凍結、解凍、傳送、檢查點與開關等實體層的透明度。"
japanese = "マップ上のデスタイル、フリーズ、アンフリーズ、テレポート、チェックポイント、スイッチなどのエンティティ層の不透明度。"
korean = "맵의 사망, 동결, 해제, 텔레포트, 체크포인트, 스위치 타일 같은 엔티티 레이어의 불투명도입니다."
russian = "Прозрачность слоёв объектов на карте: смерть, заморозка, разморозка, телепорт, чекпоинт и переключатели."
german = "Deckkraft der Objektebenen auf der Karte, etwa Tod, Einfrieren, Auftauen, Teleport, Checkpoint und Schalter."
spanish = "Opacidad de las capas de entidades del mapa, como muerte, congelación, descongelación, teletransporte, punto de control e interruptores."
french = "Opacité des calques d'entités de la carte : mort, gel, dégel, téléportation, point de contrôle et interrupteurs."
brazilian_portuguese = "Opacidade das camadas de entidades do mapa, como morte, congelamento, descongelamento, teleporte, checkpoint e interruptores."
portuguese = "Opacidade das camadas de entidades do mapa, como morte, congelamento, descongelamento, teleporte, ponto de controlo e interruptores."
turkish = "Haritadaki ölüm, dondurma, çözme, ışınlanma, kontrol noktası ve anahtar gibi varlık katmanlarının saydamlığı."
polish = "Krycie warstw encji na mapie, takich jak śmierć, zamrożenie, rozmrożenie, teleport, punkt kontrolny i przełączniki."

[[message]]
key = "Drag a slider like \"Death opacity\" or \"Teleport opacity\" from 0 to 100%, or use \"Tune layer opacity\" to fade the whole entity layer."
[message.translations]
simplified_chinese = "拖动死亡透明度或传送透明度这类滑块，范围 0 到 100%，或用调整图层透明度把整个实体层调淡。"
traditional_chinese = "拖曳死亡透明度或傳送透明度這類滑桿，範圍 0 到 100%，或用調整圖層透明度把整個實體層調淡。"
japanese = "死亡の不透明度やテレポートの不透明度などのスライダーを 0〜100% で動かすか、レイヤーの不透明度を調整でエンティティ層全体を薄くします。"
korean = "사망 불투명도나 텔레포트 불투명도 같은 슬라이더를 0~100%에서 움직이거나, 레이어 불투명도 조정으로 엔티티 레이어 전체를 흐리게 합니다."
russian = "Двигайте ползунок вроде непрозрачности смерти или непрозрачности телепорта от 0 до 100% или используйте настройку прозрачности слоя, чтобы приглушить весь слой объектов."
german = "Ziehen Sie einen Regler wie Todesdeckkraft oder Teleportdeckkraft von 0 bis 100 %, oder nutzen Sie Ebenendeckkraft anpassen, um die ganze Objektebene zu dämpfen."
spanish = "Arrastra un control como opacidad de muerte u opacidad de teletransporte de 0 a 100%, o usa ajustar la opacidad de la capa para atenuar toda la capa de entidades."
french = "Faites glisser un curseur comme opacité de la mort ou opacité de la téléportation de 0 à 100 %, ou utilisez régler l'opacité du calque pour atténuer tout le calque d'entités."
brazilian_portuguese = "Arraste um controle como opacidade de morte ou opacidade de teletransporte de 0 a 100%, ou use ajustar a opacidade da camada para esmaecer toda a camada de entidades."
portuguese = "Arraste um controlo como opacidade de morte ou opacidade de teleporte de 0 a 100%, ou use ajustar a opacidade da camada para esbater toda a camada de entidades."
turkish = "Ölüm saydamlığı veya ışınlanma saydamlığı gibi bir kaydırıcıyı %0 ile %100 arasında sürükleyin ya da katman saydamlığını ayarla ile tüm varlık katmanını soluklaştırın."
polish = "Przeciągnij suwak, np. krycie śmierci lub krycie teleportu, od 0 do 100%, albo użyj dostrój krycie warstwy, by wyciszyć całą warstwę encji."

[[message]]
key = "Fading death and freeze tiles helps you see tees and weapons behind them, but the exact tile edge gets harder to judge."
[message.translations]
simplified_chinese = "把死亡块和冻结尾块调淡，能看到后面的 Tee 和武器，但块的精确边界也更难判断。"
traditional_chinese = "把死亡區塊與凍結區塊調淡，能看到後面的 Tee 與武器，但區塊的精確邊界也更難判斷。"
japanese = "デスタイルやフリーズタイルを薄くすると後ろの Tee や武器が見やすくなりますが、タイルの正確な境界は判断しにくくなります。"
korean = "사망·동결 타일을 흐리게 하면 뒤의 Tee와 무기가 잘 보이지만, 타일의 정확한 경계는 판단하기 어려워집니다."
russian = "Полупрозрачные смерть и заморозка помогают видеть Tee и оружие за ними, но точную границу блока оценивать труднее."
german = "Blasse Todes- und Einfriertiles lassen Tees und Waffen dahinter besser erkennen, doch die genaue Kachelkante ist schwerer zu beurteilen."
spanish = "Atenuar los tiles de muerte y congelación ayuda a ver los Tee y las armas detrás, pero el borde exacto del tile cuesta más de juzgar."
french = "Des tiles de mort et de gel atténués laissent voir les Tee et armes derrière, mais le bord exact du tile devient plus dur à juger."
brazilian_portuguese = "Deixar os tiles de morte e congelamento mais claros ajuda a ver os Tee e armas atrás deles, mas fica mais difícil julgar a borda exata do tile."
portuguese = "Deixar os tiles de morte e congelamento mais claros ajuda a ver os Tee e as armas por trás, mas o limite exato do tile torna-se mais difícil de avaliar."
turkish = "Ölüm ve dondurma karolarını soluklaştırmak arkadaki Tee ve silahları görmeyi kolaylaştırır, ama karonun tam kenarını kestirmek zorlaşır."
polish = "Wyblakłe kafle śmierci i zamrożenia ułatwiają zobaczenie Tee i broni za nimi, ale dokładna krawędź kafla staje się trudniejsza do oceny."

[[message]]
key = "Draws collision and interaction ranges on the map: tee collision, pickups, hammer, hook, lasers and explosions."
[message.translations]
simplified_chinese = "在地图上画出碰撞与交互范围：Tee 碰撞、拾取物、锤子、钩索、激光和爆炸。"
traditional_chinese = "在地圖上畫出碰撞與互動範圍：Tee 碰撞、拾取物、槌子、鉤索、雷射與爆炸。"
japanese = "マップ上に衝突と相互作用の範囲を描画します。Tee の衝突、取得物、ハンマー、フック、レーザー、爆発。"
korean = "맵에 충돌 및 상호작용 범위를 그립니다. Tee 충돌, 획득 아이템, 망치, 훅, 레이저, 폭발."
russian = "Рисует на карте зоны столкновения и взаимодействия: столкновение Tee, подбираемые предметы, молот, крюк, лазеры и взрывы."
german = "Zeichnet Kollisions- und Interaktionsbereiche auf der Karte: Tee-Kollision, Pickups, Hammer, Haken, Laser und Explosionen."
spanish = "Dibuja en el mapa rangos de colisión e interacción: colisión del Tee, objetos, martillo, gancho, láseres y explosiones."
french = "Dessine sur la carte les zones de collision et d'interaction : collision du Tee, objets, marteau, grappin, lasers et explosions."
brazilian_portuguese = "Desenha no mapa as áreas de colisão e interação: colisão do Tee, itens, martelo, gancho, lasers e explosões."
portuguese = "Desenha no mapa as áreas de colisão e interação: colisão do Tee, itens, martelo, gancho, lasers e explosões."
turkish = "Haritada çarpışma ve etkileşim aralıklarını çizer: Tee çarpışması, toplanabilirler, çekiç, kanca, lazerler ve patlamalar."
polish = "Rysuje na mapie zasięgi kolizji i interakcji: kolizja Tee, przedmioty, młotek, hak, lasery i wybuchy."

[[message]]
key = "Tick \"Show hitbox mode\", choose the ranges you need, then set \"Player range\" to \"Local only\", \"Local + Dummy\" or \"All players\"."
[message.translations]
simplified_chinese = "勾选显示碰撞箱模式，选择需要的范围，再把玩家范围设为仅本地、本地与 dummy 或全部玩家。"
traditional_chinese = "勾選顯示碰撞箱模式，選擇需要的範圍，再把玩家範圍設為僅本機、本機與 dummy 或全部玩家。"
japanese = "ヒットボックスモードを表示にチェックを入れ、必要な範囲を選び、プレイヤー範囲をローカルのみ、ローカルと dummy、全プレイヤーのいずれかにします。"
korean = "히트박스 모드 표시를 체크하고 필요한 범위를 고른 뒤 플레이어 범위를 로컬만, 로컬과 dummy, 모든 플레이어 중 하나로 설정합니다."
russian = "Включите показ режима хитбоксов, выберите нужные зоны, затем задайте зону игрока: только локально, локально и dummy или все игроки."
german = "Hitbox-Modus anzeigen anhaken, gewünschte Bereiche wählen, dann Spielerbereich auf nur lokal, lokal und dummy oder alle Spieler setzen."
spanish = "Marca mostrar el modo de hitbox, elige los rangos que necesites y ajusta el rango de jugador en solo local, local y dummy o todos los jugadores."
french = "Cochez afficher le mode hitbox, choisissez les zones voulues, puis réglez la zone du joueur sur locale seulement, locale et dummy ou tous les joueurs."
brazilian_portuguese = "Marque mostrar o modo hitbox, escolha as áreas necessárias e defina a área do jogador como só local, local e dummy ou todos os jogadores."
portuguese = "Marque mostrar o modo hitbox, escolha as áreas necessárias e defina a área do jogador como apenas local, local e dummy ou todos os jogadores."
turkish = "Hitbox modunu göster seçeneğini işaretleyin, gereken aralıkları seçin, sonra oyuncu aralığını yalnızca yerel, yerel ve dummy ya da tüm oyuncular olarak ayarlayın."
polish = "Zaznacz pokaż tryb hitboxów, wybierz potrzebne zasięgi, a potem ustaw zasięg gracza na tylko lokalny, lokalny i dummy lub wszyscy gracze."

[[message]]
key = "It stays on for every match, so switch it off before real races to keep the screen and your aim clean."
[message.translations]
simplified_chinese = "它对每场比赛都生效，正式比赛前记得关掉，让画面和准星保持干净。"
traditional_chinese = "它對每場比賽都生效，正式比賽前記得關掉，讓畫面與準星保持乾淨。"
japanese = "すべての試合で有効なままなので、本番のレース前にはオフにして画面と照準をすっきりさせましょう。"
korean = "모든 경기에서 계속 켜져 있으니 실제 레이스 전에는 꺼서 화면과 조준을 깔끔하게 유지하세요."
russian = "Он действует во всех матчах, поэтому перед настоящими гонками выключайте его, чтобы не засорять экран и прицел."
german = "Es bleibt in jedem Match an, also vor echten Rennen abschalten, damit Bildschirm und Ziel sauber bleiben."
spanish = "Sigue activo en cada partida, así que desactívalo antes de las carreras reales para mantener limpia la pantalla y la puntería."
french = "Il reste actif à chaque course : désactivez-le avant les vraies courses pour garder l'écran et la visée nets."
brazilian_portuguese = "Ele fica ligado em toda partida, então desligue antes de corridas valendo para manter a tela e a mira limpas."
portuguese = "Fica ligado em todas as partidas, por isso desligue-o antes de corridas a sério para manter o ecrã e a mira limpos."
turkish = "Her maçta açık kalır; gerçek yarışlardan önce kapatıp ekranı ve nişanınızı temiz tutun."
polish = "Działa w każdym meczu, więc wyłącz go przed prawdziwymi wyścigami, by ekran i celowanie pozostały czyste."

[[message]]
key = "Marks teammates who hold hammer while stuck in death or freeze areas, so you can see who is hammering them."
[message.translations]
simplified_chinese = "标记卡在死亡或冻结区域里仍握着锤子的队友，方便你看清是谁在锤他们。"
traditional_chinese = "標記卡在死亡或凍結區域裡仍握著槌子的隊友，方便你看清是誰在槌他們。"
japanese = "デスやフリーズの範囲に挟まれたままハンマーを持つ味方を目立たせ、誰が叩いているか分かるようにします。"
korean = "사망·동결 지역에 갇힌 채 망치를 든 아군을 표시해 누가 때리고 있는지 보이게 합니다."
russian = "Отмечает союзников с молотом, застрявших в зонах смерти или заморозки, чтобы видеть, кто их бьёт."
german = "Markiert Teammitglieder mit Hammer, die in Todes- oder Einfrierbereichen festsitzen, damit Sie sehen, wer sie hämmert."
spanish = "Marca a los compañeros que llevan martillo atrapados en zonas de muerte o congelación, para ver quién les da martillazos."
french = "Marque les coéquipiers au marteau coincés dans une zone de mort ou de gel, pour voir qui les martèle."
brazilian_portuguese = "Marca os companheiros com martelo presos em áreas de morte ou congelamento, para você ver quem está martelando neles."
portuguese = "Marca os companheiros com martelo presos em zonas de morte ou congelamento, para ver quem lhes está a bater com o martelo."
turkish = "Ölüm veya dondurma alanlarında sıkışmışken çekiç tutan takım arkadaşlarını işaretler; onlara kimin vurduğunu görürsünüz."
polish = "Oznacza sojuszników z młotkiem uwięzionych w strefach śmierci lub zamrożenia, żeby widzieć, kto ich uderza."

[[message]]
key = "Tick \"Highlight teammates hammering in death or freeze areas\"; it works on your own team only and needs no key bind."
[message.translations]
simplified_chinese = "勾选高亮在死亡或冻结区域锤人的队友；只对自己队伍生效，无需绑定按键。"
traditional_chinese = "勾選高亮在死亡或凍結區域槌人的隊友；只對自己隊伍生效，不需綁定按鍵。"
japanese = "デスやフリーズ範囲でハンマーを振る味方を強調表示にチェックを入れます。自チームにだけ働き、キー割り当ては不要です。"
korean = "사망·동결 지역에서 망치를 휘두르는 아군 강조 표시를 체크합니다. 자기 팀에만 적용되며 키 할당이 필요 없습니다."
russian = "Включите подсветку союзников, бьющих молотом в зонах смерти или заморозки; работает только для своей команды и не требует привязки клавиш."
german = "Markierung für Teammitglieder aktivieren, die in Todes- oder Einfrierbereichen hämmern; gilt nur im eigenen Team, ohne Tastenbelegung."
spanish = "Marca resaltar a los compañeros que martillan en zonas de muerte o congelación; solo funciona en tu equipo y no necesita atajo."
french = "Cochez surligner les coéquipiers qui martèlent en zone de mort ou de gel ; cela ne vaut que pour votre équipe et ne demande aucune touche."
brazilian_portuguese = "Marque destacar companheiros martelando em áreas de morte ou congelamento; funciona só no seu time e não exige tecla."
portuguese = "Marque realçar companheiros a martelar em zonas de morte ou congelamento; funciona apenas na sua equipa e não exige tecla."
turkish = "Ölüm veya dondurma alanlarında çekiç sallayan arkadaşlarını vurgula seçeneğini işaretleyin; yalnızca kendi takımınızda çalışır, tuş ataması gerektirmez."
polish = "Zaznacz podświetlaj sojuszników uderzających młotkiem w strefach śmierci lub zamrożenia; działa tylko w twojej drużynie i nie wymaga przypisania klawisza."

[[message]]
key = "Use it to find the teammate who needs a wake-up; enemies are never highlighted, so do not look for them here."
[message.translations]
simplified_chinese = "用它找需要唤醒的队友；敌人从不被高亮，别在这里找他们。"
traditional_chinese = "用它找需要喚醒的隊友；敵人從不會被高亮，別在這裡找他們。"
japanese = "起こしてほしい味方を見つけるための機能です。敵は強調されないので、ここで探さないでください。"
korean = "깨워 줘야 할 아군을 찾는 데 쓰세요. 적은 강조되지 않으니 여기서 찾지 마세요."
russian = "Служит, чтобы найти союзника, которого нужно разбудить; враги не подсвечиваются, не ищите их здесь."
german = "Damit finden Sie den Teamkameraden, der aufgeweckt werden muss; Gegner werden nie markiert, suchen Sie sie also nicht hier."
spanish = "Sirve para encontrar al compañero que necesita que lo despierten; los enemigos nunca se resaltan, no los busques aquí."
french = "Sert à trouver le coéquipier à réveiller ; les ennemis ne sont jamais surlignés, ne les cherchez pas ici."
brazilian_portuguese = "Use para achar o companheiro que precisa ser acordado; inimigos nunca são destacados, não os procure aqui."
portuguese = "Serve para encontrar o companheiro que precisa de ser acordado; os inimigos nunca são realçados, não os procure aqui."
turkish = "Uyandırılması gereken takım arkadaşını bulmak için kullanın; düşmanlar hiç vurgulanmaz, onları burada aramayın."
polish = "Służy do znalezienia sojusznika, którego trzeba obudzić; wrogowie nigdy nie są podświetlani, więc ich tu nie szukaj."

[[message]]
key = "Hammer and gun switching made for Gores (KOG) servers, with optional Axiom login and fast input."
[message.translations]
simplified_chinese = "为 Gores（KOG）服务器设计的锤子与枪切换，可选 Axiom 登录和快速输入。"
traditional_chinese = "為 Gores（KOG）伺服器設計的槌子與槍枝切換，可選 Axiom 登入與快速輸入。"
japanese = "Gores（KOG）サーバー向けのハンマーと銃の切り替え。Axiom ログインと高速入力は任意です。"
korean = "Gores(KOG) 서버를 위한 망치·총 전환으로, Axiom 로그인과 빠른 입력은 선택 사항입니다."
russian = "Переключение молота и оружия для серверов Gores (KOG), с необязательным входом в Axiom и быстрым вводом."
german = "Hammer- und Waffenwechsel für Gores-(KOG-)Server, optional mit Axiom-Anmeldung und schneller Eingabe."
spanish = "Cambio de martillo y armas pensado para servidores Gores (KOG), con inicio de sesión en Axiom y entrada rápida opcionales."
french = "Changement de marteau et d'arme pour les serveurs Gores (KOG), avec connexion Axiom et saisie rapide en option."
brazilian_portuguese = "Troca de martelo e armas feita para servidores Gores (KOG), com login no Axiom e entrada rápida opcionais."
portuguese = "Troca de martelo e armas pensada para servidores Gores (KOG), com início de sessão no Axiom e entrada rápida opcionais."
turkish = "Gores (KOG) sunucuları için çekiç ve silah değiştirme; isteğe bağlı Axiom girişi ve hızlı giriş ile."
polish = "Przełączanie młotka i broni dla serwerów Gores (KOG), z opcjonalnym logowaniem Axiom i szybkim wejściem."

[[message]]
key = "Turn on \"Enable Gores mode\" or let \"Auto enable in Gores mode\" do it, pick options like \"Auto weapon switch\", and bind \"Gores mode key\"."
[message.translations]
simplified_chinese = "打开启用 Gores 模式，或让在 Gores 模式中自动启用代劳，选择自动切换武器等选项，再绑定 Gores 模式按键。"
traditional_chinese = "開啟啟用 Gores 模式，或讓在 Gores 模式中自動啟用代勞，選擇自動切換武器等選項，再綁定 Gores 模式按鍵。"
japanese = "Gores モードを有効にするの項目をオンにするか、Gores モードで自動有効化に任せ、自動武器切り替えなどの項目を選び、Gores モードキーを割り当てます。"
korean = "Gores 모드 사용을 켜거나 Gores 모드에서 자동 사용에 맡기고, 자동 무기 전환 같은 항목을 고른 뒤 Gores 모드 키를 할당합니다."
russian = "Включите режим Gores вручную или доверьте это автовключению в режиме Gores, выберите параметры вроде авто-смены оружия и назначьте клавишу режима Gores."
german = "Gores-Modus aktivieren einschalten oder das automatische Aktivieren im Gores-Modus übernehmen lassen, Optionen wie automatischer Waffenwechsel wählen und die Gores-Modus-Taste belegen."
spanish = "Activa activar el modo Gores o deja que lo haga activación automática en el modo Gores, elige opciones como cambio automático de arma y asigna la tecla del modo Gores."
french = "Activez activer le mode Gores ou laissez activation automatique en mode Gores le faire, choisissez des options comme changement d'arme automatique et assignez la touche du mode Gores."
brazilian_portuguese = "Ative ativar o modo Gores ou deixe a ativação automática no modo Gores fazer isso, escolha opções como troca automática de arma e defina a tecla do modo Gores."
portuguese = "Ative ativar o modo Gores ou deixe a ativação automática no modo Gores fazê-lo, escolha opções como troca automática de arma e associe a tecla do modo Gores."
turkish = "Gores modunu etkinleştir seçeneğini açın ya da Gores modunda otomatik etkinleştir seçeneğine bırakın; otomatik silah değiştirme gibi seçenekleri seçip Gores modu tuşunu atayın."
polish = "Włącz opcję włącz tryb Gores lub pozwól, by zrobiło to automatyczne włączanie w trybie Gores, wybierz opcje typu automatyczna zmiana broni i przypisz klawisz trybu Gores."

[[message]]
key = "Leave it off on normal servers: the auto switch overrides your weapon keys, so your pick can change before you shoot."
[message.translations]
simplified_chinese = "普通服务器上别开：自动切换会覆盖你的武器键，可能还没开枪武器就被换掉了。"
traditional_chinese = "一般伺服器上別開：自動切換會覆蓋你的武器鍵，可能還沒開槍武器就被換掉。"
japanese = "通常のサーバーではオフのままに。自動切り替えが武器キーを上書きするため、撃つ前に武器が変わることがあります。"
korean = "일반 서버에서는 꺼 두세요. 자동 전환이 무기 키를 덮어써서 쏘기 전에 무기가 바뀔 수 있습니다."
russian = "На обычных серверах не включайте: авто-смена перекрывает ваши клавиши оружия, и выбор может измениться до выстрела."
german = "Auf normalen Servern aus lassen: Der automatische Wechsel überschreibt Ihre Waffentasten, sodass sich die Auswahl vor dem Schuss ändern kann."
spanish = "Déjalo apagado en servidores normales: el cambio automático anula tus teclas de arma, así que la elección puede cambiar antes de disparar."
french = "Laissez-le désactivé sur les serveurs normaux : le changement automatique écrase vos touches d'arme et votre choix peut changer avant de tirer."
brazilian_portuguese = "Deixe desligado em servidores normais: a troca automática sobrepõe suas teclas de arma, então a escolha pode mudar antes de atirar."
portuguese = "Deixe-o desligado em servidores normais: a troca automática sobrepõe as suas teclas de arma, pelo que a escolha pode mudar antes de disparar."
turkish = "Normal sunucularda kapalı bırakın: otomatik değiştirme silah tuşlarınızı ezer, bu yüzden seçiminiz ateş etmeden değişebilir."
polish = "Na zwykłych serwerach pozostaw wyłączone: automatyczna zmiana nadpisuje klawisze broni, więc wybór może się zmienić, zanim strzelisz."

[[message]]
key = "The look and behavior of the IME candidate bar that appears when you type Chinese, Japanese or Korean in chat."
[message.translations]
simplified_chinese = "在聊天里输入中日韩文字时出现的 IME 候选栏的外观与行为。"
traditional_chinese = "在聊天中輸入中日韓文字時出現的 IME 候選列的外觀與行為。"
japanese = "チャットで日本語・中国語・韓国語を入力するときに表示される IME 候補バーの見た目と動作。"
korean = "채팅에서 중국어, 일본어, 한국어를 입력할 때 나타나는 IME 후보 창의 모양과 동작입니다."
russian = "Вид и поведение строки кандидатов IME, появляющейся при вводе китайского, японского или корейского текста в чат."
german = "Aussehen und Verhalten der IME-Kandidatenleiste, die beim Tippen von Chinesisch, Japanisch oder Koreanisch im Chat erscheint."
spanish = "Aspecto y comportamiento de la barra de candidatos del IME que aparece al escribir en chino, japonés o coreano en el chat."
french = "Aspect et comportement de la barre de candidats IME qui apparaît quand vous tapez en chinois, japonais ou coréen dans le chat."
brazilian_portuguese = "Aparência e comportamento da barra de candidatos do IME que aparece ao digitar chinês, japonês ou coreano no chat."
portuguese = "Aspeto e comportamento da barra de candidatos do IME que aparece ao escrever em chinês, japonês ou coreano no chat."
turkish = "Sohbette Çince, Japonca veya Korece yazarken çıkan IME aday çubuğunun görünümü ve davranışı."
polish = "Wygląd i działanie paska kandydatów IME, który pojawia się przy pisaniu po chińsku, japońsku lub koreańsku na czacie."

[[message]]
key = "Turn on \"New IME\" for the new bar and \"Auto manage IME while typing\" to switch input mode with the chat box; edit colors under \"Edit color\"."
[message.translations]
simplified_chinese = "打开新 IME 使用新候选栏，再打开输入时自动管理 IME 让输入模式跟随聊天框；颜色在编辑颜色里改。"
traditional_chinese = "開啟新 IME 使用新候選列，再開啟輸入時自動管理 IME 讓輸入模式跟隨聊天框；顏色在編輯顏色裡改。"
japanese = "新しいバーには新しい IME をオンにし、チャット欄に合わせて入力モードを切り替えるには入力中に IME を自動管理の項目をオンにします。色は色を編集で変更します。"
korean = "새 창은 새 IME를 켜고, 채팅창에 맞춰 입력 모드를 바꾸려면 입력 중 IME 자동 관리를 켭니다. 색은 색 편집에서 바꿉니다."
russian = "Включите новый IME для новой строки и авто-управление IME при вводе, чтобы режим ввода следовал за полем чата; цвета меняются в пункте изменить цвет."
german = "Neues IME für die neue Leiste einschalten und IME beim Tippen automatisch verwalten, damit der Eingabemodus dem Chatfeld folgt; Farben unter Farbe bearbeiten ändern."
spanish = "Activa IME nuevo para la barra nueva y gestión automática del IME al escribir para que el modo de entrada siga al cuadro de chat; los colores se editan en editar color."
french = "Activez nouvel IME pour la nouvelle barre et gestion automatique de l'IME pendant la saisie pour suivre la zone de chat ; les couleurs se règlent dans modifier la couleur."
brazilian_portuguese = "Ative IME novo para a barra nova e gerenciar IME automaticamente ao digitar para o modo de entrada seguir a caixa de chat; as cores mudam em editar cor."
portuguese = "Ative IME novo para a barra nova e gerir IME automaticamente ao escrever para o modo de entrada seguir a caixa de chat; as cores mudam em editar cor."
turkish = "Yeni çubuk için yeni IME seçeneğini, giriş modunun sohbet kutusunu izlemesi için yazarken IME otomatik yönet seçeneğini açın; renkler renk düzenle altında değişir."
polish = "Włącz nowy IME dla nowego paska oraz automatyczne zarządzanie IME podczas pisania, by tryb wprowadzania szedł za polem czatu; kolory zmienisz w edytuj kolor."

[[message]]
key = "If the bar covers your chat, lower \"Opacity\" or \"IME font size\" first; \"Reset IME appearance\" brings back the defaults."
[message.translations]
simplified_chinese = "候选栏挡住聊天时，先调低不透明度或 IME 字体大小；重置 IME 外观可恢复默认。"
traditional_chinese = "候選列擋住聊天時，先調低不透明度或 IME 字型大小；重設 IME 外觀可恢復預設。"
japanese = "バーがチャットを覆うなら、まず不透明度か IME のフォントサイズを下げてください。IME の外観をリセットで既定に戻ります。"
korean = "창이 채팅을 가리면 먼저 불투명도나 IME 글꼴 크기를 낮추세요. IME 모양 초기화하면 기본값으로 돌아갑니다."
russian = "Если строка закрывает чат, сначала уменьшите непрозрачность или размер шрифта IME; сброс оформления IME вернёт настройки по умолчанию."
german = "Verdeckt die Leiste den Chat, senken Sie zuerst Deckkraft oder IME-Schriftgröße; IME-Darstellung zurücksetzen stellt die Standardwerte wieder her."
spanish = "Si la barra tapa el chat, baja primero la opacidad o el tamaño de fuente del IME; restablecer la apariencia del IME vuelve a los valores predeterminados."
french = "Si la barre masque le chat, baissez d'abord l'opacité ou la taille de police de l'IME ; réinitialiser l'apparence de l'IME rétablit les valeurs par défaut."
brazilian_portuguese = "Se a barra cobrir o chat, reduza primeiro a opacidade ou o tamanho da fonte do IME; redefinir a aparência do IME volta aos padrões."
portuguese = "Se a barra cobrir o chat, baixe primeiro a opacidade ou o tamanho do tipo de letra do IME; repor o aspeto do IME volta aos valores predefinidos."
turkish = "Çubuk sohbeti kapatıyorsa önce saydamlığı veya IME yazı tipi boyutunu düşürün; IME görünümünü sıfırla varsayılanlara döndürür."
polish = "Jeśli pasek zasłania czat, najpierw zmniejsz krycie lub rozmiar czcionki IME; przywróć wygląd IME przywraca ustawienia domyślne."

[[message]]
key = "Shows fractional position numbers for edge jumps as on-screen text, so you can time a jump at the right spot."
[message.translations]
simplified_chinese = "以屏幕文字显示边缘跳的小数位置数值，帮你卡在准确的位置起跳。"
traditional_chinese = "以螢幕文字顯示邊緣跳的小數位置數值，幫你卡在準確的位置起跳。"
japanese = "エッジジャンプ用の小数の位置数値を画面テキストで表示し、正しい位置でジャンプのタイミングを取れるようにします。"
korean = "엣지 점프의 소수 위치 값을 화면 텍스트로 표시해 정확한 지점에서 점프 타이밍을 잡게 해 줍니다."
russian = "Показывает на экране дробные значения позиции для прыжков с края, чтобы прыгать в нужной точке."
german = "Zeigt Bruchteil-Positionswerte für Kantensprünge als Text auf dem Bildschirm, damit Sie im richtigen Moment springen."
spanish = "Muestra en pantalla números de posición fraccionarios para saltos de borde, para que saltes en el punto exacto."
french = "Affiche à l'écran des positions décimales pour les sauts de bord, afin de sauter au bon endroit."
brazilian_portuguese = "Mostra na tela números de posição fracionários para saltos de borda, para você saltar no ponto certo."
portuguese = "Mostra no ecrã números de posição fracionários para saltos de borda, para saltar no ponto certo."
turkish = "Kenar zıplamaları için ondalık konum sayılarını ekran metni olarak gösterir; doğru noktada zıplama zamanlaması yaparsınız."
polish = "Pokazuje na ekranie ułamkowe wartości pozycji dla skoków z krawędzi, by oddać skok w odpowiednim miejscu."

[[message]]
key = "Tick \"Position jump hint\", then move it with \"Horizontal position\" and \"Vertical position\" in percent and pick a readable \"Font size\"."
[message.translations]
simplified_chinese = "勾选显示跳跃提示，用水平位置和垂直位置（百分比）挪动它，再选一个看得清的字体大小。"
traditional_chinese = "勾選顯示跳躍提示，用水平位置與垂直位置（百分比）移動它，再選一個看得清的字型大小。"
japanese = "ジャンプヒントを表示の項目にチェックを入れ、水平位置と垂直位置をパーセントで動かし、読みやすいフォントサイズを選びます。"
korean = "점프 힌트 표시를 체크하고 가로 위치와 세로 위치를 퍼센트로 옮긴 뒤 읽기 좋은 글꼴 크기를 고릅니다."
russian = "Включите показ подсказки прыжка, сдвиньте её положением по горизонтали и положением по вертикали в процентах и выберите читаемый размер шрифта."
german = "Sprunghinweis anzeigen anhaken, ihn über horizontale Position und vertikale Position in Prozent verschieben und eine lesbare Schriftgröße wählen."
spanish = "Marca mostrar la ayuda de salto, muévela con posición horizontal y posición vertical en porcentaje y elige un tamaño de fuente legible."
french = "Cochez afficher l'indication de saut, déplacez-la avec position horizontale et position verticale en pourcentage, puis choisissez une taille de police lisible."
brazilian_portuguese = "Marque mostrar dica de salto, mova-a com posição horizontal e posição vertical em porcentagem e escolha um tamanho de fonte legível."
portuguese = "Marque mostrar dica de salto, mova-a com posição horizontal e posição vertical em percentagem e escolha um tamanho de letra legível."
turkish = "Zıplama ipucunu göster seçeneğini işaretleyin, yatay konum ve dikey konum ile yüzde olarak taşıyın ve okunaklı bir yazı tipi boyutu seçin."
polish = "Zaznacz pokazuj podpowiedź skoku, przesuń ją za pomocą pozycji poziomej i pozycji pionowej w procentach i wybierz czytelny rozmiar czcionki."

[[message]]
key = "Keep it small and near an edge: the hint draws over the map and can cover the tile you are aiming at."
[message.translations]
simplified_chinese = "保持小字号并放在边缘附近：提示会盖在地图上，可能挡住你要瞄的块。"
traditional_chinese = "保持小字號並放在邊緣附近：提示會蓋在地圖上，可能擋住你要瞄的區塊。"
japanese = "小さめにして端の近くに置きましょう。ヒントはマップ上に描画されるため、狙っているタイルを覆うことがあります。"
korean = "작게 유지하고 가장자리 근처에 두세요. 힌트는 맵 위에 그려져 조준 중인 타일을 가릴 수 있습니다."
russian = "Держите её маленькой и у края: подсказка рисуется поверх карты и может закрыть блок, в который вы целитесь."
german = "Klein und nahe am Rand halten: Der Hinweis liegt über der Karte und kann die anvisierte Kachel verdecken."
spanish = "Mantenla pequeña y cerca del borde: la ayuda se dibuja sobre el mapa y puede tapar el tile que estás apuntando."
french = "Gardez-la petite et près d'un bord : l'indication se dessine sur la carte et peut masquer le tile visé."
brazilian_portuguese = "Mantenha-a pequena e perto da borda: a dica é desenhada sobre o mapa e pode cobrir o tile que você está mirando."
portuguese = "Mantenha-a pequena e junto à borda: a dica é desenhada sobre o mapa e pode tapar o tile que está a apontar."
turkish = "Küçük tutun ve bir kenara yakın koyun: ipucu haritanın üzerine çizilir ve nişan aldığınız karoyu kapatabilir."
polish = "Trzymaj ją małą i blisko krawędzi: podpowiedź rysuje się nad mapą i może zasłaniać kafel, w który celujesz."

[[message]]
key = "Colors of the translate button in the chat input and of the language menu that button opens."
[message.translations]
simplified_chinese = "聊天输入框里翻译按钮的颜色，以及该按钮打开的语言菜单的颜色。"
traditional_chinese = "聊天輸入框裡翻譯按鈕的顏色，以及該按鈕開啟的語言選單的顏色。"
japanese = "チャット入力欄の翻訳ボタンと、そのボタンで開く言語メニューの色。"
korean = "채팅 입력창의 번역 버튼과 그 버튼으로 여는 언어 메뉴의 색상입니다."
russian = "Цвета кнопки перевода в поле чата и меню языков, которое она открывает."
german = "Farben der Übersetzen-Schaltfläche im Chatfeld und des Sprachmenüs, das sie öffnet."
spanish = "Colores del botón de traducción del cuadro de chat y del menú de idiomas que abre ese botón."
french = "Couleurs du bouton de traduction dans la zone de chat et du menu de langues qu'il ouvre."
brazilian_portuguese = "Cores do botão de tradução na caixa de chat e do menu de idiomas que ele abre."
portuguese = "Cores do botão de tradução na caixa de chat e do menu de idiomas que ele abre."
turkish = "Sohbet girişindeki çeviri düğmesinin ve bu düğmenin açtığı dil menüsünün renkleri."
polish = "Kolory przycisku tłumaczenia w polu czatu i menu języków, które ten przycisk otwiera."

[[message]]
key = "Set \"Button - Disabled\" and \"Button - Enabled\" for the button, then \"Menu background\" and the two menu option rows for the popup."
[message.translations]
simplified_chinese = "按钮部分设置按钮 - 禁用与按钮 - 启用，弹出菜单部分设置菜单背景和两行菜单选项。"
traditional_chinese = "按鈕用按鈕 - 停用與按鈕 - 啟用來設定，彈出選單則設選單背景與兩行選單選項。"
japanese = "ボタンにはボタン - 無効とボタン - 有効を設定し、ポップアップにはメニュー背景と 2 行のメニュー項目を設定します。"
korean = "버튼에는 버튼 - 비활성과 버튼 - 활성을 설정하고, 팝업에는 메뉴 배경과 두 줄의 메뉴 항목을 설정합니다."
russian = "Для кнопки задайте пункты кнопка — неактивна и кнопка — активна, а для всплывающего меню — фон меню и две строки пунктов меню."
german = "Für die Schaltfläche die Optionen Schaltfläche – inaktiv und Schaltfläche – aktiv setzen, fürs Popup dann Menühintergrund und die zwei Menüoptionszeilen."
spanish = "Ajusta botón - desactivado y botón - activado para el botón, y fondo del menú con las dos filas de opciones para el emergente."
french = "Réglez bouton - désactivé et bouton - activé pour le bouton, puis fond du menu et les deux lignes d'options pour le menu."
brazilian_portuguese = "Defina botão - desativado e botão - ativado para o botão, e fundo do menu com as duas linhas de opções para o pop-up."
portuguese = "Defina botão - desativado e botão - ativado para o botão, e fundo do menu com as duas linhas de opções para a janela."
turkish = "Düğme için düğme - devre dışı ve düğme - etkin değerlerini, açılır pencere için menü arka planı ve iki menü satırını ayarlayın."
polish = "Dla przycisku ustaw przycisk – wyłączony i przycisk – włączony, a dla okna menu tło menu i dwa wiersze opcji menu."

[[message]]
key = "\"Button - Enabled\" only shows while automatic outgoing translation is on; \"Reset translation colors\" undoes your changes."
[message.translations]
simplified_chinese = "按钮 - 启用只在自动翻译发送内容开启时显示；重置翻译颜色会撤销你的修改。"
traditional_chinese = "按鈕 - 啟用只在自動翻譯送出內容開啟時可見；重設翻譯顏色會復原你的修改。"
japanese = "ボタン - 有効は自動送信翻訳がオンのときだけ表示されます。翻訳の色をリセットで変更を元に戻せます。"
korean = "버튼 - 활성은 자동 발신 번역이 켜져 있을 때만 보입니다. 번역 색상 초기화를 누르면 변경이 취소됩니다."
russian = "Кнопка — активна видна только при включённом авто-переводе исходящих; сброс цветов перевода отменит изменения."
german = "Schaltfläche – aktiv erscheint nur bei aktiver automatischer Übersetzung ausgehender Nachrichten; Übersetzungsfarben zurücksetzen macht Änderungen rückgängig."
spanish = "Botón - activado solo se ve con la traducción automática de salida activada; restablecer los colores de traducción deshace tus cambios."
french = "Bouton - activé n'apparaît que si la traduction sortante automatique est active ; réinitialiser les couleurs de traduction annule vos changements."
brazilian_portuguese = "Botão - ativado só aparece com a tradução automática de saída ligada; redefinir as cores de tradução desfaz suas mudanças."
portuguese = "Botão - ativado só aparece com a tradução automática de saída ligada; repor as cores de tradução anula as suas alterações."
turkish = "Düğme - etkin yalnızca otomatik giden çeviri açıkken görünür; çeviri renklerini sıfırla değişikliklerinizi geri alır."
polish = "Przycisk – włączony widać tylko przy włączonym automatycznym tłumaczeniu wychodzącym; przywróć kolory tłumaczenia cofa zmiany."

[[message]]
key = "Automatic chat replies when someone else writes a keyword you set, optionally sent by your dummy."
[message.translations]
simplified_chinese = "别人说出你设定的关键词时自动回复聊天，可选由你的 dummy 发出。"
traditional_chinese = "別人說出你設定的關鍵詞時自動回覆聊天，可選由你的 dummy 發出。"
japanese = "他の人が設定したキーワードを書いたときに自動でチャット返信します。dummy から送ることもできます。"
korean = "다른 사람이 설정한 키워드를 입력하면 채팅으로 자동 답장하며, 원하면 dummy가 대신 보냅니다."
russian = "Автоответ в чате, когда кто-то пишет заданное вами ключевое слово; по желанию отправляет ваш dummy."
german = "Automatische Chat-Antworten, wenn jemand ein von Ihnen gesetztes Stichwort schreibt, optional von Ihrem Dummy gesendet."
spanish = "Respuestas automáticas en el chat cuando otra persona escribe una palabra clave que definiste; opcionalmente las envía tu dummy."
french = "Réponses automatiques dans le chat quand quelqu'un écrit un mot-clé défini, envoyées éventuellement par votre dummy."
brazilian_portuguese = "Respostas automáticas no chat quando alguém escreve uma palavra-chave definida por você, opcionalmente enviadas pelo seu dummy."
portuguese = "Respostas automáticas no chat quando alguém escreve uma palavra-chave definida por si, opcionalmente enviadas pelo seu dummy."
turkish = "Başkası belirlediğiniz anahtar sözcüğü yazınca otomatik sohbet yanıtı; isterseniz dummy'niz gönderir."
polish = "Automatyczne odpowiedzi na czacie, gdy ktoś napisze ustawione słowo kluczowe, opcjonalnie wysyłane przez twojego dummy."

[[message]]
key = "Add rules in \"Rule list\", fill the answer in \"Reply content\", then under \"Trigger limits\" turn on \"Enable keyword reply\" and set \"Auto reply cooldown\"."
[message.translations]
simplified_chinese = "在规则列表里添加规则，在回复内容里填好答案，然后在触发限制里启用关键词回复并设置自动回复冷却。"
traditional_chinese = "在規則清單裡加入規則，在回覆內容裡填好答案，然後在觸發限制下開啟啟用關鍵詞回覆並設定自動回覆冷卻。"
japanese = "ルール一覧でルールを追加し、返信内容に答えを入れてから、トリガー制限でキーワード返信を有効にするをオンにし、自動返信のクールダウンを設定します。"
korean = "규칙 목록에서 규칙을 추가하고 답장 내용에 답을 채운 뒤, 트리거 제한에서 키워드 답장 사용을 켜고 자동 답장 대기 시간을 설정합니다."
russian = "Добавьте правила в список правил, заполните текст ответа, затем в ограничениях срабатывания включите автоответ по ключевым словам и задайте задержку автоответа."
german = "Regeln in der Regelliste anlegen, die Antwort im Antwortinhalt eintragen, dann unter Auslösebeschränkungen die Stichwortantwort aktivieren und die Autoantwort-Abklingzeit setzen."
spanish = "Añade reglas en lista de reglas, escribe la respuesta en contenido de la respuesta y, en límites de activación, activa la respuesta por palabra clave y ajusta el enfriamiento de la respuesta automática."
french = "Ajoutez des règles dans liste des règles, saisissez la réponse dans contenu de la réponse, puis dans limites de déclenchement activez la réponse par mot-clé et réglez le délai de la réponse automatique."
brazilian_portuguese = "Adicione regras em lista de regras, preencha a resposta em conteúdo da resposta e, em limites de acionamento, ative a resposta por palavra-chave e defina o tempo de espera da resposta automática."
portuguese = "Adicione regras em lista de regras, preencha a resposta em conteúdo da resposta e, em limites de ativação, ative a resposta por palavra-chave e defina o tempo de espera da resposta automática."
turkish = "Kural listesinde kural ekleyin, yanıt içeriğine cevabı yazın, sonra tetikleme sınırları altında anahtar sözcük yanıtını etkinleştir seçeneğini açıp otomatik yanıt bekleme süresini ayarlayın."
polish = "Dodaj reguły na liście reguł, wpisz odpowiedź w treści odpowiedzi, a potem w limitach wyzwalania włącz odpowiedź na słowa kluczowe i ustaw czas odnowienia automatycznej odpowiedzi."

[[message]]
key = "Replies go to public chat and share one cooldown, so keep keywords specific or a common word will spam the server."
[message.translations]
simplified_chinese = "回复会发到公共聊天并共用一个冷却，关键词要具体，否则常见词会在服务器上刷屏。"
traditional_chinese = "回覆會發到公開聊天並共用一個冷卻，關鍵詞要具體，否則常見詞會在伺服器上洗頻。"
japanese = "返信は公開チャットに送られ、クールダウンは共通なので、よくある単語を使うとサーバーに連投してしまいます。キーワードは具体的にしましょう。"
korean = "답장은 공개 채팅으로 가고 대기 시간을 함께 쓰므로, 흔한 단어를 쓰면 서버에 도배됩니다. 키워드는 구체적으로 정하세요."
russian = "Ответы уходят в общий чат и делят одну задержку, поэтому ключевые слова должны быть конкретными, иначе частое слово заспамит сервер."
german = "Antworten gehen in den öffentlichen Chat und teilen eine Abklingzeit; halten Sie Stichwörter spezifisch, sonst spammt ein häufiges Wort den Server."
spanish = "Las respuestas van al chat público y comparten un enfriamiento, así que usa palabras clave específicas o una palabra común llenará el servidor de spam."
french = "Les réponses vont dans le chat public et partagent un même délai : gardez des mots-clés précis, sinon un mot courant spammera le serveur."
brazilian_portuguese = "As respostas vão para o chat público e dividem um só tempo de espera, então use palavras-chave específicas ou uma palavra comum enche o servidor de spam."
portuguese = "As respostas vão para o chat público e partilham um só tempo de espera; use palavras-chave específicas ou uma palavra comum vai encher o servidor de spam."
turkish = "Yanıtlar herkese açık sohbete gider ve tek bir bekleme süresini paylaşır; anahtar sözcükleri özel tutun, yoksa yaygın bir sözcük sunucuyu spamler."
polish = "Odpowiedzi trafiają na czat publiczny i dzielą jeden czas odnowienia, więc używaj konkretnych słów kluczowych, bo popularne słowo zaspamuje serwer."

[[message]]
key = "Sends a saved .map file from your client to the public test server and reports progress and errors."
[message.translations]
simplified_chinese = "把客户端里已保存的 .map 文件发送到公用测图服，并显示进度和错误。"
traditional_chinese = "把客戶端裡已儲存的 .map 檔案傳送到公用測圖伺服器，並顯示進度與錯誤。"
japanese = "保存した .map ファイルをクライアントから公開テストサーバーへ送り、進行状況とエラーを表示します。"
korean = "저장한 .map 파일을 클라이언트에서 공개 테스트 서버로 보내고 진행 상황과 오류를 표시합니다."
russian = "Отправляет сохранённый файл .map из клиента на публичный тестовый сервер и показывает прогресс и ошибки."
german = "Sendet eine gespeicherte .map-Datei vom Client an den öffentlichen Testserver und meldet Fortschritt und Fehler."
spanish = "Envía un archivo .map guardado desde tu cliente al servidor público de pruebas e informa del progreso y los errores."
french = "Envoie un fichier .map enregistré depuis votre client vers le serveur public de test et indique la progression et les erreurs."
brazilian_portuguese = "Envia um arquivo .map salvo do seu cliente para o servidor público de testes e mostra progresso e erros."
portuguese = "Envia um ficheiro .map guardado do seu cliente para o servidor público de testes e mostra o progresso e os erros."
turkish = "Kaydedilmiş bir .map dosyasını istemcinizden herkese açık test sunucusuna gönderir ve ilerlemeyi, hataları bildirir."
polish = "Wysyła zapisany plik .map z klienta na publiczny serwer testowy i pokazuje postęp oraz błędy."

[[message]]
key = "Press \"Select map\" to choose a file, check the target server and player shown for the upload, then press \"Upload map\"; \"Cancel\" stops it."
[message.translations]
simplified_chinese = "按选择地图挑文件，核对上传显示的目标服务器与玩家，再按上传地图；取消可中止。"
traditional_chinese = "按選擇地圖挑檔案，核對上傳顯示的目標伺服器與玩家，再按上傳地圖；取消可中止。"
japanese = "マップを選択のボタンでファイルを選び、アップロード先のサーバーとプレイヤーを確認してからマップをアップロードのボタンを押します。キャンセルで中止できます。"
korean = "맵 선택으로 파일을 고르고 업로드 대상 서버와 플레이어를 확인한 뒤 맵 업로드를 누릅니다. 취소로 멈출 수 있습니다."
russian = "Нажмите выбрать карту, проверьте целевой сервер и игрока для загрузки, затем нажмите загрузить карту; отмена остановит её."
german = "Karte auswählen drücken, Datei wählen, Zielserver und Spieler der Übertragung prüfen, dann Karte hochladen drücken; Abbrechen bricht ab."
spanish = "Pulsa seleccionar mapa para elegir un archivo, revisa el servidor y el jugador de destino de la subida y pulsa subir mapa; cancelar lo detiene."
french = "Appuyez sur choisir une carte, vérifiez le serveur et le joueur cibles, puis appuyez sur envoyer la carte ; annuler l'interrompt."
brazilian_portuguese = "Pressione selecionar mapa para escolher um arquivo, confira o servidor e o jogador de destino do envio e pressione enviar mapa; cancelar interrompe."
portuguese = "Prima selecionar mapa para escolher um ficheiro, confirme o servidor e o jogador de destino do envio e prima enviar mapa; cancelar interrompe."
turkish = "Dosya seçmek için harita seç düğmesine basın, yüklemenin hedef sunucusunu ve oyuncusunu kontrol edin, sonra haritayı yükle düğmesine basın; iptal durdurur."
polish = "Naciśnij wybierz mapę, aby wybrać plik, sprawdź docelowy serwer i gracza wysyłki, a następnie naciśnij prześlij mapę; anuluj przerywa."

[[message]]
key = "After a successful upload, log in with F2 and run the change_map command; files must stay under 64 MiB."
[message.translations]
simplified_chinese = "上传成功后用 F2 登录并执行 change_map 命令；文件须小于 64 MiB。"
traditional_chinese = "上傳成功後用 F2 登入並執行 change_map 指令；檔案須小於 64 MiB。"
japanese = "アップロードに成功したら F2 でログインし、change_map コマンドを実行します。ファイルは 64 MiB 未満である必要があります。"
korean = "업로드에 성공하면 F2로 로그인해 change_map 명령을 실행합니다. 파일은 64 MiB 미만이어야 합니다."
russian = "После успешной загрузки войдите по F2 и выполните команду change_map; файл должен быть меньше 64 MiB."
german = "Nach erfolgreichem Hochladen mit F2 einloggen und den Befehl change_map ausführen; Dateien müssen unter 64 MiB bleiben."
spanish = "Tras una subida correcta, inicia sesión con F2 y ejecuta el comando change_map; los archivos deben quedar por debajo de 64 MiB."
french = "Après un envoi réussi, connectez-vous avec F2 et lancez la commande change_map ; les fichiers doivent rester sous 64 MiB."
brazilian_portuguese = "Após um envio bem-sucedido, entre com F2 e rode o comando change_map; os arquivos devem ficar abaixo de 64 MiB."
portuguese = "Após um envio bem-sucedido, inicie sessão com F2 e execute o comando change_map; os ficheiros têm de ficar abaixo de 64 MiB."
turkish = "Yükleme başarılıysa F2 ile giriş yapıp change_map komutunu çalıştırın; dosyalar 64 MiB'nin altında kalmalı."
polish = "Po udanym przesłaniu zaloguj się klawiszem F2 i uruchom polecenie change_map; pliki muszą być mniejsze niż 64 MiB."

[[message]]
key = "Automates what happens right after a hammer wakes your frozen tee: unspec, tee switch, chat close and a hint."
[message.translations]
simplified_chinese = "自动处理锤子唤醒被冻结的 Tee 之后的动作：取消旁观、切换 Tee、关闭聊天和提示。"
traditional_chinese = "自動處理槌子喚醒被凍結的 Tee 之後的動作：取消旁觀、切換 Tee、關閉聊天與提示。"
japanese = "ハンマーで凍った Tee を起こした直後の動作を自動化します。スペック解除、Tee 切り替え、チャットを閉じる、ヒント表示。"
korean = "망치로 얼어붙은 Tee를 깨운 직후의 동작을 자동화합니다. 관전 해제, Tee 전환, 채팅 닫기, 힌트 표시."
russian = "Автоматизирует действия сразу после того, как молот разбудил замороженного Tee: снятие спектатора, смена Tee, закрытие чата и подсказка."
german = "Automatisiert, was direkt nach dem Aufwecken des eingefrorenen Tee per Hammer passiert: Spec beenden, Tee wechseln, Chat schließen und ein Hinweis."
spanish = "Automatiza lo que ocurre justo después de que un martillo despierte a tu Tee congelado: quitar espectador, cambiar de Tee, cerrar el chat y un aviso."
french = "Automatise ce qui suit le réveil de votre Tee gelé au marteau : fin du mode spectateur, changement de Tee, fermeture du chat et une indication."
brazilian_portuguese = "Automatiza o que acontece logo depois que o martelo acorda seu Tee congelado: sair do espectador, trocar de Tee, fechar o chat e um aviso."
portuguese = "Automatiza o que acontece logo após o martelo acordar o seu Tee congelado: sair de espectador, trocar de Tee, fechar o chat e um aviso."
turkish = "Çekicin donmuş Tee'nizi uyandırmasının hemen ardından olanları otomatikleştirir: izleyiciden çıkma, Tee değiştirme, sohbeti kapatma ve ipucu."
polish = "Automatyzuje to, co dzieje się zaraz po obudzeniu młotkiem zamrożonego Tee: wyjście z podglądu, zmianę Tee, zamknięcie czatu i podpowiedź."

[[message]]
key = "Tick the actions you want, such as \"Auto unspec on unfreeze\" or \"Auto team lock\"; \"Lock delay\" and \"Spectator opacity\" appear below."
[message.translations]
simplified_chinese = "勾选想要的动作，例如解冻后自动取消旁观或自动锁定队伍；下方会出现锁定延迟和旁观透明度。"
traditional_chinese = "勾選想要的動作，例如解凍後自動取消旁觀或自動鎖定隊伍；下方會出現鎖定延遲與旁觀透明度。"
japanese = "解凍時に自動でスペック解除やチームの自動ロックなど、必要な動作にチェックを入れます。下にロック遅延とスペクテイターの不透明度が表示されます。"
korean = "해제 시 자동 관전 해제나 자동 팀 잠금 같이 원하는 동작을 체크합니다. 아래에 잠금 지연과 관전자 불투명도가 나타납니다."
russian = "Отметьте нужные действия, например авто-снятие спектатора при разморозке или авто-блокировка команды; ниже появятся задержка блокировки и прозрачность наблюдателя."
german = "Gewünschte Aktionen anhaken, etwa Auto-Spec bei Auftauen oder automatische Team-Sperre; darunter erscheinen Sperrverzögerung und Zuschauer-Deckkraft."
spanish = "Marca las acciones que quieras, como quitar espectador al descongelar o bloqueo automático de equipo; abajo aparecen retardo del bloqueo y opacidad del espectador."
french = "Cochez les actions voulues, comme retirer le mode spectateur au dégel ou verrouillage automatique d'équipe ; dessous apparaissent délai de verrouillage et opacité du spectateur."
brazilian_portuguese = "Marque as ações desejadas, como tirar do espectador ao descongelar ou bloqueio automático de equipe; abaixo aparecem atraso do bloqueio e opacidade do espectador."
portuguese = "Marque as ações desejadas, como sair de espectador ao descongelar ou bloqueio automático de equipa; abaixo aparecem atraso do bloqueio e opacidade do espetador."
turkish = "İstediğiniz eylemleri işaretleyin, örneğin çözülünce otomatik izleyiciden çık veya otomatik takım kilidi; aşağıda kilit gecikmesi ve izleyici saydamlığı görünür."
polish = "Zaznacz wybrane działania, np. automatyczne wyjście z podglądu po rozmrożeniu lub automatyczna blokada drużyny; poniżej pojawią się opóźnienie blokady i krycie obserwatora."

[[message]]
key = "Turn on one option at a time: switching tee or closing chat can throw away a message you are still typing."
[message.translations]
simplified_chinese = "一次只开一项：切换 Tee 或关闭聊天可能丢掉你还没写完的消息。"
traditional_chinese = "一次只開一項：切換 Tee 或關閉聊天可能丟掉你還沒寫完的訊息。"
japanese = "一度に一つずつオンにしましょう。Tee の切り替えやチャットを閉じる動作は、入力途中のメッセージを失わせることがあります。"
korean = "한 번에 하나씩 켜세요. Tee 전환이나 채팅 닫기는 아직 쓰던 메시지를 잃게 할 수 있습니다."
russian = "Включайте по одному: смена Tee или закрытие чата могут стереть сообщение, которое вы ещё печатаете."
german = "Immer nur eine Option einschalten: Tee-Wechsel oder Chat schließen können eine noch nicht fertige Nachricht verwerfen."
spanish = "Activa una opción cada vez: cambiar de Tee o cerrar el chat puede descartar un mensaje que aún estás escribiendo."
french = "Activez une option à la fois : changer de Tee ou fermer le chat peut perdre un message en cours de saisie."
brazilian_portuguese = "Ative uma opção por vez: trocar de Tee ou fechar o chat pode descartar uma mensagem que você ainda está digitando."
portuguese = "Ative uma opção de cada vez: trocar de Tee ou fechar o chat pode descartar uma mensagem que ainda está a escrever."
turkish = "Seçenekleri tek tek açın: Tee değiştirmek veya sohbeti kapatmak yazmakta olduğunuz mesajı kaybettirebilir."
polish = "Włączaj po jednej opcji: zmiana Tee albo zamknięcie czatu może wyrzucić wiadomość, którą jeszcze piszesz."

[[message]]
key = "Puts you and your dummy in two separate teams so each can run a solo map, with keys to enter and leave."
[message.translations]
simplified_chinese = "把你和 dummy 分到两个独立队伍，各自都能跑单人图，并提供进入和离开的按键。"
traditional_chinese = "把你和 dummy 分到兩個獨立隊伍，各自都能跑單人圖，並提供進入與離開的按鍵。"
japanese = "あなたと dummy を別々のチームに分け、それぞれがソロマップを走れるようにします。開始と終了のキー付き。"
korean = "나와 dummy를 서로 다른 팀으로 나눠 각자 솔로 맵을 진행할 수 있게 하며, 시작과 종료 키를 제공합니다."
russian = "Размещает вас и вашего dummy в двух отдельных командах, чтобы каждый мог проходить соло-карту; есть клавиши входа и выхода."
german = "Steckt dich und deinen dummy in zwei getrennte Teams, sodass jeder eine Solo-Map fahren kann, mit Tasten zum Ein- und Aussteigen."
spanish = "Pone a ti y a tu dummy en dos equipos separados para que cada uno pueda jugar un mapa en solitario, con teclas para entrar y salir."
french = "Place toi et ton dummy dans deux équipes séparées pour que chacun puisse jouer une map solo, avec des touches pour entrer et sortir."
brazilian_portuguese = "Coloca você e seu dummy em dois times separados para cada um jogar um mapa solo, com teclas para entrar e sair."
portuguese = "Coloca-te a ti e ao teu dummy em duas equipas separadas para cada um jogar um mapa a solo, com teclas para entrar e sair."
turkish = "Seni ve dummy'ni iki ayrı takıma koyar; böylece her biri solo harita oynayabilir, giriş ve çıkış tuşlarıyla."
polish = "Umieszcza ciebie i twojego dummy w dwóch osobnych drużynach, aby każdy mógł grać mapę solo, z klawiszami wejścia i wyjścia."

[[message]]
key = "Tick \"Auto-connect dummy\" to connect the dummy for you, then bind \"Solo split key\" to toggle, or use the enter and leave keys."
[message.translations]
simplified_chinese = "勾选自动连接 dummy 让它替你连接，然后把单人分线按键绑定为切换，或直接使用进入和离开的按键。"
traditional_chinese = "勾選自動連線 dummy 讓它替你連線，再將單人分線鍵綁定為切換，或直接使用進入與離開的按鍵。"
japanese = "自動接続 dummy を有効にすると dummy の接続を任せられます。次にソロ分割キーを切り替えに割り当てるか、開始と終了のキーを使います。"
korean = "자동 연결 dummy를 켜면 dummy가 대신 연결되며, 그다음 솔로 분할 키를 토글로 지정하거나 시작·종료 키를 사용하면 됩니다."
russian = "Включите авто-подключение dummy, чтобы он подключался сам, затем назначьте клавишу соло-разделения как переключатель или используйте клавиши входа и выхода."
german = "Aktiviere dummy automatisch verbinden, damit der dummy für dich verbindet, dann belege die Solo-Split-Taste als Umschalter oder nutze die Ein- und Ausstiegstasten."
spanish = "Marca conectar dummy automáticamente para que se conecte solo, luego asigna la tecla de división solo como alternancia o usa las teclas de entrar y salir."
french = "Coche connecter automatiquement le dummy pour qu'il se connecte seul, puis assigne la touche de séparation solo comme bascule ou utilise les touches d'entrée et de sortie."
brazilian_portuguese = "Marque conectar dummy automaticamente para ele se conectar sozinho, depois vincule a tecla de divisão solo como alternância ou use as teclas de entrar e sair."
portuguese = "Marca ligar dummy automaticamente para ele se ligar sozinho, depois associa a tecla de divisão solo como alternância ou usa as teclas de entrar e sair."
turkish = "Otomatik dummy bağla seçeneğini işaretleyerek dummy'nin senin yerine bağlanmasını sağla, sonra solo bölme tuşunu aç/kapa olarak ata ya da giriş ve çıkış tuşlarını kullan."
polish = "Zaznacz automatyczne łączenie dummy, aby łączył się za ciebie, potem przypisz klawisz podziału solo jako przełącznik albo użyj klawiszy wejścia i wyjścia."

[[message]]
key = "Pressing the key again leaves the split and returns both Tees to the team set in \"Team when leaving solo split\"."
[message.translations]
simplified_chinese = "再按一次该键退出分线，两个 Tee 会回到退出单人分线时的队伍设置里指定的队伍。"
traditional_chinese = "再按一次該鍵退出分線，兩個 Tee 會回到退出單人分線時的隊伍設定所選的隊伍。"
japanese = "もう一度キーを押すと分割を解除し、両方の Tee はソロ分割終了時のチーム設定で選んだチームに戻ります。"
korean = "키를 다시 누르면 분할이 해제되고 두 Tee 모두 솔로 분할 종료 시 팀 설정에서 고른 팀으로 돌아갑니다."
russian = "Повторное нажатие клавиши выходит из разделения, и оба Tee возвращаются в команду, заданную в настройке команды при выходе из соло-разделения."
german = "Erneutes Drücken der Taste beendet den Split und beide Tees landen im Team, das in Team beim Verlassen des Solo-Splits festgelegt ist."
spanish = "Pulsar la tecla otra vez sale de la división y ambos Tees vuelven al equipo indicado en equipo al salir de la división solo."
french = "Appuyer encore sur la touche quitte la séparation et ramène les deux Tees dans l'équipe définie dans équipe en quittant la séparation solo."
brazilian_portuguese = "Pressionar a tecla de novo sai da divisão e ambos os Tees voltam ao time definido em time ao sair da divisão solo."
portuguese = "Premir a tecla outra vez sai da divisão e ambos os Tees voltam à equipa definida em equipa ao sair da divisão solo."
turkish = "Tuşa tekrar basmak bölmeyi bırakır ve iki Tee de solo bölmeden çıkarken takım ayarında seçilen takıma döner."
polish = "Ponowne naciśnięcie klawisza wychodzi z podziału, a oba Tee wracają do drużyny ustawionej w opcji drużyny przy wyjściu z podziału solo."

[[message]]
key = "Starts Steam automatically when the client is launched from outside, so Steam records your playtime."
[message.translations]
simplified_chinese = "从外部启动客户端时自动启动 Steam，让 Steam 记录你的游戏时长。"
traditional_chinese = "從外部啟動客戶端時自動啟動 Steam，讓 Steam 記錄你的遊戲時數。"
japanese = "外部からクライアントを起動したときに Steam を自動で起動し、Steam にプレイ時間を記録させます。"
korean = "외부에서 클라이언트를 실행할 때 Steam을 자동으로 시작해 Steam이 플레이 시간을 기록하게 합니다."
russian = "Автоматически запускает Steam при запуске клиента извне, чтобы Steam учитывал ваше игровое время."
german = "Startet Steam automatisch, wenn der Client von außen gestartet wird, damit Steam deine Spielzeit erfasst."
spanish = "Inicia Steam automáticamente cuando el cliente se abre desde fuera, para que Steam registre tu tiempo de juego."
french = "Lance Steam automatiquement quand le client est démarré de l'extérieur, pour que Steam enregistre ton temps de jeu."
brazilian_portuguese = "Inicia o Steam automaticamente quando o cliente é aberto por fora, para o Steam registrar seu tempo de jogo."
portuguese = "Inicia o Steam automaticamente quando o cliente é aberto de fora, para o Steam registar o teu tempo de jogo."
turkish = "İstemci dışarıdan başlatıldığında Steam'i otomatik açar, böylece Steam oynama süreni kaydeder."
polish = "Uruchamia Steam automatycznie, gdy klient jest startowany z zewnątrz, aby Steam zapisywał czas gry."

[[message]]
key = "Tick \"Launch Steam automatically when starting externally\"; if Steam is not found, type its path or press \"Detect Steam again\"."
[message.translations]
simplified_chinese = "勾选从外部启动时自动启动 Steam；若找不到 Steam，手动输入其路径或点按重新检测 Steam。"
traditional_chinese = "勾選從外部啟動時自動啟動 Steam；若找不到 Steam，手動輸入其路徑或按下重新偵測 Steam。"
japanese = "外部起動時に Steam を自動で起動を有効にします。Steam が見つからない場合はパスを入力するか、Steam を再検出を押します。"
korean = "외부 실행 시 Steam 자동 시작을 켜세요. Steam을 찾지 못하면 경로를 입력하거나 Steam 다시 감지를 누르세요."
russian = "Включите автозапуск Steam при внешнем старте; если Steam не найден, укажите путь или нажмите повторно найти Steam."
german = "Aktiviere Steam beim externen Start automatisch starten; falls Steam fehlt, Pfad eingeben oder Steam erneut suchen drücken."
spanish = "Marca iniciar Steam automáticamente al arrancar desde fuera; si no se encuentra Steam, escribe su ruta o pulsa detectar Steam de nuevo."
french = "Coche lancer Steam automatiquement au démarrage externe ; si Steam est introuvable, saisis son chemin ou appuie sur détecter Steam à nouveau."
brazilian_portuguese = "Marque iniciar Steam automaticamente ao abrir por fora; se o Steam não for encontrado, digite o caminho ou pressione detectar Steam novamente."
portuguese = "Marca iniciar o Steam automaticamente ao abrir de fora; se o Steam não for encontrado, escreve o caminho ou prime detetar Steam novamente."
turkish = "Dışarıdan başlatırken Steam'i otomatik aç seçeneğini işaretle; Steam bulunamazsa yolunu yaz veya Steam'i yeniden bul düğmesine bas."
polish = "Zaznacz automatyczne uruchamianie Steam przy starcie z zewnątrz; jeśli Steam nie zostanie znaleziony, wpisz ścieżkę lub naciśnij wykryj Steam ponownie."

[[message]]
key = "Leave the path empty to auto-detect; fill it in only when the status says \"Steam not found\"."
[message.translations]
simplified_chinese = "路径留空即可自动检测；只有状态显示未找到 Steam 时才需要填写。"
traditional_chinese = "路徑留空即可自動偵測；只有狀態顯示找不到 Steam 時才需要填寫。"
japanese = "パスを空にすると自動検出します。状態が Steam が見つかりませんと表示されたときだけ入力してください。"
korean = "경로를 비워 두면 자동으로 찾습니다. 상태에 Steam을 찾을 수 없음이 표시될 때만 입력하세요."
russian = "Оставьте путь пустым для автоопределения; заполняйте его только если статус сообщает, что Steam не найден."
german = "Lass den Pfad leer für die automatische Suche; trage ihn nur ein, wenn der Status Steam nicht gefunden meldet."
spanish = "Deja la ruta vacía para detectarlo solo; rellénala solo cuando el estado indique que no se encuentra Steam."
french = "Laisse le chemin vide pour la détection auto ; ne le remplis que si le statut indique que Steam est introuvable."
brazilian_portuguese = "Deixe o caminho vazio para detectar sozinho; preencha só quando o status disser que o Steam não foi encontrado."
portuguese = "Deixa o caminho vazio para detetar sozinho; preenche-o só quando o estado disser que o Steam não foi encontrado."
turkish = "Yolu boş bırakırsan otomatik bulunur; yalnızca durum Steam bulunamadı dediğinde doldur."
polish = "Zostaw ścieżkę pustą, aby wykryć automatycznie; wpisz ją tylko, gdy status mówi, że nie znaleziono Steam."

[[message]]
key = "Shows X and Y coordinates on players' nameplates, for yourself, for other players, or both."
[message.translations]
simplified_chinese = "在玩家名牌上显示 X 和 Y 坐标，可只显示自己的、其他玩家的，或两者都显示。"
traditional_chinese = "在玩家名牌上顯示 X 和 Y 座標，可只顯示自己的、其他玩家的，或兩者都顯示。"
japanese = "プレイヤーのネームプレートに X と Y 座標を表示します。自分だけ、他のプレイヤーだけ、または両方に表示できます。"
korean = "플레이어 이름표에 X, Y 좌표를 표시합니다. 자신만, 다른 플레이어만, 또는 둘 다 표시할 수 있습니다."
russian = "Показывает координаты X и Y на никах игроков — у себя, у других игроков или у всех."
german = "Zeigt X- und Y-Koordinaten auf den Namensschildern von Spielern — bei dir, bei anderen oder bei beiden."
spanish = "Muestra las coordenadas X e Y en los carteles de nombre: las tuyas, las de otros jugadores o ambas."
french = "Affiche les coordonnées X et Y sur les pseudos des joueurs : les tiennes, celles des autres ou les deux."
brazilian_portuguese = "Mostra as coordenadas X e Y nas placas de nome: as suas, as de outros jogadores ou ambas."
portuguese = "Mostra as coordenadas X e Y nas placas de nome: as tuas, as de outros jogadores ou ambas."
turkish = "Oyuncu isim levhalarında X ve Y koordinatlarını gösterir: kendin için, diğer oyuncular için veya ikisi için."
polish = "Pokazuje współrzędne X i Y na tabliczkach graczy: twoje, innych graczy albo oba."

[[message]]
key = "Turn on \"Show own coordinates\" or \"Show other players' coordinates\", then choose \"Show X\" and \"Show Y\"."
[message.translations]
simplified_chinese = "开启显示自己的坐标或显示其他玩家的坐标，再选择显示 X 和显示 Y。"
traditional_chinese = "開啟顯示自己的座標或顯示其他玩家的座標，再選擇顯示 X 與顯示 Y。"
japanese = "自分の座標を表示または他のプレイヤーの座標を表示をオンにし、次に X を表示と Y を表示を選びます。"
korean = "내 좌표 표시 또는 다른 플레이어 좌표 표시를 켜고, X 표시와 Y 표시를 선택하세요."
russian = "Включите показ своих координат или координат других игроков, затем выберите показывать X и показывать Y."
german = "Aktiviere eigene Koordinaten anzeigen oder Koordinaten anderer Spieler anzeigen und wähle dann X anzeigen und Y anzeigen."
spanish = "Activa mostrar mis coordenadas o mostrar coordenadas de otros jugadores y elige mostrar X y mostrar Y."
french = "Active afficher mes coordonnées ou afficher les coordonnées des autres joueurs, puis choisis afficher X et afficher Y."
brazilian_portuguese = "Ative mostrar minhas coordenadas ou mostrar coordenadas de outros jogadores e escolha mostrar X e mostrar Y."
portuguese = "Ativa mostrar as minhas coordenadas ou mostrar coordenadas de outros jogadores e escolhe mostrar X e mostrar Y."
turkish = "Kendi koordinatlarımı göster veya diğer oyuncuların koordinatlarını göster seçeneğini aç, sonra X göster ve Y göster seçeneklerini seç."
polish = "Włącz pokazuj własne współrzędne lub pokazuj współrzędne innych graczy, a potem wybierz pokazuj X i pokazuj Y."

[[message]]
key = "\"X alignment hint with me\" colors another player's X after it matches yours for the set \"Detection time\"."
[message.translations]
simplified_chinese = "X 与我对齐提示会在另一名玩家的 X 与你的对齐达设定的检测时间后为其变色。"
traditional_chinese = "X 與我對齊提示會在另一名玩家的 X 與你的對齊達設定的偵測時間後為其變色。"
japanese = "自分と X が揃ったら強調は、他のプレイヤーの X が設定した検出時間だけあなたと一致した後に色を付けます。"
korean = "나와 X 정렬 시 강조는 다른 플레이어의 X가 설정한 감지 시간 동안 내 X와 일치하면 색을 입힙니다."
russian = "Подсказка совпадения X со мной окрашивает X другого игрока, когда он совпадает с вашим в течение заданного времени обнаружения."
german = "X-Ausrichtungshinweis bei Übereinstimmung färbt das X eines anderen Spielers, wenn es für die eingestellte Erkennungszeit mit deinem übereinstimmt."
spanish = "El aviso de alineación de X conmigo colorea la X de otro jugador cuando coincide con la tuya durante el tiempo de detección fijado."
french = "L'indice d'alignement X avec moi colore le X d'un autre joueur quand il correspond au tien pendant le temps de détection défini."
brazilian_portuguese = "O aviso de alinhamento de X comigo colore o X de outro jogador quando ele coincide com o seu pelo tempo de deteção definido."
portuguese = "O aviso de alinhamento de X comigo colore o X de outro jogador quando coincide com o teu durante o tempo de deteção definido."
turkish = "Benimle X hizası ipucu, başka bir oyuncunun X'i ayarlanan algılama süresi boyunca seninkiyle eşleşince onu renklendirir."
polish = "Podpowiedź wyrównania X ze mną koloruje X innego gracza, gdy przez ustawiony czas wykrywania pokrywa się z twoim."

[[message]]
key = "Adds HUD lines for alive time, rescue and freeze counts and hook left/right ratio, plus a map progress bar."
[message.translations]
simplified_chinese = "增加 HUD 行，显示存活时间、救援与冻结次数、钩子左右比例，另加地图进度条。"
traditional_chinese = "增加 HUD 列，顯示存活時間、救援與凍結次數、鉤子左右比例，另加地圖進度條。"
japanese = "生存時間、救助と凍結の回数、フックの左右比率の HUD 行に加え、マップ進行バーを追加します。"
korean = "생존 시간, 구조 및 동결 횟수, 훅 좌우 비율의 HUD 줄과 맵 진행 막대를 추가합니다."
russian = "Добавляет в HUD строки со временем жизни, числом спасений и заморозок, соотношением хука влево/вправо и полосу прогресса карты."
german = "Fügt HUD-Zeilen für Überlebenszeit, Rettungs- und Einfrierzahlen sowie Haken links/rechts-Verhältnis hinzu, dazu einen Map-Fortschrittsbalken."
spanish = "Añade líneas al HUD con tiempo vivo, rescates, congelaciones y proporción de gancho izquierda/derecha, más una barra de progreso del mapa."
french = "Ajoute des lignes HUD pour le temps de survie, les sauvetages, les gels et le ratio de grappin gauche/droite, plus une barre de progression de la map."
brazilian_portuguese = "Adiciona linhas no HUD com tempo vivo, resgates, congelamentos e proporção do gancho esquerda/direita, além de uma barra de progresso do mapa."
portuguese = "Adiciona linhas no HUD com tempo vivo, salvamentos, congelamentos e proporção do gancho esquerda/direita, além de uma barra de progresso do mapa."
turkish = "Canlı kalma süresi, kurtarma ve dondurma sayıları, kanca sol/sağ oranı için HUD satırları ve harita ilerleme çubuğu ekler."
polish = "Dodaje do HUD wiersze z czasem życia, liczbą uratowań i zamrożeń, proporcją haka lewo/prawo oraz pasek postępu mapy."

[[message]]
key = "Enable \"Show player stats HUD\"; tick \"Map progress bar\", then pick \"Use embedded HUD progress bar\" or place the bar with the sliders."
[message.translations]
simplified_chinese = "启用显示玩家统计 HUD；勾选地图进度条，然后选择使用内嵌 HUD 进度条，或用滑块自行摆放进度条。"
traditional_chinese = "啟用顯示玩家統計 HUD；勾選地圖進度條，然後選擇使用內嵌 HUD 進度條，或用滑桿自行擺放進度條。"
japanese = "プレイヤー統計 HUD を表示を有効にし、マップ進行バーをオンにしてから、内蔵 HUD 進行バーを使うを選ぶか、スライダーでバーを配置します。"
korean = "플레이어 통계 HUD 표시를 켜고 맵 진행 막대를 선택한 다음, 내장 HUD 진행 막대 사용을 고르거나 슬라이더로 막대를 배치하세요."
russian = "Включите показ HUD статистики игрока, отметьте полосу прогресса карты, затем выберите встроенную полосу HUD или разместите её ползунками."
german = "Aktiviere Spielerstatistik-HUD anzeigen, markiere Map-Fortschrittsbalken und wähle dann eingebetteten HUD-Fortschrittsbalken verwenden oder platziere den Balken mit den Schiebereglern."
spanish = "Activa mostrar HUD de estadísticas y marca barra de progreso del mapa; luego elige usar la barra de progreso del HUD integrado o colócala con los deslizadores."
french = "Active afficher le HUD des statistiques, coche la barre de progression de la map, puis choisis utiliser la barre du HUD intégré ou place la barre avec les curseurs."
brazilian_portuguese = "Ative mostrar HUD de estatísticas, marque barra de progresso do mapa e escolha usar a barra de progresso do HUD integrado ou posicione a barra com os controles."
portuguese = "Ativa mostrar HUD de estatísticas, marca barra de progresso do mapa e escolhe usar a barra de progresso do HUD integrado ou posiciona a barra com os controlos."
turkish = "Oyuncu istatistikleri HUD'unu göster seçeneğini etkinleştir; harita ilerleme çubuğunu işaretle, sonra gömülü HUD ilerleme çubuğunu kullan seçeneğini seç ya da çubuğu kaydırıcılarla yerleştir."
polish = "Włącz pokazuj HUD statystyk gracza; zaznacz pasek postępu mapy, a potem wybierz użyj wbudowanego paska HUD albo ustaw pasek suwakami."

[[message]]
key = "The map progress bar only fills on Gores maps; the other three lines work on any server."
[message.translations]
simplified_chinese = "地图进度条只在 Gores 地图上填充；其余三行在任何服务器上都有效。"
traditional_chinese = "地圖進度條只在 Gores 地圖上填充；其餘三列在任何伺服器上都有效。"
japanese = "マップ進行バーは Gores マップでのみ伸びます。残りの 3 行はどのサーバーでも機能します。"
korean = "맵 진행 막대는 Gores 맵에서만 채워지며, 나머지 세 줄은 어느 서버에서나 동작합니다."
russian = "Полоса прогресса карты заполняется только на картах Gores; остальные три строки работают на любом сервере."
german = "Der Map-Fortschrittsbalken füllt sich nur auf Gores-Maps; die anderen drei Zeilen funktionieren auf jedem Server."
spanish = "La barra de progreso del mapa solo se llena en mapas Gores; las otras tres líneas funcionan en cualquier servidor."
french = "La barre de progression ne se remplit que sur les maps Gores ; les trois autres lignes marchent sur n'importe quel serveur."
brazilian_portuguese = "A barra de progresso do mapa só enche em mapas Gores; as outras três linhas funcionam em qualquer servidor."
portuguese = "A barra de progresso do mapa só enche em mapas Gores; as outras três linhas funcionam em qualquer servidor."
turkish = "Harita ilerleme çubuğu yalnızca Gores haritalarında dolar; diğer üç satır her sunucuda çalışır."
polish = "Pasek postępu mapy wypełnia się tylko na mapach Gores; pozostałe trzy wiersze działają na każdym serwerze."

[[message]]
key = "Graphs RTT, prediction, snapshot age and frame rate in a panel shown while the debug graph toggle is on."
[message.translations]
simplified_chinese = "在调试图形开关打开时显示的面板中，绘制 RTT、预测、快照时延和帧率曲线。"
traditional_chinese = "在偵錯圖形開關開啟時顯示的面板中，繪製 RTT、預測、快照時延與幀率曲線。"
japanese = "デバッググラフの切り替えがオンの間に出るパネルに、RTT、予測、スナップショット経過時間、フレームレートをグラフ表示します。"
korean = "디버그 그래프 토글이 켜져 있는 동안 표시되는 패널에 RTT, 예측, 스냅샷 지연, 프레임 속도를 그래프로 보여줍니다."
russian = "Рисует графики RTT, предсказания, возраста снапшота и частоты кадров на панели, которая видна при включённом переключателе графика отладки."
german = "Zeichnet RTT, Vorhersage, Snapshot-Alter und Bildrate als Diagramm in einem Panel, das bei aktiver Debug-Grafik erscheint."
spanish = "Dibuja gráficas de RTT, predicción, antigüedad de instantánea y tasa de fotogramas en un panel visible con el interruptor de gráfica de depuración activo."
french = "Trace des courbes RTT, prédiction, âge du snapshot et fréquence d'images dans un panneau visible quand le graphe de débogage est activé."
brazilian_portuguese = "Desenha gráficos de RTT, predição, idade do snapshot e taxa de quadros num painel exibido com a chave de gráfico de depuração ligada."
portuguese = "Desenha gráficos de RTT, predição, idade do snapshot e taxa de fotogramas num painel visível com o interruptor de gráfico de depuração ligado."
turkish = "Hata ayıklama grafiği açıkken görünen panelde RTT, tahmin, anlık görüntü yaşı ve kare hızını grafikler."
polish = "Rysuje wykresy RTT, predykcji, wieku snapshotu i liczby klatek na panelu widocznym przy włączonym przełączniku wykresu debugowania."

[[message]]
key = "Bind \"Global toggle key\" to show or hide the panel, and raise \"Panel opacity\" if the graphs are hard to read."
[message.translations]
simplified_chinese = "绑定全局切换键来显示或隐藏面板；若曲线难以看清，可调高面板不透明度。"
traditional_chinese = "綁定全域切換鍵來顯示或隱藏面板；若曲線難以看清，可調高面板不透明度。"
japanese = "グローバル切り替えキーを割り当ててパネルの表示を切り替え、グラフが見づらければパネルの不透明度を上げます。"
korean = "전역 토글 키를 지정해 패널을 표시하거나 숨기고, 그래프가 잘 안 보이면 패널 불투명도를 높이세요."
russian = "Назначьте глобальную клавишу переключения, чтобы показывать или скрывать панель, и повысьте непрозрачность панели, если графики плохо видны."
german = "Belege die globale Umschalttaste, um das Panel ein- oder auszublenden, und erhöhe die Panel-Deckkraft, wenn die Diagramme schlecht lesbar sind."
spanish = "Asigna la tecla de alternancia global para mostrar u ocultar el panel y sube la opacidad del panel si las gráficas cuestan de leer."
french = "Assigne la touche de bascule globale pour afficher ou masquer le panneau, et augmente l'opacité du panneau si les courbes sont difficiles à lire."
brazilian_portuguese = "Vincule a tecla de alternância global para mostrar ou ocultar o painel e aumente a opacidade do painel se os gráficos forem difíceis de ler."
portuguese = "Associa a tecla de alternância global para mostrar ou ocultar o painel e aumenta a opacidade do painel se os gráficos forem difíceis de ler."
turkish = "Paneli göstermek veya gizlemek için genel aç/kapa tuşunu ata; grafikler zor okunuyorsa panel saydamlığını artır."
polish = "Przypisz globalny klawisz przełączania, aby pokazywać lub ukrywać panel, i zwiększ krycie panelu, jeśli wykresy trudno odczytać."

[[message]]
key = "It is a diagnostic overlay, not gameplay data; lower the opacity when it covers the map."
[message.translations]
simplified_chinese = "这是诊断用的浮层，不是游戏数据；挡住地图时把不透明度调低。"
traditional_chinese = "這是診斷用的浮層，不是遊戲資料；擋住地圖時把不透明度調低。"
japanese = "これは診断用のオーバーレイで、ゲームプレイのデータではありません。マップを覆うときは不透明度を下げてください。"
korean = "이것은 진단용 오버레이일 뿐 게임플레이 데이터가 아니므로 지도를 가리면 불투명도를 낮추세요."
russian = "Это диагностический оверлей, а не игровые данные; если он закрывает карту, уменьшите непрозрачность."
german = "Es ist ein Diagnose-Overlay, keine Gameplay-Anzeige; senke die Deckkraft, wenn es die Map verdeckt."
spanish = "Es una superposición de diagnóstico, no datos de juego; baja la opacidad cuando tape el mapa."
french = "C'est une surcouche de diagnostic, pas des données de jeu ; baisse l'opacité quand elle couvre la map."
brazilian_portuguese = "É uma sobreposição de diagnóstico, não dados de jogo; diminua a opacidade quando cobrir o mapa."
portuguese = "É uma sobreposição de diagnóstico, não dados de jogo; baixa a opacidade quando cobrir o mapa."
turkish = "Bu bir tanılama katmanıdır, oyun verisi değildir; haritayı kapladığında saydamlığı azalt."
polish = "To nakładka diagnostyczna, nie dane rozgrywki; zmniejsz krycie, gdy zasłania mapę."

[[message]]
key = "Logs slow frames and startup stutter timings so you can report why the game felt laggy."
[message.translations]
simplified_chinese = "记录慢帧和启动卡顿耗时，方便你反馈游戏为何感觉卡顿。"
traditional_chinese = "記錄慢幀與啟動卡頓耗時，方便你回報遊戲為何感覺卡頓。"
japanese = "遅いフレームや起動時の引っかかりの時間を記録し、もたつきの原因を報告できるようにします。"
korean = "느린 프레임과 시작 시 끊김 시간을 기록해 게임이 왜 버벅였는지 신고할 수 있게 합니다."
russian = "Записывает медленные кадры и задержки при запуске, чтобы вы могли сообщить, почему игра тормозила."
german = "Protokolliert langsame Frames und Ruckler beim Start, damit du melden kannst, warum sich das Spiel träge anfühlte."
spanish = "Registra fotogramas lentos y tiempos de tirón al arrancar para que puedas informar por qué iba con tirones."
french = "Enregistre les frames lentes et les à-coups au démarrage pour signaler pourquoi le jeu semblait saccadé."
brazilian_portuguese = "Registra quadros lentos e travadas na inicialização para você relatar por que o jogo parecia travado."
portuguese = "Regista fotogramas lentos e engasgos no arranque para poderes relatar porque o jogo parecia lento."
turkish = "Yavaş kareleri ve açılıştaki takılma sürelerini kaydeder, böylece oyunun neden kasıntılı hissettirdiğini bildirebilirsin."
polish = "Zapisuje wolne klatki i zacinanie się przy starcie, aby można było zgłosić, dlaczego gra wydawała się zacinać."

[[message]]
key = "Tick \"Debug mode\" to turn all options on, then set \"Performance debug log threshold (ms)\" to choose which frames get logged."
[message.translations]
simplified_chinese = "勾选调试模式会打开全部选项，然后设置性能调试日志阈值（ms）来决定记录哪些帧。"
traditional_chinese = "勾選偵錯模式會開啟全部選項，然後設定效能偵錯日誌閾值（ms）來決定記錄哪些幀。"
japanese = "デバッグモードをオンにするとすべての項目が有効になります。その後、パフォーマンスデバッグログのしきい値（ms）でどのフレームを記録するかを決めます。"
korean = "디버그 모드를 켜면 모든 옵션이 켜지며, 그다음 성능 디버그 로그 임계값(ms)으로 기록할 프레임을 정합니다."
russian = "Отметьте режим отладки, чтобы включить все параметры, затем задайте порог журнала производительности (ms), чтобы выбрать, какие кадры писать."
german = "Aktiviere Debug-Modus, um alle Optionen einzuschalten, und lege dann den Schwellenwert für das Performance-Debug-Log (ms) fest, welche Frames protokolliert werden."
spanish = "Marca modo de depuración para activar todas las opciones y ajusta el umbral del registro de rendimiento (ms) para elegir qué fotogramas se registran."
french = "Coche le mode débogage pour tout activer, puis règle le seuil du journal de performance (ms) pour choisir les frames enregistrées."
brazilian_portuguese = "Marque modo de depuração para ligar todas as opções e defina o limite do log de desempenho (ms) para escolher quais quadros são registrados."
portuguese = "Marca modo de depuração para ligar todas as opções e define o limite do registo de desempenho (ms) para escolher que fotogramas são registados."
turkish = "Hata ayıklama modunu işaretleyerek tüm seçenekleri aç, sonra hangi karelerin kaydedileceğini seçmek için performans hata ayıklama günlüğü eşiğini (ms) ayarla."
polish = "Zaznacz tryb debugowania, aby włączyć wszystkie opcje, potem ustaw próg dziennika wydajności (ms), aby wybrać, które klatki są zapisywane."

[[message]]
key = "Switch it off when you are done; these logs are for bug reports, not daily play."
[message.translations]
simplified_chinese = "用完就关掉；这些日志用于反馈问题，不适合日常游戏。"
traditional_chinese = "用完就關掉；這些日誌用於回報問題，不適合日常遊戲。"
japanese = "終わったらオフにしてください。このログは不具合報告用で、普段のプレイ向けではありません。"
korean = "다 쓰면 꺼 두세요. 이 로그는 버그 신고용이며 일상 플레이용이 아닙니다."
russian = "Выключайте после использования; эти журналы нужны для отчётов об ошибках, а не для обычной игры."
german = "Schalte es danach wieder aus; diese Logs sind für Fehlerberichte, nicht für den Alltag."
spanish = "Desactívalo al terminar; estos registros son para informes de errores, no para jugar a diario."
french = "Désactive-le une fois terminé ; ces journaux servent aux rapports de bugs, pas au jeu quotidien."
brazilian_portuguese = "Desligue quando terminar; esses logs são para relatórios de bug, não para o jogo do dia a dia."
portuguese = "Desliga-o quando terminares; estes registos servem para relatórios de erros, não para o jogo do dia a dia."
turkish = "İşin bitince kapat; bu günlükler hata bildirimi içindir, günlük oyun için değil."
polish = "Wyłącz go po skończeniu; te dzienniki służą do zgłaszania błędów, a nie do codziennej gry."

[[message]]
key = "Draws a keyboard and mouse on screen that light up with your presses, so viewers can follow your inputs."
[message.translations]
simplified_chinese = "在屏幕上绘制键盘和鼠标，按键时会亮起，方便观众跟上你的操作。"
traditional_chinese = "在畫面上繪製鍵盤與滑鼠，按下時會亮起，方便觀眾跟上你的操作。"
japanese = "画面にキーボードとマウスを描画し、押したキーが光るので、視聴者が入力を追えます。"
korean = "화면에 키보드와 마우스를 그려 입력할 때 빛나므로 시청자가 조작을 따라갈 수 있습니다."
russian = "Рисует на экране клавиатуру и мышь, которые подсвечиваются при нажатии, чтобы зрители следили за вводом."
german = "Zeichnet Tastatur und Maus auf dem Bildschirm, die bei Tastendruck aufleuchten, damit Zuschauer deine Eingaben verfolgen können."
spanish = "Dibuja un teclado y un ratón en pantalla que se iluminan al pulsar, para que los espectadores sigan tus entradas."
french = "Dessine un clavier et une souris à l'écran qui s'allument aux appuis, pour que les spectateurs suivent tes entrées."
brazilian_portuguese = "Desenha teclado e mouse na tela que acendem com seus apertos, para os espectadores acompanharem suas entradas."
portuguese = "Desenha teclado e rato no ecrã que acendem com os teus toques, para os espetadores acompanharem as tuas entradas."
turkish = "Ekranda tuşlarına basınca yanan bir klavye ve fare çizer, böylece izleyiciler girdilerini takip edebilir."
polish = "Rysuje na ekranie klawiaturę i mysz, które świecą przy naciśnięciu, aby widzowie śledzili twoje wejścia."

[[message]]
key = "Tick \"Show inputs\", then size and place it with \"Keyboard size\", \"Mouse size\", \"Opacity\" and the position sliders."
[message.translations]
simplified_chinese = "勾选显示输入，然后用键盘大小、鼠标大小、不透明度和位置滑块调整尺寸与位置。"
traditional_chinese = "勾選顯示輸入，然後用鍵盤大小、滑鼠大小、不透明度與位置滑桿調整尺寸與位置。"
japanese = "入力を表示をオンにし、キーボードの大きさ、マウスの大きさ、不透明度、位置スライダーでサイズと位置を整えます。"
korean = "입력 표시를 선택한 다음 키보드 크기, 마우스 크기, 불투명도, 위치 슬라이더로 크기와 위치를 조정하세요."
russian = "Отметьте показ ввода, затем задайте размер и положение размерами клавиатуры и мыши, непрозрачностью и ползунками позиции."
german = "Aktiviere Eingaben anzeigen und stelle Größe und Position mit Tastaturgröße, Mausgröße, Deckkraft und den Positionsreglern ein."
spanish = "Marca mostrar entradas y ajusta tamaño y posición con tamaño del teclado, tamaño del ratón, opacidad y los deslizadores de posición."
french = "Coche afficher les entrées, puis règle taille et position avec taille du clavier, taille de la souris, opacité et les curseurs de position."
brazilian_portuguese = "Marque mostrar entradas e ajuste tamanho e posição com tamanho do teclado, tamanho do mouse, opacidade e os controles de posição."
portuguese = "Marca mostrar entradas e ajusta tamanho e posição com tamanho do teclado, tamanho do rato, opacidade e os controlos de posição."
turkish = "Girdileri göster seçeneğini işaretle, sonra klavye boyutu, fare boyutu, saydamlık ve konum kaydırıcılarıyla boyutunu ve yerini ayarla."
polish = "Zaznacz pokazuj wejścia, potem ustaw rozmiar i położenie rozmiarem klawiatury, rozmiarem myszy, kryciem i suwakami pozycji."

[[message]]
key = "Keep it small and in a corner; a large overlay covers the map and hides what matters."
[message.translations]
simplified_chinese = "保持较小并放在角落；过大的浮层会遮住地图，把重要的东西挡住。"
traditional_chinese = "保持小巧並放在角落；過大的浮層會遮住地圖，把重要的東西擋住。"
japanese = "小さくして隅に置きましょう。大きすぎるオーバーレイはマップを覆い、大事なものを隠します。"
korean = "작게 유지하고 구석에 두세요. 너무 큰 오버레이는 지도를 가려 중요한 것을 숨깁니다."
russian = "Держите его небольшим и в углу; крупный оверлей закрывает карту и скрывает важное."
german = "Halte es klein und in einer Ecke; ein großes Overlay verdeckt die Map und verbirgt das Wesentliche."
spanish = "Mantenlo pequeño y en una esquina; una superposición grande tapa el mapa y oculta lo importante."
french = "Garde-le petit et dans un coin ; une grande surcouche couvre la map et cache l'essentiel."
brazilian_portuguese = "Mantenha pequeno e no canto; uma sobreposição grande cobre o mapa e esconde o que importa."
portuguese = "Mantém-no pequeno e num canto; uma sobreposição grande tapa o mapa e esconde o que importa."
turkish = "Küçük tut ve bir köşeye koy; büyük bir katman haritayı kaplayıp önemli olanı gizler."
polish = "Trzymaj go małym i w rogu; duża nakładka zasłania mapę i ukrywa to, co ważne."

[[message]]
key = "Turns on voice chat and sets your microphone, playback volume, voice activation and audio devices."
[message.translations]
simplified_chinese = "开启语音聊天，并设置麦克风、播放音量、语音激活和音频设备。"
traditional_chinese = "開啟語音聊天，並設定麥克風、播放音量、語音啟動與音訊裝置。"
japanese = "ボイスチャットを有効にし、マイク、再生音量、音声検出、オーディオデバイスを設定します。"
korean = "음성 채팅을 켜고 마이크, 재생 음량, 음성 감지, 오디오 장치를 설정합니다."
russian = "Включает голосовой чат и настраивает микрофон, громкость воспроизведения, голосовую активацию и аудиоустройства."
german = "Schaltet den Sprachchat ein und legt Mikrofon, Wiedergabelautstärke, Sprachaktivierung und Audiogeräte fest."
spanish = "Activa el chat de voz y ajusta el micrófono, el volumen de reproducción, la activación por voz y los dispositivos de audio."
french = "Active le chat vocal et règle le micro, le volume de lecture, l'activation vocale et les périphériques audio."
brazilian_portuguese = "Liga o chat de voz e define microfone, volume de reprodução, ativação por voz e dispositivos de áudio."
portuguese = "Liga o chat de voz e define microfone, volume de reprodução, ativação por voz e dispositivos de áudio."
turkish = "Sesli sohbeti açar; mikrofon, çalma ses düzeyi, sesle etkinleştirme ve ses aygıtlarını ayarlar."
polish = "Włącza czat głosowy i ustawia mikrofon, głośność odtwarzania, aktywację głosem i urządzenia audio."

[[message]]
key = "Tick \"Enable voice\", then open \"Advanced options\" to pick \"Input device\" and \"Output device\"; \"Auto unmute when speaking\" frees your mute key."
[message.translations]
simplified_chinese = "勾选启用语音，打开高级选项选择输入设备和输出设备；说话时自动取消静音能让你空出静音键。"
traditional_chinese = "勾選啟用語音，打開進階選項選擇輸入裝置與輸出裝置；說話時自動取消靜音能讓你空出靜音鍵。"
japanese = "音声を有効にするをオンにし、詳細オプションで入力デバイスと出力デバイスを選びます。話すと自動でミュート解除を使えばミュートキーが空きます。"
korean = "음성 활성화를 선택하고 고급 옵션에서 입력 장치와 출력 장치를 고르세요. 말할 때 자동 음소거 해제를 쓰면 음소거 키를 비울 수 있습니다."
russian = "Отметьте включить голос, откройте дополнительные параметры и выберите устройство ввода и вывода; автоснятие мьюта при речи освобождает клавишу мьюта."
german = "Aktiviere Sprache aktivieren, dann öffne die erweiterten Optionen und wähle Eingabegerät und Ausgabegerät; Stummschaltung beim Sprechen automatisch aufheben macht deine Mute-Taste frei."
spanish = "Marca activar voz, abre las opciones avanzadas y elige dispositivo de entrada y dispositivo de salida; quitar silencio al hablar libera tu tecla de silencio."
french = "Coche activer la voix, ouvre les options avancées et choisis le périphérique d'entrée et de sortie ; réactiver le micro en parlant libère ta touche de mute."
brazilian_portuguese = "Marque ativar voz, abra as opções avançadas e escolha dispositivo de entrada e dispositivo de saída; reativar o áudio ao falar libera sua tecla de mudo."
portuguese = "Marca ativar voz, abre as opções avançadas e escolhe dispositivo de entrada e dispositivo de saída; reativar o áudio ao falar liberta a tua tecla de silêncio."
turkish = "Sesi etkinleştir seçeneğini işaretle, gelişmiş seçeneklerden giriş ve çıkış aygıtını seç; konuşunca sessizliği otomatik kaldır, sessize alma tuşunu boşaltır."
polish = "Zaznacz włącz głos, otwórz opcje zaawansowane i wybierz urządzenie wejściowe oraz wyjściowe; automatyczne wyłączanie wyciszenia przy mówieniu zwalnia klawisz wyciszenia."

[[message]]
key = "Check your devices before tweaking thresholds; most silent-mic cases are simply the wrong input device."
[message.translations]
simplified_chinese = "先检查设备再调阈值；大多数麦克风没声音的情况只是输入设备选错了。"
traditional_chinese = "先檢查裝置再調閾值；大多數麥克風沒聲音的情況只是輸入裝置選錯了。"
japanese = "しきい値をいじる前にデバイスを確認しましょう。マイクが無音の多くは入力デバイスの選び間違いだけです。"
korean = "임계값을 만지기 전에 장치를 확인하세요. 마이크가 안 들리는 대부분은 입력 장치를 잘못 골랐을 뿐입니다."
russian = "Сначала проверьте устройства, потом крутите пороги; чаще всего микрофон молчит из-за неверного устройства ввода."
german = "Prüfe zuerst die Geräte, bevor du Schwellenwerte änderst; meist ist bei stummem Mikrofon nur das falsche Eingabegerät gewählt."
spanish = "Revisa tus dispositivos antes de tocar los umbrales; casi siempre un micro sin sonido es solo el dispositivo de entrada equivocado."
french = "Vérifie tes périphériques avant de régler les seuils ; un micro muet vient le plus souvent d'un mauvais périphérique d'entrée."
brazilian_portuguese = "Verifique os dispositivos antes de mexer nos limites; na maioria dos casos, microfone mudo é só o dispositivo de entrada errado."
portuguese = "Verifica os dispositivos antes de mexer nos limites; na maioria dos casos, um microfone mudo é apenas o dispositivo de entrada errado."
turkish = "Eşikleri kurcalamadan önce aygıtlarını kontrol et; mikrofonun ses vermemesi çoğunlukla yanlış giriş aygıtından başka bir şey değildir."
polish = "Sprawdź urządzenia, zanim ruszysz progi; w większości przypadków cisza w mikrofonie to po prostu złe urządzenie wejściowe."

[[message]]
key = "Tweaks the top HUD pill and its extras: background color, team, song title, hook and switch countdowns."
[message.translations]
simplified_chinese = "调整顶部 HUD 胶囊及其附加内容：背景色、队伍、歌曲标题、钩子和切换倒计时。"
traditional_chinese = "調整頂部 HUD 膠囊及其附加內容：背景色、隊伍、歌曲標題、鉤子與切換倒數。"
japanese = "上部 HUD のピルとその追加要素を調整します。背景色、チーム、曲名、フックと切り替えのカウントダウンです。"
korean = "상단 HUD 알약과 부가 요소를 조정합니다. 배경색, 팀, 곡 제목, 훅 및 전환 카운트다운입니다."
russian = "Настраивает верхнюю капсулу HUD и её дополнения: цвет фона, команду, название песни, отсчёты хука и переключения."
german = "Passt die obere HUD-Pille und ihre Extras an: Hintergrundfarbe, Team, Songtitel, Haken- und Wechsel-Countdowns."
spanish = "Ajusta la píldora superior del HUD y sus extras: color de fondo, equipo, título de la canción y cuentas atrás de gancho y cambio."
french = "Ajuste la pastille HUD du haut et ses extras : couleur de fond, équipe, titre du morceau, comptes à rebours du grappin et du changement."
brazilian_portuguese = "Ajusta a pílula do HUD no topo e seus extras: cor de fundo, time, título da música e contagens de gancho e troca."
portuguese = "Ajusta a pílula do HUD no topo e os seus extras: cor de fundo, equipa, título da música e contagens decrescentes de gancho e troca."
turkish = "Üstteki HUD hapını ve eklerini ayarlar: arka plan rengi, takım, şarkı adı, kanca ve geçiş geri sayımları."
polish = "Dostraja górną pigułkę HUD i jej dodatki: kolor tła, drużynę, tytuł utworu, odliczania haka i przełączania."

[[message]]
key = "Untick \"Use original style\" to reach \"Background color\", the countdown options and \"Always show song title and artist\"; \"Show team\" works in both styles."
[message.translations]
simplified_chinese = "取消勾选使用原始样式，才能设置背景色、倒计时选项和始终显示歌曲标题与歌手；显示队伍在两种样式下都有效。"
traditional_chinese = "取消勾選使用原始樣式，才能設定背景色、倒數選項與永遠顯示歌曲標題與歌手；顯示隊伍在兩種樣式下都有效。"
japanese = "元のスタイルを使うのチェックを外すと、背景色、カウントダウン設定、曲名とアーティストを常に表示に触れます。チームを表示はどちらのスタイルでも使えます。"
korean = "원래 스타일 사용을 해제해야 배경색, 카운트다운 옵션, 곡 제목과 아티스트 항상 표시를 설정할 수 있습니다. 팀 표시는 두 스타일 모두에서 동작합니다."
russian = "Снимите галочку использовать исходный стиль, чтобы открыть цвет фона, настройки отсчёта и постоянный показ песни с исполнителем; показ команды работает в обоих стилях."
german = "Deaktiviere Originalstil verwenden, um Hintergrundfarbe, die Countdown-Optionen und Songtitel und Interpret immer anzeigen zu erreichen; Team anzeigen gilt in beiden Stilen."
spanish = "Desmarca usar estilo original para acceder al color de fondo, las opciones de cuenta atrás y mostrar siempre título y artista; mostrar equipo funciona en ambos estilos."
french = "Décoche utiliser le style d'origine pour accéder à la couleur de fond, aux options de compte à rebours et à toujours afficher le titre et l'artiste ; afficher l'équipe marche dans les deux styles."
brazilian_portuguese = "Desmarque usar estilo original para acessar a cor de fundo, as opções de contagem e mostrar sempre título e artista; mostrar time funciona nos dois estilos."
portuguese = "Desmarca usar estilo original para aceder à cor de fundo, às opções de contagem e a mostrar sempre título e artista; mostrar equipa funciona nos dois estilos."
turkish = "Özgün stili kullan işaretini kaldırarak arka plan rengi, geri sayım seçenekleri ve şarkı adı ile sanatçıyı her zaman göster ayarlarına ulaş; takımı göster iki stilde de çalışır."
polish = "Odznacz używaj oryginalnego stylu, aby przejść do koloru tła, opcji odliczania i zawsze pokazuj tytuł oraz wykonawcę; pokazuj drużynę działa w obu stylach."

[[message]]
key = "\"Use original style\" hides the color and countdown options below it."
[message.translations]
simplified_chinese = "勾选使用原始样式时，其下方的颜色和倒计时选项会被隐藏。"
traditional_chinese = "勾選使用原始樣式時，其下方的顏色與倒數選項會被隱藏。"
japanese = "元のスタイルを使うをオンにすると、その下の色とカウントダウンの設定は隠れます。"
korean = "원래 스타일 사용을 켜면 그 아래의 색상과 카운트다운 옵션이 숨겨집니다."
russian = "При включённом использовании исходного стиля параметры цвета и отсчёта под ним скрываются."
german = "Mit Originalstil verwenden werden die Farb- und Countdown-Optionen darunter ausgeblendet."
spanish = "Con usar estilo original activado, las opciones de color y cuenta atrás de debajo quedan ocultas."
french = "Avec utiliser le style d'origine, les options de couleur et de compte à rebours en dessous sont masquées."
brazilian_portuguese = "Com usar estilo original marcado, as opções de cor e contagem abaixo ficam ocultas."
portuguese = "Com usar estilo original marcado, as opções de cor e contagem abaixo ficam ocultas."
turkish = "Özgün stili kullan açıkken altındaki renk ve geri sayım seçenekleri gizlenir."
polish = "Przy włączonym używaj oryginalnego stylu opcje koloru i odliczania poniżej są ukryte."

[[message]]
key = "Links the music playing on your system with the system media controls, and can show its title in the top-left HUD."
[message.translations]
simplified_chinese = "把系统正在播放的音乐接入系统媒体控件，并可将其标题显示在左上角 HUD 中。"
traditional_chinese = "把系統正在播放的音樂接入系統媒體控制項，並可將其標題顯示在左上角 HUD 中。"
japanese = "システムで再生中の音楽をシステムのメディアコントロールに連携し、その曲名を左上の HUD に表示できます。"
korean = "시스템에서 재생 중인 음악을 시스템 미디어 컨트롤과 연결하고, 그 제목을 좌측 상단 HUD에 표시할 수 있습니다."
russian = "Связывает музыку в системе с системными медиаэлементами управления и может показывать её название в HUD слева сверху."
german = "Verbindet die auf dem System laufende Musik mit den System-Mediensteuerungen und kann den Titel oben links im HUD anzeigen."
spanish = "Vincula la música que suena en tu sistema con los controles multimedia del sistema y puede mostrar su título en el HUD de la esquina superior izquierda."
french = "Relie la musique jouée sur ton système aux commandes multimédias du système et peut afficher son titre dans le HUD en haut à gauche."
brazilian_portuguese = "Liga a música tocando no sistema aos controles de mídia do sistema e pode mostrar o título no HUD do canto superior esquerdo."
portuguese = "Liga a música a tocar no sistema aos controlos de multimédia do sistema e pode mostrar o título no HUD do canto superior esquerdo."
turkish = "Sistemde çalan müziği sistem medya kontrollerine bağlar ve şarkı adını sol üstteki HUD'da gösterebilir."
polish = "Łączy muzykę odtwarzaną w systemie z systemowymi kontrolkami multimediów i może pokazywać tytuł w HUD w lewym górnym rogu."

[[message]]
key = "Tick \"Enable system media control\", then \"Show song info in top-left corner\"; the Previous, Play/Pause and Next buttons drive the track."
[message.translations]
simplified_chinese = "勾选启用系统媒体控件，再勾选在左上角显示歌曲信息；上一首、播放/暂停和下一首按钮可控制曲目。"
traditional_chinese = "勾選啟用系統媒體控制項，再勾選在左上角顯示歌曲資訊；上一首、播放/暫停與下一首按鈕可控制曲目。"
japanese = "システムメディアコントロールを有効にするをオンにし、次に左上に曲情報を表示をオンにします。前へ、再生/一時停止、次へのボタンで曲を操作できます。"
korean = "시스템 미디어 컨트롤 사용을 선택하고 좌측 상단에 곡 정보 표시를 켜세요. 이전, 재생/일시 정지, 다음 버튼으로 곡을 조작합니다."
russian = "Отметьте включить системное управление медиа, затем показ информации о песне в левом верхнем углу; кнопки назад, воспроизведение/пауза и вперёд управляют треком."
german = "Aktiviere System-Mediensteuerung aktivieren und dann Songinfos oben links anzeigen; die Tasten Zurück, Wiedergabe/Pause und Weiter steuern den Titel."
spanish = "Marca activar control multimedia del sistema y luego mostrar info de la canción arriba a la izquierda; los botones anterior, reproducir/pausa y siguiente controlan la pista."
french = "Coche activer les commandes multimédias du système puis afficher les infos du morceau en haut à gauche ; les boutons précédent, lecture/pause et suivant pilotent le titre."
brazilian_portuguese = "Marque ativar controle de mídia do sistema e mostrar info da música no canto superior esquerdo; os botões anterior, reproduzir/pausar e próximo controlam a faixa."
portuguese = "Marca ativar o controlo de multimédia do sistema e mostrar informação da música no canto superior esquerdo; os botões anterior, reproduzir/pausar e seguinte controlam a faixa."
turkish = "Sistem medya denetimini etkinleştir seçeneğini işaretle, sonra sol üstte şarkı bilgisini göster seçeneğini; önceki, oynat/duraklat ve sonraki düğmeleri parçayı yönetir."
polish = "Zaznacz włącz systemową kontrolę multimediów, potem pokazuj informacje o utworze w lewym górnym rogu; przyciski poprzedni, odtwarzaj/pauza i następny sterują utworem."

[[message]]
key = "Nothing appears until a media app is playing; use the buttons to check which app the system reports."
[message.translations]
simplified_chinese = "没有媒体应用播放时不会显示任何内容；可用这些按钮确认系统上报的是哪个应用。"
traditional_chinese = "沒有媒體應用程式播放時不會顯示任何內容；可用這些按鈕確認系統回報的是哪個應用程式。"
japanese = "メディアアプリが再生するまで何も表示されません。ボタンでシステムがどのアプリを認識しているか確認できます。"
korean = "미디어 앱이 재생하기 전에는 아무것도 나타나지 않습니다. 버튼으로 시스템이 어느 앱을 보고하는지 확인하세요."
russian = "Пока медиаприложение не играет, ничего не появится; кнопками можно проверить, какое приложение видит система."
german = "Es erscheint nichts, solange keine Medien-App läuft; mit den Tasten prüfst du, welche App das System meldet."
spanish = "No aparece nada hasta que una app multimedia esté reproduciendo; usa los botones para ver qué app detecta el sistema."
french = "Rien n'apparaît tant qu'une appli multimédia ne joue pas ; les boutons indiquent quelle appli le système signale."
brazilian_portuguese = "Nada aparece até um app de mídia estar tocando; use os botões para ver qual app o sistema reporta."
portuguese = "Nada aparece até uma aplicação de multimédia estar a tocar; usa os botões para ver que aplicação o sistema reporta."
turkish = "Bir medya uygulaması çalmaya başlayana kadar hiçbir şey görünmez; düğmelerle sistemin hangi uygulamayı bildirdiğini kontrol et."
polish = "Nic nie pojawi się, dopóki aplikacja multimedialna nie gra; przyciskami sprawdzisz, którą aplikację zgłasza system."

[[message]]
key = "Shows the current song's lyric line in the Dynamic Island and lets you pick which music app supplies it."
[message.translations]
simplified_chinese = "在 Dynamic Island 中显示当前歌曲的歌词，并可选择由哪个音乐应用提供。"
traditional_chinese = "在 Dynamic Island 中顯示目前歌曲的歌詞，並可選擇由哪個音樂應用程式提供。"
japanese = "現在の曲の歌詞行を Dynamic Island に表示し、どの音楽アプリから取得するかを選べます。"
korean = "현재 곡의 가사 한 줄을 Dynamic Island에 표시하며, 어느 음악 앱에서 가져올지 고를 수 있습니다."
russian = "Показывает строку текста текущей песни в Dynamic Island и позволяет выбрать, какое музыкальное приложение её передаёт."
german = "Zeigt die aktuelle Liedzeile im Dynamic Island und lässt dich wählen, welche Musik-App sie liefert."
spanish = "Muestra la línea de letra de la canción actual en el Dynamic Island y te deja elegir qué app de música la aporta."
french = "Affiche la ligne de paroles du morceau en cours dans le Dynamic Island et laisse choisir l'appli de musique qui la fournit."
brazilian_portuguese = "Mostra a linha da letra da música atual no Dynamic Island e deixa escolher qual app de música a fornece."
portuguese = "Mostra a linha da letra da música atual no Dynamic Island e deixa escolher que aplicação de música a fornece."
turkish = "Geçerli şarkının söz satırını Dynamic Island'da gösterir ve bunu hangi müzik uygulamasının sağlayacağını seçmenizi sağlar."
polish = "Pokazuje wers tekstu bieżącego utworu w Dynamic Island i pozwala wybrać, która aplikacja muzyczna go dostarcza."

[[message]]
key = "Tick \"Enable lyrics\" and \"Show lyrics inside Dynamic Island\", then enable one source such as \"Enable Netease music Hook\" or \"Enable Spotify lyrics\"."
[message.translations]
simplified_chinese = "勾选启用歌词和在 Dynamic Island 内显示歌词，然后启用一个来源，例如启用 Netease 音乐 Hook 或启用 Spotify 歌词。"
traditional_chinese = "勾選啟用歌詞與在 Dynamic Island 內顯示歌詞，然後啟用一個來源，例如啟用 Netease 音樂 Hook 或啟用 Spotify 歌詞。"
japanese = "歌詞を有効にするをオンにし、Dynamic Island 内に歌詞を表示もオンにしてから、Netease 音楽 Hook を有効にするや Spotify 歌詞を有効にするなど、1 つのソースを有効にします。"
korean = "가사 사용과 Dynamic Island 안에 가사 표시를 켠 다음, Netease 음악 Hook 사용이나 Spotify 가사 사용 같은 소스 하나를 활성화하세요."
russian = "Отметьте включить текст песни и показывать текст в Dynamic Island, затем включите один источник, например Hook музыки Netease или текст Spotify."
german = "Aktiviere Songtext aktivieren und Songtext im Dynamic Island anzeigen und schalte dann eine Quelle ein, etwa Netease Musik-Hook aktivieren oder Spotify-Songtext aktivieren."
spanish = "Marca activar letras y mostrar letras en el Dynamic Island, luego activa una fuente como activar el Hook de Netease Music o activar letras de Spotify."
french = "Coche activer les paroles et afficher les paroles dans le Dynamic Island, puis active une source comme activer le Hook Netease Music ou activer les paroles Spotify."
brazilian_portuguese = "Marque ativar letras e mostrar letras no Dynamic Island e ative uma fonte, como ativar o Hook do Netease Music ou ativar letras do Spotify."
portuguese = "Marca ativar letras e mostrar letras no Dynamic Island e ativa uma fonte, como ativar o Hook do Netease Music ou ativar letras do Spotify."
turkish = "Şarkı sözlerini etkinleştir ve Dynamic Island içinde şarkı sözlerini göster seçeneklerini işaretle, sonra Netease müzik Hook'unu etkinleştir veya Spotify şarkı sözlerini etkinleştir gibi bir kaynağı aç."
polish = "Zaznacz włącz tekst utworu i pokazuj tekst w Dynamic Island, a potem włącz jedno źródło, np. włącz Hook muzyki Netease albo włącz tekst Spotify."

[[message]]
key = "Lyrics live in the Dynamic Island, so they stay hidden until that option is on."
[message.translations]
simplified_chinese = "歌词只显示在 Dynamic Island 中，因此该选项未开启前不会出现。"
traditional_chinese = "歌詞只顯示在 Dynamic Island 中，因此該選項未開啟前不會出現。"
japanese = "歌詞は Dynamic Island に表示されるため、その設定をオンにするまで表示されません。"
korean = "가사는 Dynamic Island에 표시되므로 해당 옵션을 켜기 전에는 보이지 않습니다."
russian = "Текст песни выводится в Dynamic Island, поэтому не появится, пока эта опция не включена."
german = "Der Songtext erscheint im Dynamic Island und bleibt daher verborgen, bis diese Option aktiv ist."
spanish = "La letra se muestra en el Dynamic Island, así que no aparece hasta activar esa opción."
french = "Les paroles s'affichent dans le Dynamic Island, donc elles restent invisibles tant que cette option est désactivée."
brazilian_portuguese = "As letras ficam no Dynamic Island, então só aparecem com essa opção ligada."
portuguese = "As letras ficam no Dynamic Island, por isso só aparecem com essa opção ligada."
turkish = "Şarkı sözleri Dynamic Island'da görünür; bu seçenek açılana kadar gizli kalır."
polish = "Tekst utworu jest w Dynamic Island, więc pozostaje ukryty, dopóki ta opcja nie zostanie włączona."

[[message]]
key = "Draws drifting 3D shapes such as cubes, hearts or rings in the background, with size, speed, color and glow."
[message.translations]
simplified_chinese = "在背景中绘制漂浮的 3D 形状，如立方体、爱心或圆环，可调大小、速度、颜色和辉光。"
traditional_chinese = "在背景中繪製漂浮的 3D 形狀，如立方體、愛心或圓環，可調大小、速度、顏色與輝光。"
japanese = "立方体、ハート、リングなどの 3D 図形を背景に漂わせます。大きさ、速度、色、光り方を調整できます。"
korean = "큐브, 하트, 링 같은 3D 도형을 배경에 떠다니게 합니다. 크기, 속도, 색, 빛남을 조절할 수 있습니다."
russian = "Рисует на фоне плывущие 3D-фигуры — кубы, сердца или кольца — с размером, скоростью, цветом и свечением."
german = "Zeichnet driftende 3D-Formen wie Würfel, Herzen oder Ringe im Hintergrund, mit Größe, Tempo, Farbe und Leuchten."
spanish = "Dibuja formas 3D flotando en el fondo, como cubos, corazones o anillos, con tamaño, velocidad, color y brillo."
french = "Dessine des formes 3D flottantes en arrière-plan, comme des cubes, des cœurs ou des anneaux, avec taille, vitesse, couleur et lueur."
brazilian_portuguese = "Desenha formas 3D flutuando no fundo, como cubos, corações ou anéis, com tamanho, velocidade, cor e brilho."
portuguese = "Desenha formas 3D a flutuar no fundo, como cubos, corações ou anéis, com tamanho, velocidade, cor e brilho."
turkish = "Arka planda küp, kalp veya halka gibi süzülen 3D şekiller çizer; boyut, hız, renk ve parlaklık ayarlanabilir."
polish = "Rysuje w tle unoszące się kształty 3D, jak sześciany, serca czy pierścienie, z rozmiarem, prędkością, kolorem i poświatą."

[[message]]
key = "Tick \"Enable 3D background particles\", pick a \"Particle type\", then set \"Particle count\", \"Particle speed\" and \"Particle color\"."
[message.translations]
simplified_chinese = "勾选启用 3D 背景粒子，选择粒子类型，然后设置粒子数量、粒子速度和粒子颜色。"
traditional_chinese = "勾選啟用 3D 背景粒子，選擇粒子類型，然後設定粒子數量、粒子速度與粒子顏色。"
japanese = "3D 背景パーティクルを有効にするをオンにし、パーティクルの種類を選んでから、パーティクル数、パーティクル速度、パーティクルの色を設定します。"
korean = "3D 배경 파티클 사용을 선택하고 파티클 유형을 고른 뒤 파티클 수, 파티클 속도, 파티클 색을 설정하세요."
russian = "Отметьте включить 3D-частицы фона, выберите тип частиц, затем задайте количество, скорость и цвет частиц."
german = "Aktiviere 3D-Hintergrundpartikel aktivieren, wähle einen Partikeltyp und stelle dann Partikelanzahl, Partikelgeschwindigkeit und Partikelfarbe ein."
spanish = "Marca activar partículas 3D de fondo, elige un tipo de partícula y ajusta cantidad, velocidad y color de las partículas."
french = "Coche activer les particules 3D d'arrière-plan, choisis un type de particule, puis règle le nombre, la vitesse et la couleur des particules."
brazilian_portuguese = "Marque ativar partículas 3D de fundo, escolha um tipo de partícula e defina quantidade, velocidade e cor das partículas."
portuguese = "Marca ativar partículas 3D de fundo, escolhe um tipo de partícula e define quantidade, velocidade e cor das partículas."
turkish = "3D arka plan parçacıklarını etkinleştir seçeneğini işaretle, bir parçacık türü seç, sonra parçacık sayısı, parçacık hızı ve parçacık rengini ayarla."
polish = "Zaznacz włącz cząsteczki tła 3D, wybierz typ cząsteczki, a potem ustaw liczbę, prędkość i kolor cząsteczek."

[[message]]
key = "High particle counts and trails cost frame rate; lower \"Particle count\" if your FPS drops."
[message.translations]
simplified_chinese = "大量粒子和拖尾会消耗帧率；FPS 下降时降低粒子数量。"
traditional_chinese = "大量粒子與拖尾會消耗幀率；FPS 下降時降低粒子數量。"
japanese = "パーティクル数が多いとトレイルも相まってフレームレートを食います。FPS が落ちるならパーティクル数を下げてください。"
korean = "파티클 수가 많고 잔상이 있으면 프레임 속도를 잡아먹습니다. FPS가 떨어지면 파티클 수를 줄이세요."
russian = "Много частиц и следы снижают частоту кадров; если FPS падает, уменьшите количество частиц."
german = "Viele Partikel und Spuren kosten Bildrate; senke die Partikelanzahl, wenn deine FPS sinken."
spanish = "Muchas partículas y estelas cuestan tasa de fotogramas; baja la cantidad de partículas si caen tus FPS."
french = "Beaucoup de particules et de traînées coûtent des images par seconde ; réduis le nombre de particules si tes FPS chutent."
brazilian_portuguese = "Muitas partículas e rastros custam taxa de quadros; reduza a quantidade de partículas se seus FPS caírem."
portuguese = "Muitas partículas e rastos custam fotogramas por segundo; reduz a quantidade de partículas se os teus FPS caírem."
turkish = "Yüksek parçacık sayısı ve izler kare hızını yer; FPS düşerse parçacık sayısını azalt."
polish = "Duża liczba cząsteczek i smugi obciążają liczbę klatek; zmniejsz liczbę cząsteczek, gdy spada FPS."

[[message]]
key = "Adds HUD rows for stuck keys, hammer state, dummy control and dummy copy status."
[message.translations]
simplified_chinese = "增加 HUD 行，显示卡键、锤子状态、分身控制和分身同步状态。"
traditional_chinese = "增加 HUD 列，顯示卡鍵、錘子狀態、分身控制與分身同步狀態。"
japanese = "キーの引っかかり、ハンマー状態、dummy 操作、dummy コピー状態の HUD 行を追加します。"
korean = "키 걸림, 해머 상태, dummy 조작, dummy 복사 상태의 HUD 줄을 추가합니다."
russian = "Добавляет в HUD строки для зажатых клавиш, состояния молота, управления dummy и состояния копии dummy."
german = "Fügt HUD-Zeilen für hängende Tasten, Hammerzustand, dummy-Steuerung und dummy-Kopierstatus hinzu."
spanish = "Añade filas al HUD para teclas atascadas, estado del martillo, control del dummy y estado de copia del dummy."
french = "Ajoute des lignes HUD pour les touches bloquées, l'état du marteau, le contrôle du dummy et l'état de copie du dummy."
brazilian_portuguese = "Adiciona linhas no HUD para teclas presas, estado do martelo, controle do dummy e status de cópia do dummy."
portuguese = "Adiciona linhas no HUD para teclas presas, estado do martelo, controlo do dummy e estado de cópia do dummy."
turkish = "Takılı tuşlar, çekiç durumu, dummy kontrolü ve dummy kopya durumu için HUD satırları ekler."
polish = "Dodaje do HUD wiersze ze stanem zablokowanych klawiszy, młotka, sterowania dummy i kopiowania dummy."

[[message]]
key = "Tick any of \"Show key stuck status\", \"Show hammer status\", \"Show dummy control status\" or \"Show dummy copy status\"."
[message.translations]
simplified_chinese = "按需勾选显示卡键状态、显示锤子状态、显示分身控制状态或显示分身同步状态。"
traditional_chinese = "按需勾選顯示卡鍵狀態、顯示錘子狀態、顯示分身控制狀態或顯示分身同步狀態。"
japanese = "キーの引っかかり表示、ハンマー状態を表示、dummy 操作状態を表示、dummy コピー状態を表示のうち、必要なものをオンにします。"
korean = "키 걸림 상태 표시, 해머 상태 표시, dummy 조작 상태 표시, dummy 복사 상태 표시 중 필요한 것을 선택하세요."
russian = "Отметьте нужные: показ зажатых клавиш, состояние молота, состояние управления dummy или состояние копии dummy."
german = "Aktiviere nach Bedarf Tastenstatus anzeigen, Hammerstatus anzeigen, dummy-Steuerstatus anzeigen oder dummy-Kopierstatus anzeigen."
spanish = "Marca los que quieras: mostrar teclas atascadas, mostrar estado del martillo, mostrar control del dummy o mostrar copia del dummy."
french = "Coche au choix afficher les touches bloquées, afficher l'état du marteau, afficher le contrôle du dummy ou afficher la copie du dummy."
brazilian_portuguese = "Marque o que quiser: mostrar teclas presas, mostrar estado do martelo, mostrar controle do dummy ou mostrar cópia do dummy."
portuguese = "Marca o que quiseres: mostrar teclas presas, mostrar estado do martelo, mostrar controlo do dummy ou mostrar cópia do dummy."
turkish = "Tuş takılı durumunu göster, çekiç durumunu göster, dummy kontrol durumunu göster veya dummy kopya durumunu göster seçeneklerinden istediklerini işaretle."
polish = "Zaznacz dowolne z: pokazuj stan zablokowanych klawiszy, pokazuj stan młotka, pokazuj stan sterowania dummy lub pokazuj stan kopii dummy."

[[message]]
key = "Start with one or two rows; all four at once crowd the corner during a run."
[message.translations]
simplified_chinese = "先开一两行就好；四行全开会在跑图时挤满角落。"
traditional_chinese = "先開一兩列就好；四列全開會在跑圖時擠滿角落。"
japanese = "まず 1、2 行から始めましょう。4 行すべて出すと、走行中に隅が窮屈になります。"
korean = "한두 줄로 시작하세요. 네 줄을 모두 켜면 달리는 동안 구석이 꽉 찹니다."
russian = "Начните с одной-двух строк; все четыре разом перегружают угол во время прохождения."
german = "Starte mit ein oder zwei Zeilen; alle vier auf einmal drängen sich beim Lauf in der Ecke."
spanish = "Empieza con una o dos filas; las cuatro a la vez llenan la esquina en plena carrera."
french = "Commence avec une ou deux lignes ; les quatre à la fois encombrent le coin pendant un run."
brazilian_portuguese = "Comece com uma ou duas linhas; as quatro juntas lotam o canto durante a corrida."
portuguese = "Começa com uma ou duas linhas; as quatro ao mesmo tempo enchem o canto durante a corrida."
turkish = "Bir iki satırla başla; dördü birden koşu sırasında köşeyi doldurur."
polish = "Zacznij od jednego lub dwóch wierszy; wszystkie cztery naraz zapełniają róg podczas przejścia."

[[message]]
key = "Shows a small board counting drown deaths for players on your team on Gores maps."
[message.translations]
simplified_chinese = "在 Gores 地图上显示一个小面板，统计你队伍里玩家的溺水死亡次数。"
traditional_chinese = "在 Gores 地圖上顯示一個小面板，統計你隊伍中玩家的溺水死亡次數。"
japanese = "Gores マップで、自分のチームのプレイヤーの溺死回数を数える小さなボードを表示します。"
korean = "Gores 맵에서 같은 팀 플레이어의 익사 횟수를 세는 작은 보드를 표시합니다."
russian = "Показывает небольшую панель со счётом смертей от утопления у игроков вашей команды на картах Gores."
german = "Zeigt auf Gores-Maps eine kleine Tafel, die Ertrinkungstode der Spieler in deinem Team zählt."
spanish = "Muestra un panel pequeño que cuenta las muertes por ahogamiento de los jugadores de tu equipo en mapas Gores."
french = "Affiche un petit tableau comptant les noyades des joueurs de ton équipe sur les maps Gores."
brazilian_portuguese = "Mostra um painel pequeno contando mortes por afogamento dos jogadores do seu time em mapas Gores."
portuguese = "Mostra um painel pequeno a contar mortes por afogamento dos jogadores da tua equipa em mapas Gores."
turkish = "Gores haritalarında takımındaki oyuncuların boğulma ölümlerini sayan küçük bir pano gösterir."
polish = "Pokazuje na mapach Gores małą tablicę z liczbą utonięć graczy z twojej drużyny."

[[message]]
key = "Tick \"Show Gores drown board\"; set \"Players shown\" and \"Card opacity\", and add \"Show player Tee\" for avatars."
[message.translations]
simplified_chinese = "勾选显示 Gores 溺水面板；设置显示玩家数和卡片不透明度，并可加上显示玩家 Tee 来展示头像。"
traditional_chinese = "勾選顯示 Gores 溺水面板；設定顯示玩家數與卡片不透明度，並可加上顯示玩家 Tee 來展示頭像。"
japanese = "Gores 溺死ボードを表示をオンにし、表示プレイヤー数とカードの不透明度を設定、アバターにはプレイヤー Tee を表示を追加します。"
korean = "Gores 익사 보드 표시를 선택하고 표시할 플레이어 수와 카드 불투명도를 설정하며, 아바타에는 플레이어 Tee 표시를 추가하세요."
russian = "Отметьте показ панели утоплений Gores; задайте число отображаемых игроков и непрозрачность карточки, а для аватаров включите показ Tee игрока."
german = "Aktiviere Gores-Ertrinkungstafel anzeigen, stelle angezeigte Spieler und Karten-Deckkraft ein und ergänze Spieler-Tee anzeigen für Avatare."
spanish = "Marca mostrar panel de ahogos de Gores, ajusta jugadores mostrados y opacidad de la tarjeta, y añade mostrar Tee del jugador para los avatares."
french = "Coche afficher le tableau de noyades Gores, règle les joueurs affichés et l'opacité de la carte, et ajoute afficher le Tee du joueur pour les avatars."
brazilian_portuguese = "Marque mostrar painel de afogamentos Gores, defina jogadores exibidos e opacidade do cartão, e adicione mostrar Tee do jogador para avatares."
portuguese = "Marca mostrar painel de afogamentos Gores, define jogadores apresentados e opacidade do cartão, e adiciona mostrar Tee do jogador para avatares."
turkish = "Gores boğulma panosunu göster seçeneğini işaretle; gösterilecek oyuncular ve kart saydamlığını ayarla, avatarlar için oyuncu Tee'sini göster seçeneğini ekle."
polish = "Zaznacz pokazuj tablicę utonięć Gores; ustaw liczbę pokazywanych graczy i krycie karty, a dla awatarów dodaj pokazuj Tee gracza."

[[message]]
key = "It only appears in Gores mode; enable \"Include Team 0\" to count players without a team."
[message.translations]
simplified_chinese = "它只在 Gores 模式下出现；启用包含 0 队可统计没有队伍的玩家。"
traditional_chinese = "它只在 Gores 模式下出現；啟用包含 0 隊可統計沒有隊伍的玩家。"
japanese = "Gores モードでのみ表示されます。チームなしのプレイヤーも数えるにはチーム 0 を含めるを有効にします。"
korean = "Gores 모드에서만 나타납니다. 팀이 없는 플레이어도 세려면 팀 0 포함을 켜세요."
russian = "Панель появляется только в режиме Gores; включите учитывать команду 0, чтобы считать игроков без команды."
german = "Sie erscheint nur im Gores-Modus; aktiviere Team 0 einschließen, um Spieler ohne Team mitzuzählen."
spanish = "Solo aparece en modo Gores; activa incluir el equipo 0 para contar a los jugadores sin equipo."
french = "Il n'apparaît qu'en mode Gores ; active inclure l'équipe 0 pour compter les joueurs sans équipe."
brazilian_portuguese = "Só aparece no modo Gores; ative incluir o time 0 para contar jogadores sem time."
portuguese = "Só aparece no modo Gores; ativa incluir a equipa 0 para contar jogadores sem equipa."
turkish = "Yalnızca Gores modunda görünür; takımı olmayan oyuncuları da saymak için takım 0'ı dahil et seçeneğini etkinleştir."
polish = "Pojawia się tylko w trybie Gores; włącz uwzględnij drużynę 0, aby liczyć graczy bez drużyny."

[[message]]
key = "Binds any command to a key, mouse button or wheel direction, including combinations with Ctrl, Alt, Shift and Win."
[message.translations]
simplified_chinese = "把任意命令绑定到按键、鼠标键或滚轮方向，也支持与 Ctrl、Alt、Shift、Win 组合。"
traditional_chinese = "把任意指令綁定到按鍵、滑鼠鍵或滾輪方向，也支援與 Ctrl、Alt、Shift、Win 的組合。"
japanese = "任意のコマンドをキー、マウスボタン、ホイール方向に割り当てます。Ctrl、Alt、Shift、Win との組み合わせにも対応します。"
korean = "임의의 명령을 키, 마우스 버튼, 휠 방향에 바인딩하며 Ctrl, Alt, Shift, Win 조합도 지원합니다."
russian = "Привязывает любую команду к клавише, кнопке мыши или направлению колеса, включая сочетания с Ctrl, Alt, Shift и Win."
german = "Belegt jede Funktion mit einer Taste, Maustaste oder Radrichtung, auch in Kombination mit Ctrl, Alt, Shift und Win."
spanish = "Asigna cualquier comando a una tecla, botón del ratón o dirección de la rueda, incluidas combinaciones con Ctrl, Alt, Shift y Win."
french = "Assigne n'importe quelle commande à une touche, un bouton de souris ou une direction de molette, y compris les combinaisons avec Ctrl, Alt, Shift et Win."
brazilian_portuguese = "Associa qualquer comando a uma tecla, botão do mouse ou direção da roda, incluindo combinações com Ctrl, Alt, Shift e Win."
portuguese = "Associa qualquer comando a uma tecla, botão do rato ou direção da roda, incluindo combinações com Ctrl, Alt, Shift e Win."
turkish = "Herhangi bir komutu tuşa, fare düğmesine veya tekerlek yönüne atar; Ctrl, Alt, Shift ve Win ile kombinasyonları da destekler."
polish = "Przypisuje dowolną komendę do klawisza, przycisku myszy lub kierunku kółka, także w kombinacjach z Ctrl, Alt, Shift i Win."

[[message]]
key = "Click a key on the keyboard picture or under \"Mouse\", then add a command with \"Add function\" or use the capture button to move an existing bind."
[message.translations]
simplified_chinese = "在键盘图上或鼠标按键区点一下键，再用添加功能加上命令，或用捕获按钮把已有的绑定移过来。"
traditional_chinese = "在鍵盤圖上或滑鼠按鍵區點一下鍵，再用新增功能加上指令，或用擷取按鈕把既有的綁定移過來。"
japanese = "キーボード図かマウス欄でキーをクリックし、機能を追加でコマンドを足すか、キャプチャボタンで既存の割り当てを移動します。"
korean = "키보드 그림이나 마우스 항목에서 키를 클릭한 뒤 기능 추가로 명령을 더하거나, 캡처 버튼으로 기존 바인드를 옮깁니다."
russian = "Нажмите клавишу на картинке клавиатуры или в разделе мыши, затем добавьте команду через Добавить действие либо перенесите готовую привязку кнопкой захвата."
german = "Klicke eine Taste im Tastaturbild oder im Bereich Maus an, füge dann mit Funktion hinzufügen eine Funktion hinzu oder verschiebe eine Belegung mit der Aufnahmetaste."
spanish = "Haz clic en una tecla del dibujo del teclado o en la zona del ratón, añade un comando con Añadir función o mueve una asignación con el botón de captura."
french = "Clique une touche sur l'image du clavier ou dans la zone souris, ajoute une commande avec Ajouter une fonction ou déplace une assignation avec le bouton de capture."
brazilian_portuguese = "Clique numa tecla na imagem do teclado ou na área do mouse, adicione um comando com Adicionar função ou mova uma atribuição com o botão de captura."
portuguese = "Clica numa tecla na imagem do teclado ou na área do rato, adiciona um comando com Adicionar função ou move uma atribuição com o botão de captura."
turkish = "Klavye görselindeki ya da fare bölümündeki bir tuşa tıkla, İşlev ekle ile komut ekle veya yakalama düğmesiyle var olan atamayı taşı."
polish = "Kliknij klawisz na obrazku klawiatury lub w sekcji myszy, dodaj komendę przez Dodaj funkcję albo przenieś istniejące przypisanie przyciskiem przechwytywania."

[[message]]
key = "One key can hold several commands, so remove single entries under \"Bound functions\" instead of clearing the key."
[message.translations]
simplified_chinese = "一个键能放多条命令，想删掉其中一条就到已绑定功能里单独删除，不必清空整个键。"
traditional_chinese = "一個鍵能放多條指令，想刪掉其中一條就到已綁定功能裡單獨刪除，不必清空整個鍵。"
japanese = "1 つのキーに複数のコマンドを割り当てられるので、キーを丸ごと消さず割り当て済みの機能で個別に削除します。"
korean = "키 하나에 명령을 여러 개 둘 수 있으니, 키를 통째로 지우지 말고 지정된 기능에서 하나씩 삭제하세요."
russian = "На одну клавишу можно повесить несколько команд, поэтому удаляйте отдельные записи в Назначенные действия, а не очищайте клавишу."
german = "Eine Taste kann mehrere Funktionen tragen, entferne einzelne Einträge unter Zugewiesene Funktionen, statt die Taste zu leeren."
spanish = "Una tecla puede tener varios comandos, así que borra entradas sueltas en Funciones asignadas en vez de vaciar la tecla."
french = "Une touche peut porter plusieurs commandes ; supprime les entrées une à une dans Fonctions assignées plutôt que de vider la touche."
brazilian_portuguese = "Uma tecla pode ter vários comandos, então remova entradas individuais em Funções atribuídas em vez de limpar a tecla."
portuguese = "Uma tecla pode ter vários comandos, por isso remove as entradas individuais em Funções atribuídas em vez de limpar a tecla."
turkish = "Bir tuş birden çok komut taşıyabilir; tuşu tümden temizlemek yerine Atanmış işlevler altından tek tek sil."
polish = "Jeden klawisz może mieć kilka komend, więc usuwaj pojedyncze wpisy w Przypisane funkcje zamiast czyścić cały klawisz."

[[message]]
key = "Lists every bound key, grouped by purpose such as Movement, Weapon, Chat or Dummy."
[message.translations]
simplified_chinese = "列出所有已绑定的按键，并按移动、武器、聊天、dummy 等用途分组。"
traditional_chinese = "列出所有已綁定的按鍵，並按移動、武器、聊天、dummy 等用途分組。"
japanese = "割り当て済みのキーを一覧し、移動、武器、チャット、dummy などの用途ごとにまとめます。"
korean = "바인딩된 모든 키를 나열하고 이동, 무기, 채팅, dummy 같은 용도별로 묶습니다."
russian = "Перечисляет все привязанные клавиши, группируя их по назначению: движение, оружие, чат, dummy."
german = "Listet alle belegten Tasten auf, gruppiert nach Zweck wie Bewegung, Waffe, Chat oder Dummy."
spanish = "Enumera todas las teclas asignadas, agrupadas por uso como movimiento, arma, chat o dummy."
french = "Liste toutes les touches assignées, groupées par usage comme déplacement, arme, chat ou dummy."
brazilian_portuguese = "Lista todas as teclas atribuídas, agrupadas por uso como movimento, arma, chat ou dummy."
portuguese = "Lista todas as teclas atribuídas, agrupadas por utilização como movimento, arma, chat ou dummy."
turkish = "Atanmış tüm tuşları listeler; hareket, silah, sohbet veya dummy gibi amaçlara göre gruplar."
polish = "Wyświetla wszystkie przypisane klawisze, pogrupowane według celu, np. ruch, broń, czat czy dummy."

[[message]]
key = "Type in the search field to filter, switch between \"Sort by key\" and \"Sort by command\", and press \"Copy all\" to copy the rows."
[message.translations]
simplified_chinese = "在搜索框输入即可筛选，可在按键排序和命令排序之间切换，按复制全部能复制这些行。"
traditional_chinese = "在搜尋框輸入即可篩選，可在按按鍵排序和按指令排序之間切換，按複製全部能複製這些列。"
japanese = "検索欄に入力すると絞り込め、キー順とコマンド順の並べ替えを切り替えられ、すべてコピーで行をコピーできます。"
korean = "검색란에 입력해 걸러 내고, 키 기준 정렬과 명령 기준 정렬을 전환하며, 모두 복사로 행을 복사합니다."
russian = "Вводите текст в поиске для фильтра, переключайтесь между сортировкой по клавише и по команде, а Копировать все скопирует строки."
german = "Tippe zum Filtern ins Suchfeld, wechsle zwischen Nach Taste sortieren und Nach Befehl sortieren und kopiere die Zeilen mit Alle kopieren."
spanish = "Escribe en el buscador para filtrar, alterna entre Ordenar por tecla y Ordenar por comando y pulsa Copiar todo para copiar las filas."
french = "Tape dans la recherche pour filtrer, alterne entre Trier par touche et Trier par commande, et appuie sur Tout copier pour copier les lignes."
brazilian_portuguese = "Digite na busca para filtrar, alterne entre Ordenar por tecla e Ordenar por comando e use Copiar tudo para copiar as linhas."
portuguese = "Escreve na pesquisa para filtrar, alterna entre Ordenar por tecla e Ordenar por comando e usa Copiar tudo para copiar as linhas."
turkish = "Filtrelemek için arama alanına yaz, Tuşa göre sırala ile Komuta göre sırala arasında geçiş yap, satırları kopyalamak için Tümünü kopyala."
polish = "Wpisz tekst w wyszukiwaniu, by filtrować, przełączaj Sortuj według klawisza i Sortuj według komendy, a Kopiuj wszystko skopiuje wiersze."

[[message]]
key = "\"Copy all\" only copies the filtered rows, so clear the search first if you want your whole list."
[message.translations]
simplified_chinese = "复制全部只会复制筛选后的行，想复制完整列表请先清空搜索。"
traditional_chinese = "複製全部只會複製篩選後的列，想複製完整列表請先清空搜尋。"
japanese = "すべてコピーは絞り込んだ行だけをコピーするので、全体が欲しいときは先に検索を消してください。"
korean = "모두 복사는 걸러진 행만 복사하니, 전체 목록이 필요하면 먼저 검색을 지우세요."
russian = "Копировать все берёт только отфильтрованные строки, поэтому сначала очистите поиск, если нужен весь список."
german = "Alle kopieren übernimmt nur die gefilterten Zeilen; leere zuerst die Suche, wenn du die ganze Liste willst."
spanish = "Copiar todo solo copia las filas filtradas, así que borra la búsqueda si quieres la lista completa."
french = "Tout copier ne prend que les lignes filtrées ; vide donc la recherche si tu veux la liste complète."
brazilian_portuguese = "Copiar tudo copia apenas as linhas filtradas, então limpe a busca se quiser a lista inteira."
portuguese = "Copiar tudo copia apenas as linhas filtradas, por isso limpa a pesquisa se quiseres a lista completa."
turkish = "Tümünü kopyala yalnızca süzülen satırları alır; tüm listeyi istiyorsan önce aramayı temizle."
polish = "Kopiuj wszystko kopiuje tylko przefiltrowane wiersze, więc najpierw wyczyść wyszukiwanie, jeśli chcesz całą listę."

[[message]]
key = "Adds an outline to skins, slowly cycles your custom Tee colors, and draws a shadow behind emoticons."
[message.translations]
simplified_chinese = "给皮肤加描边，让自定义 Tee 颜色缓慢循环，并在表情后面画出阴影。"
traditional_chinese = "給皮膚加描邊，讓自訂 Tee 顏色緩慢循環，並在表情後面畫出陰影。"
japanese = "スキンに輪郭を付け、カスタム Tee カラーをゆっくり循環させ、エモートの後ろに影を描きます。"
korean = "스킨에 윤곽선을 더하고, 사용자 지정 Tee 색상을 천천히 순환시키며, 이모티콘 뒤에 그림자를 그립니다."
russian = "Добавляет скинам контур, медленно перебирает ваши цвета Tee и рисует тень за эмоциями."
german = "Fügt Skins einen Umriss hinzu, lässt eigene Tee-Farben langsam kreisen und zeichnet einen Schatten hinter Emoticons."
spanish = "Añade contorno a los skins, hace girar lentamente tus colores de Tee y dibuja una sombra tras los emoticonos."
french = "Ajoute un contour aux skins, fait défiler lentement tes couleurs de Tee et dessine une ombre derrière les émoticônes."
brazilian_portuguese = "Adiciona contorno às skins, alterna lentamente suas cores de Tee e desenha uma sombra atrás dos emoticons."
portuguese = "Adiciona contorno às skins, alterna lentamente as tuas cores de Tee e desenha uma sombra atrás dos emoticons."
turkish = "Skinlere dış çizgi ekler, özel Tee renklerini yavaşça döndürür ve ifadelerin arkasına gölge çizer."
polish = "Dodaje obrys skórkom, powoli przewija własne kolory Tee i rysuje cień za emotikonami."

[[message]]
key = "Turn on \"Skin outline for self and dummy\" or \"Skin outline for other players\", then tune width and opacity; \"Cycle custom Tee hue\" animates custom colors."
[message.translations]
simplified_chinese = "打开自己和 dummy 的皮肤描边或其他玩家的皮肤描边，再调宽度和透明度；循环自定义 Tee 色调负责让自定义颜色动起来。"
traditional_chinese = "打開自己與 dummy 的皮膚描邊或其他玩家的皮膚描邊，再調寬度和透明度；循環自定義 Tee 色調負責讓自訂顏色動起來。"
japanese = "自分と dummy のスキンの輪郭か他のプレイヤーのスキンの輪郭をオンにして、太さと不透明度を調整します。カスタム Tee の色相切り替えがカスタムカラーを動かします。"
korean = "자신과 dummy의 스킨 윤곽선 또는 다른 플레이어의 스킨 윤곽선을 켜고 두께와 불투명도를 맞추세요. 사용자 지정 Tee 색조 순환이 사용자 지정 색상을 움직입니다."
russian = "Включите Контур скина для себя и dummy или Контур скина других игроков и настройте толщину с прозрачностью; Циклическая смена оттенка Tee оживляет пользовательские цвета."
german = "Schalte Skin-Umriss für dich und Dummy oder Skin-Umriss für andere Spieler ein und justiere Breite und Deckkraft; der Wechsel des eigenen Tee-Farbtons animiert eigene Farben."
spanish = "Activa Contorno de skin propio y del dummy o Contorno de skin de otros jugadores y ajusta grosor y opacidad; el ciclo de tono del Tee anima los colores personalizados."
french = "Active le contour du skin pour soi et le dummy ou pour les autres joueurs, puis règle épaisseur et opacité ; la rotation de la teinte Tee anime les couleurs personnalisées."
brazilian_portuguese = "Ative o contorno da skin própria e do dummy ou para outros jogadores e ajuste espessura e opacidade; a alternância de matiz do Tee anima as cores personalizadas."
portuguese = "Ativa o contorno da skin própria e do dummy ou para os outros jogadores e ajusta espessura e opacidade; a alternância de matiz do Tee anima as cores personalizadas."
turkish = "Kendin ve dummy için skin dış çizgisini ya da diğer oyuncuların skin dış çizgisini aç, kalınlık ve saydamlığı ayarla; özel Tee tonu döngüsü özel renkleri canlandırır."
polish = "Włącz obrys skórki własnej i dummy lub obrys skórki innych graczy, potem ustaw grubość i krycie; cykliczna zmiana odcienia Tee ożywia własne kolory."

[[message]]
key = "\"Cycle custom Tee hue\" only works with custom colors and does nothing while the TClient rainbow Tee option is on."
[message.translations]
simplified_chinese = "循环自定义 Tee 色调只在用自定义颜色时生效，TClient 的彩虹 Tee 开着时它不起作用。"
traditional_chinese = "循環自定義 Tee 色調只在用自訂顏色時生效，TClient 的彩虹 Tee 開著時它不起作用。"
japanese = "カスタム Tee の色相切り替えはカスタムカラー専用で、TClient のレインボー Tee がオンの間は何も起きません。"
korean = "사용자 지정 Tee 색조 순환은 사용자 지정 색상에서만 동작하며, TClient 무지개 Tee 옵션이 켜져 있으면 아무 효과도 없습니다."
russian = "Циклическая смена оттенка Tee работает только с пользовательскими цветами и ничего не делает, пока включена радужная опция Tee в TClient."
german = "Der Wechsel des eigenen Tee-Farbtons wirkt nur mit eigenen Farben und tut nichts, solange die Regenbogen-Tee-Option von TClient an ist."
spanish = "El ciclo de tono del Tee solo actúa con colores personalizados y no hace nada si la opción de Tee arcoíris de TClient está activa."
french = "La rotation de la teinte Tee ne marche qu'avec des couleurs personnalisées et ne fait rien tant que l'option Tee arc-en-ciel de TClient est active."
brazilian_portuguese = "A alternância de matiz do Tee só funciona com cores personalizadas e não faz nada enquanto a opção de Tee arco-íris do TClient estiver ligada."
portuguese = "A alternância de matiz do Tee só funciona com cores personalizadas e nada faz enquanto a opção de Tee arco-íris do TClient estiver ligada."
turkish = "Özel Tee tonu döngüsü yalnızca özel renklerle çalışır ve TClient gökkuşağı Tee seçeneği açıkken hiçbir şey yapmaz."
polish = "Cykliczna zmiana odcienia Tee działa tylko z własnymi kolorami i nic nie robi, gdy w TClient włączona jest opcja tęczowego Tee."

[[message]]
key = "Chooses which name plates are drawn and adds clan, team color, friend icon, coordinates and client IDs to them."
[message.translations]
simplified_chinese = "选择要绘制哪些昵称，并给昵称加上战队、队伍颜色、好友图标、坐标和客户端 ID。"
traditional_chinese = "選擇要繪製哪些暱稱，並給暱稱加上戰隊、隊伍顏色、好友圖示、座標和客戶端 ID。"
japanese = "どのネームプレートを描くかを選び、クラン、チームカラー、フレンドアイコン、座標、クライアント ID を付け加えます。"
korean = "어떤 이름표를 그릴지 고르고, 여기에 클랜, 팀 색상, 친구 아이콘, 좌표, 클라이언트 ID를 더합니다."
russian = "Выбирает, какие таблички с именами рисовать, и добавляет к ним клан, цвет команды, значок друга, координаты и ID клиента."
german = "Wählt, welche Namensschilder gezeichnet werden, und ergänzt Clan, Teamfarbe, Freundessymbol, Koordinaten und Client-IDs."
spanish = "Elige qué placas de nombre se dibujan y les añade clan, color de equipo, icono de amigo, coordenadas e ID de cliente."
french = "Choisit quelles plaques de nom sont dessinées et leur ajoute clan, couleur d'équipe, icône d'ami, coordonnées et ID client."
brazilian_portuguese = "Escolhe quais placas de nome são desenhadas e acrescenta clã, cor da equipe, ícone de amigo, coordenadas e IDs de cliente."
portuguese = "Escolhe que placas de nome são desenhadas e acrescenta clã, cor de equipa, ícone de amigo, coordenadas e IDs de cliente."
turkish = "Hangi isim plakalarının çizileceğini seçer ve bunlara klan, takım rengi, arkadaş simgesi, koordinatlar ve istemci ID'leri ekler."
polish = "Wybiera, które tabliczki z nazwami są rysowane, i dodaje do nich klan, kolor drużyny, ikonę znajomego, współrzędne i ID klienta."

[[message]]
key = "Pick a scope under \"Show name plates\", then set \"Name plates size\" and \"Name plates offset\"; clan and client ID lines have their own switches."
[message.translations]
simplified_chinese = "在显示昵称下选择范围，再设置昵称大小和昵称距离；战队与客户端 ID 各自有独立开关。"
traditional_chinese = "在顯示暱稱下選擇範圍，再設定暱稱大小和暱稱距離；戰隊與客戶端 ID 各自有獨立開關。"
japanese = "ネームプレート表示の範囲を選び、ネームプレートのサイズとオフセットを設定します。クランとクライアント ID の行には個別のスイッチがあります。"
korean = "이름표 표시에서 범위를 고르고 이름표 크기와 이름표 오프셋을 설정하세요. 클랜과 클라이언트 ID 행에는 각각 스위치가 있습니다."
russian = "Выберите область в Показывать таблички с именами, затем задайте Размер табличек с именами и Смещение табличек с именами; у строк клана и ID клиента свои переключатели."
german = "Wähle einen Bereich unter Namensschilder anzeigen, dann Größe und Abstand der Namensschilder; Clan- und Client-ID-Zeilen haben eigene Schalter."
spanish = "Elige un alcance en Mostrar placas de nombre y ajusta tamaño y desplazamiento de las placas; las líneas de clan e ID de cliente tienen sus propios interruptores."
french = "Choisis une portée dans Afficher les plaques de nom, puis règle taille et décalage ; les lignes clan et ID client ont leurs propres interrupteurs."
brazilian_portuguese = "Escolha o alcance em Mostrar placas de nome e ajuste tamanho e deslocamento; as linhas de clã e ID de cliente têm seus próprios controles."
portuguese = "Escolhe o alcance em Mostrar placas de nome e ajusta tamanho e deslocamento; as linhas de clã e ID de cliente têm os seus próprios interruptores."
turkish = "İsim plakalarını göster altında kapsamı seç, sonra isim plakası boyutu ve ofsetini ayarla; klan ve istemci ID satırlarının ayrı anahtarları var."
polish = "Wybierz zakres w Pokaż tabliczki z nazwami, ustaw rozmiar i odstęp tabliczek; wiersze klanu i ID klienta mają własne przełączniki."

[[message]]
key = "\"None\" hides all name plates including your own team, so choose \"Others\" if you only want a cleaner screen."
[message.translations]
simplified_chinese = "无会连自己队伍的昵称一起隐藏，只想要画面干净请选其他玩家。"
traditional_chinese = "無會連自己隊伍的暱稱一起隱藏，只想要畫面乾淨請選其他玩家。"
japanese = "なしは自分のチームも含めてすべてのネームプレートを隠すので、画面をすっきりさせたいだけなら他のプレイヤーを選びます。"
korean = "없음은 자기 팀까지 모든 이름표를 숨기므로, 화면만 깔끔하게 하고 싶다면 다른 플레이어를 고르세요."
russian = "Вариант Нет скрывает все таблички, включая вашу команду, поэтому выбирайте Другие, если просто нужен чистый экран."
german = "Keine blendet alle Namensschilder samt eigenem Team aus; wähle Andere, wenn du nur einen ruhigeren Bildschirm willst."
spanish = "Ninguno oculta todas las placas, incluido tu equipo, así que elige Otros si solo quieres una pantalla más limpia."
french = "Aucun masque toutes les plaques, y compris ton équipe ; choisis Autres si tu veux juste un écran plus propre."
brazilian_portuguese = "Nenhum oculta todas as placas, inclusive a do seu time, então escolha Outros se quiser apenas uma tela mais limpa."
portuguese = "Nenhum esconde todas as placas, incluindo a da tua equipa, por isso escolhe Outros se só queres um ecrã mais limpo."
turkish = "Hiçbiri kendi takımın dahil tüm isim plakalarını gizler; sadece daha temiz bir ekran istiyorsan Diğerleri seç."
polish = "Brak ukrywa wszystkie tabliczki, także twojej drużyny, więc wybierz Inni, jeśli chcesz tylko czystszy ekran."

[[message]]
key = "Adds border, gradient, rainbow and glow effects to nameplate text, with separate scopes for play, spectating and demos."
[message.translations]
simplified_chinese = "给昵称文字加上边框、渐变、彩虹和发光效果，并分别作用于游戏、观战和 demo。"
traditional_chinese = "給暱稱文字加上邊框、漸變、彩虹和發光效果，並分別作用於遊戲、觀戰和 demo。"
japanese = "ネームプレートの文字に枠線、グラデーション、レインボー、発光の効果を加えます。プレイ、観戦、デモで範囲を分けられます。"
korean = "이름표 글자에 테두리, 그라데이션, 무지개, 발광 효과를 넣고 플레이, 관전, demo에 각각 범위를 정합니다."
russian = "Добавляет тексту табличек рамку, градиент, радугу и свечение, с отдельными областями для игры, наблюдения и demo."
german = "Gibt Namensschild-Text Rahmen, Verlauf, Regenbogen und Leuchten, mit eigenen Bereichen fürs Spielen, Zuschauen und Demos."
spanish = "Añade borde, degradado, arcoíris y brillo al texto de las placas, con alcances separados para jugar, observar y demos."
french = "Ajoute bordure, dégradé, arc-en-ciel et lueur au texte des plaques, avec des portées séparées pour jouer, observer et les demos."
brazilian_portuguese = "Adiciona borda, degradê, arco-íris e brilho ao texto das placas, com escopos separados para jogar, assistir e demos."
portuguese = "Adiciona bordo, gradiente, arco-íris e brilho ao texto das placas, com âmbitos separados para jogar, observar e demos."
turkish = "İsim plakası yazısına kenarlık, renk geçişi, gökkuşağı ve parlama efektleri ekler; oynarken, izlerken ve demolarda ayrı kapsamlar sunar."
polish = "Dodaje obramowanie, gradient, tęczę i poświatę do tekstu tabliczek, z osobnymi zakresami dla gry, obserwacji i dem."

[[message]]
key = "Turn on \"Show advanced options\", then enable \"Border\", \"Gradient\", \"Rainbow\" or \"Glow\" and set the matching ranges and colors."
[message.translations]
simplified_chinese = "打开显示高级选项，再启用边框、渐变、彩虹或发光，并设置对应的范围和颜色。"
traditional_chinese = "打開顯示進階選項，再啟用邊框、漸變、彩虹或發光，並設定對應的範圍和顏色。"
japanese = "詳細オプション表示をオンにしてから、枠線、グラデーション、レインボー、発光を有効にし、それぞれの範囲と色を設定します。"
korean = "고급 옵션 표시를 켠 뒤 테두리, 그라데이션, 무지개, 발광 중 원하는 것을 켜고 해당 범위와 색상을 설정하세요."
russian = "Включите Показать дополнительные параметры, затем включите Рамка, Градиент, Радуга или Свечение и задайте соответствующие диапазоны и цвета."
german = "Schalte Erweiterte Optionen anzeigen ein, aktiviere dann Rahmen, Verlauf, Regenbogen oder Leuchten und stelle die passenden Bereiche und Farben ein."
spanish = "Activa Mostrar opciones avanzadas, habilita Borde, Degradado, Arcoíris o Brillo y ajusta los rangos y colores correspondientes."
french = "Active Afficher les options avancées, puis active Bordure, Dégradé, Arc-en-ciel ou Lueur et règle les plages et couleurs correspondantes."
brazilian_portuguese = "Ative Mostrar opções avançadas, ligue Borda, Degradê, Arco-íris ou Brilho e ajuste as faixas e cores correspondentes."
portuguese = "Ativa Mostrar opções avançadas, liga Bordo, Gradiente, Arco-íris ou Brilho e define os intervalos e cores correspondentes."
turkish = "Gelişmiş seçenekleri göster seçeneğini aç, sonra Kenarlık, Renk geçişi, Gökkuşağı veya Parlama efektini etkinleştirip ilgili aralıkları ve renkleri ayarla."
polish = "Włącz Pokaż opcje zaawansowane, następnie włącz Obramowanie, Gradient, Tęcza lub Poświata i ustaw pasujące zakresy oraz kolory."

[[message]]
key = "Effects are heavy on crowded servers, so keep \"Automatic effect LOD when crowded\" enabled."
[message.translations]
simplified_chinese = "人多时特效很耗性能，建议保持同屏拥挤时自动 LOD 开启。"
traditional_chinese = "人多時特效很耗效能，建議保持同屏擁擠時自動 LOD 開啟。"
japanese = "人が多いサーバーではエフェクトが重いので、密集時の自動 LOD はオンにしておいてください。"
korean = "사람이 많은 서버에서는 효과가 무거우니 혼잡할 때 자동 LOD를 켜 두세요."
russian = "На многолюдных серверах эффекты тяжелы, поэтому оставьте автоматический LOD при скоплении включённым."
german = "Auf vollen Servern sind Effekte teuer, also lass das automatische Effekt-LOD bei Gedränge an."
spanish = "En servidores llenos los efectos pesan, así que mantén activo el LOD automático de efectos en multitudes."
french = "Sur les serveurs bondés, ces effets coûtent cher ; garde le LOD automatique des effets en foule activé."
brazilian_portuguese = "Em servidores cheios os efeitos pesam, então mantenha ligado o LOD automático de efeitos em multidão."
portuguese = "Em servidores cheios os efeitos pesam, por isso mantém ligado o LOD automático de efeitos em multidão."
turkish = "Kalabalık sunucularda efektler ağır kalır, kalabalıkta otomatik efekt LOD seçeneğini açık tut."
polish = "Na zatłoczonych serwerach efekty są ciężkie, więc zostaw włączony automatyczny LOD efektów przy tłoku."

[[message]]
key = "Shows whether each tee can still be hooked, as an icon or a number beside the name."
[message.translations]
simplified_chinese = "用图标或名字旁的数字显示每个 Tee 是否还能被钩。"
traditional_chinese = "用圖示或名字旁的數字顯示每個 Tee 是否還能被鉤。"
japanese = "各 Tee がまだフックできるかを、名前の横のアイコンや数値で示します。"
korean = "각 Tee가 아직 갈고리로 당겨질 수 있는지 이름 옆 아이콘 또는 숫자로 보여 줍니다."
russian = "Показывает, можно ли ещё зацепить крюком каждый Tee, значком или числом рядом с именем."
german = "Zeigt als Symbol oder Zahl neben dem Namen, ob ein Tee noch gehakt werden kann."
spanish = "Muestra con un icono o un número junto al nombre si cada Tee aún se puede enganchar."
french = "Indique par une icône ou un nombre à côté du nom si chaque Tee peut encore être accroché."
brazilian_portuguese = "Mostra com ícone ou número ao lado do nome se cada Tee ainda pode ser puxado pelo gancho."
portuguese = "Mostra com ícone ou número junto ao nome se cada Tee ainda pode ser apanhado pelo gancho."
turkish = "Her Tee'nin hâlâ kancalanabilir olup olmadığını adının yanında simge ya da sayıyla gösterir."
polish = "Pokazuje przy nazwie ikoną lub liczbą, czy danego Tee można jeszcze zahaczyć."

[[message]]
key = "Turn on \"Show hook strength icon indicator\", optionally add \"Show hook strength number indicator\", then choose a \"Hook strength scope\"."
[message.translations]
simplified_chinese = "打开显示钩索强度图标，需要的话再开显示钩索强度数值，然后选择钩索强度范围。"
traditional_chinese = "打開顯示鉤索強度圖示，需要時再開顯示鉤索強度數值，然後選擇鉤索強度範圍。"
japanese = "フック強度アイコンインジケーター表示をオンにし、必要ならフック強度数値インジケーターもオンにして、フック強度の範囲を選びます。"
korean = "갈고리 강도 아이콘 표시를 켜고, 필요하면 갈고리 강도 숫자 표시를 켠 뒤 갈고리 강도 범위를 고릅니다."
russian = "Включите Показывать значок силы крюка, при желании добавьте числовой индикатор силы крюка и выберите область силы крюка."
german = "Schalte Hakenstärke-Symbol anzeigen ein, optional zusätzlich Hakenstärke-Zahl anzeigen, und wähle dann einen Bereich für die Hakenstärke."
spanish = "Activa Mostrar indicador de icono de fuerza de gancho, opcionalmente añade el indicador numérico y elige el alcance de la fuerza de gancho."
french = "Active l'indicateur d'icône de force du crochet, ajoute éventuellement l'indicateur de nombre, puis choisis une portée de force du crochet."
brazilian_portuguese = "Ative Mostrar indicador de ícone de força do gancho, opcionalmente o indicador numérico, e escolha o escopo de força do gancho."
portuguese = "Ativa Mostrar indicador de ícone de força do gancho, opcionalmente o indicador numérico, e escolhe o âmbito da força do gancho."
turkish = "Kanca gücü simge göstergesini göster seçeneğini aç, istersen kanca gücü sayı göstergesini de ekle, sonra kanca gücü kapsamını seç."
polish = "Włącz Pokaż wskaźnik ikony siły haka, opcjonalnie wskaźnik liczbowy, i wybierz zakres siły haka."

[[message]]
key = "\"Hook strength scope\" limits which players get the marker, so pick \"All\" if it seems missing."
[message.translations]
simplified_chinese = "钩索强度范围决定哪些玩家带标记，看不到标记时选全部。"
traditional_chinese = "鉤索強度範圍決定哪些玩家帶標記，看不到標記時選全部。"
japanese = "フック強度の範囲でマーカーが付くプレイヤーが決まるので、見当たらないときはすべてを選びます。"
korean = "갈고리 강도 범위는 표시가 붙을 플레이어를 제한하니, 안 보이면 모두를 고르세요."
russian = "Область силы крюка ограничивает, кому ставится метка, поэтому выбирайте Все, если её не видно."
german = "Der Bereich der Hakenstärke begrenzt, wer die Markierung bekommt; wähle Alle, wenn sie zu fehlen scheint."
spanish = "El alcance de la fuerza de gancho limita quién recibe la marca, así que elige Todos si no la ves."
french = "La portée de force du crochet limite qui reçoit le marqueur ; choisis Tous s'il semble absent."
brazilian_portuguese = "O escopo de força do gancho limita quem recebe a marca, então escolha Todos se ela não aparecer."
portuguese = "O âmbito da força do gancho limita quem recebe a marca, por isso escolhe Todos se ela não aparecer."
turkish = "Kanca gücü kapsamı işareti kimin alacağını sınırlar; görünmüyorsa Tümü seç."
polish = "Zakres siły haka ogranicza, kto dostaje znacznik, więc wybierz Wszyscy, jeśli go nie widzisz."

[[message]]
key = "Draws the keys each tee is pressing beside their name, so you can read their movement."
[message.translations]
simplified_chinese = "在名字旁画出每个 Tee 正在按的键，方便看出对方的移动。"
traditional_chinese = "在名字旁畫出每個 Tee 正在按的鍵，方便看出對方的移動。"
japanese = "各 Tee が押しているキーを名前の横に描き、動きが読めるようにします。"
korean = "각 Tee가 누르는 키를 이름 옆에 그려 움직임을 읽을 수 있게 합니다."
russian = "Рисует рядом с именем клавиши, которые нажимает Tee, чтобы читать его движение."
german = "Zeichnet die gedrückten Tasten jedes Tees neben den Namen, damit du seine Bewegung lesen kannst."
spanish = "Dibuja junto al nombre las teclas que pulsa cada Tee para que puedas leer su movimiento."
french = "Dessine à côté du nom les touches que presse chaque Tee pour lire ses déplacements."
brazilian_portuguese = "Desenha ao lado do nome as teclas que cada Tee aperta, para você ler o movimento."
portuguese = "Desenha junto ao nome as teclas que cada Tee prime, para leres o movimento."
turkish = "Her Tee'nin bastığı tuşları adının yanına çizer, böylece hareketini okuyabilirsin."
polish = "Rysuje obok nazwy klawisze wciskane przez danego Tee, żeby czytać jego ruch."

[[message]]
key = "Choose \"Show players' key presses\" as \"Own\", \"Others\" or \"All\", then adjust \"Size of key press icons\"."
[message.translations]
simplified_chinese = "把显示按键设为自己的、其他玩家或全部，再调按键显示图标大小。"
traditional_chinese = "把顯示按鍵設為自己的、其他玩家或全部，再調按鍵顯示圖示大小。"
japanese = "プレイヤーのキー入力表示を自分、他のプレイヤー、すべてから選び、キー入力アイコンのサイズを調整します。"
korean = "플레이어 키 입력 표시를 자신, 다른 플레이어, 모두 중에서 고르고 키 입력 아이콘 크기를 맞춥니다."
russian = "Выберите для Показывать нажатия клавиш игроков вариант Свои, Другие или Все, затем настройте Размер иконок нажатий клавиш."
german = "Stelle Tastendrücke der Spieler anzeigen auf Eigene, Andere oder Alle und passe die Größe der Tastendruck-Symbole an."
spanish = "Elige en Mostrar pulsaciones de teclas de los jugadores entre Propias, Otros o Todos y ajusta el tamaño de los iconos."
french = "Choisis dans Afficher les pressions de touches des joueurs entre Les miennes, Autres ou Toutes, puis règle la taille des icônes."
brazilian_portuguese = "Em Mostrar teclas pressionadas dos jogadores escolha Próprias, Outros ou Todas e ajuste o tamanho dos ícones."
portuguese = "Em Mostrar teclas premidas dos jogadores escolhe Próprias, Outros ou Todas e ajusta o tamanho dos ícones."
turkish = "Oyuncuların tuş vuruşlarını göster ayarını Kendim, Diğerleri veya Tümü olarak seç, sonra tuş vuruşu simgelerinin boyutunu ayarla."
polish = "W Pokaż naciśnięcia klawiszy graczy wybierz Własne, Inni lub Wszyscy, a potem dostosuj Rozmiar ikon naciśnięć klawiszy."

[[message]]
key = "Big icons can overlap names and nearby tees, so shrink \"Size of key press icons\" when many players are close."
[message.translations]
simplified_chinese = "图标太大会压住名字和旁边的 Tee，人多挤在一起时把按键显示图标大小调小。"
traditional_chinese = "圖示太大會壓住名字和旁邊的 Tee，人多擠在一起時把按鍵顯示圖示大小調小。"
japanese = "大きいアイコンは名前や近くの Tee に重なるので、プレイヤーが密集しているときはキー入力アイコンのサイズを小さくします。"
korean = "아이콘이 크면 이름과 가까운 Tee를 가리니, 플레이어가 몰려 있을 때는 키 입력 아이콘 크기를 줄이세요."
russian = "Крупные значки перекрывают имена и соседние Tees, поэтому при тесноте уменьшайте размер иконок нажатий."
german = "Große Symbole überlappen Namen und nahe Tees; verkleinere die Symbole, wenn viele Spieler dicht beieinander sind."
spanish = "Los iconos grandes tapan nombres y Tees cercanos; reduce su tamaño cuando haya muchos jugadores juntos."
french = "Des icônes trop grandes chevauchent les noms et les Tees proches ; réduis leur taille quand les joueurs sont serrés."
brazilian_portuguese = "Ícones grandes cobrem nomes e Tees próximos; diminua o tamanho quando houver muita gente junta."
portuguese = "Ícones grandes tapam nomes e Tees próximos; diminui o tamanho quando houver muita gente junta."
turkish = "Büyük simgeler adları ve yakındaki Tee'leri örtebilir; oyuncular sıkışıksa simge boyutunu küçült."
polish = "Duże ikony nachodzą na nazwy i pobliskie Tee, więc przy tłoku zmniejsz ich rozmiar."

[[message]]
key = "Shows your tee and dummy side by side so you can set skin, colors and default eyes for each of them."
[message.translations]
simplified_chinese = "并排显示你的 Tee 和 dummy，方便分别给它们设置皮肤、颜色和默认眼睛。"
traditional_chinese = "並排顯示你的 Tee 和 dummy，方便分別設定皮膚、顏色和預設眼睛。"
japanese = "自分の Tee と dummy を並べて表示し、それぞれのスキン、色、既定の目を設定できます。"
korean = "내 Tee와 dummy를 나란히 보여 주어 각각의 스킨, 색상, 기본 눈을 설정할 수 있습니다."
russian = "Показывает ваш Tee и dummy рядом, чтобы задать каждому скин, цвета и глаза по умолчанию."
german = "Zeigt deinen Tee und den Dummy nebeneinander, um für beide Skin, Farben und Standardaugen einzustellen."
spanish = "Muestra tu Tee y el dummy uno al lado del otro para configurar skin, colores y ojos por defecto de cada uno."
french = "Affiche ton Tee et le dummy côte à côte pour régler skin, couleurs et yeux par défaut de chacun."
brazilian_portuguese = "Mostra seu Tee e o dummy lado a lado para definir skin, cores e olhos padrão de cada um."
portuguese = "Mostra o teu Tee e o dummy lado a lado para definires skin, cores e olhos predefinidos de cada um."
turkish = "Kendi Tee'nle dummy'yi yan yana gösterir; her biri için skin, renk ve varsayılan gözleri ayarlarsın."
polish = "Pokazuje twojego Tee i dummy obok siebie, by ustawić dla każdego skórkę, kolory i domyślne oczy."

[[message]]
key = "Click the \"Player\" or \"Dummy\" preview, type a name under \"Your skin\", then turn on \"Custom colors\" to pick \"Body\" and \"Feet\"."
[message.translations]
simplified_chinese = "点一下玩家或 Dummy 的预览，在皮肤栏里输入名字，再打开自定义颜色选身体和脚的颜色。"
traditional_chinese = "點一下玩家或 Dummy 的預覽，在皮膚欄裡輸入名字，再打開自訂顏色選身體和腳的顏色。"
japanese = "プレイヤーまたは Dummy のプレビューをクリックし、スキン名を入力してから、カスタムカラーをオンにして体と足の色を選びます。"
korean = "플레이어 또는 Dummy 미리보기를 클릭하고 스킨 항목에 이름을 입력한 뒤 사용자 지정 색상을 켜서 몸과 발 색을 고릅니다."
russian = "Нажмите предпросмотр игрока или Dummy, введите имя в поле скина, затем включите Пользовательские цвета и выберите цвета тела и ног."
german = "Klicke die Vorschau von Spieler oder Dummy an, gib unter Dein Skin einen Namen ein und schalte Benutzerdefinierte Farben ein, um Körper und Füße zu wählen."
spanish = "Haz clic en la vista previa de jugador o Dummy, escribe un nombre en tu skin y activa Colores personalizados para elegir cuerpo y pies."
french = "Clique sur l'aperçu joueur ou Dummy, saisis un nom dans ton skin, puis active Couleurs personnalisées pour choisir corps et pieds."
brazilian_portuguese = "Clique na prévia de jogador ou Dummy, digite um nome no seu skin e ative Cores personalizadas para escolher corpo e pés."
portuguese = "Clica na pré-visualização de jogador ou Dummy, escreve um nome no teu skin e ativa Cores personalizadas para escolher corpo e pés."
turkish = "Oyuncu veya Dummy önizlemesine tıkla, skin alanına bir ad yaz, sonra Özel renkler seçeneğini açıp gövde ve ayak renklerini seç."
polish = "Kliknij podgląd gracza lub Dummy, wpisz nazwę w polu skina, a następnie włącz Niestandardowe kolory i wybierz ciało oraz stopy."

[[message]]
key = "Only the selected tee changes, so switch to \"Dummy\" before editing the colors you want on your dummy."
[message.translations]
simplified_chinese = "改动只作用于选中的 Tee，想改 dummy 的颜色要先切到 Dummy。"
traditional_chinese = "改動只作用於選中的 Tee，想改 dummy 的顏色要先切到 Dummy。"
japanese = "変更は選択中の Tee にだけ効くので、dummy の色を変える前に Dummy へ切り替えてください。"
korean = "변경은 선택한 Tee에만 적용되니, dummy 색을 바꾸려면 먼저 Dummy로 전환하세요."
russian = "Меняется только выбранный Tee, поэтому перед правкой цветов dummy переключитесь на Dummy."
german = "Nur der ausgewählte Tee ändert sich; wechsle zu Dummy, bevor du die Farben für deinen Dummy anpasst."
spanish = "Solo cambia el Tee seleccionado, así que pasa a Dummy antes de editar los colores de tu dummy."
french = "Seul le Tee sélectionné change ; passe sur Dummy avant de régler les couleurs de ton dummy."
brazilian_portuguese = "Só o Tee selecionado muda, então troque para Dummy antes de editar as cores do seu dummy."
portuguese = "Só o Tee selecionado muda, por isso muda para Dummy antes de editar as cores do teu dummy."
turkish = "Yalnızca seçili Tee değişir; dummy'nin renklerini düzenlemeden önce Dummy'ye geç."
polish = "Zmienia się tylko wybrany Tee, więc przełącz na Dummy, zanim ustawisz kolory swojego dummy."

[[message]]
key = "Searches every skin the client knows and keeps favorite and recently used ones in separate tabs."
[message.translations]
simplified_chinese = "搜索客户端知道的所有皮肤，并把收藏和最近使用的皮肤分到独立标签页。"
traditional_chinese = "搜尋客戶端知道的所有皮膚，並把收藏和最近使用的皮膚分到獨立分頁。"
japanese = "クライアントが知っているすべてのスキンを検索し、お気に入りと最近使ったものを別タブにまとめます。"
korean = "클라이언트가 아는 모든 스킨을 검색하고 즐겨찾기와 최근 사용 스킨을 별도 탭에 모읍니다."
russian = "Ищет по всем известным клиенту скинам и держит избранные и недавние на отдельных вкладках."
german = "Durchsucht alle dem Client bekannten Skins und führt Favoriten und zuletzt genutzte in eigenen Tabs."
spanish = "Busca entre todos los skins que conoce el cliente y guarda favoritos y recientes en pestañas aparte."
french = "Cherche parmi tous les skins connus du client et garde favoris et récents dans des onglets séparés."
brazilian_portuguese = "Pesquisa entre todas as skins que o cliente conhece e mantém favoritas e recentes em abas separadas."
portuguese = "Pesquisa entre todas as skins que o cliente conhece e mantém favoritas e recentes em separadores próprios."
turkish = "İstemcinin bildiği tüm skinlerde arama yapar; favorileri ve son kullanılanları ayrı sekmelerde tutar."
polish = "Przeszukuje wszystkie znane klientowi skórki i trzyma ulubione oraz ostatnie na osobnych kartach."

[[message]]
key = "Type in the search field or switch between \"All\", \"Favorites\" and \"Recent\", then click a skin to apply it and use the plus icon to queue it."
[message.translations]
simplified_chinese = "在搜索框输入或切换全部、收藏、最近，点一下皮肤立即套用，用加号图标把它排进队列。"
traditional_chinese = "在搜尋框輸入或切換全部、收藏、最近，點一下皮膚立即套用，用加號圖示把它排進佇列。"
japanese = "検索欄に入力するか、すべて、お気に入り、最近を切り替え、スキンをクリックすると適用され、プラスアイコンでキューに追加します。"
korean = "검색란에 입력하거나 모두, 즐겨찾기, 최근을 전환하고, 스킨을 클릭하면 바로 적용되며 더하기 아이콘으로 대기열에 넣습니다."
russian = "Введите текст в поиске или переключитесь на Все, Избранное и Недавние, клик по скину применяет его, а значок плюса ставит в очередь."
german = "Tippe ins Suchfeld oder wechsle zwischen Alle, Favoriten und Zuletzt, klicke einen Skin zum Anwenden an und nutze das Plus-Symbol für die Warteschlange."
spanish = "Escribe en el buscador o cambia entre Todos, Favoritos y Recientes, haz clic en un skin para aplicarlo y usa el icono más para añadirlo a la cola."
french = "Tape dans la recherche ou passe entre Tous, Favoris et Récents, clique un skin pour l'appliquer et utilise l'icône plus pour le mettre en file."
brazilian_portuguese = "Digite na busca ou alterne entre Todas, Favoritas e Recentes, clique numa skin para aplicá-la e use o ícone de mais para enfileirá-la."
portuguese = "Escreve na pesquisa ou alterna entre Todas, Favoritas e Recentes, clica numa skin para a aplicar e usa o ícone de mais para a pôr em fila."
turkish = "Arama alanına yaz ya da Tümü, Favoriler ve Son kullanılanlar arasında geçiş yap; bir skine tıklayınca hemen uygulanır, artı simgesiyle sıraya alınır."
polish = "Wpisz tekst w wyszukiwaniu lub przełączaj Wszystkie, Ulubione i Ostatnie, kliknij skórkę, by ją zastosować, a ikoną plusa dodaj ją do kolejki."

[[message]]
key = "Every click applies the skin at once, so star the ones you like before you start browsing."
[message.translations]
simplified_chinese = "每点一次都会立刻套用，想留下喜欢的皮肤就先加星再慢慢浏览。"
traditional_chinese = "每點一次都會立刻套用，想留下喜歡的皮膚就先加星再慢慢瀏覽。"
japanese = "クリックするたびにすぐ適用されるので、気に入ったものは先に星を付けてから探してください。"
korean = "클릭할 때마다 바로 적용되니, 마음에 드는 스킨은 먼저 별표를 해 두고 둘러보세요."
russian = "Каждый клик сразу применяет скин, поэтому отметьте звёздочкой любимые до начала просмотра."
german = "Jeder Klick wendet den Skin sofort an, markiere also Favoriten mit dem Stern, bevor du stöberst."
spanish = "Cada clic aplica el skin al instante, así que marca con estrella los que te gusten antes de explorar."
french = "Chaque clic applique le skin aussitôt ; mets en favori ceux qui te plaisent avant de parcourir."
brazilian_portuguese = "Cada clique aplica a skin na hora, então favorite as que gostar antes de começar a navegar."
portuguese = "Cada clique aplica a skin de imediato, por isso marca com estrela as que gostas antes de navegar."
turkish = "Her tıklama skini anında uygular; beğendiklerini göz atmaya başlamadan önce yıldızla."
polish = "Każde kliknięcie od razu stosuje skórkę, więc najpierw oznacz gwiazdką te, które lubisz."

[[message]]
key = "Decides which skins the client downloads and lists, and can add a prefix to load prefixed skin variants."
[message.translations]
simplified_chinese = "决定客户端下载并列出哪些皮肤，还可以加前缀来加载带前缀的皮肤变体。"
traditional_chinese = "決定客戶端下載並列出哪些皮膚，還可以加前綴來載入帶前綴的皮膚變體。"
japanese = "クライアントがダウンロードして一覧に出すスキンを決め、プレフィックス付きのスキン変種を読み込むための接頭辞も設定できます。"
korean = "클라이언트가 내려받고 목록에 표시할 스킨을 정하고, 접두사가 붙은 스킨 변형을 불러올 접두사를 추가할 수 있습니다."
russian = "Определяет, какие скины клиент скачивает и показывает, и позволяет задать префикс для загрузки вариантов скинов с префиксом."
german = "Legt fest, welche Skins der Client lädt und auflistet, und kann ein Präfix setzen, um Skin-Varianten mit Präfix zu laden."
spanish = "Decide qué skins descarga y muestra el cliente, y puede añadir un prefijo para cargar variantes de skin con prefijo."
french = "Décide quels skins le client télécharge et liste, et peut ajouter un préfixe pour charger des variantes préfixées."
brazilian_portuguese = "Define quais skins o cliente baixa e lista, e pode adicionar um prefixo para carregar variações com prefixo."
portuguese = "Define que skins o cliente transfere e lista, e pode adicionar um prefixo para carregar variantes com prefixo."
turkish = "İstemcinin hangi skinleri indirip listeleyeceğini belirler ve ön ekli skin varyantlarını yüklemek için ön ek ekleyebilir."
polish = "Decyduje, które skórki klient pobiera i wyświetla, i pozwala dodać prefiks, by wczytywać warianty skórek z prefiksem."

[[message]]
key = "Tick \"Download skins\", \"Download community skins\" or \"Vanilla skins only\", then type a \"Skin prefix\" or use a preset such as \"kitty\"."
[message.translations]
simplified_chinese = "勾选下载官方皮肤、下载社区皮肤或只显示原生皮肤，然后输入皮肤名称前缀，或直接用 kitty 之类的预设。"
traditional_chinese = "勾選下載官方皮膚、下載社群皮膚或只顯示原生皮膚，然後輸入皮膚名稱前綴，或直接用 kitty 之類的預設。"
japanese = "スキンをダウンロード、コミュニティスキンをダウンロード、バニラスキンのみのいずれかにチェックを入れ、スキンの接頭辞を入力するか、kitty などのプリセットを使います。"
korean = "스킨 다운로드, 커뮤니티 스킨 다운로드, 바닐라 스킨만 표시 중 하나를 체크하고 스킨 접두사를 입력하거나 kitty 같은 프리셋을 쓰세요."
russian = "Отметьте Скачать скины, Скачать скины сообщества или Только ванильные скины, затем введите префикс скина или выберите готовый вариант вроде kitty."
german = "Setze Haken bei Skins herunterladen, Community-Skins herunterladen oder Nur Vanilla-Skins und tippe ein Skin-Präfix oder nutze eine Vorgabe wie kitty."
spanish = "Marca Descargar skins, Descargar skins de la comunidad o Solo skins originales, y escribe un prefijo de skin o usa un preajuste como kitty."
french = "Coche Télécharger les skins, Télécharger les skins communautaires ou Skins vanilla uniquement, puis saisis un préfixe de skin ou un préréglage comme kitty."
brazilian_portuguese = "Marque Baixar skins, Baixar skins da comunidade ou Apenas skins vanilla e digite um prefixo de skin ou use uma predefinição como kitty."
portuguese = "Marca Baixar skins, Baixar skins da comunidade ou Apenas skins vanilla e escreve um prefixo de skin ou usa uma predefinição como kitty."
turkish = "Görünümleri indir, Topluluk görünümlerini indir veya Sadece orijinal skinler seçeneklerini işaretle, sonra bir skin ön eki yaz veya kitty gibi hazır bir ayar kullan."
polish = "Zaznacz Pobierz skórki, Pobierz skórki społeczności lub Tylko oryginalne skórki, a potem wpisz prefiks skina albo użyj ustawienia takiego jak kitty."

[[message]]
key = "\"Vanilla skins only\" hides every custom skin, so turn it off if your skin suddenly turns default."
[message.translations]
simplified_chinese = "只显示原生皮肤会把自定义皮肤全部隐藏，皮肤突然变回默认就把它关掉。"
traditional_chinese = "只顯示原生皮膚會把自訂皮膚全部隱藏，皮膚突然變回預設就把它關掉。"
japanese = "バニラスキンのみをオンにするとカスタムスキンが全部隠れるので、スキンが急に既定になったらオフにします。"
korean = "바닐라 스킨만 표시를 켜면 모든 사용자 지정 스킨이 숨겨지니, 스킨이 갑자기 기본이 되면 꺼 두세요."
russian = "Только ванильные скины скрывает все пользовательские скины, поэтому выключите её, если ваш скин вдруг стал стандартным."
german = "Nur Vanilla-Skins blendet alle eigenen Skins aus; schalte es aus, wenn dein Skin plötzlich Standard ist."
spanish = "Solo skins originales oculta todos los skins personalizados; desactívalo si tu skin se vuelve el de fábrica."
french = "Skins vanilla uniquement cache tous les skins personnalisés ; désactive-le si ton skin redevient celui par défaut."
brazilian_portuguese = "Apenas skins vanilla esconde todas as skins personalizadas; desative se a sua virar a padrão de repente."
portuguese = "Apenas skins vanilla esconde todas as skins personalizadas; desativa se a tua passar a predefinida de repente."
turkish = "Sadece orijinal skinler tüm özel skinleri gizler; skinin bir anda varsayılana dönerse bunu kapat."
polish = "Tylko oryginalne skórki ukrywa wszystkie własne skórki, więc wyłącz to, jeśli twoja skórka nagle wróci do domyślnej."

[[message]]
key = "Rotates your tee through a saved list of skins, either on a timer or at a random spot when a map starts."
[message.translations]
simplified_chinese = "按保存的皮肤列表轮流换肤，可以定时切换，也可以在地图开始时随机挑一个。"
traditional_chinese = "按儲存的皮膚列表輪流換膚，可以定時切換，也可以在地圖開始時隨機挑一個。"
japanese = "保存したスキン一覧で Tee を順に切り替えます。タイマーでも、マップ開始時にランダムな位置からでも動かせます。"
korean = "저장한 스킨 목록으로 Tee를 순환시키며, 타이머로 바꾸거나 맵 시작 시 무작위 위치에서 시작할 수 있습니다."
russian = "Перебирает скины Tee по сохранённому списку: по таймеру или со случайного места при старте карты."
german = "Wechselt deinen Tee durch eine gespeicherte Skin-Liste, entweder per Timer oder ab einer zufälligen Stelle beim Kartenstart."
spanish = "Rota tu Tee por una lista guardada de skins, con temporizador o desde un punto aleatorio al empezar el mapa."
french = "Fait tourner ton Tee dans une liste de skins enregistrée, au minuteur ou depuis un point aléatoire au début d'une map."
brazilian_portuguese = "Alterna seu Tee por uma lista salva de skins, por temporizador ou a partir de um ponto aleatório quando o mapa começa."
portuguese = "Alterna o teu Tee por uma lista guardada de skins, por temporizador ou a partir de um ponto aleatório ao começar o mapa."
turkish = "Tee'ni kayıtlı bir skin listesinde döndürür; zamanlayıcıyla ya da harita başlarken rastgele bir noktadan."
polish = "Przełącza twojego Tee przez zapisaną listę skórek, albo czasowo, albo od losowego miejsca przy starcie mapy."

[[message]]
key = "Turn on \"Enable rotation\", set \"Switch interval\" in milliseconds, then add skins with the plus icon in the skin list; \"Random skin on map join\" picks the start."
[message.translations]
simplified_chinese = "打开启用轮换并把切换间隔设成毫秒数，然后在皮肤列表里用加号图标加入皮肤；进入地图时随机皮肤决定从哪里开始。"
traditional_chinese = "打開啟用輪換並把切換間隔設成毫秒數，然後在皮膚列表裡用加號圖示加入皮膚；進入地圖時隨機皮膚決定從哪裡開始。"
japanese = "ローテーションを有効にするをオンにし、切り替え間隔をミリ秒で設定してから、スキン一覧のプラスアイコンでスキンを追加します。マップ参加時のランダムスキンが開始位置を決めます。"
korean = "순환 활성화를 켜고 전환 간격을 밀리초로 설정한 뒤 스킨 목록의 더하기 아이콘으로 스킨을 추가하세요. 맵 입장 시 무작위 스킨이 시작 지점을 정합니다."
russian = "Включите Включить ротацию, задайте Интервал смены в миллисекундах и добавляйте скины значком плюса в списке; Случайный скин при входе на карту задаёт начало."
german = "Schalte Rotation aktivieren ein, setze Wechselintervall in Millisekunden und füge Skins über das Plus-Symbol in der Skin-Liste hinzu; Zufälliger Skin beim Kartenbeitritt wählt den Start."
spanish = "Activa Activar rotación, ajusta el intervalo de cambio en milisegundos y añade skins con el icono más de la lista; el skin aleatorio al entrar al mapa elige el inicio."
french = "Active Activer la rotation, règle l'intervalle de changement en millisecondes et ajoute des skins via l'icône plus de la liste ; le skin aléatoire à l'entrée sur une map choisit le départ."
brazilian_portuguese = "Ative Ativar rotação, defina o intervalo de troca em milissegundos e adicione skins pelo ícone de mais na lista; a skin aleatória ao entrar no mapa escolhe o começo."
portuguese = "Ativa Ativar rotação, define o intervalo de mudança em milissegundos e adiciona skins pelo ícone de mais na lista; a skin aleatória ao entrar no mapa escolhe o início."
turkish = "Döndürmeyi etkinleştir seçeneğini aç, değiştirme aralığını milisaniye olarak ayarla, sonra skin listesindeki artı simgesiyle skin ekle; haritaya girişte rastgele skin başlangıcı seçer."
polish = "Włącz Włącz rotację, ustaw interwał zmiany w milisekundach, potem dodawaj skórki ikoną plusa na liście skórek; losowa skórka przy wejściu na mapę ustala początek."

[[message]]
key = "Set \"Switch interval\" to 0 to stop timed switching and keep the queue for manual or map-join changes."
[message.translations]
simplified_chinese = "把切换间隔设为 0 就会停止定时切换，队列留给手动切换或进图时使用。"
traditional_chinese = "把切換間隔設為 0 就會停止定時切換，佇列留給手動切換或進圖時使用。"
japanese = "切り替え間隔を 0 にすると時間での切り替えが止まり、キューは手動やマップ参加時の変更に使えます。"
korean = "전환 간격을 0으로 두면 시간에 따른 전환이 멈추고, 대기열은 수동 전환이나 맵 입장 시에만 쓰입니다."
russian = "Поставьте Интервал смены на 0, чтобы отключить смену по таймеру; очередь останется для смены вручную или при входе на карту."
german = "Setze Wechselintervall auf 0, um das zeitgesteuerte Wechseln zu stoppen; die Warteschlange bleibt für manuelle Wechsel oder den Kartenbeitritt."
spanish = "Pon el intervalo de cambio en 0 para detener el cambio por tiempo y dejar la cola para cambios manuales o al entrar al mapa."
french = "Mets l'intervalle de changement à 0 pour couper le changement minuté et garder la file pour les changements manuels ou à l'entrée sur une map."
brazilian_portuguese = "Deixe o intervalo de troca em 0 para parar a troca por tempo e manter a fila só para trocas manuais ou ao entrar no mapa."
portuguese = "Deixa o intervalo de mudança em 0 para parar a mudança por tempo e manter a fila só para mudanças manuais ou ao entrar no mapa."
turkish = "Değiştirme aralığını 0 yapmak zamanlı değişimi durdurur; sıra yalnızca elle ya da haritaya girişte kullanılır."
polish = "Ustaw interwał zmiany na 0, by wyłączyć zmianę czasową; kolejka zostanie do zmian ręcznych lub przy wejściu na mapę."

[[message]]
key = "Colors a halo around each tee by its race team, so teammates and opponents are easy to tell apart."
[message.translations]
simplified_chinese = "按竞速队伍给每个 Tee 画一圈彩色光晕，方便分清队友和对手。"
traditional_chinese = "按競速隊伍給每個 Tee 畫一圈彩色光暈，方便分清隊友和對手。"
japanese = "チームごとに各 Tee の周囲に光輪を色付けし、味方と相手を見分けやすくします。"
korean = "경주 팀별로 각 Tee 주위에 색깔 후광을 그려 아군과 상대를 쉽게 구분하게 합니다."
russian = "Окрашивает ореол вокруг каждого Tee по его команде в гонке, чтобы легко отличать союзников от соперников."
german = "Färbt einen Halo um jeden Tee nach seinem Rennteam, damit Verbündete und Gegner leicht zu unterscheiden sind."
spanish = "Colorea un halo alrededor de cada Tee según su equipo de carrera, para distinguir compañeros y rivales."
french = "Colore un halo autour de chaque Tee selon son équipe de course, pour distinguer alliés et adversaires."
brazilian_portuguese = "Colore um halo em volta de cada Tee conforme o time de corrida, para separar colegas e adversários."
portuguese = "Colore um halo à volta de cada Tee conforme a equipa de corrida, para distinguir colegas de adversários."
turkish = "Her Tee'nin çevresini yarış takımına göre renklendirir, böylece takım arkadaşlarıyla rakipleri kolayca ayırırsın."
polish = "Koloruje poświatę wokół każdego Tee według drużyny wyścigu, by łatwo odróżnić sojuszników od rywali."

[[message]]
key = "Turn on \"Team tee glow\", then set \"Team tee glow intensity\" and \"Team tee glow halo size\"; \"Team 0 glow\" handles players without a team."
[message.translations]
simplified_chinese = "打开队伍 Tee 发光，再设队伍 Tee 发光强度和队伍 Tee 光晕大小；队伍 0 发光负责没有队伍的玩家。"
traditional_chinese = "打開隊伍 Tee 發光，再設隊伍 Tee 發光強度和隊伍 Tee 光暈大小；隊伍 0 發光負責沒有隊伍的玩家。"
japanese = "チーム Tee の発光をオンにし、チーム Tee の発光強度と光輪サイズを設定します。チーム 0 のグローはチームなしのプレイヤーを扱います。"
korean = "팀 Tee 발광을 켜고 팀 Tee 발광 강도와 팀 Tee 후광 크기를 설정하세요. 팀 0 발광은 팀이 없는 플레이어를 담당합니다."
russian = "Включите Свечение Tee команды и задайте интенсивность свечения и размер ореола; Свечение команды 0 отвечает за игроков без команды."
german = "Schalte Team-Tee-Glühen ein und stelle Leuchtstärke und Halo-Größe ein; Team-0-Glühen deckt Spieler ohne Team ab."
spanish = "Activa el brillo de los Tees del equipo y ajusta intensidad y tamaño del halo; el brillo del equipo 0 cubre a quien no tiene equipo."
french = "Active la lueur des Tees d'équipe, puis règle intensité et taille du halo ; la lueur de l'équipe 0 gère les joueurs sans équipe."
brazilian_portuguese = "Ative o brilho dos Tees da equipe e ajuste intensidade e tamanho do halo; o brilho da equipe 0 cuida de quem está sem equipe."
portuguese = "Ativa o brilho dos Tees da equipa e ajusta intensidade e tamanho do halo; o brilho da equipa 0 trata de quem está sem equipa."
turkish = "Takım Tee parlamasını aç, sonra takım Tee parlama yoğunluğunu ve hale boyutunu ayarla; takımsız oyuncuları Takım 0 parlaması kapsar."
polish = "Włącz Poświatę Tee drużyny, ustaw intensywność poświaty i rozmiar aureoli; Poświata drużyny 0 obsługuje graczy bez drużyny."

[[message]]
key = "A big \"Team tee glow halo size\" can wash out outlines and map detail, so start low and raise it slowly."
[message.translations]
simplified_chinese = "光晕太大会把描边和地图细节冲淡，先调小再慢慢加大。"
traditional_chinese = "光暈太大會把描邊和地圖細節沖淡，先調小再慢慢加大。"
japanese = "光輪サイズを大きくすると輪郭やマップの細部が飛ぶので、小さめから少しずつ上げてください。"
korean = "후광 크기가 크면 윤곽선과 맵 세부가 흐려지니 작게 시작해 천천히 올리세요."
russian = "Большой размер ореола размывает контуры и детали карты, поэтому начинайте с малого и повышайте постепенно."
german = "Eine große Halo-Größe überstrahlt Umrisse und Kartendetails; starte klein und erhöhe langsam."
spanish = "Un halo grande difumina contornos y detalles del mapa, así que empieza bajo y súbelo poco a poco."
french = "Un halo trop grand efface les contours et les détails de la map ; commence bas et augmente doucement."
brazilian_portuguese = "Um halo grande apaga contornos e detalhes do mapa, então comece baixo e aumente aos poucos."
portuguese = "Um halo grande apaga contornos e detalhes do mapa, por isso começa baixo e aumenta devagar."
turkish = "Büyük hale, dış çizgileri ve harita ayrıntılarını boğar; düşük başlayıp yavaşça artır."
polish = "Duża aureola zlewa obrysy i szczegóły mapy, więc zacznij od małej i zwiększaj powoli."

[[message]]
key = "Toggles the dynamic camera, its smoothing, and automatic weapon switching on pickup or when out of ammo."
[message.translations]
simplified_chinese = "开关动态视野、它的平滑效果，以及拾取武器或没子弹时自动换枪。"
traditional_chinese = "開關動態視野、它的平滑效果，以及拾取武器或沒子彈時自動換槍。"
japanese = "ダイナミックカメラとその平滑化、武器を拾ったときや弾切れのときの自動持ち替えを切り替えます。"
korean = "다이나믹 카메라와 그 부드러움, 무기를 주웠을 때나 탄이 떨어졌을 때 자동 전환을 켜고 끕니다."
russian = "Включает и выключает динамическую камеру, её сглаживание и автосмену оружия при подборе или без патронов."
german = "Schaltet die dynamische Kamera, deren Glättung und den automatischen Waffenwechsel beim Aufheben oder bei leerer Munition um."
spanish = "Activa o desactiva la cámara dinámica, su suavizado y el cambio automático de arma al recoger una o al quedarte sin munición."
french = "Active ou coupe la caméra dynamique, son lissage et le changement d'arme automatique au ramassage ou quand tu n'as plus de munitions."
brazilian_portuguese = "Liga e desliga a câmera dinâmica, seu suavizamento e a troca automática de arma ao pegar uma ou ao ficar sem munição."
portuguese = "Liga e desliga a câmara dinâmica, o seu suavizamento e a troca automática de arma ao apanhar uma ou ao ficar sem munições."
turkish = "Dinamik kamerayı, yumuşatmasını ve silahı aldığında ya da mermin bitince otomatik geçişi açar veya kapatır."
polish = "Włącza i wyłącza dynamiczną kamerę, jej wygładzanie oraz automatyczną zmianę broni przy podniesieniu lub braku amunicji."

[[message]]
key = "Tick \"Dynamic Camera\" to turn it on; \"Smooth Dynamic Camera\" adds glide to its movement, and the weapon switches are separate rows below."
[message.translations]
simplified_chinese = "勾上动态视野即可开启；平滑动态视野让镜头移动更顺滑，武器切换则是下面各自独立的行。"
traditional_chinese = "勾上動態視野即可開啟；平滑動態視野讓鏡頭移動更順滑，武器切換則是下面各自獨立的列。"
japanese = "ダイナミックカメラにチェックを入れると有効になります。ダイナミックカメラの平滑化は動きに滑らかさを加え、武器の切り替えは下の独立した行です。"
korean = "다이나믹 카메라를 체크하면 켜집니다. 부드러운 다이나믹 카메라는 움직임에 미끄러짐을 더하고, 무기 전환은 아래에 따로 있는 행입니다."
russian = "Поставьте галочку на Динамическая камера, чтобы включить её; Сглаживание динамической камеры добавляет плавность, а переключатели оружия — отдельные строки ниже."
german = "Setze den Haken bei Dynamische Kamera; Dynamische Kamera glätten macht die Bewegung weich, die Waffenwechsel sind eigene Zeilen darunter."
spanish = "Marca Cámara dinámica para activarla; la cámara dinámica suave añade deslizamiento y los cambios de arma son filas aparte debajo."
french = "Coche Caméra dynamique pour l'activer ; le lissage de la caméra dynamique adoucit ses mouvements, et les changements d'arme sont des lignes séparées en dessous."
brazilian_portuguese = "Marque Câmera dinâmica para ativá-la; a câmera dinâmica suave deixa o movimento deslizante, e as trocas de arma são linhas separadas abaixo."
portuguese = "Marca Câmara Dinâmica para a ativar; a câmara dinâmica suave torna o movimento deslizante, e as trocas de arma são linhas separadas abaixo."
turkish = "Dinamik Kamera seçeneğini işaretleyerek aç; dinamik kamerayı yumuşatma harekete kayma katar, silah geçişleri ise altta ayrı satırlardır."
polish = "Zaznacz Dynamiczna kamera, by ją włączyć; wygładzanie dynamicznej kamery dodaje płynności, a przełączniki broni to osobne wiersze poniżej."

[[message]]
key = "\"Switch weapon on pickup\" grabs whatever you walk over, which can override the weapon you wanted to keep."
[message.translations]
simplified_chinese = "拾取武器时自动装备会抓走你踩到的任何枪，可能把你本想留着的武器换掉。"
traditional_chinese = "拾取武器時自動裝備會抓走你踩到的任何槍，可能把你本想留著的武器換掉。"
japanese = "拾得時に武器を自動装備は踏んだ武器を何でも拾うので、残しておきたい武器が切り替わることがあります。"
korean = "획득 시 무기 자동 장착은 밟고 지나가는 무기를 모두 집어, 남겨 두고 싶은 무기를 바꿔 버릴 수 있습니다."
russian = "Переключать оружие при подборе хватает всё, на что вы наступаете, и может заменить оружие, которое вы хотели сохранить."
german = "Waffe beim Aufheben wechseln nimmt alles auf, worüber du läufst, und kann die gewünschte Waffe ersetzen."
spanish = "Cambiar arma al recoger toma cualquier arma que pises y puede quitarte la que querías conservar."
french = "Changer d'arme lors de la récupération prend tout ce que tu traverses et peut remplacer l'arme que tu voulais garder."
brazilian_portuguese = "Trocar arma ao pegar apanha qualquer arma em que você passar e pode substituir a que queria manter."
portuguese = "Trocar arma ao apanhar apanha qualquer arma por onde passares e pode substituir a que querias manter."
turkish = "Aldığında silahı değiştir üstünden geçtiğin her silahı alır ve saklamak istediğin silahı değiştirebilir."
polish = "Przełącz broń po podniesieniu bierze każdą broń, na którą wejdziesz, i może podmienić tę, którą chciałeś zachować."

[[message]]
key = "Sets the client update rate, whether the main menu is skipped, and opens the folders for settings, saves and themes."
[message.translations]
simplified_chinese = "设置客户端刷新率、是否跳过主菜单，并打开设置、存档和主题所在目录。"
traditional_chinese = "設定客戶端刷新率、是否跳過主選單，並打開設定、存檔和主題所在目錄。"
japanese = "クライアントの更新レート、メインメニューをスキップするかを設定し、設定、セーブ、テーマのフォルダーを開けます。"
korean = "클라이언트 업데이트 속도, 메인 메뉴 건너뛰기 여부를 설정하고 설정, 저장, 테마 폴더를 엽니다."
russian = "Задаёт частоту обновления клиента, пропуск главного меню, а также открывает папки настроек, сохранений и тем."
german = "Legt die Aktualisierungsrate des Clients und das Überspringen des Hauptmenüs fest und öffnet die Ordner für Einstellungen, Spielstände und Themes."
spanish = "Ajusta la tasa de actualización del cliente, si se salta el menú principal y abre las carpetas de ajustes, partidas guardadas y temas."
french = "Règle le taux de rafraîchissement du client, le saut du menu principal et ouvre les dossiers des paramètres, sauvegardes et thèmes."
brazilian_portuguese = "Define a taxa de atualização do cliente, se o menu principal é pulado e abre as pastas de configurações, saves e temas."
portuguese = "Define a taxa de atualização do cliente, se o menu principal é saltado e abre as pastas de definições, gravações e temas."
turkish = "İstemci güncelleme hızını, ana menünün atlanıp atlanmayacağını ayarlar ve ayarlar, kayıtlar ve temalar klasörlerini açar."
polish = "Ustawia częstotliwość odświeżania klienta, pomijanie menu głównego i otwiera foldery ustawień, zapisów oraz motywów."

[[message]]
key = "Change \"Update Rate\" in Hz, tick \"Skip the main menu\", and use \"Settings file\" or \"Themes directory\" to open those locations."
[message.translations]
simplified_chinese = "以 Hz 为单位修改客户端刷新率，勾选跳过主菜单，用设置文件或主题目录打开对应位置。"
traditional_chinese = "以 Hz 為單位修改客戶端刷新率，勾選跳過主選單，用設定檔或主題目錄打開對應位置。"
japanese = "更新レートを Hz 単位で変更し、メインメニューをスキップにチェックを入れ、設定ファイルやテーマディレクトリで各場所を開けます。"
korean = "업데이트 속도를 Hz 단위로 바꾸고, 메인 메뉴 건너뛰기를 체크하며, 설정 파일이나 테마 디렉터리로 해당 위치를 엽니다."
russian = "Меняйте частоту обновления в Hz, отметьте Пропустить главное меню и открывайте места через Файл настроек или Папку тем."
german = "Ändere die Aktualisierungsrate in Hz, setze den Haken bei Hauptmenü überspringen und öffne die Orte über Einstellungsdatei oder Theme-Verzeichnis."
spanish = "Cambia la tasa de actualización en Hz, marca Saltar el menú principal y abre esas ubicaciones con Archivo de configuración o Directorio de temas."
french = "Modifie le taux de rafraîchissement en Hz, coche Passer le menu principal et ouvre ces emplacements via Fichier de paramètres ou Répertoire des thèmes."
brazilian_portuguese = "Mude a taxa de atualização em Hz, marque Pular o menu principal e abra esses locais por Arquivo de configurações ou Diretório de temas."
portuguese = "Muda a taxa de atualização em Hz, marca Saltar o menu principal e abre esses locais através de Ficheiro de definições ou Diretório de temas."
turkish = "Güncelleme Hızını Hz olarak değiştir, Ana menüyü atla seçeneğini işaretle ve bu konumları Ayarlar dosyası ya da Temalar dizini ile aç."
polish = "Zmień Częstotliwość odświeżania w Hz, zaznacz Pomiń menu główne i otwieraj te miejsca przez Plik ustawień lub Katalog motywów."

[[message]]
key = "\"Save power by lowering update rate (higher input latency)\" adds input delay, so keep it off while racing."
[message.translations]
simplified_chinese = "降低刷新率省电（输入延迟更高）会让输入更迟钝，跑图时保持关闭。"
traditional_chinese = "降低刷新率省電（輸入延遲更高）會讓輸入更遲鈍，跑圖時保持關閉。"
japanese = "更新レートを下げる省電力設定は入力遅延を増やすので、走るときはオフにしてください。"
korean = "업데이트 속도를 낮추는 전력 절약(입력 지연 증가)은 입력 지연을 더하니, 달릴 때는 꺼 두세요."
russian = "Экономия энергии за счёт снижения частоты (выше задержка ввода) добавляет задержку, поэтому во время гонки держите её выключенной."
german = "Energie sparen durch niedrigere Aktualisierungsrate (mehr Eingabelatenz) bringt Verzögerung; lass es beim Racen aus."
spanish = "Ahorrar energía bajando la tasa de actualización (más latencia de entrada) añade retardo, así que déjalo desactivado al correr."
french = "Économiser l'énergie en baissant le taux de rafraîchissement (latence d'entrée plus élevée) ajoute du délai ; laisse-le désactivé en course."
brazilian_portuguese = "Economizar energia baixando a taxa de atualização (latência de entrada maior) adiciona atraso, então deixe desligado nas corridas."
portuguese = "Poupar energia baixando a taxa de atualização (maior latência de entrada) acrescenta atraso, por isso deixa desligado nas corridas."
turkish = "Güncelleme hızını düşürerek enerji tasarrufu (giriş gecikmesi artar) ek gecikme getirir, yarışırken kapalı tut."
polish = "Oszczędzanie energii przez niższą częstotliwość (większe opóźnienie wejścia) dodaje opóźnienie, więc trzymaj to wyłączone podczas wyścigów."

[[message]]
key = "Mouse speed for aiming and for menus, and how far your cursor may travel from the tee."
[message.translations]
simplified_chinese = "瞄准和菜单用的鼠标速度，以及光标离 tee 最远能走多远。"
traditional_chinese = "瞄準和選單用的滑鼠速度，以及游標離 tee 最遠能走多遠。"
japanese = "エイム用とメニュー用のマウス速度、そしてカーソルが tee からどれだけ離れられるかを決めます。"
korean = "조준과 메뉴에 쓰는 마우스 속도, 그리고 커서가 tee에서 얼마나 멀어질 수 있는지를 정합니다."
russian = "Скорость мыши для прицеливания и меню, а также предельное удаление курсора от tee."
german = "Mausgeschwindigkeit für Zielen und Menüs und wie weit der Cursor sich vom Tee entfernen darf."
spanish = "Velocidad del ratón para apuntar y para los menús, y hasta dónde puede alejarse el cursor del tee."
french = "Vitesse de la souris pour viser et pour les menus, et distance maximale du curseur par rapport au tee."
brazilian_portuguese = "Velocidade do mouse para mirar e para os menus, e até onde o cursor pode se afastar do tee."
portuguese = "Velocidade do rato para apontar e para os menus, e até onde o cursor se pode afastar do tee."
turkish = "Nişan alma ve menüler için fare hızı, ayrıca imlecin tee'den ne kadar uzaklaşabileceği."
polish = "Prędkość myszy do celowania i menu oraz to, jak daleko kursor może odejść od tee."

[[message]]
key = "Set \"Ingame mouse sens.\" for aiming and \"UI mouse sens.\" for menus, then limit the cursor with \"Minimum cursor distance\" and \"Maximum cursor distance\"."
[message.translations]
simplified_chinese = "瞄准用游戏内鼠标灵敏度，菜单用鼠标灵敏度（界面），再用最小光标距离和最大光标距离限制光标位置。"
traditional_chinese = "瞄準用遊戲內鼠標靈敏度，選單用鼠標靈敏度（界面），再用最小光標距離和最大光標距離限制光標位置。"
japanese = "エイムはゲーム内マウス感度、メニューは UI マウス感度で設定し、最小カーソル距離と最大カーソル距離でカーソルの位置を制限します。"
korean = "조준은 게임 내 마우스 감도, 메뉴는 UI 마우스 감도로 설정한 뒤 최소 커서 거리와 최대 커서 거리로 커서 위치를 제한합니다."
russian = "Для прицеливания задайте чувствительность мыши (игра), для меню — чувств. мыши UI, а затем ограничьте курсор минимальным и максимальным расстоянием курсора."
german = "Stelle für das Zielen die Maus-Empfindlichkeit (Spiel) und für Menüs die UI-Mausempfindl. ein und begrenze den Cursor dann mit minimaler und maximaler Cursordistanz."
spanish = "Ajusta la sensibilidad del ratón en el juego para apuntar y la sens. ratón UI para los menús, y limita el cursor con la distancia mínima y máxima del cursor."
french = "Règle la sensibilité souris (jeu) pour viser et la sens. souris UI pour les menus, puis limite le curseur avec la distance minimale et maximale du curseur."
brazilian_portuguese = "Ajuste a sensibilidade do mouse no jogo para mirar e a sensibilidade do mouse na interface para os menus, depois limite o cursor com a distância mínima e máxima do cursor."
portuguese = "Ajusta a sensibilidade do rato no jogo para apontar e a sensibilidade do rato na IU para os menus, depois limita o cursor com a distância mínima e máxima do cursor."
turkish = "Nişan için oyunda fare hassasiyetini, menüler için arayüz fare hassasiyetini ayarla; ardından minimum ve maksimum imleç mesafesiyle imleci sınırla."
polish = "Do celowania ustaw czułość myszy (w grze), do menu czułość myszy (interfejs), a potem ogranicz kursor minimalną i maksymalną odległością kursora."

[[message]]
key = "\"Ingame mouse sens.\" changes your aim, so adjust it in small steps and test it on a warm-up map."
[message.translations]
simplified_chinese = "游戏内鼠标灵敏度会直接影响瞄准，一次只改一点，然后去热身图里试。"
traditional_chinese = "遊戲內鼠標靈敏度會直接影響瞄準，一次只改一點，然後去熱身圖裡試。"
japanese = "ゲーム内マウス感度はエイムに直結するので、少しずつ変えてウォームアップ用マップで試してください。"
korean = "게임 내 마우스 감도는 조준에 바로 영향을 주니 조금씩 바꾸고 워밍업 맵에서 시험해 보세요."
russian = "Чувствительность мыши (игра) напрямую меняет прицел, поэтому правьте её мелкими шагами и проверяйте на разминочной карте."
german = "Die Maus-Empfindlichkeit (Spiel) verändert dein Zielen, also ändere sie in kleinen Schritten und teste sie auf einer Aufwärmkarte."
spanish = "La sensibilidad del ratón en el juego cambia tu puntería, así que ajústala poco a poco y pruébala en un mapa de calentamiento."
french = "La sensibilité souris (jeu) change ta visée : ajuste-la par petits pas et teste-la sur une map d'échauffement."
brazilian_portuguese = "A sensibilidade do mouse no jogo muda sua mira, então ajuste em passos pequenos e teste em um mapa de aquecimento."
portuguese = "A sensibilidade do rato no jogo muda a tua pontaria, por isso ajusta-a em passos pequenos e testa num mapa de aquecimento."
turkish = "Oyunda fare hassasiyeti nişanını değiştirir; küçük adımlarla ayarla ve ısınma haritasında dene."
polish = "Czułość myszy (w grze) zmienia celowanie, więc zmieniaj ją małymi krokami i testuj na mapie rozgrzewkowej."

[[message]]
key = "Turns controller input on and maps stick axes to aiming, with speed settings for play and for menus."
[message.translations]
simplified_chinese = "开启手柄输入，把摇杆轴映射到瞄准，并提供游戏和菜单两套速度设置。"
traditional_chinese = "開啟手柄輸入，把搖桿軸對應到瞄準，並提供遊戲和選單兩套速度設定。"
japanese = "コントローラー入力を有効にし、スティックの軸をエイムに割り当てます。プレイ用とメニュー用の速度設定があります。"
korean = "컨트롤러 입력을 켜고 스틱 축을 조준에 연결하며, 플레이와 메뉴 각각의 속도 설정을 제공합니다."
russian = "Включает ввод с контроллера и привязывает оси стика к прицеливанию, с отдельными скоростями для игры и меню."
german = "Aktiviert die Controller-Eingabe und bindet Stick-Achsen ans Zielen, mit Geschwindigkeiten für Spiel und Menüs."
spanish = "Activa la entrada del mando y asigna los ejes del stick al apuntado, con velocidad propia para el juego y los menús."
french = "Active la manette et associe les axes du stick à la visée, avec des réglages de vitesse pour le jeu et les menus."
brazilian_portuguese = "Ativa a entrada do controle e mapeia os eixos do analógico para a mira, com velocidades para o jogo e os menus."
portuguese = "Ativa a entrada do comando e associa os eixos do manípulo à pontaria, com velocidades para o jogo e os menus."
turkish = "Kumanda girişini açar ve çubuk eksenlerini nişana bağlar; oyun ve menüler için ayrı hız ayarları sunar."
polish = "Włącza obsługę kontrolera i przypisuje osie drążka do celowania, z osobną prędkością dla gry i menu."

[[message]]
key = "Turn on \"Enable controller\", choose the device, pick \"Relative\" or \"Absolute\" under \"Ingame controller mode\", then tick the axes you want under \"Aim bind\"."
[message.translations]
simplified_chinese = "打开启用控制器并选好设备，在游戏内手柄瞄准模式里选相对或绝对，再在操作轴绑定里勾选需要的轴。"
traditional_chinese = "開啟使用手柄並選好裝置，在遊戲內手柄瞄準模式裡選相對或絕對，再在操作軸綁定裡勾選需要的軸。"
japanese = "コントローラーを有効にして機器を選び、ゲーム内コントローラーモードで相対か絶対を選び、エイムバインドで使う軸にチェックを入れます。"
korean = "컨트롤러 사용을 켜고 장치를 고른 뒤, 게임 내 컨트롤러 모드에서 상대 또는 절대를 선택하고 조준 바인드에서 원하는 축을 체크합니다."
russian = "Включите контроллер, выберите устройство, укажите относительный или абсолютный в режиме контроллера в игре и отметьте нужные оси в привязке оси."
german = "Schalte Controller aktivieren ein, wähle das Gerät, stelle im Controller-Modus im Spiel auf relativ oder absolut und setze dann bei Ziel-Bindung die Häkchen für die Achsen."
spanish = "Marca Habilitar mando, elige el dispositivo, selecciona relativo o absoluto en Modo de mando en el juego y marca los ejes que quieras en Asignación de apuntado."
french = "Mets Activer la manette sur oui, choisis l'appareil, sélectionne relatif ou absolu dans Mode manette en jeu, puis coche les axes voulus dans Touche de visée."
brazilian_portuguese = "Ative Ativar controle, escolha o dispositivo, selecione relativo ou absoluto em Modo de controle no jogo e marque os eixos desejados em Bind de mira."
portuguese = "Ativa Ativar comando, escolhe o dispositivo, seleciona relativo ou absoluto em Modo de comando no jogo e marca os eixos que queres em Bind de mira."
turkish = "Kumandayı etkinleştir seçeneğini aç, aygıtı seç, oyunda kumanda modu altında göreli ya da mutlak seç ve nişan alma tuşu bölümünde istediğin eksenleri işaretle."
polish = "Włącz opcję Włącz kontroler, wybierz urządzenie, ustaw względny lub bezwzględny w trybie kontrolera w grze, a potem zaznacz osie w wiązaniu celowania."

[[message]]
key = "\"Absolute\" aims at a fixed point and hides the speed setting, so pick \"Relative\" if you want to tune it."
[message.translations]
simplified_chinese = "绝对模式按固定点瞄准，会隐藏速度设置；想调速度就选相对。"
traditional_chinese = "絕對模式按固定點瞄準，會隱藏速度設定；想調速度就選相對。"
japanese = "絶対は固定点を狙う方式で速度設定が隠れるので、速度を調整したいなら相対を選んでください。"
korean = "절대는 고정 지점을 조준하고 속도 설정을 숨기니, 속도를 조정하려면 상대를 선택하세요."
russian = "Абсолютный режим целится в фиксированную точку и скрывает настройку скорости, так что для тонкой подстройки выбирайте относительный."
german = "Absolut zielt auf einen festen Punkt und blendet die Geschwindigkeit aus; nimm relativ, wenn du sie fein einstellen willst."
spanish = "El modo absoluto apunta a un punto fijo y oculta la velocidad; elige relativo si quieres ajustarla."
french = "Le mode absolu vise un point fixe et masque le réglage de vitesse ; choisis relatif si tu veux l'ajuster."
brazilian_portuguese = "O modo absoluto mira em um ponto fixo e esconde a velocidade; escolha relativo se quiser ajustá-la."
portuguese = "O modo absoluto aponta para um ponto fixo e esconde a velocidade; escolhe relativo se quiseres ajustá-la."
turkish = "Mutlak, sabit bir noktaya nişan alır ve hız ayarını gizler; hızı ayarlamak istiyorsan göreli seç."
polish = "Tryb bezwzględny celuje w stały punkt i ukrywa ustawienie prędkości, więc jeśli chcesz ją dostroić, wybierz względny."

[[message]]
key = "Keys for moving, jumping, firing and hooking, plus camera zoom and visibility shortcuts."
[message.translations]
simplified_chinese = "移动、跳跃、开火和钩索的按键，还有镜头缩放和显示相关的快捷键。"
traditional_chinese = "移動、跳躍、開火和鉤索的按鍵，還有鏡頭縮放和顯示相關的快捷鍵。"
japanese = "移動、ジャンプ、射撃、フックのキーに加え、カメラズームと表示まわりのショートカット。"
korean = "이동, 점프, 발사, 갈고리 키와 카메라 줌, 표시 관련 단축키입니다."
russian = "Клавиши движения, прыжка, стрельбы и крюка, а также масштаб камеры и переключатели отображения."
german = "Tasten für Bewegen, Springen, Schießen und Haken sowie Kamera-Zoom und Sichtbarkeits-Kürzel."
spanish = "Teclas para moverte, saltar, disparar y usar el gancho, más el zoom de cámara y atajos de visibilidad."
french = "Touches pour se déplacer, sauter, tirer et crocheter, plus le zoom caméra et les raccourcis d'affichage."
brazilian_portuguese = "Teclas para mover, pular, atirar e usar o gancho, além do zoom da câmera e atalhos de visibilidade."
portuguese = "Teclas para mover, saltar, disparar e usar o gancho, além do zoom da câmara e atalhos de visibilidade."
turkish = "Hareket, zıplama, ateş etme ve kanca tuşlarının yanı sıra kamera yakınlaştırma ve görünürlük kısayolları."
polish = "Klawisze ruchu, skoku, strzału i haka oraz zoom kamery i skróty widoczności."

[[message]]
key = "Click the key field next to an action such as \"Jump\" or \"Hook\" and press the key you want; a waiting field takes your next key."
[message.translations]
simplified_chinese = "点跳跃或钩索这类动作旁边的按键栏，再按下想用的键；处于等待状态的按键栏会接收你下一个按键。"
traditional_chinese = "點跳躍或鉤索這類動作旁邊的按鍵欄，再按下想用的鍵；處於等待狀態的按鍵欄會接收你下一個按鍵。"
japanese = "ジャンプやフックなどの動作の横にあるキー欄をクリックし、使いたいキーを押します。待機中の欄は次のキー入力を受け付けます。"
korean = "점프나 갈고리 같은 동작 옆의 키 칸을 클릭하고 원하는 키를 누르세요. 대기 중인 칸은 다음 키 입력을 받습니다."
russian = "Щёлкните поле клавиши рядом с действием вроде прыжка или крюка и нажмите нужную клавишу: ожидающее поле примет следующее нажатие."
german = "Klicke das Tastenfeld neben einer Aktion wie Springen oder Haken an und drücke die gewünschte Taste; ein wartendes Feld übernimmt die nächste Taste."
spanish = "Haz clic en el campo de tecla junto a una acción como Saltar o Gancho y pulsa la tecla que quieras; un campo en espera toma tu siguiente tecla."
french = "Clique sur le champ de touche à côté d'une action comme Sauter ou Crochet et appuie sur la touche voulue ; un champ en attente prend la touche suivante."
brazilian_portuguese = "Clique no campo de tecla ao lado de uma ação como Pular ou Gancho e pressione a tecla desejada; um campo em espera recebe a próxima tecla."
portuguese = "Clica no campo da tecla ao lado de uma ação como Saltar ou Gancho e prime a tecla que queres; um campo em espera recebe a próxima tecla."
turkish = "Zıpla veya Kanca gibi bir eylemin yanındaki tuş alanına tıkla ve istediğin tuşa bas; bekleyen alan bir sonraki tuşu alır."
polish = "Kliknij pole klawisza obok akcji takiej jak Skok czy Hak i naciśnij wybrany klawisz; oczekujące pole przyjmie następny klawisz."

[[message]]
key = "A key you assign here replaces whatever action used it before, so check your other keys after changing one."
[message.translations]
simplified_chinese = "这里绑定的键会顶掉之前占用它的动作，所以改完一个键记得回头检查其他按键。"
traditional_chinese = "這裡綁定的鍵會頂掉之前佔用它的動作，所以改完一個鍵記得回頭檢查其他按鍵。"
japanese = "ここで割り当てたキーは、それまでそのキーを使っていた動作から外れます。変更したら他のキーも確認してください。"
korean = "여기서 지정한 키는 이전에 그 키를 쓰던 동작에서 빠지므로, 하나를 바꾸면 다른 키도 확인하세요."
russian = "Назначенная здесь клавиша отнимается у действия, которое использовало её раньше, поэтому после замены проверьте остальные клавиши."
german = "Eine hier zugewiesene Taste verliert die Aktion, die sie vorher nutzte; prüfe nach dem Ändern also deine übrigen Tasten."
spanish = "La tecla que asignes aquí se quita de la acción que la usaba antes, así que revisa tus otras teclas tras cambiar una."
french = "La touche assignée ici est retirée à l'action qui l'utilisait avant : vérifie tes autres touches après un changement."
brazilian_portuguese = "A tecla atribuída aqui é retirada da ação que a usava antes, então confira as outras teclas depois de trocar uma."
portuguese = "A tecla atribuída aqui é retirada à ação que a usava antes, por isso verifica as outras teclas depois de trocar uma."
turkish = "Burada atadığın tuş, onu daha önce kullanan eylemden alınır; birini değiştirdikten sonra diğer tuşları kontrol et."
polish = "Klawisz przypisany tutaj zostaje odebrany akcji, która używała go wcześniej, więc po zmianie sprawdź pozostałe klawisze."

[[message]]
key = "Keys that select each weapon and step to the next or previous one."
[message.translations]
simplified_chinese = "选择每种武器的按键，以及切换到下一件或上一件武器的按键。"
traditional_chinese = "選擇每種武器的按鍵，以及切換到下一件或上一件武器的按鍵。"
japanese = "各武器を選ぶキーと、次・前の武器に切り替えるキー。"
korean = "각 무기를 고르는 키와 다음 또는 이전 무기로 넘어가는 키입니다."
russian = "Клавиши выбора оружия и перехода к следующему или предыдущему."
german = "Tasten zum Auswählen der Waffen und zum Wechseln zur nächsten oder vorigen."
spanish = "Teclas que eligen cada arma y pasan a la siguiente o a la anterior."
french = "Touches qui choisissent chaque arme et passent à la suivante ou à la précédente."
brazilian_portuguese = "Teclas que selecionam cada arma e passam para a próxima ou a anterior."
