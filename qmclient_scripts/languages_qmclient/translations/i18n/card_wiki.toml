polish = "Klawisze wybierające każdą broń i przełączające na następną lub poprzednią."

[[message]]
key = "Click the key field beside \"Hammer\", \"Pistol\", \"Shotgun\" or \"Next weapon\" and press the key you want to use."
[message.translations]
simplified_chinese = "点锤子、手枪、霰弹枪或下一个武器旁边的按键栏，按下想用的键。"
traditional_chinese = "點錘子、手槍、霰彈槍或下一個武器旁邊的按鍵欄，按下想用的鍵。"
