# 卡片 Wiki（设置卡片标题栏 ⓘ 打开的三段式说明）
# 维护源：qmclient_scripts/languages_qmclient/translations/i18n/card_wiki.toml
# 运行时产物由 generate_all.py 生成，不手改 data/languages/*.txt。
# 文案内的界面控件名按实际 UI 术语翻译，避免与卡片里的标签对不上。

[[message]]
key = "Camera effects for gameplay: camera drift, speed-based FOV, instant zoom reverse, UI scale and a fixed aspect ratio."
[message.translations]
simplified_chinese = "游戏内的镜头效果：镜头漂移、随速度变化的 FOV、即时开镜反转、界面缩放和固定宽高比。"
traditional_chinese = "遊戲內的鏡頭效果：鏡頭漂移、隨速度變化的 FOV、即時開鏡反轉、介面縮放和固定長寬比。"
japanese = "ゲーム内のカメラ効果：カメラドリフト、速度に応じたFOV、即時ズーム反転、UIスケール、固定アスペクト比。"
korean = "게임 내 카메라 효과: 카메라 드리프트, 속도 기반 FOV, 즉시 줌 반전, UI 배율, 고정 화면 비율."
russian = "Эффекты камеры в игре: дрейф камеры, FOV в зависимости от скорости, мгновенный обратный зум, масштаб интерфейса и фиксированное соотношение сторон."
german = "Kameraeffekte im Spiel: Kamera-Drift, geschwindigkeitsabhängiges FOV, sofortiges Zoom-Umkehren, UI-Skalierung und ein festes Seitenverhältnis."
spanish = "Efectos de cámara: deriva de la cámara, FOV según la velocidad, inversión instantánea del zoom, escala de la interfaz y una relación de aspecto fija."
french = "Effets de caméra : dérive de caméra, FOV selon la vitesse, inversion instantanée du zoom, échelle de l'interface et un rapport d'aspect fixe."
brazilian_portuguese = "Efeitos de câmera: deriva da câmera, FOV conforme a velocidade, inversão instantânea do zoom, escala da interface e uma proporção fixa."
portuguese = "Efeitos de câmara: deriva da câmara, FOV conforme a velocidade, inversão instantânea do zoom, escala da interface e uma proporção fixa."
turkish = "Oyun içi kamera efektleri: kamera sürüklenmesi, hıza bağlı FOV, anlık zoom tersine çevirme, arayüz ölçeği ve sabit en-boy oranı."
polish = "Efekty kamery w grze: dryf kamery, FOV zależne od prędkości, natychmiastowe odwrócenie zoomu, skala interfejsu i stały współczynnik proporcji."

[[message]]
key = "Turn on \"Enable camera drift\" or \"Enable dynamic FOV\", then tune \"Drift intensity\" and \"Dynamic FOV intensity\"; use \"Aspect ratio preset\" to force a view shape."
[message.translations]
simplified_chinese = "打开镜头漂移或动态 FOV 后，才会出现对应的强度与平滑度滑条；用宽高比预设固定画面形状，选自定义可自己填比例。"
traditional_chinese = "開啟鏡頭漂移或動態 FOV 後，才會出現對應的強度與平滑度滑條；用長寬比預設固定畫面形狀，選自訂可自己填比例。"
japanese = "カメラドリフトか動的FOVをオンにすると、強度と滑らかさのスライダーが現れます。アスペクト比プリセットで画面の形を固定し、カスタムを選べば比率を自分で入力できます。"
korean = "카메라 드리프트나 동적 FOV를 켜야 강도와 부드러움 슬라이더가 나타납니다. 화면 비율 프리셋으로 화면 형태를 고정하고, 사용자 지정을 고르면 비율을 직접 입력할 수 있습니다."
russian = "Ползунки силы и плавности появятся только после включения дрейфа камеры или динамического FOV. Пресет соотношения сторон задаёт форму вида, а вариант «Другой» позволяет ввести своё значение."
german = "Die Regler für Stärke und Weichheit erscheinen erst, wenn Kamera-Drift oder dynamisches FOV aktiviert ist. Das Seitenverhältnis-Preset legt die Bildform fest, bei „Eigene\" trägst du den Wert selbst ein."
spanish = "Los deslizadores de intensidad y suavidad aparecen solo al activar la deriva de cámara o el FOV dinámico. El preajuste de relación de aspecto fija la forma de la vista y «Personalizado» te deja escribirla."
french = "Les curseurs d'intensité et de douceur n'apparaissent qu'après avoir activé la dérive de caméra ou le FOV dynamique. Le préréglage de rapport d'aspect fixe la forme de la vue, « Personnalisé » te laisse saisir la valeur."
brazilian_portuguese = "Os controles de intensidade e suavidade só aparecem depois de ligar a deriva da câmera ou o FOV dinâmico. A predefinição de proporção fixa o formato da visão e \"Personalizado\" permite digitar a sua."
portuguese = "Os controlos de intensidade e suavidade só aparecem depois de ligar a deriva da câmara ou o FOV dinâmico. A predefinição de proporção fixa o formato da vista e \"Personalizado\" permite introduzir a sua."
turkish = "Yoğunluk ve yumuşatma kaydırıcıları yalnızca kamera sürüklenmesi veya dinamik FOV açıkken görünür. En-boy oranı ön ayarı görünüm şeklini sabitler, \"Özel\" seçeneğiyle oranı kendin girebilirsin."
polish = "Suwaki intensywności i płynności pojawiają się dopiero po włączeniu dryfu kamery lub dynamicznego FOV. Ustawienie proporcji wymusza kształt widoku, a opcja „Własne\" pozwala wpisać własną wartość."

[[message]]
key = "Drift and dynamic FOV are cosmetic and can make aiming feel floaty, so start with a low intensity in a warm-up map."
[message.translations]
simplified_chinese = "镜头漂移和动态 FOV 只是观感效果，会让准星手感发飘，建议先在热身图里用低强度试。"
traditional_chinese = "鏡頭漂移和動態 FOV 只是觀感效果，會讓準星手感發飄，建議先在熱身圖裡用低強度試。"
japanese = "カメラドリフトと動的FOVは見た目だけの効果で、照準が浮いて感じられます。まずは低い強度でウォームアップマップで試してください。"
korean = "카메라 드리프트와 동적 FOV는 겉보기 효과라 조준이 둥 뜨는 느낌이 들 수 있습니다. 연습 맵에서 낮은 강도로 먼저 시험해 보세요."
russian = "Дрейф камеры и динамическое FOV — только визуальные эффекты, из-за них прицел «плывёт». Начните с малой силы на разминочной карте."
german = "Kamera-Drift und dynamisches FOV sind reine Optik und lassen das Zielen schwammig wirken. Starte auf einer Aufwärmkarte mit niedriger Stärke."
spanish = "La deriva de cámara y el FOV dinámico son solo estética y pueden hacer que apuntar se sienta flotante; empieza con poca intensidad en un mapa de calentamiento."
french = "La dérive de caméra et le FOV dynamique sont purement esthétiques et rendent la visée flottante ; commence avec une faible intensité sur une map d'échauffement."
brazilian_portuguese = "A deriva da câmera e o FOV dinâmico são só estética e deixam a mira flutuante; comece com intensidade baixa em um mapa de aquecimento."
portuguese = "A deriva da câmara e o FOV dinâmico são apenas estética e tornam a mira flutuante; começa com intensidade baixa num mapa de aquecimento."
turkish = "Kamera sürüklenmesi ve dinamik FOV yalnızca görseldir ve nişan almayı kaygan hissettirebilir; ısınma haritasında düşük yoğunlukla başla."
polish = "Dryf kamery i dynamiczne FOV to tylko efekty wizualne i mogą sprawiać, że celowanie wydaje się pływające; zacznij od niskiej intensywności na mapie rozgrzewkowej."

[[message]]
key = "The look of the help bubbles that appear when you hover over buttons, settings and bind rows."
[message.translations]
simplified_chinese = "鼠标停在按钮、设置项和绑定行上时弹出的提示气泡的外观。"
traditional_chinese = "滑鼠停在按鈕、設定項和綁定列上時彈出的提示氣泡的外觀。"
japanese = "ボタンや設定項目、バインド行にマウスを重ねたときに出るヒント吹き出しの見た目を設定します。"
korean = "버튼, 설정 항목, 바인드 행 위에 마우스를 올렸을 때 나오는 도움말 풍선의 모양을 정합니다."
russian = "Внешний вид подсказок, которые появляются при наведении на кнопки, настройки и строки привязок."
german = "Das Aussehen der Hilfeblasen, die beim Überfahren von Schaltflächen, Einstellungen und Belegungszeilen erscheinen."
spanish = "El aspecto de los globos de ayuda que aparecen al pasar el cursor por botones, ajustes y filas de atajos."
french = "L'apparence des bulles d'aide qui apparaissent au survol des boutons, des réglages et des lignes de raccourcis."
brazilian_portuguese = "A aparência das bolhas de ajuda que aparecem ao passar o mouse sobre botões, ajustes e linhas de atalhos."
portuguese = "O aspeto das bolhas de ajuda que aparecem ao passar o rato sobre botões, definições e linhas de atalhos."
turkish = "Düğmelerin, ayarların ve tuş atama satırlarının üzerine gelince çıkan yardım balonlarının görünümü."
polish = "Wygląd dymków pomocy pojawiających się po najechaniu na przyciski, ustawienia i wiersze przypisań."

[[message]]
key = "Pick \"Tooltip background color\" and \"Tooltip text color\", drag \"Tooltip font size\", and keep \"Tooltip bounce animation\" on for a small pop."
[message.translations]
simplified_chinese = "分别选提示背景色和提示文字色，拖动提示字号滑条，想要弹出时的小回弹就保持提示回弹动画开启。"
traditional_chinese = "分別選提示背景色和提示文字色，拖動提示字號滑條，想要彈出時的小回彈就保持提示回彈動畫開啟。"
japanese = "ヒントの背景色と文字色を選び、ヒントの文字サイズをドラッグし、小さく弾む動きが欲しければヒントのバウンスアニメーションをオンにします。"
korean = "도움말 배경색과 글자색을 고르고, 도움말 글자 크기를 끌어 조절하며, 작게 튀는 효과를 원하면 도움말 튕김 애니메이션을 켜 두세요."
russian = "Выберите цвет фона и цвет текста подсказки, задайте размер шрифта, а для лёгкого подпрыгивания оставьте включённой анимацию подсказки."
german = "Wähle Hintergrund- und Textfarbe der Hilfe, ziehe die Schriftgröße und lass die Feder-Animation an, wenn die Blase kurz aufpoppen soll."
spanish = "Elige el color de fondo y del texto, arrastra el tamaño de fuente y deja activa la animación de rebote si quieres que aparezca con un pequeño salto."
french = "Choisis la couleur de fond et du texte, fais glisser la taille de police et garde l'animation de rebond pour un petit effet d'apparition."
brazilian_portuguese = "Escolha a cor de fundo e a do texto, arraste o tamanho da fonte e mantenha a animação de quique se quiser um pequeno salto ao aparecer."
portuguese = "Escolhe a cor de fundo e a do texto, arrasta o tamanho da letra e mantém a animação de salto se quiseres um pequeno efeito ao aparecer."
turkish = "Yardım balonunun arka plan ve yazı rengini seç, yazı boyutunu sürükle ve açılırken küçük bir zıplama istiyorsan zıplama animasyonunu açık bırak."
polish = "Wybierz kolor tła i tekstu dymka, przeciągnij rozmiar czcionki, a dla lekkiego podskoku zostaw włączoną animację sprężystości."

[[message]]
key = "Keep the text light on a dark background; press \"Reset tooltip appearance\" to return to the defaults."
[message.translations]
simplified_chinese = "深色背景配浅色文字最好读；想恢复推荐样式就点重置提示外观。"
traditional_chinese = "深色背景配淺色文字最好讀；想恢復建議樣式就點重設提示外觀。"
japanese = "暗い背景には明るい文字が見やすいです。既定の見た目に戻すにはヒントの外観をリセットを押します。"
korean = "어두운 배경에는 밝은 글자가 읽기 좋습니다. 기본 모양으로 되돌리려면 도움말 모양 초기화를 누르세요."
russian = "На тёмном фоне лучше читается светлый текст; кнопка сброса вернёт рекомендуемый вид подсказки."
german = "Auf dunklem Grund liest sich heller Text am besten; mit dem Zurücksetzen der Hilfe-Darstellung kehrst du zum Standard zurück."
spanish = "Sobre fondo oscuro se lee mejor el texto claro; el botón de restablecer la apariencia de las ayudas vuelve a los valores recomendados."
french = "Sur un fond sombre, un texte clair se lit mieux ; le bouton de réinitialisation de l'apparence des infobulles rétablit les valeurs par défaut."
brazilian_portuguese = "Em fundo escuro o texto claro lê melhor; o botão de redefinir a aparência das dicas volta ao padrão."
portuguese = "Em fundo escuro o texto claro lê-se melhor; o botão de repor o aspeto das dicas volta ao predefinido."
turkish = "Koyu zeminde açık renk yazı daha okunaklıdır; yardım görünümünü sıfırla düğmesi önerilen görünümü geri getirir."
polish = "Na ciemnym tle najlepiej czyta się jasny tekst; przycisk przywrócenia wyglądu dymka wraca do zalecanych ustawień."

[[message]]
key = "A calm-play mode that hides the HUD, names, effects, chat and sounds you pick, so only the game stays on screen."
[message.translations]
simplified_chinese = "一个安静游玩的模式：按你的选择隐藏 HUD、名字、特效、聊天和声音，屏幕上只留下游戏本身。"
traditional_chinese = "一個安靜遊玩的模式：依你的選擇隱藏 HUD、名字、特效、聊天和聲音，螢幕上只留下遊戲本身。"
japanese = "静かに遊ぶためのモードです。選んだHUD、名前、エフェクト、チャット、音を隠し、画面にはゲームだけを残します。"
korean = "조용히 플레이하는 모드로, 선택한 HUD·이름·효과·채팅·소리를 숨겨 화면에 게임만 남깁니다."
russian = "Режим спокойной игры: скрывает выбранные элементы HUD, имена, эффекты, чат и звуки, оставляя на экране только игру."
german = "Ein ruhiger Spielmodus: Er blendet gewählte HUD-Teile, Namen, Effekte, Chat und Geräusche aus, sodass nur das Spiel zu sehen bleibt."
spanish = "Un modo de juego tranquilo: oculta el HUD, los nombres, los efectos, el chat y los sonidos que elijas, y deja solo el juego en pantalla."
french = "Un mode de jeu apaisé : il masque le HUD, les noms, les effets, le chat et les sons choisis pour ne laisser que le jeu à l'écran."
brazilian_portuguese = "Um modo de jogo tranquilo: oculta o HUD, nomes, efeitos, chat e sons que você escolher, deixando só o jogo na tela."
portuguese = "Um modo de jogo tranquilo: oculta o HUD, nomes, efeitos, chat e sons que escolheres, deixando apenas o jogo no ecrã."
turkish = "Sakin oyun modu: seçtiğin HUD öğelerini, isimleri, efektleri, sohbeti ve sesleri gizler; ekranda yalnızca oyun kalır."
polish = "Tryb spokojnej gry: ukrywa wybrane elementy HUD, nazwy, efekty, czat i dźwięki, zostawiając na ekranie tylko samą grę."

[[message]]
key = "Turn on \"Enable Zen mode\", pick what to hide under \"Interface\", \"Players\", \"Visuals\", \"Audio\" and \"Chat\", then set the \"Zen mode key\" for quick switching."
[message.translations]
simplified_chinese = "打开启用禅模式，再在界面、玩家、视觉、音频和聊天分区里挑选要隐藏的项目，最后设置禅模式按键方便随时切换。"
traditional_chinese = "開啟啟用禪模式，再在介面、玩家、視覺、音訊和聊天分區裡挑選要隱藏的項目，最後設定禪模式按鍵方便隨時切換。"
japanese = "禅モードを有効にするをオンにし、インターフェース・プレイヤー・表示・音声・チャットの各項目で隠すものを選び、最後に禅モードキーを設定して素早く切り替えられるようにします。"
korean = "젠 모드 사용을 켜고 인터페이스·플레이어·시각·오디오·채팅 항목에서 숨길 것을 고른 뒤, 젠 모드 키를 지정해 두면 바로 전환할 수 있습니다."
russian = "Включите дзен-режим, отметьте, что скрывать, в разделах «Интерфейс», «Игроки», «Визуальные эффекты», «Звук» и «Чат», затем назначьте клавишу дзен-режима для быстрого переключения."
german = "Aktiviere den Zen-Modus, wähle unter „Oberfläche\", „Spieler\", „Darstellung\", „Audio\" und „Chat\" aus, was ausgeblendet wird, und lege dann die Zen-Modus-Taste zum schnellen Umschalten fest."
spanish = "Activa el modo Zen, elige qué ocultar en «Interfaz», «Jugadores», «Visual», «Audio» y «Chat», y asigna la tecla del modo Zen para cambiar rápido."
french = "Active le mode Zen, choisis ce qui doit être masqué dans « Interface », « Joueurs », « Visuels », « Audio » et « Chat », puis définis la touche du mode Zen pour basculer vite."
brazilian_portuguese = "Ative o modo Zen, escolha o que ocultar em \"Interface\", \"Jogadores\", \"Visual\", \"Áudio\" e \"Chat\" e defina a tecla do modo Zen para alternar rápido."
portuguese = "Ativa o modo Zen, escolhe o que ocultar em \"Interface\", \"Jogadores\", \"Visual\", \"Áudio\" e \"Chat\" e define a tecla do modo Zen para alternar depressa."
turkish = "Zen modunu etkinleştir seçeneğini aç, \"Arayüz\", \"Oyuncular\", \"Görseller\", \"Ses\" ve \"Sohbet\" bölümlerinde gizlenecekleri işaretle, sonra hızlı geçiş için Zen modu tuşunu ata."
polish = "Włącz tryb Zen, wybierz, co ukryć w sekcjach „Interfejs\", „Gracze\", „Wygląd\", „Dźwięk\" i „Czat\", a następnie ustaw klawisz trybu Zen do szybkiego przełączania."

[[message]]
key = "Bind \"Zen mode key\" before you need it: while Zen mode is on, hidden HUD, chat and scoreboard stay hidden."
[message.translations]
simplified_chinese = "最好提前绑好禅模式按键：禅模式开启时，被隐藏的 HUD、聊天和计分板会一直隐藏。"
traditional_chinese = "最好提前綁好禪模式按鍵：禪模式開啟時，被隱藏的 HUD、聊天和計分板會一直隱藏。"
japanese = "必要になる前に禅モードキーを割り当てておきましょう。禅モード中は隠したHUD、チャット、スコアボードが隠れたままになります。"
korean = "필요해지기 전에 젠 모드 키를 지정해 두세요. 젠 모드가 켜져 있는 동안 숨긴 HUD, 채팅, 스코어보드는 계속 숨겨집니다."
russian = "Назначьте клавишу дзен-режима заранее: пока он включён, скрытые HUD, чат и таблица счёта останутся скрытыми."
german = "Lege die Zen-Modus-Taste vorher fest: Solange der Zen-Modus aktiv ist, bleiben ausgeblendetes HUD, Chat und Punktestand unsichtbar."
spanish = "Asigna la tecla del modo Zen antes de necesitarla: mientras está activo, el HUD, el chat y la tabla de puntos ocultos siguen ocultos."
french = "Définis la touche du mode Zen à l'avance : tant qu'il est actif, le HUD, le chat et le tableau des scores masqués le restent."
brazilian_portuguese = "Defina a tecla do modo Zen antes de precisar: enquanto ele estiver ativo, HUD, chat e placar ocultos continuam ocultos."
portuguese = "Define a tecla do modo Zen antes de precisares: enquanto estiver ativo, o HUD, o chat e a tabela de pontuação ocultos continuam ocultos."
turkish = "Zen modu tuşunu ihtiyaç duymadan önce ata: Zen modu açıkken gizlenen HUD, sohbet ve skor tablosu gizli kalır."
polish = "Ustaw klawisz trybu Zen zawczasu: dopóki tryb Zen jest włączony, ukryty HUD, czat i tabela wyników pozostają ukryte."

[[message]]
key = "Fast keys for common dummy, aim and rescue actions: HDF, DF, 45-degree aim, jumps and the trajectory line."
[message.translations]
simplified_chinese = "为常用分身、瞄准和救场操作准备现成按键：HDF、DF、45 度瞄准、左右跳和武器轨迹线。"
traditional_chinese = "為常用分身、瞄準和救場操作準備現成按鍵：HDF、DF、45 度瞄準、左右跳和武器軌跡線。"
japanese = "分身・エイム・立て直しでよく使う操作の既製キー：HDF、DF、45度エイム、左右ジャンプ、武器の軌道線。"
korean = "더미·조준·복구에 자주 쓰는 동작의 기본 키: HDF, DF, 45도 조준, 좌우 점프, 무기 궤적선."
russian = "Готовые клавиши для частых действий с дамми, прицеливанием и спасением: HDF, DF, прицел под 45°, прыжки в стороны и линия траектории оружия."
german = "Fertige Tasten für häufige Dummy-, Ziel- und Rettungsaktionen: HDF, DF, 45-Grad-Zielen, Sprünge und die Waffentrajektorie."
spanish = "Teclas listas para acciones habituales de dummy, puntería y rescate: HDF, DF, puntería a 45 grados, saltos y la línea de trayectoria del arma."
french = "Touches prêtes pour les actions courantes de dummy, de visée et de sauvetage : HDF, DF, visée à 45 degrés, sauts et trajectoire de l'arme."
brazilian_portuguese = "Teclas prontas para ações comuns de dummy, mira e resgate: HDF, DF, mira em 45 graus, saltos e a linha de trajetória da arma."
portuguese = "Teclas prontas para ações comuns de dummy, mira e resgate: HDF, DF, mira a 45 graus, saltos e a linha de trajetória da arma."
turkish = "Dummy, nişan ve kurtarma için hazır tuşlar: HDF, DF, 45 derece nişan, sağ-sol zıplama ve silah yörünge çizgisi."
polish = "Gotowe klawisze do typowych akcji z dummy, celowania i ratunku: HDF, DF, celowanie pod 45 stopni, skoki i linia toru broni."

[[message]]
key = "Click a row such as \"HDF\" or \"Left jump\", press the key you want, and use the trash icon to remove a bind."
[message.translations]
simplified_chinese = "点一下 HDF 或左跳这类行，按下想用的键即可绑定；点旁边的垃圾桶图标可以清除这个绑定。"
traditional_chinese = "點一下 HDF 或左跳這類列，按下想用的鍵即可綁定；點旁邊的垃圾桶圖示可以清除這個綁定。"
japanese = "HDFや左ジャンプなどの行をクリックして好きなキーを押すと割り当てられます。隣のゴミ箱アイコンでその割り当てを消せます。"
korean = "HDF나 왼쪽 점프 같은 행을 클릭하고 원하는 키를 누르면 지정됩니다. 옆의 휴지통 아이콘을 누르면 그 지정이 해제됩니다."
russian = "Нажмите на строку вроде HDF или «Прыжок влево» и нажмите нужную клавишу. Значок корзины рядом снимает привязку."
german = "Klicke auf eine Zeile wie HDF oder Linker Sprung und drücke die gewünschte Taste. Das Papierkorb-Symbol daneben löscht die Belegung wieder."
spanish = "Haz clic en una fila como HDF o Salto a la izquierda y pulsa la tecla que quieras; el icono de papelera borra ese atajo."
french = "Clique sur une ligne comme HDF ou Saut à gauche et appuie sur la touche voulue ; l'icône de corbeille supprime ce raccourci."
brazilian_portuguese = "Clique em uma linha como HDF ou Salto à esquerda e pressione a tecla desejada; o ícone de lixeira remove o atalho."
portuguese = "Clica numa linha como HDF ou Salto à esquerda e pressiona a tecla pretendida; o ícone de lixo remove o atalho."
turkish = "HDF veya Sola zıplama gibi bir satıra tıkla ve istediğin tuşa bas; yanındaki çöp kutusu simgesi atamayı siler."
polish = "Kliknij wiersz taki jak HDF lub Skok w lewo i naciśnij wybrany klawisz; ikona kosza obok usuwa przypisanie."

[[message]]
key = "A key that already has a command is overwritten, so recheck your other binds after assigning keys here."
[message.translations]
simplified_chinese = "已经被占用的键会被覆盖，所以在这里绑定后最好回头检查其他绑定。"
traditional_chinese = "已經被佔用的鍵會被覆蓋，所以在這裡綁定後最好回頭檢查其他綁定。"
japanese = "すでにコマンドが割り当てられているキーは上書きされます。ここで割り当てた後は他のキー設定も確認してください。"
korean = "이미 명령이 지정된 키는 덮어써집니다. 여기서 키를 지정한 뒤 다른 바인드도 다시 확인하세요."
russian = "Клавиша с уже назначенной командой будет перезаписана, поэтому после привязки проверьте остальные назначения."
german = "Eine Taste, die schon einen Befehl hat, wird überschrieben. Prüfe danach deine übrigen Belegungen."
spanish = "Una tecla que ya tiene un comando se sobrescribe, así que revisa tus otros atajos después de asignar aquí."
french = "Une touche déjà associée à une commande est écrasée ; vérifie donc tes autres raccourcis après avoir assigné ici."
brazilian_portuguese = "Uma tecla que já tem um comando é sobrescrita, então revise seus outros atalhos depois de atribuir aqui."
portuguese = "Uma tecla que já tem um comando é substituída, por isso revê os outros atalhos depois de atribuíres aqui."
turkish = "Zaten bir komuta atanmış tuş üzerine yazılır; burada tuş atadıktan sonra diğer atamalarını yeniden kontrol et."
polish = "Klawisz z przypisaną komendą zostanie nadpisany, więc po przypisaniu tutaj sprawdź pozostałe przypisania."

[[message]]
key = "Show or hide other players' large and launched emoticons, and choose the key that opens the emote launcher."
[message.translations]
simplified_chinese = "决定是否显示其他玩家的大表情和发射表情，并选择打开表情发射器的按键。"
traditional_chinese = "決定是否顯示其他玩家的大表情和發射表情，並選擇開啟表情發射器的按鍵。"
japanese = "他のプレイヤーの大きな表情と発射表情を表示するかを決め、表情ランチャーを開くキーを選びます。"
korean = "다른 플레이어의 큰 이모티콘과 발사 이모티콘 표시 여부를 정하고, 이모티콘 발사기를 여는 키를 고릅니다."
russian = "Показывает или скрывает большие и запускаемые эмоции других игроков, а также задаёт клавишу запуска своих эмоций."
german = "Blendet große und abgeschossene Emoticons anderer Spieler ein oder aus und legt die Taste für den Emote-Starter fest."
spanish = "Muestra u oculta los emoticonos grandes y lanzados de otros jugadores, y elige la tecla que abre el lanzador de emoticonos."
french = "Affiche ou masque les grands emoticons et les emoticons lancés des autres joueurs, et choisit la touche qui ouvre le lanceur d'emoticons."
brazilian_portuguese = "Mostra ou oculta emoticons grandes e lançados de outros jogadores, e escolhe a tecla que abre o lançador de emoticons."
portuguese = "Mostra ou oculta emoticons grandes e lançados de outros jogadores, e escolhe a tecla que abre o lançador de emoticons."
turkish = "Diğer oyuncuların büyük ve fırlatılan ifadelerini gösterip gizler ve ifade başlatıcıyı açan tuşu seçer."
polish = "Pokazuje lub ukrywa duże i wystrzeliwane emotikony innych graczy oraz wybiera klawisz otwierający wyrzutnię emotikonów."

[[message]]
key = "Untick \"Show other players' large emoticons\" or \"Show other players' launched emoticons\"; click \"Launch emote key\" to assign the key that turns launching on and off."
[message.translations]
simplified_chinese = "取消勾选显示其他玩家的大表情或显示其他玩家发射的表情可以减少干扰；点发射表情按键即可指定开关发射模式的键。"
traditional_chinese = "取消勾選顯示其他玩家的大表情或顯示其他玩家發射的表情可以減少干擾；點發射表情按鍵即可指定開關發射模式的鍵。"
japanese = "他のプレイヤーの大きな表情や発射表情の表示を外すと画面がすっきりします。発射表情キーをクリックすると、発射モードを切り替えるキーを割り当てられます。"
korean = "다른 플레이어의 큰 이모티콘 또는 발사 이모티콘 표시를 끄면 화면이 깔끔해집니다. 발사 이모티콘 키를 눌러 발사 모드를 켜고 끄는 키를 지정하세요."
russian = "Снимите галочки «Показывать большие эмоции других игроков» и «Показывать запущенные эмоции», чтобы меньше отвлекаться. Нажав на клавишу запуска эмоций, назначьте переключатель этого режима."
german = "Entferne das Häkchen bei „Große Emoticons anderer Spieler\" oder „Abgeschossene Emoticons anderer Spieler\", um weniger Ablenkung zu haben. Über die Emote-Starter-Taste legst du fest, womit du den Startmodus umschaltest."
spanish = "Desmarca «Mostrar emoticonos grandes de otros jugadores» o «Mostrar emoticonos lanzados» para reducir el ruido; pulsa la tecla de lanzamiento de emoticonos para asignar la que activa y desactiva el lanzamiento."
french = "Décoche « Afficher les grands emoticons des autres joueurs » ou « Afficher les emoticons lancés » pour alléger l'écran ; clique sur la touche de lancement d'emoticons pour choisir celle qui active ce mode."
brazilian_portuguese = "Desmarque \"Mostrar emoticons grandes de outros jogadores\" ou \"Mostrar emoticons lançados\" para reduzir a poluição; clique em \"Tecla de lançar emoticon\" para escolher a tecla que liga o modo de lançamento."
portuguese = "Desmarca \"Mostrar emoticons grandes de outros jogadores\" ou \"Mostrar emoticons lançados\" para reduzir a poluição; clica em \"Tecla de lançar emoticon\" para escolher a tecla que liga o modo de lançamento."
turkish = "Kalabalığı azaltmak için diğer oyuncuların büyük ifadelerini veya fırlatılan ifadelerini göster seçeneklerini kaldır; fırlatma modunu açıp kapatan tuşu atamak için ifade fırlatma tuşuna tıkla."
polish = "Odznacz „Pokaż duże emotikony innych graczy\" lub „Pokaż wystrzelone emotikony innych graczy\", aby zmniejszyć bałagan; kliknij klawisz wyrzutni emotikonów, aby przypisać klawisz przełączający tryb wystrzeliwania."

[[message]]
key = "The launcher key only switches launch mode, so you still choose the emote with your normal emote key."
[message.translations]
simplified_chinese = "发射键只负责切换发射模式，具体表情仍要用平时的表情键来选择。"
traditional_chinese = "發射鍵只負責切換發射模式，具體表情仍要用平時的表情鍵來選擇。"
japanese = "ランチャーのキーは発射モードを切り替えるだけで、どの表情を出すかは通常の表情キーで選びます。"
korean = "발사기 키는 발사 모드만 전환하고, 어떤 이모티콘을 쓸지는 평소 이모티콘 키로 고릅니다."
russian = "Клавиша запуска только переключает режим: саму эмоцию вы по-прежнему выбираете обычной клавишей эмоций."
german = "Die Starter-Taste schaltet nur den Startmodus um; welches Emoticon kommt, wählst du weiterhin mit deiner normalen Emote-Taste."
spanish = "La tecla del lanzador solo cambia el modo de lanzamiento; el emoticono concreto lo sigues eligiendo con tu tecla de emoticonos habitual."
french = "La touche du lanceur ne fait que basculer le mode de lancement ; l'emoticon se choisit toujours avec ta touche d'emoticons habituelle."
brazilian_portuguese = "A tecla do lançador só alterna o modo de lançamento; o emoticon você continua escolhendo com sua tecla normal."
portuguese = "A tecla do lançador só alterna o modo de lançamento; o emoticon continuas a escolhê-lo com a tua tecla normal."
turkish = "Fırlatıcı tuşu yalnızca fırlatma modunu değiştirir; hangi ifadenin çıkacağını yine normal ifade tuşunla seçersin."
polish = "Klawisz wyrzutni tylko przełącza tryb wystrzeliwania; samą emotikonę nadal wybierasz zwykłym klawiszem emotikon."

[[message]]
key = "Your list of favorite maps, each shown with its map type, with quick copy and remove actions."
[message.translations]
simplified_chinese = "你的收藏地图列表，每张都标出地图类型，并提供快速复制和移除操作。"
traditional_chinese = "你的收藏地圖清單，每張都標出地圖類型，並提供快速複製和移除操作。"
japanese = "お気に入りマップの一覧です。各マップは種類付きで表示され、コピーと削除をすばやく行えます。"
korean = "즐겨찾기 맵 목록입니다. 각 맵은 유형과 함께 표시되고 빠르게 복사하거나 삭제할 수 있습니다."
russian = "Список избранных карт: у каждой указан тип, а скопировать или удалить её можно в один клик."
german = "Deine Liste der Lieblingskarten, jede mit ihrem Kartentyp und schnellen Kopier- und Löschaktionen."
spanish = "Tu lista de mapas favoritos, cada uno con su tipo y acciones rápidas de copiar y eliminar."
french = "Ta liste de maps favorites, chacune affichée avec son type et des actions rapides de copie et de suppression."
brazilian_portuguese = "Sua lista de mapas favoritos, cada um com o tipo e ações rápidas de copiar e remover."
portuguese = "A tua lista de mapas favoritos, cada um com o tipo e ações rápidas de copiar e remover."
turkish = "Favori haritalarının listesi; her biri türüyle gösterilir ve hızlıca kopyalanıp kaldırılabilir."
polish = "Twoja lista ulubionych map, każda z typem oraz szybkim kopiowaniem i usuwaniem."

[[message]]
key = "Click a map name to copy it and press the X button to remove it; add maps with the \"Favorite map\" checkbox in the in-game server info page."
[message.translations]
simplified_chinese = "点地图名可以复制，点右侧的 X 按钮可以移除；在游戏内服务器信息页勾选收藏地图即可添加。"
traditional_chinese = "點地圖名可以複製，點右側的 X 按鈕可以移除；在遊戲內伺服器資訊頁勾選收藏地圖即可加入。"
japanese = "マップ名をクリックするとコピーでき、右側のXボタンで削除できます。追加はゲーム内のサーバー情報ページでお気に入りマップにチェックを入れます。"
korean = "맵 이름을 클릭하면 복사되고 오른쪽 X 버튼으로 삭제됩니다. 추가는 게임 내 서버 정보 페이지에서 즐겨찾기 맵을 체크하면 됩니다."
russian = "Щёлкните по названию карты, чтобы скопировать его, а кнопка X справа удалит запись. Добавлять карты можно галочкой «Избранная карта» на странице информации о сервере."
german = "Ein Klick auf den Kartennamen kopiert ihn, das X rechts entfernt den Eintrag. Hinzufügen kannst du Karten über das Kästchen „Lieblingskarte\" auf der Serverinfo-Seite im Spiel."
spanish = "Haz clic en el nombre del mapa para copiarlo y pulsa la X para quitarlo; añade mapas con la casilla «Mapa favorito» en la página de información del servidor."
french = "Clique sur le nom d'une map pour le copier, et sur le X pour la retirer ; ajoute des maps avec la case « Map favorite » dans la page d'infos du serveur en jeu."
brazilian_portuguese = "Clique no nome do mapa para copiá-lo e pressione o X para removê-lo; adicione mapas pela caixa \"Mapa favorito\" na página de informações do servidor."
portuguese = "Clica no nome do mapa para o copiar e prime o X para o remover; adiciona mapas pela caixa \"Mapa favorito\" na página de informações do servidor."
turkish = "Harita adına tıklayınca kopyalanır, sağdaki X düğmesi kaydı kaldırır. Ekleme için oyun içi sunucu bilgi sayfasındaki favori harita kutusunu işaretle."
polish = "Kliknięcie nazwy mapy kopiuje ją, a przycisk X po prawej usuwa wpis. Mapy dodasz polem „Ulubiona mapa\" na stronie informacji o serwerze."

[[message]]
key = "Favorites match the exact map name and also feed the \"Favorite map\" tab in the server browser."
[message.translations]
simplified_chinese = "收藏按地图名精确匹配，同时会作为服务器浏览器里收藏地图分页的来源。"
traditional_chinese = "收藏依地圖名精確匹配，同時會作為伺服器瀏覽器裡收藏地圖分頁的來源。"
japanese = "お気に入りはマップ名の完全一致で判定され、サーバーブラウザのお気に入りマップタブにも反映されます。"
korean = "즐겨찾기는 맵 이름을 정확히 일치시켜 판단하며, 서버 브라우저의 즐겨찾기 맵 탭에도 반영됩니다."
russian = "Совпадение идёт по точному названию карты, и эти же записи наполняют вкладку избранных карт в браузере серверов."
german = "Favoriten gleichen den exakten Kartennamen ab und füllen auch den Tab „Lieblingskarte\" im Serverbrowser."
spanish = "Los favoritos se comparan por el nombre exacto del mapa y también alimentan la pestaña «Mapa favorito» del navegador de servidores."
french = "Les favoris correspondent au nom exact de la map et alimentent aussi l'onglet « Map favorite » du navigateur de serveurs."
brazilian_portuguese = "Os favoritos comparam o nome exato do mapa e também alimentam a aba \"Mapa favorito\" do navegador de servidores."
portuguese = "Os favoritos comparam o nome exato do mapa e também alimentam o separador \"Mapa favorito\" do navegador de servidores."
turkish = "Favoriler harita adının tam eşleşmesine göre çalışır ve sunucu tarayıcısındaki favori harita sekmesini de besler."
polish = "Ulubione dopasowują się po dokładnej nazwie mapy i zasilają zakładkę „Ulubiona mapa\" w przeglądarce serwerów."

[[message]]
key = "A radial menu that opens near a player and offers quick actions such as whisper, spectate or copy skin."
[message.translations]
simplified_chinese = "在玩家旁边展开的轮盘菜单，提供悄悄话、观战、复制皮肤等快速操作。"
traditional_chinese = "在玩家旁邊展開的輪盤選單，提供悄悄話、觀戰、複製皮膚等快速操作。"
japanese = "プレイヤーの近くに開く円形メニューで、ささやき、観戦、スキンコピーなどを素早く実行できます。"
korean = "플레이어 근처에 열리는 원형 메뉴로, 귓속말·관전·스킨 복사 같은 작업을 빠르게 실행합니다."
russian = "Круговое меню рядом с игроком: шёпот, наблюдение, копирование скина и другие быстрые действия."
german = "Ein Radialmenü beim Spieler für schnelle Aktionen wie Flüstern, Zuschauen oder Skin kopieren."
spanish = "Un menú radial que se abre junto a un jugador y ofrece acciones rápidas como susurrar, observar o copiar la skin."
french = "Un menu radial qui s'ouvre près d'un joueur et propose des actions rapides comme chuchoter, observer ou copier le skin."
brazilian_portuguese = "Um menu radial que abre perto de um jogador e oferece ações rápidas como sussurrar, assistir ou copiar a skin."
portuguese = "Um menu radial que abre junto de um jogador e oferece ações rápidas como sussurrar, observar ou copiar a skin."
turkish = "Bir oyuncunun yanında açılan ve fısıldama, izleme, skin kopyalama gibi hızlı işlemler sunan radyal menü."
polish = "Menu promieniste otwierane przy graczu, oferujące szybkie akcje, takie jak szept, obserwacja czy kopiowanie skina."

[[message]]
key = "Turn on \"Enable pie menu\", bind the \"Pie menu\" command on the Bind page, then hold that key near a player and release on an option."
[message.translations]
simplified_chinese = "打开启用轮盘菜单，在按键绑定页把轮盘菜单命令绑到一个键，然后在玩家旁边按住该键、在选项上松开。"
traditional_chinese = "開啟啟用輪盤選單，在按鍵綁定頁把輪盤選單指令綁到一個鍵，然後在玩家旁邊按住該鍵、在選項上放開。"
japanese = "円形メニューを有効にするをオンにし、キー割り当てページで円形メニューのコマンドを割り当て、プレイヤーの近くでそのキーを押し続けて項目の上で離します。"
korean = "원형 메뉴 사용을 켜고 키 설정 페이지에서 원형 메뉴 명령을 키에 지정한 뒤, 플레이어 근처에서 그 키를 누르고 있다가 항목에서 떼면 됩니다."
russian = "Включите круговое меню, в разделе назначений привяжите команду «Круговое меню» к клавише, затем зажмите её рядом с игроком и отпустите на нужном пункте."
german = "Aktiviere das Radialmenü, belege auf der Belegungsseite den Befehl „Radialmenü\" auf eine Taste und halte sie beim Spieler gedrückt, um beim Loslassen einen Eintrag zu wählen."
spanish = "Activa «Activar menú radial», asigna el comando «Menú radial» en la página de atajos y mantén esa tecla junto a un jugador para soltar sobre una opción."
french = "Active « Activer le menu radial », assigne la commande « Menu radial » sur la page des raccourcis, puis maintiens la touche près d'un joueur et relâche sur une option."
brazilian_portuguese = "Ative \"Ativar menu radial\", atribua o comando \"Menu radial\" na página de atalhos e segure a tecla perto de um jogador, soltando sobre uma opção."
portuguese = "Ativa \"Ativar menu radial\", atribui o comando \"Menu radial\" na página de atalhos e mantém a tecla junto de um jogador, largando sobre uma opção."
turkish = "Radyal menüyü etkinleştir seçeneğini aç, tuş atama sayfasında radyal menü komutunu bir tuşa ata, sonra oyuncunun yanında tuşu basılı tutup bir seçeneğin üzerinde bırak."
polish = "Włącz menu promieniste, przypisz komendę menu promienistego na stronie przypisań, a następnie przytrzymaj ten klawisz przy graczu i puść na wybranej opcji."

[[message]]
key = "Options only exist within \"Detection distance\"; turn off the ones you never use to keep the wheel short."
[message.translations]
simplified_chinese = "选项只在检测距离内才有效；关掉从不使用的选项，轮盘会更短更好选。"
traditional_chinese = "選項只在偵測距離內才有效；關掉從不使用的選項，輪盤會更短更好選。"
japanese = "項目は検出距離の中でのみ有効です。使わない項目を切ると輪が短く選びやすくなります。"
korean = "항목은 감지 거리 안에서만 나타납니다. 쓰지 않는 항목을 끄면 바퀴가 짧아져 고르기 쉽습니다."
russian = "Пункты доступны только в пределах расстояния обнаружения; отключите ненужные, чтобы колесо было короче."
german = "Einträge gelten nur innerhalb der Erkennungsdistanz; schalte ungenutzte Einträge ab, damit das Rad kurz bleibt."
spanish = "Las opciones solo existen dentro de la distancia de detección; desactiva las que no uses para que el círculo sea más corto."
french = "Les options n'existent que dans la distance de détection ; désactive celles que tu n'utilises pas pour garder un cercle court."
brazilian_portuguese = "As opções só existem dentro da distância de detecção; desligue as que você nunca usa para manter o círculo curto."
portuguese = "As opções só existem dentro da distância de deteção; desliga as que nunca usas para manter o círculo curto."
turkish = "Seçenekler yalnızca algılama mesafesi içinde geçerlidir; kullanmadıklarını kapatarak çarkı kısa tut."
polish = "Opcje działają tylko w zasięgu wykrywania; wyłącz nieużywane, aby menu pozostało krótkie."

[[message]]
key = "Shows a translated copy of received chat lines and can translate your own messages before they are sent."
[message.translations]
simplified_chinese = "为收到的聊天显示译文，也可以在发送前翻译你自己写的内容。"
traditional_chinese = "為收到的聊天顯示譯文，也可以在發送前翻譯你自己寫的內容。"
japanese = "受信したチャットに翻訳を表示し、自分のメッセージを送信前に翻訳できます。"
korean = "받은 채팅에 번역문을 보여 주고, 보내기 전에 내 메시지를 번역할 수도 있습니다."
russian = "Показывает перевод полученных сообщений и может переводить ваши сообщения перед отправкой."
german = "Zeigt eine Übersetzung empfangener Chatzeilen und übersetzt eigene Nachrichten vor dem Senden."
spanish = "Muestra una copia traducida del chat recibido y puede traducir tus mensajes antes de enviarlos."
french = "Affiche une traduction du chat reçu et peut traduire tes propres messages avant l'envoi."
brazilian_portuguese = "Mostra uma tradução das mensagens recebidas e pode traduzir suas mensagens antes de enviar."
portuguese = "Mostra uma tradução das mensagens recebidas e pode traduzir as tuas mensagens antes do envio."
turkish = "Gelen sohbet satırlarını çeviriyle gösterir ve kendi mesajlarını göndermeden önce çevirebilir."
polish = "Pokazuje tłumaczenie odebranego czatu i potrafi przetłumaczyć twoje wiadomości przed wysłaniem."

[[message]]
key = "Turn on \"Auto translate received messages\", pick a \"Translation service\", set \"Translate received messages to\", then press \"Test translation\"."
[message.translations]
simplified_chinese = "打开自动翻译收到的消息，选择翻译服务，设定收到消息译为的目标语言，再点测试翻译确认能用。"
traditional_chinese = "開啟自動翻譯收到的訊息，選擇翻譯服務，設定收到訊息譯為的目標語言，再點測試翻譯確認能用。"
japanese = "受信メッセージの自動翻訳をオンにし、翻訳サービスを選び、受信メッセージの翻訳先を設定してからテスト翻訳を押します。"
korean = "받은 메시지 자동 번역을 켜고 번역 서비스를 고른 뒤, 받은 메시지를 번역할 언어를 지정하고 테스트 번역을 누릅니다."
russian = "Включите автоперевод входящих сообщений, выберите сервис перевода, задайте язык перевода и нажмите «Проверить перевод»."
german = "Aktiviere die automatische Übersetzung eingehender Nachrichten, wähle den Übersetzungsdienst, stelle die Zielsprache ein und tippe auf Übersetzung testen."
spanish = "Activa la traducción automática de mensajes recibidos, elige el servicio de traducción, fija el idioma de destino y pulsa «Probar traducción»."
french = "Active la traduction automatique des messages reçus, choisis le service de traduction, définis la langue cible, puis clique sur « Tester la traduction »."
brazilian_portuguese = "Ative a tradução automática das mensagens recebidas, escolha o serviço de tradução, defina o idioma de destino e clique em \"Testar tradução\"."
portuguese = "Ativa a tradução automática das mensagens recebidas, escolhe o serviço de tradução, define o idioma de destino e clica em \"Testar tradução\"."
turkish = "Gelen mesajları otomatik çevir seçeneğini aç, çeviri hizmetini seç, gelen mesajların çevrileceği dili belirle ve çeviriyi test et düğmesine bas."
polish = "Włącz automatyczne tłumaczenie odebranych wiadomości, wybierz usługę tłumaczenia, ustaw język docelowy i naciśnij test tłumaczenia."

[[message]]
key = "Each service needs its own API key and network access; run \"Test translation\" after changing keys."
[message.translations]
simplified_chinese = "每个服务都需要各自的 API Key 和可用网络；换 Key 之后记得再点一次测试翻译。"
traditional_chinese = "每個服務都需要各自的 API Key 和可用網路；換 Key 之後記得再點一次測試翻譯。"
japanese = "各サービスにはそれぞれのAPIキーとネットワーク接続が必要です。キーを変えたらテスト翻訳をもう一度実行してください。"
korean = "각 서비스에는 해당 API 키와 네트워크 연결이 필요합니다. 키를 바꾼 뒤에는 테스트 번역을 다시 실행하세요."
russian = "Каждому сервису нужен свой API-ключ и доступ к сети; после смены ключа снова нажмите «Проверить перевод»."
german = "Jeder Dienst braucht einen eigenen API-Schlüssel und Netzzugang; nach dem Ändern eines Schlüssels erneut Übersetzung testen ausführen."
spanish = "Cada servicio necesita su propia clave de API y acceso a la red; vuelve a probar la traducción después de cambiar una clave."
french = "Chaque service a besoin de sa propre clé d'API et d'un accès réseau ; relance le test de traduction après avoir changé une clé."
brazilian_portuguese = "Cada serviço precisa da própria chave de API e de acesso à rede; teste a tradução novamente depois de trocar uma chave."
portuguese = "Cada serviço precisa da sua própria chave de API e de acesso à rede; testa a tradução novamente depois de trocar uma chave."
turkish = "Her hizmetin kendi API anahtarı ve ağ erişimi gerekir; anahtarı değiştirdikten sonra çeviriyi test et'i yeniden çalıştır."
polish = "Każda usługa wymaga własnego klucza API i dostępu do sieci; po zmianie klucza uruchom ponownie test tłumaczenia."

[[message]]
key = "Two keys that block or allow killing yourself with K, so you cannot die by accident while racing."
[message.translations]
simplified_chinese = "两个用于禁止或允许按 K 自杀的按键，避免跑图中误触直接死掉。"
traditional_chinese = "兩個用於禁止或允許按 K 自殺的按鍵，避免跑圖中誤觸直接死掉。"
japanese = "Kで自殺できるかどうかを切り替える2つのキーです。走行中の誤爆で落ちるのを防げます。"
korean = "K로 자살할 수 있는지를 막거나 허용하는 두 개의 키로, 달리는 중 실수로 죽는 일을 막습니다."
russian = "Две клавиши, запрещающие или разрешающие самоубийство по K, чтобы случайное нажатие не кончало забег."
german = "Zwei Tasten, die das Selbsttöten mit K sperren oder erlauben, damit ein Fehlgriff im Lauf nicht das Ende bedeutet."
spanish = "Dos teclas que bloquean o permiten suicidarte con K, para que un pulsado accidental no acabe con tu intento."
french = "Deux touches qui bloquent ou autorisent le suicide avec K, pour qu'une fausse frappe en course ne termine pas ton essai."
brazilian_portuguese = "Duas teclas que bloqueiam ou liberam o suicídio com K, para um toque acidental não acabar com a sua corrida."
portuguese = "Duas teclas que bloqueiam ou permitem o suicídio com K, para um toque acidental não terminar a tua corrida."
turkish = "K ile kendini öldürmeyi engelleyen veya izin veren iki tuş; böylece parkurda yanlışlıkla ölmezsin."
polish = "Dwa klawisze blokujące lub zezwalające na samobójstwo klawiszem K, aby przypadkowe naciśnięcie nie kończyło przejazdu."

[[message]]
key = "Assign \"Self-kill off\" and \"Self-kill on\"; after pressing the off key, K is ignored until you press the on key."
[message.translations]
simplified_chinese = "分别绑定禁止自杀和允许自杀两个按键；按下禁止键后，K 会被忽略，直到你按允许键。"
traditional_chinese = "分別綁定禁止自殺和允許自殺兩個按鍵；按下禁止鍵後，K 會被忽略，直到你按允許鍵。"
japanese = "自殺禁止と自殺許可の2つを割り当てます。禁止キーを押した後は、許可キーを押すまでKは無視されます。"
korean = "자살 금지와 자살 허용 키를 각각 지정하세요. 금지 키를 누른 뒤에는 허용 키를 누를 때까지 K가 무시됩니다."
russian = "Назначьте клавиши «Запрет самоубийства» и «Разрешить самоубийство»: после запрета K игнорируется, пока не нажмёте разрешающую."
german = "Belege „Selbsttöten aus\" und „Selbsttöten an\". Nach der Aus-Taste wird K ignoriert, bis du die An-Taste drückst."
spanish = "Asigna «Autosuicidio desactivado» y «Autosuicidio activado»; tras pulsar la tecla de desactivar, K se ignora hasta que pulses la de activar."
french = "Attribue « Suicide désactivé » et « Suicide activé » ; après la touche de désactivation, K est ignoré jusqu'à la touche d'activation."
brazilian_portuguese = "Atribua \"Suicídio desligado\" e \"Suicídio ligado\"; depois da tecla de desligar, K é ignorado até você apertar a de ligar."
portuguese = "Atribui \"Suicídio desligado\" e \"Suicídio ligado\"; depois da tecla de desligar, K é ignorado até pressionares a de ligar."
turkish = "Kendini öldürme kapalı ve kendini öldürme açık tuşlarını ata; kapalı tuşuna bastıktan sonra açık tuşuna basana kadar K yok sayılır."
polish = "Przypisz klawisze samobójstwo wyłączone i samobójstwo włączone; po wciśnięciu klawisza wyłączania K jest ignorowany do czasu wciśnięcia klawisza włączania."

[[message]]
key = "Only kills sent by your own client are blocked and server commands still work, so press your off key again after racing."
[message.translations]
simplified_chinese = "只拦截你自己客户端发出的自杀，服务器指令仍然有效，所以跑完图记得再按一次禁止键。"
traditional_chinese = "只攔截你自己客戶端發出的自殺，伺服器指令仍然有效，所以跑完圖記得再按一次禁止鍵。"
japanese = "ブロックされるのは自分のクライアントが送る自殺だけで、サーバーからのコマンドは有効なままです。走り終えたら禁止キーをもう一度押しておきましょう。"
korean = "차단되는 것은 내 클라이언트가 보내는 자살뿐이고 서버 명령은 그대로 동작합니다. 달리기가 끝나면 금지 키를 다시 눌러 두세요."
russian = "Блокируются только самоубийства, отправленные вашим клиентом, команды сервера продолжают работать, поэтому после забега снова нажмите запрещающую клавишу."
german = "Blockiert wird nur das Selbsttöten, das dein Client sendet; Serverbefehle wirken weiter. Drücke nach dem Lauf also wieder die Aus-Taste."
spanish = "Solo se bloquea el autosuicidio que envía tu cliente; los comandos del servidor siguen funcionando, así que vuelve a pulsar la tecla de desactivar al terminar."
french = "Seul le suicide envoyé par ton client est bloqué, les commandes du serveur fonctionnent toujours ; repense donc à réactiver la protection après ta course."
brazilian_portuguese = "Só o suicídio enviado pelo seu cliente é bloqueado; comandos do servidor continuam valendo, então aperte a tecla de desligar de novo depois da corrida."
portuguese = "Só o suicídio enviado pelo teu cliente é bloqueado; os comandos do servidor continuam a funcionar, por isso volta a premir a tecla de desligar depois da corrida."
turkish = "Yalnızca kendi istemcinin gönderdiği intiharlar engellenir; sunucu komutları çalışmaya devam eder, bu yüzden parkurdan sonra kapalı tuşuna yeniden bas."
polish = "Blokowane jest tylko samobójstwo wysłane przez twój klient, polecenia serwera nadal działają, więc po przejeździe ponownie naciśnij klawisz wyłączania."

[[message]]
key = "Chooses the language used by every menu, setting and message in the client."
[message.translations]
simplified_chinese = "选择客户端所有菜单、设置项和提示文本使用的语言。"
traditional_chinese = "選擇客戶端所有選單、設定項和提示文字使用的語言。"
japanese = "クライアント内のメニュー、設定、メッセージで使う言語を選びます。"
korean = "클라이언트의 모든 메뉴, 설정, 안내 문구에 사용할 언어를 고릅니다."
russian = "Выбирает язык всех меню, настроек и сообщений клиента."
german = "Legt die Sprache für alle Menüs, Einstellungen und Meldungen des Clients fest."
spanish = "Elige el idioma de todos los menús, ajustes y mensajes del cliente."
french = "Choisit la langue de tous les menus, réglages et messages du client."
brazilian_portuguese = "Escolhe o idioma de todos os menus, ajustes e mensagens do cliente."
portuguese = "Escolhe o idioma de todos os menus, definições e mensagens do cliente."
turkish = "İstemcideki tüm menülerin, ayarların ve mesajların dilini seçer."
polish = "Wybiera język wszystkich menu, ustawień i komunikatów klienta."

[[message]]
key = "Click a language in the list to apply it right away; the flag on the left shows which one is selected."
[message.translations]
simplified_chinese = "在列表里点一种语言就会立即生效，左侧的国旗标出当前选择。"
traditional_chinese = "在清單裡點一種語言就會立即生效，左側的國旗標出目前選擇。"
japanese = "一覧で言語をクリックするとすぐに反映されます。左側の国旗が現在の選択を示します。"
korean = "목록에서 언어를 클릭하면 바로 적용되며, 왼쪽 국기로 현재 선택을 확인할 수 있습니다."
russian = "Щёлкните язык в списке, и он применится сразу; флаг слева показывает текущий выбор."
german = "Ein Klick auf eine Sprache wendet sie sofort an; die Flagge links zeigt die aktuelle Auswahl."
spanish = "Haz clic en un idioma de la lista para aplicarlo al momento; la bandera de la izquierda indica el elegido."
french = "Clique sur une langue de la liste pour l'appliquer immédiatement ; le drapeau à gauche indique le choix actuel."
brazilian_portuguese = "Clique em um idioma da lista para aplicá-lo na hora; a bandeira à esquerda mostra o escolhido."
portuguese = "Clica num idioma da lista para o aplicar de imediato; a bandeira à esquerda mostra o escolhido."
turkish = "Listeden bir dile tıklayınca hemen uygulanır; soldaki bayrak seçili olanı gösterir."
polish = "Kliknięcie języka na liście od razu go stosuje; flaga po lewej pokazuje aktualny wybór."

[[message]]
key = "Community translations can be unfinished, so a few lines may stay in English; switch back here at any time."
[message.translations]
simplified_chinese = "社区翻译可能还没做完，个别条目仍会显示英文；随时可以回到这里换回别的语言。"
traditional_chinese = "社群翻譯可能還沒做完，個別條目仍會顯示英文；隨時可以回到這裡換回別的語言。"
japanese = "コミュニティ翻訳は未完成のことがあり、一部の行は英語のまま残る場合があります。いつでもここで戻せます。"
korean = "커뮤니티 번역은 미완성일 수 있어 일부 문구가 영어로 남을 수 있습니다. 언제든 여기서 되돌릴 수 있습니다."
russian = "Переводы сообщества могут быть неполными, поэтому часть строк останется на английском; вернуться сюда можно в любой момент."
german = "Community-Übersetzungen können unvollständig sein, einzelne Zeilen bleiben dann Englisch. Hier kannst du jederzeit zurückwechseln."
spanish = "Las traducciones de la comunidad pueden estar incompletas y algunas líneas seguirán en inglés; puedes volver aquí cuando quieras."
french = "Les traductions communautaires peuvent être incomplètes et quelques lignes rester en anglais ; tu peux revenir ici à tout moment."
brazilian_portuguese = "As traduções da comunidade podem estar incompletas, então algumas linhas continuam em inglês; volte aqui quando quiser."
portuguese = "As traduções da comunidade podem estar incompletas, por isso algumas linhas continuam em inglês; volta aqui quando quiseres."
turkish = "Topluluk çevirileri eksik olabilir, bu yüzden bazı satırlar İngilizce kalabilir; dilediğin zaman buradan geri dönebilirsin."
polish = "Tłumaczenia społeczności mogą być nieukończone, więc część wierszy pozostanie po angielsku; w każdej chwili możesz tu wrócić."

