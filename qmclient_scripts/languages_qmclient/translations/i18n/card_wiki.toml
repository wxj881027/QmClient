russian = "Щёлкните поле клавиши рядом с чатом, командным чатом или командой чата и нажмите нужную клавишу."
german = "Klicke das Tastenfeld neben Chat, Team-Chat oder Chat-Befehl an und drücke die gewünschte Taste."
