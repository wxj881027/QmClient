turkish = "Sohbet, Takım sohbeti veya Sohbet komutu yanındaki tuş alanına tıkla ve kullanmak istediğin tuşa bas."
polish = "Kliknij pole klawisza obok Czat, Czat drużynowy lub Komenda czatu i naciśnij wybrany klawisz."

[[message]]
key = "Give \"Team chat\" its own key so a quick call to your team cannot reach everyone by mistake."
[message.translations]
simplified_chinese = "给队伍聊天单独一个键，这样临时喊队友时才不会误发到全场。"
traditional_chinese = "給隊伍聊天單獨一個鍵，這樣臨時喊隊友時才不會誤發到全場。"
japanese = "チームチャット専用のキーを用意しておけば、味方への呼びかけが誤って全員に届くことはありません。"
korean = "팀 채팅에 전용 키를 두면 팀에게 급히 외칠 때 실수로 전체에 보내는 일이 없습니다."
russian = "Выделите командному чату отдельную клавишу, чтобы быстрый клич команде не ушёл всем подряд."
german = "Gib dem Team-Chat eine eigene Taste, damit ein schneller Zuruf nicht versehentlich alle erreicht."
spanish = "Dale al chat de equipo su propia tecla para que un aviso rápido no llegue a todos por error."
french = "Donne au chat d'équipe sa propre touche pour qu'un appel rapide ne parte pas à tout le monde par erreur."
brazilian_portuguese = "Dê ao chat da equipe uma tecla própria para que um aviso rápido não chegue a todos por engano."
portuguese = "Dá ao chat de equipa uma tecla própria para que um aviso rápido não chegue a todos por engano."
turkish = "Takım sohbetine ayrı bir tuş ver; böylece takımına hızlıca seslenirken yanlışlıkla herkese gitmez."
polish = "Daj czatowi drużynowemu własny klawisz, aby szybkie zawołanie do drużyny nie trafiło omyłkowo do wszystkich."

[[message]]
key = "Keys for your second tee: switching to it, making it jump, fire or hook, and copying your moves."
[message.translations]
simplified_chinese = "第二个 tee 的按键：切换到它、让它跳跃、开火或钩索，以及复制你的操作。"
traditional_chinese = "第二個 tee 的按鍵：切換到它、讓它跳躍、開火或鉤索，以及複製你的操作。"
japanese = "二つ目の tee 用のキー。切り替え、ジャンプ・射撃・フック、そして自分の動きのコピーです。"
korean = "두 번째 tee를 위한 키로, 전환하고 점프·발사·갈고리를 시키며 내 움직임을 복사합니다."
russian = "Клавиши для второго tee: переключение на него, прыжок, выстрел и крюк, а также копирование ваших движений."
german = "Tasten für deinen zweiten Tee: umschalten, springen, schießen, haken und deine Bewegungen kopieren."
spanish = "Teclas para tu segundo tee: cambiar a él, hacer que salte, dispare o use el gancho, y copiar tus movimientos."
french = "Touches pour ton second tee : basculer dessus, le faire sauter, tirer ou crocheter, et copier tes mouvements."
brazilian_portuguese = "Teclas para o seu segundo tee: alternar para ele, fazê-lo pular, atirar ou usar o gancho, e copiar seus movimentos."
portuguese = "Teclas para o teu segundo tee: alternar para ele, fazê-lo saltar, disparar ou usar o gancho, e copiar os teus movimentos."
turkish = "İkinci tee için tuşlar: ona geçiş, zıplatma, ateş ettirme veya kanca attırma ve hareketlerini kopyalama."
polish = "Klawisze drugiego tee: przełączanie na niego, skok, strzał i hak oraz kopiowanie twoich ruchów."

[[message]]
key = "Click the key field beside \"Toggle dummy\", \"Dummy jump\" or \"Dummy copy\" and press the key you want."
[message.translations]
simplified_chinese = "点切换分身、分身跳或分身同步旁边的按键栏，按下想用的键。"
traditional_chinese = "點切換分身、分身跳或分身同步旁邊的按鍵欄，按下想用的鍵。"
japanese = "ダミー切り替え、ダミージャンプ、ダミーコピーの横にあるキー欄をクリックし、使いたいキーを押します。"
korean = "더미 전환, 더미 점프 또는 더미 복사 옆의 키 칸을 클릭하고 원하는 키를 누르세요."
russian = "Щёлкните поле клавиши рядом с переключением дамми, прыжком дамми или копией дамми и нажмите нужную клавишу."
german = "Klicke das Tastenfeld neben Dummy umschalten, Dummy-Sprung oder Dummy-Synchronisation an und drücke die gewünschte Taste."
spanish = "Haz clic en el campo de tecla junto a Alternar Dummy, Salto del dummy o Copia del Dummy y pulsa la tecla que quieras."
french = "Clique sur le champ de touche à côté de Basculer le dummy, Saut du Dummy ou Copie du dummy et appuie sur la touche voulue."
brazilian_portuguese = "Clique no campo de tecla ao lado de Alternar dummy, Pulo do Dummy ou Cópia do boneco e pressione a tecla desejada."
portuguese = "Clica no campo da tecla ao lado de Alternar Dummy, Salto do dummy ou Cópia do Dummy e prime a tecla que queres."
turkish = "Dummy'yi değiştir, Kukla zıplaması veya Yapay kopyalama yanındaki tuş alanına tıkla ve istediğin tuşa bas."
polish = "Kliknij pole klawisza obok Przełącz kukłę, Skok dummy lub Kopia Dummy i naciśnij wybrany klawisz."

[[message]]
key = "Learn \"Toggle dummy\" first; the other dummy keys only help once you already play with a second tee."
[message.translations]
simplified_chinese = "先学会切换分身；其他分身按键只有在你已经开始用第二个 tee 跑图时才有用。"
traditional_chinese = "先學會切換分身；其他分身按鍵只有在你已經開始用第二個 tee 跑圖時才有用。"
japanese = "まずダミー切り替えを覚えましょう。ほかのダミー用キーは、二つ目の tee で走れてから役に立ちます。"
korean = "더미 전환부터 익히세요. 나머지 더미 키는 두 번째 tee로 플레이하기 시작해야 쓸모가 있습니다."
russian = "Сначала освойте переключение дамми: остальные клавиши дамми полезны, лишь когда вы уже играете вторым tee."
german = "Lerne zuerst Dummy umschalten; die übrigen Dummy-Tasten helfen erst, wenn du schon mit einem zweiten Tee spielst."
spanish = "Aprende primero Alternar Dummy; las demás teclas del dummy solo ayudan cuando ya juegas con un segundo tee."
french = "Apprends d'abord Basculer le dummy ; les autres touches du dummy n'aident qu'une fois que tu joues avec un second tee."
brazilian_portuguese = "Aprenda primeiro Alternar dummy; as outras teclas do dummy só ajudam quando você já joga com um segundo tee."
portuguese = "Aprende primeiro Alternar Dummy; as outras teclas do dummy só ajudam quando já jogas com um segundo tee."
turkish = "Önce Dummy'yi değiştir tuşunu öğren; diğer dummy tuşları ancak ikinci tee ile oynamaya başlayınca işe yarar."
polish = "Najpierw opanuj Przełącz kukłę; pozostałe klawisze dummy pomagają dopiero, gdy grasz drugim tee."

[[message]]
key = "All remaining binds: scoreboard, spectating, console, screenshots, emoticon and practice tools."
[message.translations]
simplified_chinese = "其余所有绑定：计分板、旁观、控制台、截图、表情和练习工具。"
traditional_chinese = "其餘所有綁定：計分板、旁觀、控制台、截圖、表情和練習工具。"
