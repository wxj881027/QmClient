[[message]]
key = "Toggle team between team 0 and team mode. This mode will make your team behave like team 0."
[message.translations]
simplified_chinese = "在 team 0 和 team 模式间切换。该模式会让你的队伍按 team 0 规则运行"
traditional_chinese = "在 team 0 和 team 模式間切換。該模式會讓你的隊伍按 team 0 規則運行"
japanese = "チームをチーム 0 とチームモード間で切り替えます。このモードでは、チームがチーム 0 のように動作します。"
korean = "팀 0과 팀 모드 사이를 전환합니다. 이 모드는 팀이 팀 0처럼 작동하게 합니다."
russian = "Переключить команду между командой 0 и командным режимом. Этот режим заставит вашу команду вести себя как команда 0."
german = "Team zwischen Team 0 und Team-Modus umschalten. Dieser Modus bewirkt, dass sich dein Team wie Team 0 verhält."
spanish = "Alternar equipo entre equipo 0 y modo equipo. Este modo hará que tu equipo se comporte como el equipo 0."
french = "Basculer l'équipe entre l'équipe 0 et le mode équipe. Ce mode fera en sorte que votre équipe se comporte comme l'équipe 0."
brazilian_portuguese = "Alternar equipe entre equipe 0 e modo de equipe. Este modo fará sua equipe se comportar como equipe 0."
portuguese = "Alternar equipa entre equipa 0 e modo de equipa. Este modo fará a tua equipa comportar-se como a equipa 0."
turkish = "Takım 0 ile takım modu arasında geçiş yap. Bu mod, takımının takım 0 gibi davranmasını sağlayacaktır."
polish = "Przełącz drużynę między drużyną 0 a trybem drużynowym. Ten tryb sprawi, że twoja drużyna będzie zachowywać się jak drużyna 0."

[[message]]
key = "Toggle team lock so no one else can join and so the team restarts when a player dies. /lock 0 to unlock, /lock 1 to lock"
[message.translations]
simplified_chinese = "切换队伍锁定，这样其他人就无法加入，因此当一名玩家死亡时队伍会重新开始。/lock 0 解锁，/lock 1 锁定"
traditional_chinese = "切換隊伍鎖定，這樣其他人就無法加入，因此當一名玩家死亡時隊伍會重新開始。/lock 0 解鎖，/lock 1 鎖定"
japanese = "チームロックを切り替え、他のプレイヤーが参加できなくなり、プレイヤーが死亡するとチームが再開します。/lock 0 でロック解除、/lock 1 でロック"
korean = "팀 잠금을 전환하여 다른 사람이 참가할 수 없고 플레이어가 죽으면 팀이 다시 시작됩니다. /lock 0으로 잠금 해제, /lock 1로 잠금"
russian = "Переключить блокировку команды, чтобы никто другой не мог присоединиться, и команда перезапускалась при смерти игрока. /lock 0 для разблокировки, /lock 1 для блокировки"
german = "Team-Sperre umschalten, sodass niemand anderes beitreten kann und das Team neu startet, wenn ein Spieler stirbt. /lock 0 zum Entsperren, /lock 1 zum Sperren"
spanish = "Alternar bloqueo del equipo para que nadie más pueda unirse y el equipo se reinicie cuando un jugador muera. /lock 0 para desbloquear, /lock 1 para bloquear"
french = "Basculer le verrouillage de l'équipe pour que personne d'autre ne puisse rejoindre et que l'équipe redémarre lorsqu'un joueur meurt. /lock 0 pour déverrouiller, /lock 1 pour verrouiller"
brazilian_portuguese = "Alternar bloqueio de equipe para que ninguém mais possa entrar e a equipe reinicie quando um jogador morrer. /lock 0 para destrancar, /lock 1 para trancar"
portuguese = "Alternar bloqueio de equipa para que ninguém mais possa entrar e para que a equipa recomece quando um jogador morre. /lock 0 para desbloquear, /lock 1 para bloquear"
turkish = "Takım kilidini değiştir, böylece başka hiç kimse katılamaz ve bir oyuncu öldüğünde takım yeniden başlar. Kilidi açmak için /lock 0, kilitlemek için /lock 1"
polish = "Przełącz blokadę drużyny, aby nikt inny nie mógł dołączyć, a drużyna restartowała się, gdy gracz umrze. /lock 0 aby odblokować, /lock 1 aby zablokować"

