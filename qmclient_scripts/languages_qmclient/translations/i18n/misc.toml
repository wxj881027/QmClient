german = "Konnte das angegebene Grafik-Backend nicht initialisieren, wechsle jetzt zum Standard-Backend."
spanish = "No se pudo inicializar el backend gráfico dado, revirtiendo al backend predeterminado ahora."
french = "Impossible d'initialiser le backend graphique donné, retour au backend par défaut maintenant."
brazilian_portuguese = "Não foi possível inicializar o backend gráfico fornecido, revertendo para o backend padrão agora."
portuguese = "Não foi possível inicializar o backend gráfico fornecido, a reverter para o backend padrão agora."
turkish = "Verilen grafik arka ucu başlatılamadı, şimdi varsayılan arka uca dönülüyor."
polish = "Nie można zainicjować podanego backendu graficznego, przywracanie domyślnego backendu."

[[message]]
key = "Could not initialize the given graphics backend, this is probably because you didn't install the driver of the integrated graphics card."
context = "Graphics error"
[message.translations]
simplified_chinese = "无法初始化当前配置的图形后端，请检查此电脑是否已安装集成显卡的驱动程序。"
traditional_chinese = "無法初始化當前配置的圖形後端，請檢查此電腦是否已安裝集成顯卡的驅動程序。"
japanese = "指定のグラフィックスバックエンドを初期化できませんでした。内蔵グラフィックカードのドライバがインストールされていない可能性があります。"
korean = "지정된 그래픽 백엔드를 초기화할 수 없습니다. 통합 그래픽 카드 드라이버가 설치되지 않았을 수 있습니다."
russian = "Не удалось инициализировать указанный графический бэкенд. Вероятно, вы не установили драйвер встроенной видеокарты."
german = "Konnte das angegebene Grafik-Backend nicht initialisieren. Dies liegt wahrscheinlich daran, dass der Treiber der integrierten Grafikkarte nicht installiert ist."
spanish = "No se pudo inicializar el backend gráfico dado, probablemente porque no instalaste el controlador de la tarjeta gráfica integrada."
french = "Impossible d'initialiser le backend graphique donné, probablement parce que vous n'avez pas installé le pilote de la carte graphique intégrée."
brazilian_portuguese = "Não foi possível inicializar o backend gráfico fornecido, provavelmente porque você não instalou o driver da placa gráfica integrada."
portuguese = "Não foi possível inicializar o backend gráfico fornecido, provavelmente porque não instalaste o driver da placa gráfica integrada."
turkish = "Verilen grafik arka ucu başlatılamadı, bunun nedeni muhtemelen tümleşik grafik kartının sürücüsünü yüklememiş olmanızdır."
polish = "Nie można zainicjować podanego backendu graficznego, prawdopodobnie dlatego, że nie zainstalowałeś sterownika zintegrowanej karty graficznej."

[[message]]
key = "Failed during initialization. Try to change gfx_backend to OpenGL or Vulkan in settings_ddnet.cfg in the config directory and try again."
context = "Graphics error"
[message.translations]
simplified_chinese = "初始化失败。请尝试打开配置目录中的 settings_ddnet.cfg 文件，将 gfx_backend 改为 OpenGL 或 Vulkan 再重试。"
traditional_chinese = "初始化失敗。請嘗試打開配置目錄中的 settings_ddnet.cfg 文件，將 gfx_backend 改為 OpenGL 或 Vulkan 再重試。"
japanese = "初期化中に失敗しました。設定ディレクトリの settings_ddnet.cfg で gfx_backend を OpenGL または Vulkan に変更して、もう一度試してください。"
korean = "초기화 중 실패했습니다. 설정 디렉토리의 settings_ddnet.cfg 에서 gfx_backend 를 OpenGL 또는 Vulkan 으로 변경한 후 다시 시도하세요."
russian = "Ошибка инициализации. Попробуйте изменить gfx_backend на OpenGL или Vulkan в файле settings_ddnet.cfg в папке конфигурации и повторите попытку."
german = "Fehler bei der Initialisierung. Versuche, gfx_backend in settings_ddnet.cfg im Konfigurationsverzeichnis auf OpenGL oder Vulkan zu ändern und versuche es erneut."
spanish = "Falló durante la inicialización. Intenta cambiar gfx_backend a OpenGL o Vulkan en settings_ddnet.cfg en el directorio de configuración e inténtalo de nuevo."
french = "Échec lors de l'initialisation. Essayez de changer gfx_backend en OpenGL ou Vulkan dans settings_ddnet.cfg dans le répertoire de configuration et réessayez."
brazilian_portuguese = "Falha durante a inicialização. Tente alterar gfx_backend para OpenGL ou Vulkan em settings_ddnet.cfg no diretório de configuração e tente novamente."
portuguese = "Falha durante a inicialização. Tenta mudar gfx_backend para OpenGL ou Vulkan no ficheiro settings_ddnet.cfg no diretório de configuração e tenta novamente."
turkish = "Başlatma sırasında başarısız oldu. Yapılandırma dizinindeki settings_ddnet.cfg dosyasında gfx_backend'i OpenGL veya Vulkan olarak değiştirmeyi ve tekrar denemeyi deneyin."
polish = "Niepowodzenie podczas inicjalizacji. Spróbuj zmienić gfx_backend na OpenGL lub Vulkan w settings_ddnet.cfg w katalogu konfiguracyjnym i spróbuj ponownie."

[[message]]
key = "Failed to swap framebuffers. Try to update your GPU drivers."
context = "Graphics error"
[message.translations]
simplified_chinese = "帧缓存交替失败。请尝试更新显卡驱动程序。"
traditional_chinese = "幀緩存交替失敗。請嘗試更新顯卡驅動程序。"
japanese = "フレームバッファのスワップに失敗しました。GPU ドライバーを更新してみてください。"
korean = "프레임버퍼 교체 실패. GPU 드라이버를 업데이트해 보세요."
russian = "Не удалось переключить буферы кадров. Попробуйте обновить драйверы GPU."
german = "Fehler beim Tauschen der Framebuffer. Versuche, deine GPU-Treiber zu aktualisieren."
spanish = "Falló al intercambiar framebuffers. Intenta actualizar los controladores de tu GPU."
french = "Échec de l'échange des tampons d'images. Essayez de mettre à jour vos pilotes GPU."
brazilian_portuguese = "Falha ao trocar framebuffers. Tente atualizar seus drivers de GPU."
portuguese = "Falha ao trocar framebuffers. Tenta atualizar os drivers da GPU."
turkish = "Kare tamponları değiştirilemedi. GPU sürücülerinizi güncellemeyi deneyin."
polish = "Nie udało się zamienić buforów ramki. Spróbuj zaktualizować sterowniki GPU."

[[message]]
key = "Out of VRAM. Try setting 'cl_skins_loaded_max' to a lower value or remove custom assets (skins, entities, etc.), especially those with high resolution."
context = "Graphics error"
[message.translations]
simplified_chinese = "显存不足。请尝试将 'cl_skins_loaded_max' 设置为较低的值或移除自定义资源（皮肤、实体等），尤其是高分辨率的资源。"
traditional_chinese = "顯存不足。請嘗試將 'cl_skins_loaded_max' 設置為較低的值或移除自定義資源（皮膚、實體等），尤其是高分辨率的資源。"
japanese = "VRAM 不足。'cl_skins_loaded_max' を低い値に設定するか、カスタムアセット（スキン、エンティティなど）、特に高解像度のものを削除してください。"
korean = "VRAM 부족. 'cl_skins_loaded_max' 값을 낮추거나 사용자 정의 자산(스킨, 엔티티 등), 특히 고해상도 자산을 제거해 보세요."
russian = "Не хватает видеопамяти. Попробуйте установить 'cl_skins_loaded_max' на меньшее значение или удалить пользовательские ресурсы (скины, сущности и т.д.), особенно с высоким разрешением."
german = "VRAM erschöpft. Versuche, 'cl_skins_loaded_max' auf einen niedrigeren Wert zu setzen oder benutzerdefinierte Assets (Skins, Entitäten usw.) zu entfernen, insbesondere solche mit hoher Auflösung."
spanish = "Sin VRAM. Intenta establecer 'cl_skins_loaded_max' a un valor más bajo o eliminar activos personalizados (skins, entidades, etc.), especialmente aquellos de alta resolución."
french = "Mémoire VRAM insuffisante. Essayez de définir 'cl_skins_loaded_max' sur une valeur plus basse ou de supprimer les ressources personnalisées (skins, entités, etc.), surtout celles à haute résolution."
brazilian_portuguese = "Sem VRAM. Tente definir 'cl_skins_loaded_max' para um valor mais baixo ou remover assets personalizados (skins, entidades, etc.), especialmente aqueles com alta resolução."
portuguese = "Sem VRAM. Tenta definir 'cl_skins_loaded_max' para um valor mais baixo ou remove assets personalizados (skins, entidades, etc.), especialmente os de alta resolução."
turkish = "VRAM yetersiz. 'cl_skins_loaded_max' değerini daha düşük bir değere ayarlamayı veya özel varlıkları (skinler, varlıklar vb.), özellikle yüksek çözünürlüklü olanları kaldırmayı deneyin."
polish = "Brak VRAM. Spróbuj ustawić 'cl_skins_loaded_max' na niższą wartość lub usuń niestandardowe zasoby (skiny, encje itp.), zwłaszcza te o wysokiej rozdzielczości."

[[message]]
key = "Submitting the render commands failed. Try to update your GPU drivers."
