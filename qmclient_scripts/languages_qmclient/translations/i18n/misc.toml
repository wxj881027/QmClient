[message.translations]
japanese = "不明なエラー。設定ディレクトリの qmclient/settings.cfg で gfx_backend を OpenGL または Vulkan に変更して、再試行してください。"
korean = "알 수 없는 오류입니다. 설정 디렉터리의 qmclient/settings.cfg에서 gfx_backend를 OpenGL 또는 Vulkan으로 변경하고 다시 시도하세요."
simplified_chinese = "未知错误。请尝试打开配置目录中的设置文件（qmclient/settings.cfg）并将 “gfx_backend” 设置为 “gfx_backend OpenGL” 或 “gfx_backend Vulkan” 再重试。"
traditional_chinese = "未知錯誤。請嘗試打開配置目錄中的設定檔（qmclient/settings.cfg）並將「gfx_backend」設定為「gfx_backend OpenGL」或「gfx_backend Vulkan」再重試。"
russian = "Неизвестная ошибка. Попробуйте изменить gfx_backend на OpenGL или Vulkan в файле qmclient/settings.cfg в папке конфигурации и повторите попытку."
german = "Unbekannter Fehler. Versuche, gfx_backend in qmclient/settings.cfg im Konfigurationsverzeichnis auf OpenGL oder Vulkan zu ändern und versuche es erneut."
spanish = "Error desconocido. Intenta cambiar gfx_backend a OpenGL o Vulkan en qmclient/settings.cfg en el directorio de configuración e inténtalo de nuevo."
french = "Erreur inconnue. Essayez de changer gfx_backend en OpenGL ou Vulkan dans qmclient/settings.cfg dans le répertoire de configuration et réessayez."
brazilian_portuguese = "Erro desconhecido. Tente alterar gfx_backend para OpenGL ou Vulkan em qmclient/settings.cfg no diretório de configuração e tente novamente."
portuguese = "Erro desconhecido. Tenta mudar gfx_backend para OpenGL ou Vulkan no ficheiro qmclient/settings.cfg no diretório de configuração e tenta novamente."
turkish = "Bilinmeyen hata. Yapılandırma dizinindeki qmclient/settings.cfg dosyasında gfx_backend'i OpenGL veya Vulkan olarak değiştirmeyi ve tekrar denemeyi deneyin."
polish = "Nieznany błąd. Spróbuj zmienić gfx_backend na OpenGL lub Vulkan w qmclient/settings.cfg w katalogu konfiguracyjnym i spróbuj ponownie."

