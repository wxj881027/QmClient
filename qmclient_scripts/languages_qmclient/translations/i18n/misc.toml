simplified_chinese = "队伍已由 %s 成功存档。数据库连接失败，因此改用生成的存档码避免冲突。用 '/load %s' 继续"
traditional_chinese = "隊伍已由 %s 成功存檔。數據庫連接失敗，因此改用生成的存檔碼避免衝突。用 '/load %s' 繼續"
