turkish = "Render komutlarının gönderilmesi başarısız oldu. GPU sürücülerinizi güncellemeyi deneyin."
polish = "Przesyłanie poleceń renderowania nie powiodło się. Spróbuj zaktualizować sterowniki GPU."

