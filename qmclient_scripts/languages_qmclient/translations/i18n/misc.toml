spanish = "Equipo guardado exitosamente por %s. La conexión a la base de datos falló, usando un código de guardado generado en su lugar para evitar colisiones. Usa '/load %s' para continuar"
french = "Équipe sauvegardée avec succès par %s. La connexion à la base de données a échoué, utilisation d'un code de sauvegarde généré pour éviter les collisions. Utilisez '/load %s' pour continuer"
brazilian_portuguese = "Equipe salva com sucesso por %s. A conexão com o banco de dados falhou, usando código de save gerado para evitar colisões. Use '/load %s' para continuar"
portuguese = "Equipa guardada com sucesso por %s. A conexão à base de dados falhou, usando código de salvamento gerado para evitar colisões. Usa '/load %s' para continuar"
turkish = "Takım %s tarafından başarıyla kaydedildi. Veritabanı bağlantısı başarısız oldu, çakışmaları önlemek için bunun yerine oluşturulan kayıt kodu kullanılıyor. Devam etmek için '/load %s' kullanın"
