[[message]]
key = "Team save in progress. You'll be able to load with '/load %s' if save is successful or with '/load %s' if it fails"
[message.translations]
simplified_chinese = "正在保存队伍进度：成功后可用「/load %s」读取，失败则用「/load %s」"
traditional_chinese = "正在保存隊伍進度：成功後可用「/load %s」讀取，失敗則用「/load %s」"
japanese = "チームセーブ進行中。成功した場合は '/load %s'、失敗した場合は '/load %s' でロードできます"
korean = "팀 저장 진행 중. 성공 시 '/load %s' 로, 실패 시 '/load %s' 로 불러올 수 있습니다"
russian = "Сохранение команды выполняется. Вы сможете загрузиться с помощью '/load %s' в случае успеха или '/load %s' в случае неудачи"
german = "Teamspeicherung läuft. Du kannst mit '/load %s' laden, wenn die Speicherung erfolgreich ist, oder mit '/load %s', wenn sie fehlschlägt"
spanish = "Guardado de equipo en progreso. Podrás cargar con '/load %s' si el guardado es exitoso o con '/load %s' si falla"
french = "Sauvegarde d'équipe en cours. Vous pourrez charger avec '/load %s' si la sauvegarde réussit ou avec '/load %s' si elle échoue"
brazilian_portuguese = "Save da equipe em andamento. Você poderá carregar com '/load %s' se o save for bem-sucedido ou com '/load %s' se falhar"
portuguese = "Salvamento de equipa em progresso. Poderás carregar com '/load %s' se o salvamento for bem-sucedido ou com '/load %s' se falhar"
turkish = "Takım kaydı devam ediyor. Kayıt başarılı olursa '/load %s' ile veya başarısız olursa '/load %s' ile yükleyebileceksiniz"
polish = "Trwa zapisywanie drużyny. Będziesz mógł załadować za pomocą '/load %s', jeśli zapis się powiedzie, lub '/load %s', jeśli się nie powiedzie"

[[message]]
key = "Team successfully saved by %s. The database connection failed, using generated save code instead to avoid collisions. Use '/load %s' on %s to continue"
[message.translations]
simplified_chinese = "队伍已由 %s 成功存档。数据库连接失败，因此改用生成的存档码避免冲突。请在 %s 上用 '/load %s' 继续"
traditional_chinese = "隊伍已由 %s 成功存檔。數據庫連接失敗，因此改用生成的存檔碼避免衝突。請在 %s 上用 '/load %s' 繼續"
japanese = "%s がチームを保存しました。データベース接続に失敗したため、衝突を避けるために生成されたセーブコードを使用します。%s で '/load %s' を使用して続行してください"
korean = "%s 님이 팀을 성공적으로 저장했습니다. 데이터베이스 연결에 실패하여 충돌을 피하기 위해 생성된 저장 코드를 대신 사용합니다. %s 에서 '/load %s' 를 사용하여 계속하세요"
russian = "Команда успешно сохранена %s. Соединение с базой данных не удалось, используется сгенерированный код сохранения во избежание коллизий. Используйте '/load %s' на %s для продолжения"
german = "Team erfolgreich von %s gespeichert. Die Datenbankverbindung ist fehlgeschlagen, stattdessen wird ein generierter Speichercode verwendet, um Kollisionen zu vermeiden. Verwende '/load %s' auf %s, um fortzufahren"
spanish = "Equipo guardado exitosamente por %s. La conexión a la base de datos falló, usando un código de guardado generado en su lugar para evitar colisiones. Usa '/load %s' en %s para continuar"
french = "Équipe sauvegardée avec succès par %s. La connexion à la base de données a échoué, utilisation d'un code de sauvegarde généré pour éviter les collisions. Utilisez '/load %s' sur %s pour continuer"
brazilian_portuguese = "Equipe salva com sucesso por %s. A conexão com o banco de dados falhou, usando código de save gerado para evitar colisões. Use '/load %s' em %s para continuar"
portuguese = "Equipa guardada com sucesso por %s. A conexão à base de dados falhou, usando código de salvamento gerado para evitar colisões. Usa '/load %s' em %s para continuar"
turkish = "Takım %s tarafından başarıyla kaydedildi. Veritabanı bağlantısı başarısız oldu, çakışmaları önlemek için bunun yerine oluşturulan kayıt kodu kullanılıyor. Devam etmek için %s üzerinde '/load %s' kullanın"
polish = "Drużyna pomyślnie zapisana przez %s. Połączenie z bazą danych nie powiodło się, użyto wygenerowanego kodu zapisu, aby uniknąć kolizji. Użyj '/load %s' na %s, aby kontynuować"

[[message]]
key = "Team successfully saved by %s. The database connection failed, using generated save code instead to avoid collisions. Use '/load %s' to continue"
