<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bind 界面原型 · QmClient</title>
<style>
  :root{
    --ink:#f7fbfe;
    --muted:rgba(247,251,254,.72);
    --faint:rgba(247,251,254,.52);
    --line:rgba(255,255,255,.22);
    --glass:rgba(255,255,255,.12);
    --glass2:rgba(255,255,255,.08);
    --dark:#1b2833;
    --teal:#7ff0d8;
    --amber:#ffcf7a;
    --red:#ff9f98;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SFMono-Regular",monospace;
    --sans:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#0d1216;font-family:var(--sans);color:#dfe8f0}
  .page{display:flex;flex-direction:column;align-items:center;gap:34px;padding:36px 0 60px}
  .shot{margin:0;display:flex;flex-direction:column;gap:10px}
  .shot figcaption{color:#7d8b99;font-size:13px;padding-left:4px;letter-spacing:.02em}
  .shot figcaption b{color:#b9c7d4;font-weight:600}

  .artboard{position:relative;width:1280px;height:800px;overflow:hidden;font-family:var(--sans);color:var(--ink);isolation:isolate}
  .scene{position:absolute;inset:-24px;background:linear-gradient(180deg,#8fc4dd 0%,#a6cdb4 36%,#87b070 60%,#4f7346 100%);filter:saturate(.72) brightness(.52)}
  .scene:before{content:"";position:absolute;left:-12%;top:48%;width:72%;height:74%;background:radial-gradient(closest-side,#82b06c,transparent 70%);filter:blur(46px);opacity:.95}
  .scene:after{content:"";position:absolute;right:-18%;top:34%;width:86%;height:86%;background:radial-gradient(closest-side,#d6e9bd,transparent 68%);filter:blur(56px);opacity:.8}
  .scrim{position:absolute;inset:0;background:radial-gradient(120% 95% at 48% 36%,rgba(6,14,18,.30),rgba(6,14,18,.72))}
  .grain{position:absolute;inset:0;opacity:.07;background-image:radial-gradient(rgba(255,255,255,.5) .5px,transparent .5px);background-size:3px 3px;mix-blend-mode:overlay}

  .settings{position:absolute;inset:16px 20px;display:grid;grid-template-columns:minmax(0,1fr) 136px;gap:12px}
  .panel{
    position:relative;height:100%;border-radius:16px;padding:13px 16px 12px;
    background:linear-gradient(180deg,rgba(22,37,45,.82),rgba(11,22,28,.76));
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 26px 64px rgba(0,8,12,.45),inset 0 1px 0 rgba(255,255,255,.14);
    backdrop-filter:blur(22px) saturate(125%);
    display:flex;flex-direction:column;gap:9px;
  }
  .side{padding-top:44px;display:flex;flex-direction:column;gap:6px}
  .side .item{
    height:33px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;
    background:rgba(9,20,26,.55);border:1px solid rgba(255,255,255,.13);
    font-size:12.8px;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.28);
  }
  .side .item.on{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.30);font-weight:600}
  .side .gear{background:rgba(9,20,26,.35)}

  .tabs{display:flex;align-items:center;gap:8px;min-height:36px}
  .tab{
    height:35px;padding:0 17px;border-radius:999px;display:flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
    font-size:13.4px;color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .tab.on{background:rgba(255,255,255,.95);border-color:transparent;color:#1b2833;font-weight:600;text-shadow:none;box-shadow:0 5px 16px rgba(9,24,30,.16)}
  .tab svg{width:15px;height:15px}

  .rowline{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .subtabs{display:flex;gap:2px;padding:3px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);width:max-content}
  .subtab{height:27px;padding:0 15px;border-radius:8px;display:flex;align-items:center;gap:6px;font-size:12.6px;color:rgba(255,255,255,.8)}
  .subtab.on{background:rgba(255,255,255,.92);color:#1b2833;font-weight:600;box-shadow:0 3px 10px rgba(9,24,30,.12)}
  .subtabs .dot{width:5px;height:5px;border-radius:50%;background:var(--teal)}
  .hint{font-size:11.6px;color:var(--faint);display:flex;align-items:center;gap:6px}
  .hint b{color:rgba(255,255,255,.86);font-weight:600}

  .body{flex:1;min-height:0;display:flex;gap:12px}
  .col{min-height:0;display:flex;flex-direction:column;gap:9px}
  .fill{flex:1;min-width:0;min-height:0}

  .card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:11px 12px;backdrop-filter:blur(8px)}
  .card-h{font-size:11.4px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;font-weight:600}

  /* keyboard */
  .kb{padding:11px 10px 10px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.10)}
  .krow{display:flex;gap:5px;margin-bottom:5px}
  .krow:last-child{margin-bottom:0}
  .key{position:relative;height:37px;flex:0 0 38px;border-radius:7px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center;font-size:10.4px;color:rgba(255,255,255,.95);text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .key.w15{flex-basis:57px}.key.w18{flex-basis:70px}.key.w2{flex-basis:83px}.key.w23{flex-basis:96px}.key.w3{flex-basis:122px}.key.w4{flex-basis:160px}
  .key.small{font-size:9.4px}
  .key.bound:after{content:"";position:absolute;right:5px;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 7px rgba(127,240,216,.9)}
  .key.sel{background:rgba(255,255,255,.95);border-color:#fff;color:#1b2833;font-weight:700;text-shadow:none;box-shadow:0 0 0 3px rgba(255,255,255,.22),0 6px 16px rgba(9,24,30,.18)}
  .mice{display:flex;gap:8px;margin-top:9px}
  .mouse{flex:1;height:44px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:11.4px}
  .mouse.bound:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--teal);margin-left:6px;box-shadow:0 0 7px rgba(127,240,216,.9)}
  .wheel{flex:1.1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .wheel div{border-radius:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:9.4px;color:rgba(255,255,255,.8)}

  /* inspector */
  .insp{width:352px;flex:0 0 352px}
  .keytitle{display:flex;align-items:flex-end;gap:10px}
  .keytitle .big{font-size:27px;font-weight:700;line-height:1;letter-spacing:-.02em}
  .badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:10.8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:rgba(255,255,255,.92)}
  .badge.teal{background:rgba(127,240,216,.18);border-color:rgba(127,240,216,.42);color:#c9fff3}
  .badge.amber{background:rgba(255,207,122,.18);border-color:rgba(255,207,122,.44);color:#ffe6b8}
  .badge.red{background:rgba(255,159,152,.18);border-color:rgba(255,159,152,.44);color:#ffd3cf}
  .src{display:flex;align-items:center;gap:6px;font-size:11.4px;color:var(--muted)}
  .src .dot{width:5px;height:5px;border-radius:50%;background:var(--teal)}
  .src a{color:#bff7ec;text-decoration:none;border-bottom:1px dashed rgba(191,247,236,.4)}
  .node{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);font-family:var(--mono);font-size:11.2px}
  .node .grip{color:rgba(255,255,255,.35);font-size:11px}
  .node .txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eaf4fb}
  .node .del{color:rgba(255,255,255,.45);font-size:12px}
  .node + .node{margin-top:6px}
  .addrow{display:flex;gap:6px;align-items:center}
  .inputlike{flex:1;height:32px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;padding:0 10px;font-size:11.6px;color:var(--faint)}
  .btn{height:32px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:11.8px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#f4fbff}
  .btn.primary{background:rgba(255,255,255,.95);border-color:transparent;color:#1b2833;font-weight:600}
  .btn.ghost{background:transparent}
  .btn.sm{height:28px;font-size:11px;padding:0 10px}
  .stat{display:flex;justify-content:space-between;font-size:10.8px;color:var(--faint)}
  .stat b{color:rgba(255,255,255,.86);font-weight:600;font-family:var(--mono)}

  .occ{display:flex;flex-direction:column;gap:5px;margin-top:8px;min-height:0;overflow:hidden}
  .occrow{display:grid;grid-template-columns:56px minmax(0,1fr) 84px 52px;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);font-size:10.6px}
  .occrow .cmd{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .occrow .src2{font-size:10.2px;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .occrow .tag2{font-size:9.4px;color:#a9f3e3;text-align:right}
  .occrow.warn{border-color:rgba(255,207,122,.35);background:rgba(255,207,122,.07)}
  .occrow.warn .tag2{color:#ffd79a}
  .occrow.warn .keycap{border-color:rgba(255,207,122,.45)}

  .modes{display:flex;flex-direction:column;gap:6px}
  .modes div{display:flex;gap:8px;align-items:baseline;font-size:10.6px;color:rgba(255,255,255,.6)}
  .modes b{flex:0 0 58px;font-size:10.8px;color:#fff;font-weight:600}
  /* workshop */
  .chips{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
  .chip{height:29px;padding:0 12px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:11.8px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);color:rgba(255,255,255,.86)}
  .chip.on{background:rgba(255,255,255,.93);color:#1b2833;font-weight:600;border-color:transparent}
  .chip i{font-style:normal;font-size:10px;opacity:.62}
  .search{height:40px;border-radius:12px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);display:flex;align-items:center;gap:9px;padding:0 13px;color:var(--faint);font-size:12.4px}
  .search .sp{flex:1}
  .seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11)}
  .seg div{width:26px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7)}
  .seg div.on{background:rgba(255,255,255,.9);color:#1b2833}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .pcard{position:relative;display:flex;flex-direction:column;gap:7px;padding:11px 12px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);overflow:hidden}
  .pcard.applied{border-color:rgba(127,240,216,.44);background:linear-gradient(180deg,rgba(127,240,216,.10),rgba(255,255,255,.09))}
  .pcard.conflict{border-color:rgba(255,207,122,.42)}
  .pcard .top{display:flex;align-items:center;justify-content:space-between}
  .cat{font-size:10px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.82)}
  .pcard h3{margin:0;font-size:14.6px;font-weight:600;letter-spacing:-.01em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .pcard .desc{margin:0;font-size:11.2px;line-height:1.5;color:var(--muted);height:33px;overflow:hidden}
  .keyrow{display:flex;align-items:center;gap:6px;font-size:10.8px;color:var(--faint)}
  .keycap{min-width:30px;height:24px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;color:#fff}
  .keycap.empty{color:rgba(255,255,255,.45);border-style:dashed;background:transparent}
  .codebox{font-family:var(--mono);font-size:10.2px;line-height:1.55;color:#dcebf5;background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:7px 8px;height:52px;min-height:52px;flex:none;overflow:hidden;position:relative}
  .codebox:after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(180deg,transparent,rgba(8,18,24,.5))}
  .tags{display:flex;gap:4px;overflow:hidden}
  .tags span{font-size:9px;line-height:1.7;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.52)}
  .pf{display:flex;align-items:center;gap:6px;margin-top:auto}
  .pf .grow{flex:1}
  .pf .apply{height:27px;padding:0 12px;border-radius:7px;background:rgba(255,255,255,.94);color:#1b2833;font-size:11.2px;font-weight:600;display:flex;align-items:center;gap:5px}
  .pf .apply.done{background:rgba(127,240,216,.22);color:#d8fff6;border:1px solid rgba(127,240,216,.45)}
  .pf .more{width:27px;height:27px;border-radius:7px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75);font-size:12px}
  .warnline{display:flex;align-items:center;gap:5px;font-size:10.2px;color:#ffe0ae}
  .footbar{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--faint);padding-top:2px}
  .footbar .l{display:flex;gap:12px;align-items:center}

  /* blueprint */
  .bp{flex:1;min-height:0;display:grid;grid-template-columns:216px minmax(0,1fr) 294px;gap:10px}
  .pane{border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);display:flex;flex-direction:column;min-height:0}
  .pane-h{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;font-size:11.4px;letter-spacing:.06em;color:var(--faint);border-bottom:1px solid rgba(255,255,255,.10)}
  .plist{padding:8px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
  .pitem{padding:8px 9px;border-radius:8px;background:rgba(255,255,255,.035);border:1px solid transparent;font-size:11.8px;color:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:space-between}
  .pitem.on{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.22);font-weight:600}
  .pitem small{font-size:9.8px;color:var(--faint);font-weight:400}
  .newflow{margin-top:auto;padding:8px 9px;border-radius:8px;border:1px dashed rgba(255,255,255,.26);font-size:11.4px;color:rgba(255,255,255,.72);text-align:center}

  .canvas{position:relative;flex:1;min-height:0;border-radius:12px;border:1px solid rgba(255,255,255,.15);overflow:hidden;
    background-color:rgba(3,10,14,.38);
    background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);
    background-size:18px 18px}
  .cvbar{position:absolute;left:10px;top:10px;display:flex;gap:5px;align-items:center;z-index:3}
  .cvbar .pill{height:26px;padding:0 10px;border-radius:7px;background:rgba(20,32,40,.55);border:1px solid rgba(255,255,255,.16);font-size:10.6px;display:flex;align-items:center;gap:5px;color:rgba(255,255,255,.82)}
  .cvstat{position:absolute;left:12px;bottom:10px;font-size:10.4px;color:rgba(255,255,255,.55)}
  .gnode{position:absolute;width:150px;border-radius:9px;background:rgba(14,26,34,.94);border:1px solid rgba(255,255,255,.22);box-shadow:0 10px 26px rgba(5,14,20,.35)}
  .gnode .gh{height:24px;display:flex;align-items:center;gap:6px;padding:0 9px;font-size:10.4px;font-weight:600;color:#0f1c24;background:#a7d8ff;border-radius:8px 8px 0 0}
  .gnode.g2 .gh{background:#9fe8d6}
  .gnode.g3 .gh{background:#ffd79a}
  .gnode .gb{padding:7px 9px;font-family:var(--mono);font-size:9.8px;line-height:1.5;color:#e8f3fa;word-break:break-all}
  .port{position:absolute;width:8px;height:8px;border-radius:50%;background:#16222b;border:1.5px solid rgba(255,255,255,.65);top:50%;transform:translateY(-50%)}
  .port.l{left:-5px}.port.r{right:-5px}
  .cvsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .cvlabel{position:absolute;font-size:9.4px;color:rgba(255,255,255,.6);background:rgba(12,24,30,.5);padding:1px 5px;border-radius:3px}

  .insp2{padding:10px 11px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
  .field{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.2px;color:var(--muted)}
  .field b{font-weight:600;color:#fff;font-size:11.4px}
  .field .val{font-family:var(--mono);font-size:10.6px;color:#eaf4fb;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:3px 7px}
  .out{font-family:var(--mono);font-size:9.9px;line-height:1.6;color:#dff0fa;background:rgba(8,18,24,.3);border:1px solid rgba(255,255,255,.13);border-radius:8px;padding:8px;height:74px;overflow:hidden}
  .checks{display:flex;flex-direction:column;gap:4px;font-size:10.2px;color:var(--muted)}
  .checks div{display:flex;justify-content:space-between}
  .checks i{font-style:normal;color:#a9f3e3}
  .checks .warn{color:#ffd79a}

  .qrow{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;font-size:10.8px;color:rgba(255,255,255,.72);border-bottom:1px solid rgba(255,255,255,.06)}
  .qrow:last-child{border-bottom:0}
  .qrow span{font-family:var(--mono);font-size:9.8px;color:rgba(255,255,255,.45)}
  .chk2{display:flex;gap:6px;align-items:center;font-size:10.4px;color:rgba(255,255,255,.68)}
  .chk2 i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;color:#0f1c24}
  .chk2 i.on{background:#7ff0d8;border-color:#7ff0d8}
  .stage{position:absolute;left:12px;top:44px;width:460px;height:520px}
  .cvnote{position:absolute;width:330px;border:1px dashed rgba(255,255,255,.16);border-radius:10px;padding:9px 10px;font-size:10px;color:rgba(255,255,255,.55);line-height:1.65;background:rgba(255,255,255,.02)}

  /* dialog */
  .overlay{position:absolute;inset:0;background:rgba(6,14,18,.44);backdrop-filter:blur(1.5px);display:flex;align-items:center;justify-content:center}
  .dialog{width:540px;border-radius:16px;padding:18px 18px 14px;background:linear-gradient(180deg,rgba(32,46,56,.96),rgba(22,33,41,.97));border:1px solid rgba(255,255,255,.22);box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .dialog h3{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}
  .dialog .sub{font-size:11.6px;color:var(--faint);margin-bottom:12px}
  .diff{border:1px solid rgba(255,255,255,.14);border-radius:10px;overflow:hidden;margin-bottom:10px}
  .drow{display:flex;gap:12px;padding:9px 10px;font-size:11px;border-bottom:1px solid rgba(255,255,255,.09)}
  .drow:last-child{border-bottom:0}
  .drow .k{width:58px;flex:none;font-family:var(--mono);color:#fff}
  .drow .v{flex:1;min-width:0;padding-right:6px;font-family:var(--mono);font-size:10.1px;color:rgba(255,255,255,.82);word-break:normal;overflow-wrap:break-word}
  .drow .tag{flex:none;font-size:9.6px;color:#a9f3e3}
  .drow.over .tag{color:#ffd79a}
  .note{display:flex;gap:6px;align-items:flex-start;font-size:10.8px;color:rgba(255,255,255,.62);line-height:1.5;margin-bottom:12px}
  .dact{display:flex;justify-content:flex-end;gap:8px}
  .dact .btn{height:32px}
