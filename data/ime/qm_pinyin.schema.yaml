schema:
  schema_id: qm_pinyin
  name: 栖梦拼音
  version: "3"
  dependencies:
    - qm_game_aliases
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, English]
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@game_alias
    - script_translator
  filters:
    - uniquifier
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  # 简拼/首字母；已确认的歧义快捷词由独立表处理，领域词由前端合并。
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([jqxy])u$/$1v/
    - derive/^([aoe])([ioun])$/$1$1$2/
    - derive/^([aoe])(ng)?$/$1$1$2/
    - derive/iu$/iou/
    # 前后鼻音作为低优先级容错（Rime correction），完整正确拼写优先。
    - derive/([ei])n$/$1ng/correction/
    - derive/([ei])ng$/$1n/correction/
translator:
  dictionary: qm_pinyin
  enable_completion: true
  enable_sentence: true
  # 学习统一由 Qm 词库管理并从第二项展示；清除学习时不会留下 Rime 用户词继续抬高首项。
  enable_user_dict: false
menu:
  page_size: 9
game_alias:
  dictionary: qm_game_aliases
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 2
ascii_composer:
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
punctuator:
  half_shape:
    ",": "，"
    ".": "。"
    "?": "？"
    "!": "！"
    ":": "："
    ";": "；"
    "(": "（"
    ")": "）"
    "/": "/"
