name: Check clang-tidy

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      heavy_changed: ${{ steps.changed.outputs.heavy_changed }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Classify changed paths
      id: changed
      run: python3 qmclient_scripts/gate/tools/ci_changed_paths.py

  check-clang-tidy:
    needs: changes
    if: needs.changes.outputs.heavy_changed == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false
      CLANG_VERSION: 22
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # PR / merge queue 只扫本次改动涉及的 TU（约 8 分钟），全量扫描（约 75 分钟）
      # 留给 master 推送与定时任务。改动里只要出现头文件或构建脚本，脚本会自动
      # 退回全量——头文件被许多 TU 包含，只重编改名的那几个 .cpp 会漏掉影响面。
      CLANG_TIDY_CHANGED_ONLY: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '1' || '' }}
      CLANG_TIDY_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Prepare Linux
      uses: ./.github/actions/linux-deps
      with:
        # MYSQL/WEBSOCKETS/UPNP 三个可选特性构建需要，主清单不装。
        extra: libmariadb-dev libwebsockets-dev libminiupnpc-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

    - name: Install Clang 22
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg lsb-release
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh "$CLANG_VERSION" all

    - name: Run clang-tidy
      run: python3 qmclient_scripts/gate/tools/clang_tidy_build.py

    - name: Build Optional Features
      # 只验证「全套可选特性能否编译」，与本次 diff 无关：PR 上每个组合都重编一遍
      # 要 17 分钟，收益却由 master 推送覆盖。PR / merge queue 跳过。
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
      run: |
        mkdir clang-tidy
        cd clang-tidy
        # 可选特性构建保留 CMake 清单告警，不将既有 source list 漂移升级为错误。
        # 主 clang-tidy 扫描负责 required gate；这一步只验证「完整特性配置能否编译」，
        # 因此不再挂 clang-tidy：重复跑一遍全量静态分析曾占掉这里 46 分钟，
        # 而它的结论已由上面的主扫描给出。
        cmake -G Ninja \
          -DCMAKE_CXX_COMPILER="clang++-${CLANG_VERSION}" \
          -DCMAKE_C_COMPILER="clang-${CLANG_VERSION}" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DANTIBOT=ON \
          -DAUTOUPDATE=ON \
          -DDISCORD=ON \
          -DMYSQL=ON \
          -DSTEAM=ON \
          -DUPNP=ON \
          -DVIDEORECORDER=ON \
          -DVULKAN=ON \
          -DWEBSOCKETS=ON \
          -Wno-error=author ..
        cmake --build . --config Debug --target everything -- -k 0

    - name: Upload clang-tidy log
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: clang-tidy-log
        path: build-clang-tidy/clang-tidy.log
        retention-days: 7
        overwrite: true
        if-no-files-found: ignore

    - name: Write CI summary
      if: always()
      run: |
        python3 qmclient_scripts/gate/tools/ci_summary.py \
          --kind clang-tidy \
          --status "${{ job.status }}" \
          --log build-clang-tidy/clang-tidy.log \
          --output "$GITHUB_STEP_SUMMARY"
      shell: bash

    - name: Upload CI summary
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ci-summary-clang-tidy
        path: tmp/ci-summary-clang-tidy.md
        retention-days: 7
        overwrite: true
        if-no-files-found: ignore
