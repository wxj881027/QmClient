name: Check ASan & UBSan

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.changed.outputs.runtime_changed }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Classify changed paths
      id: changed
      run: python3 qmclient_scripts/gate/tools/ci_changed_paths.py

  check-clang-san:
    needs: changes
    if: needs.changes.outputs.runtime_changed == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      UBSAN_OPTIONS: "suppressions=${{ github.workspace }}/ubsan.supp:log_path=SAN:print_stacktrace=1:halt_on_error=0"
      ASAN_OPTIONS: log_path=SAN:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1:detect_leaks=1:halt_on_error=0
      LSAN_OPTIONS: "suppressions=${{ github.workspace }}/lsan.supp"
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Prepare Linux
      run: |
        sudo apt-get update -y
        sudo apt-get install pkg-config cmake ninja-build python3-fonttools python3-pil libfreetype6-dev libnotify-dev libsdl2-dev libsqlite3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libx264-dev libglew-dev libgl1-mesa-dev libvulkan-dev glslang-tools spirv-tools -y

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

    - name: Build with ASan and UBSan
      run: |
        set -o pipefail
        rm -f clang-sanitizer-sanitizer.log
        rm -f clang-sanitizer-client-server.status clang-sanitizer-tests.status clang-sanitizer-integration.status
        mkdir clang-sanitizer
        cd clang-sanitizer
        export CC=clang
        export CXX=clang++
        SAN_FLAGS="-fsanitize=address,undefined,leak -fsanitize-recover=all -fno-omit-frame-pointer -fno-common"
        export CXXFLAGS="$SAN_FLAGS"
        export CFLAGS="$SAN_FLAGS"
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -DHEADLESS_CLIENT=ON -DVULKAN=OFF -DDOWNLOAD_GTEST=ON -DDEV=ON .. 2>&1 | tee ../clang-sanitizer-configure.log
        cmake --build . --config Debug --target everything 2>&1 | tee ../clang-sanitizer-build.log

    - name: Run server and headless client with ASan and UBSan
      continue-on-error: true
      run: |
        set -o pipefail
        cd clang-sanitizer
        rm -f SAN.*
        set +e
        ./DDNet "cl_download_skins 0;quit" 2>&1 | tee ../clang-sanitizer-client.log
        client_result=$?
        ./DDNet-Server shutdown 2>&1 | tee ../clang-sanitizer-server.log
        server_result=$?
        set -e
        if [ $client_result -ne 0 ]; then
          echo -e "\033[31mFAILED: Client exit code $client_result\033[m"
          failed=true
        fi
        if [ $server_result -ne 0 ]; then
          echo -e "\033[31mFAILED: Server exit code $server_result\033[m"
          failed=true
        fi
        san_files=$(find . -maxdepth 1 -type f -name 'SAN.*' | sort)
        if [ -n "$san_files" ]; then
          echo -e "\033[31mFAILED: Sanitizer errors:\033[m"
          while IFS= read -r san_file; do
            [ -n "$san_file" ] || continue
            echo "===== ${san_file#./} =====" | tee -a ../clang-sanitizer-sanitizer.log
            cat "$san_file" | tee -a ../clang-sanitizer-sanitizer.log
          done <<< "$san_files"
          failed=true
        fi
        if [ "$failed" = true ]; then
          echo "failed" > ../clang-sanitizer-client-server.status
          exit 1
        fi
        echo "passed" > ../clang-sanitizer-client-server.status

    - name: Run unit tests with ASan and UBSan
      continue-on-error: true
      run: |
        set -o pipefail
        cd clang-sanitizer
        rm -f SAN.*
        set +e
        # Rust tests work locally, but still not in CI, even with the same directory
        cmake --build . --config Debug --target run_cxx_tests 2>&1 | tee ../clang-sanitizer-tests.log
        unit_test_result=$?
        set -e
        failed=false
        if [ $unit_test_result -ne 0 ]; then
          echo -e "\033[31mFAILED: Unit test exit code $unit_test_result\033[m"
          failed=true
        fi
        san_files=$(find . -maxdepth 1 -type f -name 'SAN.*' | sort)
        if [ -n "$san_files" ]; then
          echo -e "\033[31mFAILED: Sanitizer errors:\033[m"
          while IFS= read -r san_file; do
            [ -n "$san_file" ] || continue
            echo "===== ${san_file#./} =====" | tee -a ../clang-sanitizer-sanitizer.log
            cat "$san_file" | tee -a ../clang-sanitizer-sanitizer.log
          done <<< "$san_files"
          failed=true
        fi
        if [ "$failed" = true ]; then
          echo "failed" > ../clang-sanitizer-tests.status
          exit 1
        fi
        echo "passed" > ../clang-sanitizer-tests.status

    - name: Build mastersrv
      run: |
        set -o pipefail
        cd src/mastersrv
        cargo build 2>&1 | tee ../../clang-sanitizer-mastersrv.log
        cp target/debug/mastersrv ../../clang-sanitizer

    - name: Run integration tests with ASan and UBSan
      continue-on-error: true
      run: |
        set -o pipefail
        cd clang-sanitizer
        rm -f integration_*/SAN.*
        set +e
        python ../scripts/integration_test.py --test-mastersrv . 2>&1 | tee ../clang-sanitizer-integration.log
        integration_test_result=$?
        set -e
        failed=false
        if [ $integration_test_result -ne 0 ]; then
          echo -e "\033[31mFAILED: Integration test exit code $integration_test_result\033[m"
          failed=true
        fi
        san_files=$(find . -maxdepth 2 -type f -path './integration_*/SAN.*' | sort)
        if [ -n "$san_files" ]; then
          echo -e "\033[31mFAILED: Sanitizer errors:\033[m"
          while IFS= read -r san_file; do
            [ -n "$san_file" ] || continue
            echo "===== ${san_file#./} =====" | tee -a ../clang-sanitizer-sanitizer.log
            cat "$san_file" | tee -a ../clang-sanitizer-sanitizer.log
          done <<< "$san_files"
          failed=true
        fi
        if [ "$failed" = true ]; then
          echo "failed" > ../clang-sanitizer-integration.status
          exit 1
        fi
        echo "passed" > ../clang-sanitizer-integration.status

    - name: Fail if ASan or UBSan checks failed
      run: |
        failed=false
        for status_file in clang-sanitizer-client-server.status clang-sanitizer-tests.status clang-sanitizer-integration.status; do
          if [ ! -f "$status_file" ]; then
            echo -e "\033[31mFAILED: Missing sanitizer status file $status_file\033[m"
            failed=true
            continue
          fi
          status=$(cat "$status_file")
          echo "$status_file: $status"
          if [ "$status" != "passed" ]; then
            failed=true
          fi
        done
        if [ "$failed" = true ]; then
          exit 1
        fi

    - name: Summarize ASan and UBSan
      if: always()
      run: |
        python3 qmclient_scripts/gate/tools/ci_summary.py \
          --kind sanitizer \
          --status "${{ job.status }}" \
          --logs clang-sanitizer-configure.log clang-sanitizer-build.log clang-sanitizer-client.log clang-sanitizer-server.log clang-sanitizer-tests.log clang-sanitizer-mastersrv.log clang-sanitizer-integration.log clang-sanitizer-sanitizer.log \
          --output "$GITHUB_STEP_SUMMARY"
