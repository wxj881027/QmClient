name: Diagnose macOS failures

# 临时诊断工作流：用 macOS runner 当调试机，抓 macOS 上测试失败的现场。
# 诊断完成后删除本文件。

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          for pkg in cmake ninja pkg-config python freetype libpng libogg opus opusfile sqlite wavpack ffmpeg; do
            if brew list --formula "$pkg" &>/dev/null; then
              brew link --overwrite "$pkg" 2>/dev/null || true
            else
              brew install "$pkg"
            fi
          done

      - name: Configure
        run: |
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DDOWNLOAD_GTEST=ON \
            -DPREFER_BUNDLED_LIBS=OFF -DVULKAN=OFF -DMETAL=ON \
            -DCMAKE_OSX_SYSROOT="${SDKROOT}" -DIPO=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build testrunner
        run: cmake --build build --target testrunner -j 4

      - name: Toolchain exception probe
        run: |
          cat > /tmp/thr.cpp <<'CPP'
          #include <cstdio>
          #include <stdexcept>
          #include <thread>
          int main()
          {
          	try
          	{
          		std::thread Worker([] { throw std::runtime_error("probe"); });
          		Worker.join();
          	}
          	catch(const std::exception &Error)
          	{
          		std::printf("caught: %s\n", Error.what());
          		return 0;
          	}
          	std::printf("not caught\n");
          	return 1;
          }
          CPP
          clang++ -std=c++20 -O2 -o /tmp/thr /tmp/thr.cpp
          /tmp/thr
          echo "probe_exit=$?"
          clang++ --version

      - name: Dump exception and unwind flags
        run: |
          python3 - <<'PY'
          import json, shlex
          data = json.load(open('build/compile_commands.json'))
          keys = ('qm_font_scan_failure_test', 'jobs.cpp', 'qm_font_scan_job', 'test.cpp')
          for entry in data:
              path = entry['file']
              if not any(k in path for k in keys):
                  continue
              cmd = entry.get('command') or ' '.join(entry.get('arguments', []))
              flags = [a for a in shlex.split(cmd) if ('exception' in a or 'unwind' in a or 'stdlib' in a or a.startswith('-O') or a.startswith('-g') or 'visibility' in a)]
              print(path.split('/')[-1], '->', flags)
          joined = ' '.join(e.get('command') or ' '.join(e.get('arguments', [])) for e in data)
          print('--- -fno-exceptions anywhere:', '-fno-exceptions' in joined)
          print('--- -fno-unwind-tables anywhere:', '-fno-unwind-tables' in joined)
          print('--- -fno-asynchronous-unwind-tables anywhere:', '-fno-asynchronous-unwind-tables' in joined)
          PY

      - name: Run each font scan failure test separately
        run: |
          cd build
          for t in EnumerationExceptionDoesNotTerminateWorkerOrBlockNextJob ReadExceptionPublishesOnlyPreviouslyCompletedFiles AllocationExceptionLeavesFinishedEmptyScan FailedRestoreAllowsChangedSelectionToStartNewRequest; do
            echo "=== $t ==="
            ./testrunner --gtest_filter="QmFontScanFailure.$t" 2>&1 | tail -20
            echo "exit=${PIPESTATUS[0]}"
          done

      - name: lldb terminate backtrace
        run: |
          cd build
          lldb --batch -o 'breakpoint set -n std::terminate' \
            -o 'run --gtest_filter=QmFontScanFailure.EnumerationExceptionDoesNotTerminateWorkerOrBlockNextJob' \
            -o 'thread list' -o 'bt all' ./testrunner 2>&1 | tail -120 || true

      - name: lldb throw backtrace
        run: |
          cd build
          lldb --batch -o 'breakpoint set -n __cxa_throw' \
            -o 'run --gtest_filter=QmFontScanFailure.EnumerationExceptionDoesNotTerminateWorkerOrBlockNextJob' \
            -o 'bt 10' ./testrunner 2>&1 | tail -60 || true

      - name: Unwind metadata sanity
        run: |
          cd build
          otool -l testrunner | grep -i -A3 unwind | head -30 || true
          nm -m testrunner 2>/dev/null | grep -i personality | head -5 || true
          ls -la testrunner
