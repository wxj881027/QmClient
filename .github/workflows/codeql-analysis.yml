# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
name: "CodeQL"

on:
  push:
    branches: [main, master]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main, master]
  merge_group:
  schedule:
    - cron: '0 13 * * 0'

permissions:
  contents: read
  security-events: write  # Required to upload CodeQL results to code scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      heavy_changed: ${{ steps.changed.outputs.heavy_changed }}
      python_changed: ${{ steps.changed.outputs.python_changed }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Classify changed paths
      id: changed
      run: python3 qmclient_scripts/gate/tools/ci_changed_paths.py

  analyze:
    name: Analyze
    needs: changes
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      fail-fast: false
      matrix:
        # Override automatic language detection by changing the below list
        # Supported options are ['csharp', 'cpp', 'go', 'java', 'javascript', 'python']
        language: ['cpp', 'python']
        # Learn more...
        # https://docs.github.com/en/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#overriding-automatic-language-detection

    steps:
    - name: Classify whether to run
      id: classify
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "should_run_cpp=$( [ '${{ matrix.language }}' = 'cpp' ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
        elif [ "${{ matrix.language }}" = "cpp" ] && [ "${{ needs.changes.outputs.heavy_changed }}" = "true" ]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "should_run_cpp=true" >> "$GITHUB_OUTPUT"
        elif [ "${{ matrix.language }}" = "python" ] && [ "${{ needs.changes.outputs.python_changed }}" = "true" ]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "should_run_cpp=false" >> "$GITHUB_OUTPUT"
        else
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "should_run_cpp=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout repository
      if: steps.classify.outputs.should_run == 'true'
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Prepare Linux
      if: steps.classify.outputs.should_run_cpp == 'true'
      run: |
       sudo apt-get update -y
       sudo apt-get install pkg-config cmake ninja-build python3-fonttools python3-pil libfreetype6-dev libnotify-dev libsdl2-dev libsqlite3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libx264-dev libmariadb-dev libwebsockets-dev libvulkan-dev glslang-tools spirv-tools libglew-dev -y

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      if: steps.classify.outputs.should_run == 'true'
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Disable TRAP caching because this uses a lot of cache storage (>500 MiB) for each push to master
        # and is mostly pointless because the cache key includes the commit hash. Hence, this cache could
        # only be used for the scheduled runs that happen weekly.
        trap-caching: false
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    - name: Setup Rust
      if: steps.classify.outputs.should_run_cpp == 'true'
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

    - name: Build in release mode
      if: steps.classify.outputs.should_run_cpp == 'true'
      run: |
       mkdir release
       cd release
       cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DANTIBOT=ON -DMYSQL=ON -DWEBSOCKETS=ON ..
       cmake --build . --config RelWithDebInfo --target everything

    - name: Perform CodeQL Analysis
      if: steps.classify.outputs.should_run == 'true'
      uses: github/codeql-action/analyze@v4

    - name: Skip CodeQL for irrelevant paths
      if: steps.classify.outputs.should_run == 'false'
      run: echo "No paths relevant to ${{ matrix.language }} CodeQL changed."
