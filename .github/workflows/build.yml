name: Build and Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_platform:
        description: "Build platforms (publishing always builds all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
      android_arch:
        description: "Android architectures (publishing always builds all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - arm64
      build_type:
        description: "Build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Publish as vX.Y or vX.Y-preview.N; empty only builds artifacts"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Choose build legs
        id: matrix
        shell: bash
        # 便携包与常规 Windows 同源同编译器，只差「默认用户目录」开关
        # （QMCLIENT_PORTABLE）：PR 上重复构建既多占一个并发 runner，也只是把
        # 同一个「Windows 能否编译」的信号再报一遍，所以在 PR 事件下不排这一格。
        # 发布（tag 推送、预览日构建走的 workflow_call）与手动派发仍需便携包产物。
        #
        # 为什么不在 build 作业上用 `if: !matrix.release_only` 跳过：按文档
        # jobs.<job_id>.if 只能看到 github/needs/vars/inputs，matrix 不在其中，
        # 引用它会整份工作流被判无效（GitHub 会生成一个以文件名为标题的失败 run）。
        # 所以矩阵在这里算好后由 build 用 fromJSON 接过去。
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import os

          legs = [
              {"name": "Linux", "os": "ubuntu-24.04", "package_ext": "tar.xz",
               "output_name": "QmClient-ubuntu.tar.xz", "artifact_name": "packaged-linux"},
              {"name": "Windows", "os": "windows-2022", "package_ext": "zip",
               "output_name": "QmClient-windows.zip", "artifact_name": "packaged-windows"},
              {"name": "macOS", "os": "macos-26", "package_ext": "dmg",
               "output_name": "QmClient-macOS.dmg", "artifact_name": "packaged-macos"},
          ]
          if os.environ["GITHUB_EVENT_NAME"] != "pull_request":
              legs.insert(2, {"name": "Windows Portable", "os": "windows-2022",
                              "portable": True, "package_ext": "zip",
                              "output_name": "QmClient-windows-portable.zip",
                              "artifact_name": "packaged-windows-portable"})
          print("matrix=" + json.dumps({"include": legs}, separators=(",", ":")))
          PY

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: github.event_name != 'workflow_dispatch' || inputs.target_platform != 'android' || inputs.release_tag != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      BUILD_TYPE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') && 'Release' || inputs.build_type || 'Release' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Inno Setup (Windows)
        if: runner.os == 'Windows' && !matrix.portable
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Validate and update version from tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          python3 qmclient_scripts/bump_version.py --tag "$RELEASE_TAG"
          echo "Updated version files:"
          grep -E "QMCLIENT_(BASE_VERSION|PREVIEW_NUMBER)" src/game/version.h

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1

      - name: Cache Homebrew bottles
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          # 只缓存下载好的 bottle，绝不缓存整个 Caches/Homebrew：
          #  - api/ 是公式索引，跨镜像复用会让 brew 以为要把 openssl@3、xz、lz4
          #    「降级」到旧版本；
          #  - Backup/ 存的是 brew 重链前的硬链备份，旧镜像的
          #    Backup/bin/openssl 与 /opt/homebrew/bin/openssl 撞上时
          #    brew install ccache 直接报 "ccache: same file ..." 退出 1，
          #    job 连 Configure 都到不了。
          # 同时换掉 key 前缀，避免 restore-keys 命中旧的中毒缓存。
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-bottles-v1-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: homebrew-bottles-v1-${{ runner.os }}-

      # 先自己装一次：装好了 ccache-action 走 detect 分支就不会再碰 brew。
      # 装不上也只是少一层编译缓存，不该让整条流水线红掉。
      - name: Install ccache (macOS, best effort)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache || brew link --overwrite ccache || true
          fi
          command -v ccache && ccache --version || true

      - name: Setup ccache (Linux/macOS)
        if: runner.os != 'Windows'
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
          max-size: 500M
          # macOS runner 镜像比索引新时，先刷新一次，免得去重装/降级 openssl。
          update-package-index: ${{ runner.os == 'macOS' }}

      - name: Setup sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e  # v0.0.10

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with MSVC tools was not found"
          }
          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$devCmd`" -arch=x64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match "^(.*?)=(.*)$") {
                "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
              }
            }

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        with:
          # GLEW 走源码捆绑实现（不装系统包），dbus/libogg/opus 等发布作业专属包保留在此。
          extra: libdbus-1-dev libogg-dev libopus-dev libopusfile-dev libwavpack-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          for tap in aws/tap azure/bicep; do
            brew untap "$tap" 2>/dev/null || true
          done
          for pkg in cmake ninja pkg-config python freetype libpng libogg opus opusfile sqlite wavpack ffmpeg; do
            if brew list --formula "$pkg" &>/dev/null; then
              brew link --overwrite "$pkg" 2>/dev/null || true
            else
              brew install "$pkg"
            fi
          done

      - name: Install Python build dependencies
        shell: bash
        env:
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "${PYTHON_EXECUTABLE}" -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "macOS" ]; then
            "${PYTHON_EXECUTABLE}" -m pip install dmgbuild==1.6.7 fonttools==4.65.0 Pillow==12.3.0
          else
            "${PYTHON_EXECUTABLE}" -m pip install fonttools==4.65.0 Pillow==12.3.0
          fi

      - name: Configure
        shell: bash
        env:
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          ARGS=(-G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DDOWNLOAD_GTEST=ON -DPython3_EXECUTABLE="${PYTHON_EXECUTABLE}")
          # ccache 只是加速件：只有确实能跑起来才挂到 CMake launcher 上。
          # 少了这个判断，macOS 上 brew 装 ccache 失败会让 Configure 因为
          # 找不到 ccache 可执行文件而中断，把一次缓存抖动放大成整条流水线红。
          LAUNCHER_ARGS=()
          if [ "$RUNNER_OS" != "Windows" ]; then
            if ccache --version >/dev/null 2>&1; then
              LAUNCHER_ARGS=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
            else
              echo "::warning::ccache 不可用，本次构建不启用编译缓存"
            fi
          fi
          case "$RUNNER_OS" in
            Linux)
              # Rust doctests link the C++ bridge through lld. GCC LTO objects
              # in rust_test are not consumable by that linker.
              ARGS+=(
                "${LAUNCHER_ARGS[@]}"
                -DIPO=OFF
              )
              ;;
            macOS)
              SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
              ARGS+=(
                "${LAUNCHER_ARGS[@]}"
                # macOS 走 brew 系统库（头库同源）：ddnet-libs 的 mac dylib 无法在非 mac 主机维护，
                # 旧版本产物与新共享 include 会头/库错位，故不优先 bundled。
                -DPREFER_BUNDLED_LIBS=OFF -DVULKAN=OFF -DMETAL=ON
                -DCMAKE_OSX_SYSROOT="${SDKROOT}" -DIPO=OFF
              )
              ;;
            Windows)
              ARGS+=(
                -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
                -DPREFER_BUNDLED_LIBS=ON -DCMAKE_OBJECT_PATH_MAX=1024
                -DQM_MSVC_USE_EMBEDDED_DEBUG_INFO=ON
                -DQMCLIENT_PORTABLE=${{ matrix.portable && 'ON' || 'OFF' }}
                -DTOOLS=ON
              )
              # PR 验证不需要 LTO：/GL 让每个 TU 都带上中间表示，链接期再做全程序
              # 优化，2300+ 个 TU 的构建里有相当大一块时间花在这上面。发版（带 tag）
              # 仍按发布配置走，LTO 的正确性由预览通道覆盖。
              if [ -z "${RELEASE_TAG}" ]; then
                ARGS+=(-DIPO=OFF)
              fi
              ;;
          esac
          if [ "$RUNNER_OS" = "Windows" ]; then
            MSYS_NO_PATHCONV=1 cmd.exe /c "qmclient_scripts\cmake-windows.cmd" -S . -B build "${ARGS[@]}"
          else
            cmake -S . -B build "${ARGS[@]}"
          fi

      - name: Build client
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MSYS_NO_PATHCONV=1 cmd.exe /c "qmclient_scripts\cmake-windows.cmd" --build build --target game-client --parallel
          else
            cmake --build build --target game-client --parallel
          fi

      - name: Verify native Metal client startup and screenshot
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -m unittest qmclient_scripts.tests.test_process_harness
          python3 qmclient_scripts/integration/startup_presentation_smoke.py build metal_window_presentation

      - name: Upload Metal startup diagnostics
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: metal-startup-diagnostics
          path: tmp/startup_capture_font_fix
          if-no-files-found: ignore
          retention-days: 7

      - name: Run tests
        id: run-tests
        # Windows Portable 与 Windows 同源同编译器，只差一个「默认用户目录」开关，
        # 测试套件与它无关；重复跑一遍要重新编译 1800+ 个测试 TU，纯属浪费。
        if: ${{ (env.RELEASE_TAG != '' || !inputs.skip_tests) && !matrix.portable }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MSYS_NO_PATHCONV=1 cmd.exe /c "qmclient_scripts\cmake-windows.cmd" --build build --target run_tests --parallel
          else
            cmake --build build --target run_tests --parallel
          fi

      # 测试二进制被信号打死时 ninja 只留一个退出码，日志里看不出崩在哪个用例。
      # 这个步骤自己是诊断器，绝不能因为被测进程崩溃就中断：GitHub 的 bash 带 -e，
      # 一条子命令非零退出会把后面所有证据全吞掉，所以全程 set +e 并逐条 || true。
      - name: Diagnose macOS test crash
        # 只在测试步骤真的跑挂了才做现场取证。否则任何前置失败（例如 ccache
        # 安装抖动）都会触发它，对着还不存在的 build/testrunner 空跑一遍 lldb，
        # 日志里全是误导性的「找不到可执行文件」。
        if: failure() && runner.os == 'macOS' && steps.run-tests.outcome == 'failure'
        timeout-minutes: 25
        shell: bash
        run: |
          set +e
          mkdir -p tmp
          echo "::group::limits"
          echo "main thread stack: $(ulimit -s) KB"
          sysctl -n hw.memsize 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::sem_open probe"
          # 每次 sphore_try_init 都是 sem_open + sem_unlink + sem_close，macOS 的命名
          # 信号量在长进程里是否会被耗尽，用固定循环直接量一次。
          printf '#include <errno.h>\n#include <fcntl.h>\n#include <semaphore.h>\n#include <stdio.h>\n#include <sys/stat.h>\n#include <unistd.h>\nint main(void){for(int i=0;i<200000;i++){char n[72];snprintf(n,sizeof n,"/qmp.%%d.%%d",(int)getpid(),i);sem_t*s=sem_open(n,O_CREAT|O_EXCL,S_IRWXU,0);if(s==SEM_FAILED){printf("sem_open failed at %%d errno=%%d\\n",i,errno);return 1;}sem_unlink(n);sem_close(s);}printf("sem_open x200000 ok\\n");return 0;}\n' > tmp/semprobe.c
          clang -O1 -o tmp/semprobe tmp/semprobe.c && ./tmp/semprobe
          echo "sem probe exit=$?"
          echo "::endgroup::"
          echo "::group::crashing test alone"
          ./build/testrunner --gtest_filter='DemoEditJobIntegration.RealWorkerCompletesBeforePoolShutdownReleasesStorage' > tmp/demoedit.log 2>&1
          echo "alone exit=$?"
          tail -40 tmp/demoedit.log || true
          echo "::endgroup::"
          echo "::group::crashing test under lldb"
          # 只跑出事的用例：8ms 就能崩，lldb 负担最小，栈也最干净。
          lldb --batch \
            -o "settings set target.process.stop-on-exec false" \
            -o run \
            -o "process status" \
            -o "thread backtrace all" \
            -o "frame variable" \
            -o "register read pc sp fp lr" \
            -- ./build/testrunner --gtest_filter='DemoEditJobIntegration.RealWorkerCompletesBeforePoolShutdownReleasesStorage' > tmp/lldb.log 2>&1
          echo "lldb exit=$?"
          # 崩溃原因行（EXC_BAD_ACCESS 的 code=1 是未映射页，code=2 是保护失败=栈溢出）
          grep -nE "stop reason|SIGBUS|SIGSEGV|SIGILL|abort|EXC_BAD" tmp/lldb.log | head -40 || true
          sed -n '1,160p' tmp/lldb.log || true
          echo "::endgroup::"
          echo "::group::stack frames"
          grep -nE "frame #|thread #" tmp/lldb.log | head -120 || true
          echo "::endgroup::"
          echo "::group::crash report"
          newest=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
          echo "report: $newest"
          if [ -n "$newest" ]; then
            head -c 20000 "$newest"
          fi
          echo "::endgroup::"

      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MSYS_NO_PATHCONV=1 cmd.exe /c "qmclient_scripts\cmake-windows.cmd" --build build --target package_default --parallel
          else
            cmake --build build --target package_default --parallel
          fi

      - name: Build complete Windows setup
        if: runner.os == 'Windows' && !matrix.portable
        shell: pwsh
        run: |
          $source = (Resolve-Path build).Path
          $setupSource = Join-Path (Resolve-Path build).Path 'setup-source'
          & "${{ steps.setup-python.outputs.python-path }}" qmclient_scripts/prepare_setup_source.py --source $source --data (Resolve-Path data).Path --output $setupSource
          if ($LASTEXITCODE -ne 0) { throw 'Setup payload preparation failed' }
          $versionHeader = Get-Content src/game/version.h -Raw
          $version = [regex]::Match($versionHeader, '#define QMCLIENT_BASE_VERSION "([^"]+)"').Groups[1].Value
          $preview = [int][regex]::Match($versionHeader, '#define QMCLIENT_PREVIEW_NUMBER (\d+)').Groups[1].Value
          if ($preview -gt 0) { $version += "-preview.$preview" }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & "${{ steps.setup-python.outputs.python-path }}" qmclient_scripts/build_windows_setup.py --source $setupSource --version $version --output $source --build-dir (Join-Path $source 'setup-ui-build') --iscc $compiler
          if ($LASTEXITCODE -ne 0) { throw 'Setup compilation failed' }

      - name: Collect package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            found=false
            for ext in zip 7z; do
              pkg="$(find build -type f -name "QmClient*.$ext" ! -name "*-src*" 2>/dev/null | head -n 1)"
              [ -z "$pkg" ] && pkg="$(find build -type f -name "*.$ext" ! -name "*-src*" 2>/dev/null | head -n 1)"
              if [ -n "$pkg" ]; then
                cp "$pkg" "dist/${{ matrix.portable && 'QmClient-windows-portable' || 'QmClient-windows' }}.$ext"
                echo "Found: $pkg -> dist/${{ matrix.portable && 'QmClient-windows-portable' || 'QmClient-windows' }}.$ext"
                found=true
              fi
            done
            if [ "${{ matrix.portable }}" != "true" ]; then
              setup_pkg="build/QmClient-Setup.exe"
              if [ ! -s "$setup_pkg" ]; then
                echo "No complete QmClient-Setup.exe found at build/QmClient-Setup.exe"
                exit 1
              fi
              cp "$setup_pkg" "dist/QmClient-Setup.exe"
              echo "Found: $setup_pkg -> dist/QmClient-Setup.exe"
            fi
            if [ "$found" = "false" ]; then
              echo "No zip or 7z package found under build/"
              exit 1
            fi
          else
            PKG="$(find build -type f -name "*.${{ matrix.package_ext }}" ! -name "*-src*" | head -n 1)"
            if [ -z "$PKG" ]; then
              echo "No package with extension .${{ matrix.package_ext }} found under build/"
              exit 1
            fi
            cp "$PKG" "dist/${{ matrix.output_name }}"
          fi
          ls -lah dist

      - name: Verify Windows update package contents
        if: runner.os == 'Windows'
        shell: bash
        env:
          # Windows 运行器的 stdout 是 cp1252，直接打印非 ASCII 文件名会
          # 以 UnicodeEncodeError 失败，必须显式用 UTF-8 输出。
          PYTHONIOENCODING: utf-8
        run: |
          python3 qmclient_scripts/verify_windows_package.py \
            --package "dist/${{ matrix.output_name }}" \
            --package "dist/${{ matrix.portable && 'QmClient-windows-portable' || 'QmClient-windows' }}.7z" \
            --runtime-manifest build/qmclient-setup-runtime.txt \
            --tools-manifest build/qmclient-archive-tools.txt \
            ${{ matrix.portable && '--portable' || '' }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Verify build artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            shopt -s nullglob
            for file in dist/*; do
              size=$(stat -c%s "$file")
              if [ "$size" -lt 1000000 ]; then
                echo "Artifact too small: $file ($size bytes)"
                exit 1
              fi
              echo "Verified: $file ($size bytes)"
            done
          else
            artifact="dist/${{ matrix.output_name }}"
            if [ ! -f "$artifact" ]; then
              echo "Build artifact not found!"
              exit 1
            fi
            if [ "${{ runner.os }}" = "macOS" ]; then
              size=$(stat -f%z "$artifact")
            else
              size=$(stat -c%s "$artifact")
            fi
            if [ "$size" -lt 1000000 ]; then
              echo "Build artifact too small: $size bytes"
              exit 1
            fi
            echo "Build artifact verified: $size bytes"
          fi

      - name: Verify macOS DMG contents
        if: runner.os == 'macOS'
        shell: bash
        run: qmclient_scripts/verify_macos_dmg.sh "dist/${{ matrix.output_name }}"

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Build Summary"
            echo "- **Platform**: ${{ matrix.name }}"
            echo "- **OS**: ${{ matrix.os }}"
            echo "- **Build Type**: ${{ env.BUILD_TYPE }}"
            echo "- **Status**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "- **Artifacts**: ${{ matrix.output_name }} and matching 7z${{ !matrix.portable && ', QmClient-Setup.exe' || '' }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Artifact**: ${{ matrix.output_name }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show ccache statistics (Linux/macOS)
        if: always() && runner.os != 'Windows'
        # --verbose 会列出不可缓存调用的原因（链接/预处理/不支持的选项），
        # 这是定位「为什么缓存只命中一小部分 TU」的唯一现场证据。
        run: ccache --show-stats --verbose || true

      - name: Show sccache statistics (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) { sccache --show-stats } else { "sccache not on PATH" }

  build_android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANDROID_APP_NAME: QmClient
      # PR 只验证 arm64（真机主流 ABI）：all 会串行编 4 套 ABI，占掉 40+ 分钟，
      # 而 32 位/x86 的差异面主要在第三方库，交给发版与手动 dispatch 覆盖。
      ANDROID_BUILD_ARCH: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') && 'all' || inputs.android_arch || (github.event_name == 'pull_request' && 'arm64' || 'all') }}
      ANDROID_PACKAGE_NAME: com.qmclient.client
      ANDROID_BUILD_DIR: build-android-release
      ANDROID_NDK_VERSION: "27.3.13750724"
      CARGO_NDK_VERSION: "4.1.2"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Validate and update version from tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          python3 qmclient_scripts/bump_version.py --tag "$RELEASE_TAG"
          echo "Updated version files:"
          grep -E "QMCLIENT_(BASE_VERSION|PREVIEW_NUMBER)" src/game/version.h

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Setup ccache (Android)
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: android-${{ runner.os }}
          max-size: 500M

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1

      - name: Cache cargo-ndk
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-${{ env.CARGO_NDK_VERSION }}

      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/sdk/ndk
            ~/.android/sdk/platforms
            ~/.android/sdk/build-tools
          key: android-sdk-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Cache Rust Android targets
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-android-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-android-${{ runner.os }}-

      - name: Install host dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup cargo-ndk and Rust Android targets
        run: |
          if [ ! -f ~/.cargo/bin/cargo-ndk ]; then
            cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked
          fi
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android SDK
        # v4.0.4 起跳过已废弃的 `tools` 包，避免 sdkmanager 直接失败
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}"
          yes | sdkmanager --licenses

      - name: Prepare Android signing keystore
        shell: bash
        env:
          QM_ANDROID_KEYSTORE_BASE64: ${{ secrets.QM_ANDROID_KEYSTORE_BASE64 }}
          QM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QM_ANDROID_KEYSTORE_PASSWORD }}
          QM_ANDROID_KEY_ALIAS: ${{ secrets.QM_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG}" ]; then
            for variable in QM_ANDROID_KEYSTORE_BASE64 QM_ANDROID_KEYSTORE_PASSWORD QM_ANDROID_KEY_ALIAS; do
              if [ -z "${!variable}" ]; then
                echo "Required Android release secret ${variable} is not configured"
                exit 1
              fi
            done
            TW_KEY_NAME="${RUNNER_TEMP}/qmclient-release.jks"
            printf '%s' "${QM_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${TW_KEY_NAME}"
            TW_KEY_PW="${QM_ANDROID_KEYSTORE_PASSWORD}"
            TW_KEY_ALIAS="${QM_ANDROID_KEY_ALIAS}"
          else
            TW_KEY_NAME="${HOME}/.android/debug.keystore"
            TW_KEY_PW=android
            TW_KEY_ALIAS=androiddebugkey
            mkdir -p "$(dirname "${TW_KEY_NAME}")"
            if [ ! -f "${TW_KEY_NAME}" ]; then
              keytool -genkeypair -v \
                -keystore "${TW_KEY_NAME}" \
                -storepass "${TW_KEY_PW}" \
                -keypass "${TW_KEY_PW}" \
                -alias "${TW_KEY_ALIAS}" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=GitHub Actions, OU=CI, O=QmClient, L=Unknown, ST=Unknown, C=US"
            fi
          fi
          {
            echo "TW_KEY_NAME=${TW_KEY_NAME}"
            echo "TW_KEY_PW=${TW_KEY_PW}"
            echo "TW_KEY_ALIAS=${TW_KEY_ALIAS}"
          } >> "${GITHUB_ENV}"

      - name: Build Android APK/AAB
        shell: bash
        run: |
          chmod +x qmclient_scripts/android/cmake_android.sh
          qmclient_scripts/android/cmake_android.sh "${ANDROID_BUILD_ARCH}" "${ANDROID_APP_NAME}" "${ANDROID_PACKAGE_NAME}" Release "${ANDROID_BUILD_DIR}"

      - name: Collect Android package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${ANDROID_BUILD_DIR}/${ANDROID_APP_NAME}.apk" dist/QmClient-android.apk
          cp "${ANDROID_BUILD_DIR}/${ANDROID_APP_NAME}.aab" dist/QmClient-android.aab
          ls -lah dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: packaged-android
          path: |
            dist/QmClient-android.apk
            dist/QmClient-android.aab
          if-no-files-found: error
          retention-days: 14

      - name: Verify build artifacts
        run: |
          for file in dist/QmClient-android.apk dist/QmClient-android.aab; do
            if [ ! -f "$file" ]; then
              echo "Build artifact not found: $file"
              exit 1
            fi
            FILE_SIZE=$(stat -c%s "$file")
            if [ "$FILE_SIZE" -lt 1000000 ]; then
              echo "Build artifact too small: $file ($FILE_SIZE bytes)"
              exit 1
            fi
            echo "Verified: $file ($FILE_SIZE bytes)"
          done

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo "- **Platform**: Android"
            echo "- **Status**: ${{ job.status }}"
            echo "- **Artifacts**: QmClient-android.apk, QmClient-android.aab"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show ccache statistics (Android)
        if: always()
        run: ccache --show-stats || true

  release-desktop:
    name: Publish Complete Release
    runs-on: ubuntu-24.04
    needs:
      - build
      - build_android
    if: (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') && github.repository == 'wxj881027/QmClient'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release target and preserve published versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 qmclient_scripts/bump_version.py --tag "$RELEASE_TAG" --dry-run
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          tag = os.environ["RELEASE_TAG"]
          commit = subprocess.run(["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"], capture_output=True, text=True)
          if commit.returncode == 0 and commit.stdout.strip() != os.environ["GITHUB_SHA"]:
              raise SystemExit("Release tag already points at a different commit")
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}"
          request = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              if not release["draft"]:
                  raise SystemExit("Published releases cannot be overwritten")
          PY

      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: packaged-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lah release-assets

      - name: Prepare Windows update signing environment
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python3 -m venv .update-signing-venv
          .update-signing-venv/bin/python -m pip install cryptography==45.0.6

      - name: Sign Windows automatic update assets
        env:
          QM_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.QM_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${QM_UPDATE_ED25519_PRIVATE_KEY}" ]; then
            echo "Required secret QM_UPDATE_ED25519_PRIVATE_KEY is not configured"
            exit 1
          fi
          .update-signing-venv/bin/python qmclient_scripts/sign_update_release.py \
            --package release-assets/QmClient-windows.zip \
            --sevenzip-package release-assets/QmClient-windows.7z \
            --setup release-assets/QmClient-Setup.exe \
            --version "${RELEASE_TAG}" \
            --private-key-env QM_UPDATE_ED25519_PRIVATE_KEY \
            --normalize-package \
            --output-dir release-assets
          .update-signing-venv/bin/python qmclient_scripts/sign_update_release.py \
            --package release-assets/QmClient-windows-portable.zip \
            --sevenzip-package release-assets/QmClient-windows-portable.7z \
            --version "${RELEASE_TAG}" \
            --private-key-env QM_UPDATE_ED25519_PRIVATE_KEY \
            --normalize-package \
            --output-dir release-assets

      - name: Export short commit hash for the release title
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
          fi
          PREVIOUS_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          python3 qmclient_scripts/generate_release_notes.py \
            --version "$RELEASE_TAG" \
            --current-tag "$RELEASE_TAG" \
            --previous-tag "$PREVIOUS_TAG" \
            --output release-assets/release-notes.md

      - name: Show release notes
        run: cat release-assets/release-notes.md

      - name: Stage all platform assets in a draft release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9  # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: QmClient ${{ env.RELEASE_TAG }} (${{ env.SHORT_SHA }})
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-preview.') }}
          make_latest: false
          fail_on_unmatched_files: true
          generate_release_notes: false
          body_path: release-assets/release-notes.md
          files: |
            release-assets/QmClient-windows.zip
            release-assets/QmClient-windows.zip.sig
            release-assets/QmClient-windows-update.json
            release-assets/QmClient-windows-update.json.sig
            release-assets/QmClient-windows.7z
            release-assets/QmClient-windows.7z.sig
            release-assets/QmClient-windows-7z-update.json
            release-assets/QmClient-windows-7z-update.json.sig
            release-assets/QmClient-windows-portable.zip
            release-assets/QmClient-windows-portable.zip.sig
            release-assets/QmClient-windows-portable-update.json
            release-assets/QmClient-windows-portable-update.json.sig
            release-assets/QmClient-windows-portable.7z
            release-assets/QmClient-windows-portable.7z.sig
            release-assets/QmClient-windows-portable-7z-update.json
            release-assets/QmClient-windows-portable-7z-update.json.sig
            release-assets/QmClient-Setup.exe
            release-assets/QmClient-Setup.exe.sig
            release-assets/QmClient-windows-setup-update.json
            release-assets/QmClient-windows-setup-update.json.sig
            release-assets/QmClient-ubuntu.tar.xz
            release-assets/QmClient-macOS.dmg
            release-assets/QmClient-android.apk
            release-assets/QmClient-android.aab

      - name: Verify every uploaded asset and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName,assets > release-state.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("release-state.json").read_text())
          expected = {"QmClient-windows-portable.zip", "QmClient-windows-portable.zip.sig", "QmClient-windows-portable-update.json", "QmClient-windows-portable-update.json.sig", "QmClient-windows-portable.7z", "QmClient-windows-portable.7z.sig", "QmClient-windows-portable-7z-update.json", "QmClient-windows-portable-7z-update.json.sig", "QmClient-windows.zip", "QmClient-windows.zip.sig", "QmClient-windows-update.json", "QmClient-windows-update.json.sig", "QmClient-windows.7z", "QmClient-windows.7z.sig", "QmClient-windows-7z-update.json", "QmClient-windows-7z-update.json.sig", "QmClient-Setup.exe", "QmClient-Setup.exe.sig", "QmClient-windows-setup-update.json", "QmClient-windows-setup-update.json.sig", "QmClient-ubuntu.tar.xz", "QmClient-macOS.dmg", "QmClient-android.apk", "QmClient-android.aab"}
          assert release["isDraft"] and release["tagName"] == os.environ["RELEASE_TAG"]
          assert release["isPrerelease"] == ("-preview." in os.environ["RELEASE_TAG"])
          assets = {asset["name"]: asset for asset in release["assets"]}
          assert len(assets) == len(release["assets"]) and set(assets) == expected
          for name in expected:
              assert assets[name]["state"] == "uploaded"
              assert assets[name]["size"] == (Path("release-assets") / name).stat().st_size > 0
          PY
          if [[ "$RELEASE_TAG" == *-preview.* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
