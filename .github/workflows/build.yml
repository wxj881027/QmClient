name: Build and Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Publish as vX.Y or vX.Y-preview.N; empty only builds artifacts"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      BUILD_TYPE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') && 'Release' || inputs.build_type || 'Release' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            package_ext: tar.xz
            output_name: QmClient-ubuntu.tar.xz
            artifact_name: packaged-linux
          - name: Windows
            os: windows-2022
            package_ext: zip
            output_name: QmClient-windows.zip
            artifact_name: packaged-windows
          - name: Windows Portable
            os: windows-2022
            portable: true
            package_ext: zip
            output_name: QmClient-windows-portable.zip
            artifact_name: packaged-windows-portable
          - name: macOS
            os: macos-26
            package_ext: dmg
            output_name: QmClient-macOS.dmg
            artifact_name: packaged-macos

    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Inno Setup (Windows)
        if: runner.os == 'Windows' && !matrix.portable
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Validate and update version from tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          python3 qmclient_scripts/bump_version.py --tag "$RELEASE_TAG"
          echo "Updated version files:"
          grep -E "QMCLIENT_(BASE_VERSION|PREVIEW_NUMBER)" src/game/version.h

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1

      - name: Cache CMake build
        uses: actions/cache@v5
        with:
          path: |
            build/_deps
          key: cmake-${{ runner.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: cmake-${{ runner.os }}-${{ runner.arch }}-${{ env.BUILD_TYPE }}-

      - name: Cache Homebrew packages
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: homebrew-${{ runner.os }}-

      - name: Reinstall ccache (macOS)
        if: runner.os == 'macOS'
        run: brew reinstall ccache

      - name: Setup ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: ${{ runner.os }}-${{ runner.arch }}
          max-size: 500M

      - name: Setup sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e  # v0.0.10

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with MSVC tools was not found"
          }
          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$devCmd`" -arch=x64 -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match "^(.*?)=(.*)$") {
                "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV
              }
            }

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config python3 python3-pip python3-pil \
            libfreetype6-dev libnotify-dev libsdl2-dev libsqlite3-dev \
            libgl1-mesa-dev \
            libvulkan-dev glslang-tools spirv-tools \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libx264-dev \
            libpng-dev libcurl4-openssl-dev libssl-dev \
            libogg-dev libopus-dev libopusfile-dev libwavpack-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          for tap in aws/tap azure/bicep; do
            brew untap "$tap" 2>/dev/null || true
          done
          for pkg in cmake ninja pkg-config python freetype sdl2 libpng libogg opus opusfile sqlite wavpack ffmpeg; do
            if brew list --formula "$pkg" &>/dev/null; then
              brew link --overwrite "$pkg" 2>/dev/null || true
            else
              brew install "$pkg"
            fi
          done

      - name: Install Python build dependencies
        shell: bash
        env:
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "${PYTHON_EXECUTABLE}" -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "macOS" ]; then
            "${PYTHON_EXECUTABLE}" -m pip install dmgbuild==1.6.7 fonttools==4.65.0 Pillow==12.3.0
          else
            "${PYTHON_EXECUTABLE}" -m pip install fonttools==4.65.0 Pillow==12.3.0
          fi

      - name: Configure
        shell: bash
        env:
          PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          ARGS=(-G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DDOWNLOAD_GTEST=ON -DPython3_EXECUTABLE="${PYTHON_EXECUTABLE}")
          case "$RUNNER_OS" in
            Linux)
              # Rust doctests link the C++ bridge through lld. GCC LTO objects
              # in rust_test are not consumable by that linker.
              ARGS+=(
                -DCMAKE_C_COMPILER_LAUNCHER=ccache
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
                -DIPO=OFF
              )
              ;;
            macOS)
              SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
              ARGS+=(
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
                -DPREFER_BUNDLED_LIBS=ON -DVULKAN=OFF -DMETAL=ON
                -DCMAKE_OSX_SYSROOT="${SDKROOT}" -DIPO=OFF
              )
              ;;
            Windows)
              ARGS+=(
                -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
                -DPREFER_BUNDLED_LIBS=ON -DCMAKE_OBJECT_PATH_MAX=1024
                -DQM_MSVC_USE_EMBEDDED_DEBUG_INFO=ON
                -DQMCLIENT_PORTABLE=${{ matrix.portable && 'ON' || 'OFF' }}
              )
              ;;
          esac
          if [ "$RUNNER_OS" = "Windows" ]; then
            MSYS_NO_PATHCONV=1 cmd.exe /c "qmclient_scripts\cmake-windows.cmd" -S . -B build "${ARGS[@]}"
          else
            cmake -S . -B build "${ARGS[@]}"
          fi

      - name: Build client
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MSYS_NO_PATHCONV=1 cmd.exe /c "qmclient_scripts\cmake-windows.cmd" --build build --target game-client --parallel
          else
            cmake --build build --target game-client --parallel
          fi

      - name: Run tests
        if: ${{ env.RELEASE_TAG != '' || !inputs.skip_tests }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MSYS_NO_PATHCONV=1 cmd.exe /c "qmclient_scripts\cmake-windows.cmd" --build build --target run_tests --parallel
          else
            cmake --build build --target run_tests --parallel
          fi

      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            MSYS_NO_PATHCONV=1 cmd.exe /c "qmclient_scripts\cmake-windows.cmd" --build build --target package_default --parallel
          else
            cmake --build build --target package_default --parallel
          fi

      - name: Build complete Windows setup
        if: runner.os == 'Windows' && !matrix.portable
        shell: pwsh
        run: |
          $source = (Resolve-Path build).Path
          $setupSource = Join-Path (Resolve-Path build).Path 'setup-source'
          & "${{ steps.setup-python.outputs.python-path }}" qmclient_scripts/prepare_setup_source.py --source $source --data (Resolve-Path data).Path --output $setupSource
          if ($LASTEXITCODE -ne 0) { throw 'Setup payload preparation failed' }
          $versionHeader = Get-Content src/game/version.h -Raw
          $version = [regex]::Match($versionHeader, '#define QMCLIENT_BASE_VERSION "([^"]+)"').Groups[1].Value
          $preview = [int][regex]::Match($versionHeader, '#define QMCLIENT_PREVIEW_NUMBER (\d+)').Groups[1].Value
          if ($preview -gt 0) { $version += "-preview.$preview" }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $compiler "/DSourceDir=$setupSource" "/DAppVersion=$version" "/DOutputDir=$((Resolve-Path build).Path)" qmclient_scripts/installer/QmClient.iss
          if ($LASTEXITCODE -ne 0) { throw 'Setup compilation failed' }

      - name: Collect package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            found=false
            for ext in zip 7z; do
              pkg="$(find build -type f -name "QmClient*.$ext" ! -name "*-src*" 2>/dev/null | head -n 1)"
              [ -z "$pkg" ] && pkg="$(find build -type f -name "*.$ext" ! -name "*-src*" 2>/dev/null | head -n 1)"
              if [ -n "$pkg" ]; then
                cp "$pkg" "dist/${{ matrix.portable && 'QmClient-windows-portable' || 'QmClient-windows' }}.$ext"
                echo "Found: $pkg -> dist/${{ matrix.portable && 'QmClient-windows-portable' || 'QmClient-windows' }}.$ext"
                found=true
              fi
            done
            if [ "${{ matrix.portable }}" != "true" ]; then
              setup_pkg="$(find build -type f -name 'QmClient-Setup.exe' 2>/dev/null | head -n 1)"
              if [ -z "$setup_pkg" ]; then
                echo "No QmClient-Setup.exe found under build/"
                exit 1
              fi
              cp "$setup_pkg" "dist/QmClient-Setup.exe"
              echo "Found: $setup_pkg -> dist/QmClient-Setup.exe"
            fi
            if [ "$found" = "false" ]; then
              echo "No zip or 7z package found under build/"
              exit 1
            fi
          else
            PKG="$(find build -type f -name "*.${{ matrix.package_ext }}" ! -name "*-src*" | head -n 1)"
            if [ -z "$PKG" ]; then
              echo "No package with extension .${{ matrix.package_ext }} found under build/"
              exit 1
            fi
            cp "$PKG" "dist/${{ matrix.output_name }}"
          fi
          ls -lah dist

      - name: Verify Windows update package contents
        if: runner.os == 'Windows'
        shell: bash
        env:
          # Windows 运行器的 stdout 是 cp1252，直接打印非 ASCII 文件名会
          # 以 UnicodeEncodeError 失败，必须显式用 UTF-8 输出。
          PYTHONIOENCODING: utf-8
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          package = Path("dist/${{ matrix.output_name }}")
          required = {"DDNet.exe", "DDNet-Server.exe", "QmClient-Updater.exe"}
          with zipfile.ZipFile(package) as archive:
              infos = [info for info in archive.infolist() if not info.is_dir()]
          basenames = [Path(info.filename).name for info in infos]
          missing = sorted(name for name in required if basenames.count(name) != 1)
          if missing:
              raise SystemExit(f"Windows package is missing or duplicates required files: {missing}")
          # 有损代码页转换会把非 ASCII 文件名写成 `?`：字体文件会因此找不到，
          # 两个不同的字体还可能塌成同一个名字，发布签名随后看到重复条目。
          lossy = sorted(
              info.filename
              for info in infos
              if "?" in info.filename or "\ufffd" in info.filename
          )
          if lossy:
              raise SystemExit(f"Windows package has lossy file names: {lossy}")
          non_ascii = sorted(info.filename for info in infos if not info.filename.isascii())
          print("Verified Windows automatic update executables")
          print(f"Non-ASCII package entries: {len(non_ascii)}")
          for name in non_ascii:
              print(f"  {name}")
          PY

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Verify build artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            shopt -s nullglob
            for file in dist/*; do
              size=$(stat -c%s "$file")
              if [ "$size" -lt 1000000 ]; then
                echo "Artifact too small: $file ($size bytes)"
                exit 1
              fi
              echo "Verified: $file ($size bytes)"
            done
          else
            artifact="dist/${{ matrix.output_name }}"
            if [ ! -f "$artifact" ]; then
              echo "Build artifact not found!"
              exit 1
            fi
            if [ "${{ runner.os }}" = "macOS" ]; then
              size=$(stat -f%z "$artifact")
            else
              size=$(stat -c%s "$artifact")
            fi
            if [ "$size" -lt 1000000 ]; then
              echo "Build artifact too small: $size bytes"
              exit 1
            fi
            echo "Build artifact verified: $size bytes"
          fi

      - name: Verify macOS DMG contents
        if: runner.os == 'macOS'
        shell: bash
        run: qmclient_scripts/verify_macos_dmg.sh "dist/${{ matrix.output_name }}"

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Build Summary"
            echo "- **Platform**: ${{ matrix.name }}"
            echo "- **OS**: ${{ matrix.os }}"
            echo "- **Build Type**: ${{ env.BUILD_TYPE }}"
            echo "- **Status**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "- **Artifacts**: ${{ matrix.output_name }} and matching 7z${{ !matrix.portable && ', QmClient-Setup.exe' || '' }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Artifact**: ${{ matrix.output_name }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show ccache statistics (Linux/macOS)
        if: always() && runner.os != 'Windows'
        run: ccache --show-stats || true

  build_android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANDROID_APP_NAME: QmClient
      ANDROID_PACKAGE_NAME: com.qmclient.client
      ANDROID_BUILD_DIR: build-android-release
      ANDROID_NDK_VERSION: "26.1.10909125"
      CARGO_NDK_VERSION: "4.1.2"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Validate and update version from tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          python3 qmclient_scripts/bump_version.py --tag "$RELEASE_TAG"
          echo "Updated version files:"
          grep -E "QMCLIENT_(BASE_VERSION|PREVIEW_NUMBER)" src/game/version.h

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Setup ccache (Android)
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: android-${{ runner.os }}
          max-size: 500M

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1

      - name: Cache cargo-ndk
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-${{ env.CARGO_NDK_VERSION }}

      - name: Cache Android NDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/sdk/ndk
            ~/.android/sdk/platforms
            ~/.android/sdk/build-tools
          key: android-sdk-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Cache Rust Android targets
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-android-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-android-${{ runner.os }}-

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config curl python3 python3-pip python3-pil python3-fonttools \
            glslang-tools spirv-tools ccache
          if [ ! -f ~/.cargo/bin/cargo-ndk ]; then
            cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked
          fi
          rustup target add armv7-linux-androideabi
          rustup target add i686-linux-android
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Setup Android SDK
        # v4.0.4 起跳过已废弃的 `tools` 包，避免 sdkmanager 直接失败
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}"
          yes | sdkmanager --licenses

      - name: Prepare Android signing keystore
        shell: bash
        env:
          QM_ANDROID_KEYSTORE_BASE64: ${{ secrets.QM_ANDROID_KEYSTORE_BASE64 }}
          QM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QM_ANDROID_KEYSTORE_PASSWORD }}
          QM_ANDROID_KEY_ALIAS: ${{ secrets.QM_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG}" ]; then
            for variable in QM_ANDROID_KEYSTORE_BASE64 QM_ANDROID_KEYSTORE_PASSWORD QM_ANDROID_KEY_ALIAS; do
              if [ -z "${!variable}" ]; then
                echo "Required Android release secret ${variable} is not configured"
                exit 1
              fi
            done
            TW_KEY_NAME="${RUNNER_TEMP}/qmclient-release.jks"
            printf '%s' "${QM_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${TW_KEY_NAME}"
            TW_KEY_PW="${QM_ANDROID_KEYSTORE_PASSWORD}"
            TW_KEY_ALIAS="${QM_ANDROID_KEY_ALIAS}"
          else
            TW_KEY_NAME="${HOME}/.android/debug.keystore"
            TW_KEY_PW=android
            TW_KEY_ALIAS=androiddebugkey
            mkdir -p "$(dirname "${TW_KEY_NAME}")"
            if [ ! -f "${TW_KEY_NAME}" ]; then
              keytool -genkeypair -v \
                -keystore "${TW_KEY_NAME}" \
                -storepass "${TW_KEY_PW}" \
                -keypass "${TW_KEY_PW}" \
                -alias "${TW_KEY_ALIAS}" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=GitHub Actions, OU=CI, O=QmClient, L=Unknown, ST=Unknown, C=US"
            fi
          fi
          {
            echo "TW_KEY_NAME=${TW_KEY_NAME}"
            echo "TW_KEY_PW=${TW_KEY_PW}"
            echo "TW_KEY_ALIAS=${TW_KEY_ALIAS}"
          } >> "${GITHUB_ENV}"

      - name: Build Android APK/AAB
        shell: bash
        run: |
          chmod +x scripts/android/cmake_android.sh
          scripts/android/cmake_android.sh all "${ANDROID_APP_NAME}" "${ANDROID_PACKAGE_NAME}" Release "${ANDROID_BUILD_DIR}"

      - name: Collect Android package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${ANDROID_BUILD_DIR}/${ANDROID_APP_NAME}.apk" dist/QmClient-android.apk
          cp "${ANDROID_BUILD_DIR}/${ANDROID_APP_NAME}.aab" dist/QmClient-android.aab
          ls -lah dist

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: packaged-android
          path: |
            dist/QmClient-android.apk
            dist/QmClient-android.aab
          if-no-files-found: error
          retention-days: 14

      - name: Verify build artifacts
        run: |
          for file in dist/QmClient-android.apk dist/QmClient-android.aab; do
            if [ ! -f "$file" ]; then
              echo "Build artifact not found: $file"
              exit 1
            fi
            FILE_SIZE=$(stat -c%s "$file")
            if [ "$FILE_SIZE" -lt 1000000 ]; then
              echo "Build artifact too small: $file ($FILE_SIZE bytes)"
              exit 1
            fi
            echo "Verified: $file ($FILE_SIZE bytes)"
          done

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build Summary"
            echo "- **Platform**: Android"
            echo "- **Status**: ${{ job.status }}"
            echo "- **Artifacts**: QmClient-android.apk, QmClient-android.aab"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show ccache statistics (Android)
        if: always()
        run: ccache --show-stats || true

  release-desktop:
    name: Publish Complete Release
    runs-on: ubuntu-24.04
    needs:
      - build
      - build_android
    if: (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') && github.repository == 'wxj881027/QmClient'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release target and preserve published versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 qmclient_scripts/bump_version.py --tag "$RELEASE_TAG" --dry-run
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          tag = os.environ["RELEASE_TAG"]
          commit = subprocess.run(["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"], capture_output=True, text=True)
          if commit.returncode == 0 and commit.stdout.strip() != os.environ["GITHUB_SHA"]:
              raise SystemExit("Release tag already points at a different commit")
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}"
          request = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              if not release["draft"]:
                  raise SystemExit("Published releases cannot be overwritten")
          PY

      - name: Download packaged artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: packaged-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lah release-assets

      - name: Prepare Windows update signing environment
        run: |
          set -euo pipefail
          python3 -m venv .update-signing-venv
          .update-signing-venv/bin/python -m pip install cryptography==45.0.6

      - name: Sign Windows automatic update assets
        env:
          QM_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.QM_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${QM_UPDATE_ED25519_PRIVATE_KEY}" ]; then
            echo "Required secret QM_UPDATE_ED25519_PRIVATE_KEY is not configured"
            exit 1
          fi
          .update-signing-venv/bin/python qmclient_scripts/sign_update_release.py \
            --package release-assets/QmClient-windows.zip \
            --setup release-assets/QmClient-Setup.exe \
            --version "${RELEASE_TAG}" \
            --private-key-env QM_UPDATE_ED25519_PRIVATE_KEY \
            --normalize-package \
            --output-dir release-assets
          .update-signing-venv/bin/python qmclient_scripts/sign_update_release.py \
            --package release-assets/QmClient-windows-portable.zip \
            --version "${RELEASE_TAG}" \
            --private-key-env QM_UPDATE_ED25519_PRIVATE_KEY \
            --normalize-package \
            --output-dir release-assets

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
          fi
          PREVIOUS_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          python3 qmclient_scripts/generate_release_notes.py \
            --version "$RELEASE_TAG" \
            --current-tag "$RELEASE_TAG" \
            --previous-tag "$PREVIOUS_TAG" \
            --output release-assets/release-notes.md

      - name: Show release notes
        run: cat release-assets/release-notes.md

      - name: Stage all platform assets in a draft release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9  # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: QmClient ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-preview.') }}
          make_latest: false
          fail_on_unmatched_files: true
          generate_release_notes: false
          body_path: release-assets/release-notes.md
          files: |
            release-assets/QmClient-windows.zip
            release-assets/QmClient-windows.zip.sig
            release-assets/QmClient-windows-update.json
            release-assets/QmClient-windows-update.json.sig
            release-assets/QmClient-windows.7z
            release-assets/QmClient-windows-portable.zip
            release-assets/QmClient-windows-portable.zip.sig
            release-assets/QmClient-windows-portable-update.json
            release-assets/QmClient-windows-portable-update.json.sig
            release-assets/QmClient-windows-portable.7z
            release-assets/QmClient-Setup.exe
            release-assets/QmClient-Setup.exe.sig
            release-assets/QmClient-windows-setup-update.json
            release-assets/QmClient-windows-setup-update.json.sig
            release-assets/QmClient-ubuntu.tar.xz
            release-assets/QmClient-macOS.dmg
            release-assets/QmClient-android.apk
            release-assets/QmClient-android.aab

      - name: Verify every uploaded asset and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName,assets > release-state.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("release-state.json").read_text())
          expected = {"QmClient-windows-portable.zip", "QmClient-windows-portable.zip.sig", "QmClient-windows-portable-update.json", "QmClient-windows-portable-update.json.sig", "QmClient-windows-portable.7z", "QmClient-windows.zip", "QmClient-windows.zip.sig", "QmClient-windows-update.json", "QmClient-windows-update.json.sig", "QmClient-windows.7z", "QmClient-Setup.exe", "QmClient-Setup.exe.sig", "QmClient-windows-setup-update.json", "QmClient-windows-setup-update.json.sig", "QmClient-ubuntu.tar.xz", "QmClient-macOS.dmg", "QmClient-android.apk", "QmClient-android.aab"}
          assert release["isDraft"] and release["tagName"] == os.environ["RELEASE_TAG"]
          assert release["isPrerelease"] == ("-preview." in os.environ["RELEASE_TAG"])
          assets = {asset["name"]: asset for asset in release["assets"]}
          assert len(assets) == len(release["assets"]) and set(assets) == expected
          for name in expected:
              assert assets[name]["state"] == "uploaded"
              assert assets[name]["size"] == (Path("release-assets") / name).stat().st_size > 0
          PY
          if [[ "$RELEASE_TAG" == *-preview.* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
