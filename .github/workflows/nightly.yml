name: Preview Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Select Preview Version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select next preview or reuse this commit's tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(python3 qmclient_scripts/bump_version.py --next-preview-tag)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and Publish Preview
    needs: version
    if: needs.version.outputs.publish == 'true' && github.repository == 'wxj881027/QmClient'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
